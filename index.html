d every boat on it is on this side, and that took four of us most of a night. If it goes down we have a different problem."},{text:"They cannot get over and we are not going over, so we all stand here and look at each other. That suits me. Every hour of it is another man riding in from Mina.",needs:"dragoons"},{text:"He has gone up the river. Seven miles, on my own field, in my own corn stubble, and he did not ask me because there was nobody there to ask.",aside:"I could walk you to it in the dark. I have walked it in the dark a hundred times, which is a thing worth being, this week.",needs:"eighteen",sets:"told-camp",gives:"the camp upriver"}]},{id:"dragoon-a",name:"A DRAGOON",distant:!0,tx:2,ty:9,facing:"right",needs:"dragoons",look:{build:"adult",hat:"shako",torso:"uniform",legs:"rider",skin:f(d,8),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"Too far to hear, and near enough to count."}]},{id:"dragoon-b",name:"A DRAGOON",distant:!0,tx:3,ty:11,facing:"right",needs:"dragoons",look:{build:"adult",hat:"shako",torso:"uniform",legs:"rider",skin:f(d,9),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"Too far to hear, and near enough to count."}]},{id:"dragoon-c",name:"A DRAGOON",distant:!0,tx:2,ty:13,facing:"right",needs:"dragoons",look:{build:"adult",hat:"shako",torso:"uniform",legs:"rider",skin:f(d,7),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"Too far to hear, and near enough to count."}]}],exits:[{tx:13,ty:5,to:"ponton-house",entry:{tx:7,ty:7,facing:"up"}},{tx:25,ty:5,to:"dewitt-house",entry:{tx:7,ty:7,facing:"up"}},{tx:13,ty:18,to:"sowell-shop",entry:{tx:7,ty:7,facing:"up"}},{tx:25,ty:18,to:"darst-house",entry:{tx:7,ty:7,facing:"up"}},{tx:35,ty:10,to:"orchard",entry:{tx:1,ty:9,facing:"right"}},{tx:35,ty:11,to:"orchard",entry:{tx:1,ty:10,facing:"right"}},{tx:18,ty:21,to:"williams",entry:{tx:15,ty:17,facing:"up"},needs:"crossed",passage:"the-crossing"},{tx:19,ty:21,to:"williams",entry:{tx:15,ty:17,facing:"up"},needs:"crossed",passage:"the-crossing"}],props:[{id:"the-post",tx:20,ty:10,lines:[{text:"The post in the middle of the square, with four old notices weathered onto it and one new one that is still white.",aside:"Somebody has nailed it up at the height of a man on a horse, which tells you who nailed it up."},{text:"You get it off the nail without tearing it. It is an order, in a clerk\u2019s hand, and it is shorter than you expected.",needs:"saw-corporal",sets:"read-order",gives:"the corporal asks"},{text:"The nail is still in the post and the corner of the paper is still on the nail.",needs:"read-order"}]},{id:"landing",tx:9,ty:9,lines:[{text:"The ferry landing, and no ferry. The cable is cut and coiled on this side and the flat is pulled up into the willows with water in the bottom of it."},{text:"A sheet of paper is nailed to the landing post, out in the weather, where a man on the far bank could see that there was one without being able to read it.",aside:"Which is, you understand, the point of nailing it there.",needs:"dragoons",sets:"read-muster",gives:"the eighteen at the ford",then:!0},{text:"Davis. Dickinson. Sowell. Williams. You have to stop and start again twice, because they are not names on a list, they are people whose kitchens you have been in.",needs:"read-muster",sets:"eighteen"},{text:"Eighteen names, in the rain, where a hundred men can see there is a paper and not what is on it.",needs:"eighteen"}]},{id:"well",tx:16,ty:7,lines:[{text:"The town well, and the reason the square is where it is rather than somewhere with a better view."}]},{id:"the-gun",tx:22,ty:11,lines:[{text:"The cannon. It is smaller than every story about it will be: a stubby bronze six-pounder on a rotten carriage, with a bird\u2019s nest in the muzzle.",aside:"It has sat here since you were eight. Nobody has ever fired it at anything."},{text:"The carriage is here and the gun is not on it, and there is a drag-mark across the square that somebody has swept and not swept well.",needs:"buried"},{text:"On a pair of cotton-wagon wheels, scoured down to the bronze, with Dickinson walking round it for the ninth time.",needs:"eighteen"}]}]};(ja=qn.scenes)!=null;const Gr={".":l.GRASS_A,",":l.DIRT,"~":l.WATER,Y:l.TREE,R:l.ROCK},Jn={id:"williams",name:"Williams's field",light:{base:-6,sources:[{tx:8,ty:7,r:6,gain:7},{tx:17,ty:6,r:6,gain:7},{tx:23,ty:9,r:5,gain:6}]},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","R.............................R","R...YY..................YY....R","R.............................R","R.......,,,......,,,..........R","R.......,,,......,,,......,,..R","R.........................,,..R","R.............................R","R.............................R","R.....YY................YY....R","R.............................R","R.............................R","R.............................R","R.......YY..........YY........R","R.............................R","R.............................R","RRRRRRRRRRRRRRR,,RRRRRRRRRRRRRR"],legend:Gr,ridable:!1,start:{tx:15,ty:17,facing:"up"},pen:{needs:"fought",keep:[1,3,29,18],text:"Somebody takes a fistful of your collar without looking at you and puts you back down behind the wheel. Not out there. Not now."},triggers:[{tx:15,ty:12,sets:"lost",text:"You have been walking for two hours and the man in front of you is a shape and then is not there.",aside:"You can hear a hundred and forty men within fifty yards of you and you cannot see one of them. Somewhere ahead there is a light."},{tx:15,ty:9,needs:"lost",unless:"fought",sets:"at-the-camp",text:"Close enough now to hear a horse shift its feet, and somebody on the other side of the fire says something and somebody else laughs.",aside:"They do not know you are here. Two hundred men are standing in a field in the dark and one of them is about to decide."}],scenes:[{id:"the-second",needs:"at-the-camp",unless:"fought",steps:[O(void 0,"Somewhere off to the right, a shot."),O(void 0,"Nobody ever finds out who fired it."),ie("fought"),Ne(900),O("DICKINSON","Stand clear of the wheels!","The gun goes off and the fog goes white and then orange and then white, and you do not hear the rest of it for a while."),Ne(2600),O(void 0,"It goes on like that, in the dark, for a length of time you could not afterwards put a number to. Then it begins to get light, and the fog starts to lift off the stubble in pieces, and both sides can see what they have been shooting at."),Ne(1200),O(void 0,"A hundred men on that side. A hundred and forty on this one. One man on the ground over there and nobody moving to him, which tells you what that means."),ie("daylight")]},{id:"the-parley",needs:"daylight",unless:"parley",steps:[O(void 0,"A white rag on a ramrod, and the shooting stops, and two men walk out into the middle of a field that neither of them owns."),O("JOHN HENRY MOORE","Surrender the field, lieutenant, and go home."),O("CASTA\xD1EDA","I will tell you plainly. I am a federalist. I am for the constitution of 1824, the same as you say you are, and I have no quarrel with any man standing behind you."),O("CASTA\xD1EDA","And I have my orders, which are to recover a gun that belongs to the government of Mexico and to do it without compromising the honour of Mexican arms. You may read them if you like. They are not secret and they are not unreasonable."),qe("the order out of bexar"),O("CASTA\xD1EDA","[He folds them back into his coat.] There are a hundred and forty of you. I am withdrawing. Whatever this becomes, it did not have to become it here."),ie("parley")]}],attack:{needs:"fought",fighters:[{tx:11,ty:13,toX:11,toY:10,side:"volunteer"},{tx:15,ty:13,toX:15,toY:10,side:"volunteer"},{tx:19,ty:13,toX:19,toY:10,side:"volunteer"},{tx:8,ty:14,toX:9,toY:11,side:"volunteer"},{tx:22,ty:14,toX:21,toY:11,side:"volunteer"},{tx:13,ty:15,toX:13,toY:12,side:"volunteer"},{tx:9,ty:6,toX:9,toY:8,side:"garrison",killed:!0},{tx:12,ty:6,toX:12,toY:8,side:"garrison"},{tx:17,ty:5,toX:17,toY:8,side:"garrison"},{tx:20,ty:6,toX:20,toY:8,side:"garrison"},{tx:23,ty:7,toX:22,toY:9,side:"garrison"}]},hunt:{needs:"armed",quarry:[{id:"shape-a",tx:9,ty:7,kind:"shape",said:"Something out there stops making noise for a moment, and then makes a different one."},{id:"shape-b",tx:12,ty:6,kind:"shape",said:"A shout, off to the left, in a voice you do not know, in a language you do."},{id:"shape-c",tx:15,ty:6,kind:"shape",said:"You hear it go into wood. A wagon, or a tree, or the stock of somebody else\u2019s piece."},{id:"shape-d",tx:18,ty:7,kind:"shape",said:"Nothing. No cry, no fall, no answer. You will be asked about this for the rest of your life and this is all you will have."},{id:"shape-e",tx:21,ty:8,kind:"shape",said:"A horse goes over somewhere ahead and keeps going, and a man swears at it, and that is all of it."}]},flashes:[{tx:10,ty:9,needs:"fought"},{tx:16,ty:8,needs:"fought"},{tx:21,ty:10,needs:"fought"},{tx:13,ty:7,needs:"fought"}],npcs:[{id:"moore",name:"MOORE",tx:14,ty:11,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:f(d,9),hairCol:f(d,2),cloth:f(d,7),cloth2:f(d,4)},lines:[{text:"Stay behind the wheel and stay down. You are on that roll because you put yourself on it, and a storekeeper is no better at stopping a ball than anybody else."},{text:"One of theirs is dead. Some will tell you two, and I was standing in it and I saw one.",aside:"And on our side a man came off his horse in the dark and bloodied his nose, and that is the whole of it. Write that down somewhere, because nobody else is going to.",needs:"parley",sets:"told-shot",gives:"the first shot",then:!0},{text:"Go home. Tell Ponton what you saw, and tell him exactly what you saw and not one word more than that.",needs:"told-shot",sets:"go-back"},{text:"The road is behind you and it is light now. Go on.",needs:"go-back"}]},{id:"father-here",name:"DAVIS",tx:16,ty:12,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:f(d,9),hairCol:f(d,2),cloth:f(d,10),cloth2:f(d,5)},lines:[{text:"You came out of that store with a ledger and a coat. [He does not say anything about that. He hands you the second gun off his own rack.]",aside:"Loaded, and primed, and it is the one my boy shoots rabbits with. Keep it pointed at the ground until it is not.",sets:"armed",then:!0},{text:"One shot. That is what you have and that is what everybody out there has, and after it you are holding a stick for as long as it takes you to load it again.",aside:"So do not throw it away at a noise. Wait until you have got something, and be steady, and let your breath out.",needs:"armed"},{text:"You saw it and I did not read a word of it. So you are going to have to be the one who remembers it right.",needs:"parley"}]}],props:[{id:"the-fire",tx:17,ty:6,lines:[{text:"Their fire, with a pot still on it and nobody near it. Somebody was cooking twenty minutes ago and is now somewhere in the fog with a musket."}]}],exits:[{tx:15,ty:18,to:"gonzales",entry:{tx:18,ty:20,facing:"up"},needs:"go-back",passage:"back-to-gonzales"},{tx:16,ty:18,to:"gonzales",entry:{tx:18,ty:20,facing:"up"},needs:"go-back",passage:"back-to-gonzales"}]};($a=Jn.scenes)!=null;const Wr={".":l.GRASS_A,",":l.DIRT,"=":l.DIRT_EDGE,"~":l.WATER,":":l.MARSH,"-":l.FENCE_H,"|":l.FENCE_V,1:l.FENCE_NW,2:l.FENCE_NE,3:l.FENCE_SW,4:l.FENCE_SE,"#":l.LOG,"^":l.LOG_ROOF,'"':l.LOG_EAVE,C:l.CHIMNEY,d:l.DOORWAY,b:l.BILL_LOG,Y:l.TREE,o:l.WELL,R:l.ROCK},Fr={id:"bayshore",name:"The bay shore",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR",",,..........................YYR",",,.........................YYYR",'R...."""""....................R',"R....^^^^^....YY..............R","R..C.##d##....YY..............R","R.............................R","R.....o.......................R","R.............1-----2.........R","R.............|.....|.........R","R.............|.....|.........R","R.............3-----4.........R","R.............................R","R:::::::::::::::::::::::::::::R","R:::::::::::::::::::::::::::::R","R:::::::::::::::::::::::::::::R","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"],legend:Wr,ridable:!1,start:{tx:9,ty:7,facing:"down"},npcs:[{id:"mother",name:"ELIZA",tx:10,ty:6,facing:"down",look:{build:"adult",hat:"kerchief",hair:"bun",torso:"apron",legs:"skirt",skin:f(d,10),hairCol:f(d,2),cloth:f(d,9),cloth2:f(d,5)},lines:[{text:"Nineteen days. [She says it the way you say a thing you have been counting rather than a thing you have just worked out.] Nineteen days he has been in that yard and nobody has charged him with anything.",aside:"There is a paper on the table for the colonel. I have written it out three times and this is the polite one, and it wants your name at the foot of it and not mine.",sets:"told-errand"},{text:"Three drafts on that table and I could not choose between them. You are the lawyer in this family. Which one goes up to the fort?",aside:"The long one puts everything in. The short one he might actually finish. The angry one is the true one.",needs:"told-errand",sets:"has-petition",options:[{label:"The long one",sets:"draft-long",reply:"Then he reads all of it or none of it. [She folds it in four and does not look happy about it.]",aside:"They will let you in. They would not let me in and they would not let Amos in. But they have not charged him, and you can make them say that out loud."},{label:"The angry one",sets:"draft-angry",reply:"Good. Somebody up there ought to know that somebody down here is angry. [She folds it hard.]",aside:"They will let you in. They would not let me in and they would not let Amos in. But they have not charged him, and you can make them say that out loud."},{label:"The short one",sets:"draft-plain",reply:"The short one. He is a busy man, and busy men finish short letters. [She folds it in four.]",aside:"They will let you in. They would not let me in and they would not let Amos in. But they have not charged him, and you can make them say that out loud."}]},{text:"The road west, along the top of the marsh. An hour, and do not cut across the wet.",needs:"has-petition"},{text:"You saw him. [She does not ask whether he is well. She asks the thing she can do something about.] Is he standing up?",needs:"saw-father"},{text:"Then we go out to White\u2019s with the rest of them, and we see what a hundred men and a piece of paper can do that three letters and a polite request could not.",needs:"fought"}],rebuff:"I have read that one. I have read all of them, twice, and none of them is the one that gets him out."},{id:"uncle",name:"AMOS",tx:22,ty:10,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:f(d,9),hairCol:f(d,1),cloth:f(d,8),cloth2:f(d,4)},lines:[{text:"I have been to that gate twice and got as far as the ditch both times. They know my face now, which is worse than useless.",aside:"You they will let through. That is the whole of why you are going and not me, and I want you to understand that it is not because you are brave. It is because you have a licence and I have a grievance."},{text:"Ask what the duty is on a barrel of flour coming in at that landing. Ask what it was three years ago. Then ask why there was no customs house here until they built one.",needs:"has-petition",sets:"told-duty",aside:"It is all one law and it has a date on it, and the date is the sixth of April eighteen thirty."},{text:"Go on. And whatever you see in that yard, you come back and you tell it straight \u2014 not big, and not small either.",needs:"told-duty"}],rebuff:"Paper. [He does not take it.] That is your trade and not mine, and look where it has got us."}],triggers:[{tx:1,ty:1,unless:"has-petition",sets:"tried-early",text:"You get as far as the turn in the road and stop.",aside:"She is standing in the door with a folded paper in her hand and she has not given it to you yet."}],exits:[{tx:7,ty:5,to:"white-house",entry:{tx:7,ty:7,facing:"up"}},{tx:0,ty:1,to:"anahuac",entry:{tx:33,ty:9,facing:"left"},needs:"has-petition",passage:"road-to-anahuac"},{tx:0,ty:2,to:"anahuac",entry:{tx:33,ty:9,facing:"left"},needs:"has-petition",passage:"road-to-anahuac"}],props:[{id:"well",tx:6,ty:7,lines:[{text:"Brackish, this near the bay, and it is what everybody out here drinks anyway."}]},{id:"pen",tx:16,ty:12,lines:[{text:"Eleven head in the pen and a good many more out on the marsh, which is where cattle live out here \u2014 the grass will carry them where it will not carry a plough.",aside:"Half of them are not ours. Everybody\u2019s cattle are on everybody\u2019s marsh and it works because everybody knows everybody\u2019s brand."}]},{id:"marsh",tx:12,ty:13,lines:[{text:"Coarse grass standing in an inch of water, all the way to the bay. You can walk it if you do not mind your feet.",aside:"Everything that comes to this country comes across that water. Which is the entire reason there is a fort on the bluff and a man in it counting barrels."}]}]},zr={".":l.GRASS_A,",":l.DIRT,"=":l.DIRT_EDGE,"~":l.WATER,":":l.MARSH,B:l.BRICK,D:l.BRICK_DOOR,b:l.BILL_BRICK,K:l.KILN,E:l.EMBRASURE,G:l.GUN,"#":l.LOG,"^":l.LOG_ROOF,'"':l.LOG_EAVE,C:l.CHIMNEY,d:l.DOORWAY,g:l.GATE,N:l.NOTICE,Y:l.TREE,o:l.WELL,R:l.ROCK},Vn={id:"anahuac",name:"Anahuac",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R..........................YY......R","R...BBBBbBBBBBBEE.................,R","R...BBBB,,,,GBBBE.................,R",'R...BBBB,,,,,BBBB..EG.BBB..."""""..R',"R...BB,,,,,,,,,BB,,,,,DBB..^^^^^...R","R...BB,,,K,,,,,bB..EG.BBB..##d##...R","R...BB,,,,,,,,,BB...K..............R","R...EEBBG,,,,BBBB..................R","R...EBBBBgbBBBBBB,,,,,,,,,,,,,,,,,,,","R................,,,,,,,,,,,,,,,,,,,",'R....""""".......,,,,,,,,,,,,,,,,,.R',"R....^^^^^.......,,,,,,N,,,,,,,,,,.R","R..C.##d##.......,,,,,,,,,,,,,,,,,.R","R................,,,,,,,,,,,,,,,,,.R","R......o.........,,,,,,,,,,,,,,,,,.R",'R...."""""......."""""........YY...R',"R....^^^^^.......^^^^^.............R","R..C.##d##.......##d##.............R","R..................................R","R::::::::::::::::::::::::::::::::::R","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"],legend:zr,ridable:!1,start:{tx:33,ty:9,facing:"left"},scenes:[{id:"into-the-yard",needs:"has-petition",unless:"saw-father",steps:[O(void 0,"The sentry looks at the paper, and then at you, and then puts his hand flat on your chest and holds it there while he thinks about it. Then he moves it."),O(void 0,"Inside the wall the ground is churned to clay and there is scaffolding against the north face. They have not finished building it. Half of this fort is a hole in the ground with bricks stacked beside it."),O(void 0,"And in the middle of the yard there is a brick oven the size of a small house, with the fire long out and a soldier sitting on a barrel in front of the mouth of it."),O("MY BROTHER","[From inside, and you cannot see him.] Is that you? Do not come closer. Stand where you are and let them see you standing there."),ie("saw-father")]},{id:"the-tenth",needs:"told-letter",unless:"fought",steps:[O(void 0,"They come in along the bay road at first light, and there are more of them than there are soldiers in the fort, and everybody on both sides knows it by about eight in the morning."),He("rider"),O("A MAN ON THE ROAD","North end of the town. Nobody past the square. If they want to shoot at us they can come out and do it."),O(void 0,"And for two days that is what this is: two hundred yards of dirt that nobody crosses, and a great deal of shouting across it, and a certain amount of shooting that mostly goes nowhere."),ie("fought")]},{id:"the-colonel-goes",needs:"resolved",unless:"released",steps:[O(void 0,"A column comes down the Nacogdoches road with a colonel at the head of it who is senior to everybody here, and the whole town goes quiet in the way a room goes quiet."),O("PIEDRAS","I have read what your committee has written and I have read the colonel\u2019s account, and I am not going to hang anybody today. Open the kiln."),O(void 0,"It takes two men to shift the boards off the mouth of it. What comes out is six men who have been in the dark for six weeks, and one of them puts his hand flat on the top of your head and leaves it there."),He("travis"),ie("released")]}],npcs:[{id:"bradburn",name:"COL. BRADBURN",tx:11,ty:8,facing:"down",absent:"released",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"rider",skin:f(d,9),hairCol:f(d,2),cloth:f(d,5),cloth2:f(d,9)},lines:[{text:"Give it here. [He reads it standing up, which is more than he had to do.] It does not change what I am able to do.",aside:"I am from Kentucky. Did anybody tell you that? Fifteen miles from where half these families came from. It has never once helped.",sets:"met-bradburn"},{text:"Give it here. [He turns it over, reads the second side, and goes back to the first.] There is a great deal of it.",aside:"I will grant you it is thorough. I have read four pages to find the sentence you wanted me to read, and I have found it, and the answer is still no.",needs:"draft-long",sets:"met-bradburn"},{text:"Give it here. [He gets two lines in and his jaw sets.] You may tell whoever wrote this that I have been called worse by better.",aside:"And I will tell you what I would have told them. Every word of it is true and not one word of it helps the man in that oven.",needs:"draft-angry",sets:"met-bradburn"},{text:"Give it here. [He reads the whole of it standing up, which is more than he had to do, and it takes him nine seconds.] Well. That is a letter.",aside:"Short enough that I finished it, which is more than I can say for most of what comes over that wall. It does not change what I am able to do.",needs:"draft-plain",sets:"met-bradburn"},{text:"They want three people handed back over that wall. Under the law of this country those three are not property and there is nothing to hand back. That is not my opinion. It is the law I am paid to enforce and I have enforced it.",aside:"And a lawyer was sent to me about it, and when I would not, a letter came that was not true. So the lawyer is in the kiln.",needs:"met-bradburn",sets:"told-why",then:!0},{text:"You may tell the house that your brother is not charged with anything, which is exactly what you are angry about, and you are right to be.",aside:"I am holding men on my own say-so because I have not got a court to give them to. I know what that is. I have not got a better answer.",needs:"told-why",sets:"told-letter",gives:"the letter that was not true"},{text:"A hundred men from Louisiana, the note said. There were no hundred men. I acted on it because I had to act on it, and I have been made to look a fool by a piece of paper, which is a thing that will keep happening to me.",needs:"told-letter"},{text:"The north end of the town is not mine this morning. I have fifty men and a wall with a hole in it. Go home, and go the long way.",needs:"fought"},{shows:"the law of the sixth of april",needs:"told-why",text:"Yes. That is the one. [He does not take it. He reads it out of your hand, at arm\u2019s length, the way a man reads something he already knows.]",aside:"A customs house, a garrison, a duty to collect. Read me the part about what I do with a man after I have arrested him. Take your time.",sets:"law-shown",then:!0},{shows:"the law of the sixth of april",needs:"law-shown",text:"It is not there. It sets up the post and it does not set up a court, and I have been the court for nineteen days because there is nobody else inside two hundred miles.",aside:"Write that down and take it to whoever sent you. It is the only true thing I have said this week.",sets:"law-conceded"},{shows:"a lawyer is retained",needs:"met-bradburn",text:"[He looks at it for longer than he looked at the petition.] So that is what he was. A man hires a lawyer in Louisiana and the lawyer comes to my gate and calls it a recovery.",aside:"I told him what I have told you. Under the law of this country there is nothing there to recover. He did not take it well and neither did the man paying him.",sets:"knows-retainer"}],rebuff:"He glances at it. That is not the paper I am waiting for and you know it is not."},{id:"hannah",name:"HANNAH",tx:7,ty:7,facing:"right",look:{build:"adult",hat:"kerchief",hair:"short",torso:"apron",legs:"skirt",skin:f(d,5),hairCol:f(d,0),cloth:f(d,8),cloth2:f(d,4)},lines:[{text:"Mind the stack. They are green and they will take the skin off your arm.",aside:"I stack brick. I have stacked a great deal of brick since March and I would rather stack it here than be anywhere I have been before.",sets:"met-hannah",gives:"three people who ran",then:!0},{text:"Hannah. [She says it once and goes back to the stack.] There were three of us came across the water in March and the colonel would not give us up, and that is the whole reason any of this is happening.",aside:"Everybody in this yard knows that and everybody in this yard talks about the lawyer.",needs:"met-hannah",sets:"told-hannah"},{text:"You will hear it told a hundred times and you will hear the colonel\u2019s name in it and the lawyer\u2019s name in it and the name of the man in Louisiana. Watch whether you ever hear mine.",needs:"told-hannah"},{text:"They are letting people out today. [She does not move off the stack.] Not everybody who is in this yard is in the kiln, and not everybody who walks out of here today is walking anywhere they chose.",needs:"released"}]},{id:"travis",name:"TRAVIS",tx:20,ty:13,facing:"down",needs:"released",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"ledger",skin:f(d,10),hairCol:f(d,3),cloth:f(d,4),cloth2:f(d,8)},lines:[{text:"Six weeks. [He is twenty-two and he has not slept and he is already talking like a man dictating.] Six weeks in an oven, and not one charge, and not one court, and I want that written down while everybody still remembers it the same way.",aside:"You have been in and out of that yard the whole time. You have carried more paper this summer than the post has.",sets:"to-the-table",then:!0},{text:"So. Everything you are carrying, on the table, face up. We are going to put this summer in a line and find out what it was.",aside:"I have a professional interest in the order of events. It is very nearly the only thing a lawyer has.",needs:"to-the-table",sets:"strung",opens:"anahuac"},{text:"Keep it. All of it. In four years somebody will tell you this began because Texans wanted to be Texans, and you will have a piece of paper in your hand that says we declared for the constitution of eighteen twenty-four and for General Santa Anna, by name.",aside:"Go home. Your father is on the road ahead of you and he is walking very slowly on purpose.",needs:"strung",sets:"the-end"}]},{id:"sergeant",name:"THE SERGEANT",tx:11,ty:10,facing:"up",absent:"released",look:{build:"adult",hat:"shako",hair:"crop",torso:"uniform",legs:"calzoneras",stance:"wide",skin:f(d,8),hairCol:f(d,1),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"One paper, one boy, one time. And you do not go near the oven."},{text:"Half this garrison is men who were sent here instead of prison. They laid those bricks. Now they are standing on the wall they built, being shouted at by the people they built it for.",aside:"There is a work bill nailed up on the north wall inside, if you want the numbers. Thousands fired, thousands laid, and a column of names with nothing against them.",needs:"told-why",sets:"told-convicts"},{shows:"the fort is made of its own ground",needs:"told-convicts",text:"[He takes it, and holds it, and does not give it back for a moment.] Ruiz. Herrera. That one there. Those are men on my wall this morning.",aside:"Go on, then. Ten feet and no closer, and if the colonel comes out you were never standing there.",sets:"nearer-the-kiln"}],rebuff:"One paper is what I said, and that was not it. Put it away before somebody senior sees it."},{id:"rider",name:"A MAN ON THE ROAD",tx:24,ty:12,facing:"left",needs:"fought",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"rider",sash:!0,skin:f(d,9),hairCol:f(d,2),cloth:f(d,7),cloth2:f(d,4)},lines:[{text:"We are not rebels and I want that understood before anybody writes anything down. We are asking a Mexican officer to obey a Mexican constitution.",aside:"There is a meeting out at White\u2019s place on the bayou. Everybody who can write is going, and a good many who cannot.",sets:"to-the-bayou-told",gives:"the tenth of june"},{shows:"the letter that was not true",text:"A hundred men from Louisiana. [He reads it twice.] There was no hundred men, and there is no name at the bottom of it, and a garrison moved on it anyway.",aside:"That is why we are going to sit in a shed on a bayou and write out what we actually want and put our names under it. So that nobody can do this to us with a paper again.",sets:"why-write-it-down"},{text:"Out at the bayou. Today. If it is going to be said properly it has to be said on paper and it has to be said today.",needs:"to-the-bayou-told"}],rebuff:"Not that one. Bring me the one with no name at the bottom of it \u2014 that is the one people need to see."}],exits:[{tx:7,ty:13,to:"customs-house",entry:{tx:7,ty:7,facing:"up"}},{tx:35,ty:9,to:"bayshore",entry:{tx:1,ty:1,facing:"right"}},{tx:35,ty:10,to:"bayshore",entry:{tx:1,ty:2,facing:"right"}},{tx:1,ty:12,to:"turtlebayou",entry:{tx:16,ty:16,facing:"up"},needs:"to-the-bayou-told",passage:"out-to-the-bayou"}],props:[{id:"fort-davis",tx:4,ty:8,lines:[{text:"The southwest work, and there is a name cut over the embrasure. FORT DAVIS. Fifty men could stand in it.",aside:"The gun in it is a six-pounder and it is not pointed at the town. It is pointed out over Trinity Bay \u2014 at the water, at the boats, and at whatever is in them that has not paid a duty."}]},{id:"northeast-work",tx:16,ty:3,lines:[{text:"The other redoubt, diagonally opposite that one, and this embrasure faces inland. Between the two of them the cavalry horses are tethered.",aside:"One gun for the bay and one for the road. Somebody drew this place knowing exactly which two directions trouble arrives from, and neither of them is Mexico."}]},{id:"six-pounder",tx:8,ty:8,lines:[{text:"A six-pound field gun in the yard on its carriage, trail down, wheels chocked, with the trunnion caps off.",aside:"It belongs in the southwest work. Somebody has run it back inside to get at it, which means for the moment the harbour is covered by an empty hole in a wall."}]},{id:"hidalgo",tx:19,ty:4,lines:[{text:"HIDALGO, cut into the brick over the embrasure, and a sixteen-pounder behind it. It covers the passage and the magazine and nothing else.",aside:"Named for the priest who was shot in eighteen eleven for starting all of this. The other one is Morelos, and he was shot too, and both names are on a wall built by a government that shot them."}]},{id:"morelos",tx:19,ty:6,lines:[{text:"MORELOS. The same work, the same weight of gun, set so its field of fire crosses the other one over the ground between them.",aside:"The two heaviest guns in this fort are pointed at a doorway on their own side of the wall. Powder is worth more than a customs house and everybody here knows it."}]},{id:"magazine",tx:22,ty:5,lines:[{text:"The magazine door. Strapped, banded, and padlocked through a staple set into the brick while the brick was still soft.",aside:"There is a bucket of sand outside it and no lantern anywhere within twenty feet, which tells you what is on the other side better than a sign would."}]},{id:"passage",tx:19,ty:5,lines:[{text:"A brick-lined cut in the ground running east out of the enclosure, roofed over and turfed, wide enough for one man carrying one barrel.",aside:"You do not walk powder across open ground where anybody standing off the bluff can count how many barrels of it you have."}]},{id:"brickyard",tx:20,ty:7,lines:[{text:"The clamp the brick came out of. It has been burning since March and there is a stack of green ones under sacking beside it.",aside:"Every wall you have looked at today came out of this hole in the ground. The men who fired it are down as convict soldiers, working their sentences off with their hands, and they are on the wall above you now."}]},{id:"the-post",tx:23,ty:12,lines:[{text:"The post in the square, with a printed sheet on it gone brown and a schedule of duties nailed under it in a clerk\u2019s hand.",aside:"The schedule is what everybody argues about. The sheet above it is what the schedule comes out of, and hardly anybody reads that far up the post."},{text:"You read the top sheet. It is a decree of the Mexican Congress and it is dated the sixth of April, eighteen thirty, and it is four sentences long.",needs:"told-duty",sets:"read-law",gives:"the law of the sixth of april"},{text:"The decree, and the schedule under it, and a great deal of weather on both.",needs:"read-law"}]},{id:"relief",tx:10,ty:9,lines:[{text:"The fort gate, standing open, with the bar leaning against the wall beside it because nobody has been ordered to put it back."},{text:"A sheet nailed to the gatepost in a hand nobody here knows, signed by a colonel who was not in this town yesterday.",aside:"It says the commandant of the post is relieved and the men held in the yard are handed to the civil authority. It is four lines long and it is dated today.",needs:"released",sets:"read-relief",gives:"the colonel is removed"},{text:"The relief order, on the gatepost, going soft already in this air.",needs:"read-relief"}]},{id:"kiln",tx:9,ty:6,lines:[{text:"A brick clamp the size of a small house, with the fire out and boards over the mouth of it and a soldier on a barrel in front of that.",aside:"It is what they fired the walls in. It is not a building and it was never meant to hold anything but heat."},{text:"You get near enough to hear somebody inside cough and somebody else tell them to stop.",needs:"saw-father"},{text:"The boards are off it and it is empty and it is smaller inside than you had been imagining for six weeks, which is somehow worse.",needs:"released",sets:"read-kiln",gives:"the lawyer goes into the kiln"},{text:"Empty, with the boards stacked beside it.",needs:"read-kiln"}]},{id:"brickstack",tx:8,ty:2,lines:[{text:"Something is nailed to the brick up under a scrap of tarpaulin, out of the weather, and it is too high and too dark to read from here."},{text:"A bill of work: so many thousand fired, so many laid, and a column of names down the side of it with no wages against them.",needs:"told-convicts",sets:"read-brick",gives:"the fort is made of its own ground"},{text:"The work bill, with the weather getting at it.",needs:"read-brick"}]},{id:"retainer",tx:15,ty:6,lines:[{text:"A bill of lading spike on the wall by the fort office, with a dozen papers driven onto it and a thirteenth that is not a bill of lading at all.",aside:"Somebody has spiked a lawyer\u2019s fee note in with the shipping. It has been there long enough to have gone the same colour as the rest."},{text:"A retainer, from a man in Louisiana, engaging a lawyer at Anahuac to recover three people. The lawyer\u2019s name is on it and he is twenty-two years old and nobody outside this bay has ever heard of him.",needs:"met-hannah",sets:"read-retainer",gives:"a lawyer is retained"},{text:"The spike, and the fee note down among the shipping.",needs:"read-retainer"}]},{id:"house-east",tx:29,ty:6,lines:[{text:"Shuttered, with the bar across it on the inside and somebody moving behind the shutter who stops moving when your shadow crosses it.",aside:"This one is nearest the fort. Whoever lives here has had a fortnight of soldiers going past the window."}]},{id:"house-west",tx:7,ty:18,lines:[{text:"Shut, and the chickens are still in the yard and the washing is still on the line, so whoever lives here did not go far and did not go slowly."}]},{id:"house-south",tx:19,ty:18,lines:[{text:"Shut, with a bench dragged across the front of it from the outside \u2014 which is somebody saying they have gone and would rather it was obvious."}]},{id:"well",tx:7,ty:15,lines:[{text:"The town well, and the reason the town is fifty yards from the fort and not five hundred."}]},{id:"bay",tx:18,ty:20,lines:[{text:"The bluff, and then the marsh, and then Galveston Bay all the way out to a horizon with nothing on it.",aside:"Everything that comes to this country comes across that. Which is why there is a fort behind you."}]}]};(qa=Vn.scenes)!=null;const Pr={".":l.GRASS_A,",":l.DIRT,"~":l.WATER,":":l.MARSH,"-":l.FENCE_H,"|":l.FENCE_V,1:l.FENCE_NW,2:l.FENCE_NE,3:l.FENCE_SW,4:l.FENCE_SE,"#":l.LOG,"^":l.LOG_ROOF,'"':l.LOG_EAVE,C:l.CHIMNEY,d:l.DOORWAY,t:l.TABLE,Y:l.TREE,o:l.WELL,R:l.ROCK},Xn={id:"turtlebayou",name:"White's place",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","R:::::::::::::::::::::::::::::R","R.............................R",'R....""""".............YY.....R',"R....^^^^^....................R","R..C.##d##....................R","R.............................R","R........o......t.............R","R.............................R","R......1--------2.............R","R......|........|.............R","R......|........|.............R","R......3---.----4.............R","R.............................R","R......YY.....................R","R.............................R","R...............,,............R","RRRRRRRRRRRRRRRR,,RRRRRRRRRRRRR"],legend:Pr,ridable:!1,start:{tx:16,ty:16,facing:"up"},scenes:[{id:"the-resolutions",needs:"to-the-bayou-told",unless:"resolved",steps:[O(void 0,"There are more people in this yard than live in the town, and half of them are arguing, and the half that are not arguing are eating White\u2019s beef."),O("J. T. WHITE","Eat first. You can none of you write a straight line hungry and I have got the cattle for it."),O(void 0,"They put a table out under the trees and four men sit at it and everybody else stands round telling them what to put."),O("A MAN AT THE TABLE","Careful how it goes down. If this reads as a rising against Mexico then a Mexican general comes up that bay and hangs the lot of us."),O("ANOTHER","Then it does not read as a rising against Mexico. It reads as what it is. We are for the constitution of eighteen twenty-four, and so is Santa Anna, and he is in the field for it right now."),O(void 0,"Somebody says that is a clever way of putting it. Somebody else says it is not clever, it is true, and those are different, and the first man says he knows."),O(void 0,"Nobody signs it."),He("clerk"),He("gossip"),ie("resolved")]}],npcs:[{id:"white",name:"J. T. WHITE",tx:12,ty:7,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:f(d,9),hairCol:f(d,2),cloth:f(d,10),cloth2:f(d,5)},lines:[{text:"They are in my yard because there is water, grass and no garrison, and because I have got more beef than sense. That is the whole of why anything happens anywhere, in my experience.",aside:"Grass out there will carry cattle where it will not carry a plough. That is the only reason there is a man living on this bayou at all.",sets:"met-white",gives:"the cattle on turtle bayou"},{text:"I have not read it and I am not going to. I have fed them and they can write what they like on my table.",needs:"met-white"}]},{id:"clerk",name:"AT THE TABLE",tx:15,ty:9,facing:"up",needs:"resolved",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"ledger",skin:f(d,10),hairCol:f(d,1),cloth:f(d,6),cloth2:f(d,9)},lines:[{text:"Four resolutions. Read them and tell me whether a man in Mexico City reading them would call it a rebellion, because that is the only question that matters about this piece of paper.",aside:"Nobody has put a name to it. Ask me in thirty years what day we wrote it and I will give you a different answer than the man beside me will.",sets:"read-resolutions",gives:"the turtle bayou resolutions",then:!0},{text:"It goes to Brazoria, to General Mex\xEDa, who has come up the coast with ships to put down a rebellion. We are going to hand him a paper explaining that he has not found one.",needs:"read-resolutions",sets:"told-mexia"},{text:"Brazoria. The eighteenth. Seven of us put our names to the covering sheet and not one to the resolutions, and I could not tell you now why we did it that way round.",needs:"told-mexia",gives:"handed to mexia at brazoria",sets:"read-mexia"},{text:"It worked. That is the strangest part and nobody says it enough. He read it and he took his fleet home.",needs:"read-mexia"}]},{id:"gossip",name:"A WOMAN FROM VELASCO",tx:21,ty:8,facing:"left",needs:"resolved",look:{build:"adult",hat:"kerchief",hair:"long",torso:"apron",legs:"skirt",skin:f(d,10),hairCol:f(d,1),cloth:f(d,7),cloth2:f(d,4)},lines:[{text:"They are writing here and they were shooting at Velasco. A party took a gun down the Brazos to bring it round to you people and the fort at the river mouth would not let it past.",aside:"They took the fort. It cost a few dozen men between the two sides, which is a good deal more than anything that has happened on this bayou.",sets:"told-velasco",gives:"velasco"},{text:"Write it down somewhere. Everybody up here is going to remember the meeting and nobody is going to remember the fighting, and the fighting is where people died.",needs:"told-velasco"}]}],exits:[{tx:7,ty:6,to:"whites-place",entry:{tx:7,ty:7,facing:"up"}},{tx:16,ty:18,to:"anahuac",entry:{tx:2,ty:12,facing:"right"},passage:"back-from-the-bayou"},{tx:17,ty:18,to:"anahuac",entry:{tx:2,ty:12,facing:"right"},passage:"back-from-the-bayou"}],props:[{id:"table",tx:16,ty:8,lines:[{text:"A plank table dragged out under the trees, with an inkpot on it and a great many rings where cups have been."},{text:"They are still arguing about the letter. Somebody says a man in a cloak carried it up to the gate after dark so the sentry could not name him. Somebody else says that is nonsense and everybody knows who wrote it.",aside:"Neither of them was there. Neither of them says so.",needs:"resolved",sets:"told-cloak",gives:"the man in the cloak"},{text:"The table, and the inkpot, and a lot of rings.",needs:"told-cloak"}]},{id:"well",tx:9,ty:8,lines:[{text:"Sweet water, which out here is worth more than the cattle and everybody knows it."}]},{id:"bayou",tx:14,ty:2,lines:[{text:"Turtle Bayou, brown and slow and full of things you do not put a hand into.",aside:"It runs down to the bay, which runs to the fort, which is where everybody in this yard has somebody."}]}]};(Ja=Xn.scenes)!=null;const _r={".":l.GRASS_A,":":l.GRASS_C,",":l.DIRT,"~":l.WATER,Y:l.TREE,R:l.ROCK,s:l.STONE,d:l.DOORWAY,k:l.ROOF,a:l.ADOBE,N:l.NOTICE,G:l.GUN,W:l.WAGON,o:l.WELL,f:l.FLAGSTONE},Lr={id:"alazan",name:"The camp on the Alaz\xE1n",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R..YY.........................YY...R","R.............:::::................R","R....sssss....:::::................R","R....skkks....:::::.......W........R","R....sdsss.........................R","R..................................R","R..................................R","R......~~~~~~~~~~~~~~~~~~..........R","R......~~~~~~~~~~~~~~~~~~..........R","R..................................R","R.......,,,,,,,,,,,,,,,............R","R......,,,,,,,,,,,,,,,,,,..........R","R.....,,,,,,,,,,,,,,,,,,,,.........R","R.....,,,,,,,,,,,,,,,,,,,,....G....R","R.....,,,,,,,,N,,,,,,,,,,,....G....R","R.....,,,,,,,,,,,,,,,,,,,,.........R","R.....,,,,,,,,,,,,,,,,,,,,.........R","R......,,,,,,,,,,,,,,,,,,..........R","R.......,,,,,,,,,,,,,,,............R","R.......o..........................R","R..................................R","R..YY.............,,...........YY..R","RRRRRRRRRRRRRRRRRR,,RRRRRRRRRRRRRRR"],legend:_r,ridable:!1,start:{tx:18,ty:21,facing:"up"},npcs:[{id:"milam",name:"BEN MILAM",tx:13,ty:13,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"rider",skin:f(d,10),hairCol:f(d,12),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"You are the lawyer they had shut up in there. [He looks at you the way a man looks at a map that has just walked into his camp.]",aside:"I was in a cell in Monterrey in July and I did not know there was a war on until October. So I have a good deal of sympathy for a man who has spent six weeks looking out of a window.",sets:"met-milam"},{text:"Half this camp voted last night to go home until the spring. They are not cowards. They have got farms and it is December and nobody has been paid.",aside:"And they are right, on the arithmetic. Walking three hundred men across that plaza into a gun is not a plan, it is a funeral with a flag on it.",needs:"met-milam",sets:"told-vote",then:!0},{text:"So do not tell me they are brave. Tell me something I can DO. [He waits. He is genuinely waiting.]",needs:"told-vote",sets:"asked-plan"},{shows:"the diary of a man under arrest",needs:"asked-plan",text:"[He takes the book and turns it toward the fire and reads it for a long time without saying anything at all.]",aside:"A gun on the roof of the priest\u2019s house, laid on the square. Ditches across the two streets from the north. And the houses on Soledad have doors on both sides.",sets:"read-diary",then:!0},{shows:"the diary of a man under arrest",needs:"read-diary",text:"Then we do not use the square. [He gives it back.] We go up the streets in the dark and then we go through the WALLS, and we never once stand in the open where that gun is looking.",aside:"That is not courage, that is a job of work with crowbars. I can sell a job of work to three hundred cold men. I could not sell them a charge.",sets:"has-plan"},{text:"Tomorrow, before it is light. You are coming in at the head of the right-hand column with me, because you are the only man here who has seen the inside of that town this year.",needs:"has-plan",sets:"called",gives:"who will go with old ben milam"},{text:"Sleep if you can. I never can, the night before.",needs:"called"}],rebuff:"I cannot use that. [He hands it straight back.] Bring me something about the inside of that town."},{id:"johnson",name:"F. W. JOHNSON",tx:18,ty:16,facing:"up",look:{build:"adult",hat:"cap",hair:"short",torso:"camisa",legs:"rider",skin:f(d,11),hairCol:f(d,2),cloth:f(d,8),cloth2:f(d,4)},lines:[{text:"If it happens there will be two columns, not one. Milam takes the right and I take the left and we work inward toward each other from the north end.",aside:"Two columns means if one of them is stopped the other is still in the town. One column means if it is stopped, it is stopped.",sets:"met-johnson"},{text:"Crowbars, picks and axes. Not ladders. We are not going over anything, we are going through it, and a wall of unfired adobe comes down quicker than you would believe.",needs:"has-plan",sets:"told-tools",gives:"the left division"},{text:"Four days of somebody\u2019s kitchen, then somebody\u2019s store. Nobody will write a poem about it and it is going to work.",needs:"told-tools"}],rebuff:"Show that to Milam. I am the left column; the right column is the one with the plan."},{id:"seguin",name:"JUAN SEGU\xCDN",tx:9,ty:17,facing:"right",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:f(d,9),hairCol:f(d,1),cloth:f(d,7),cloth2:f(d,4)},lines:[{text:"My company is from the town you have been living in. Some of them can walk you to a door in the dark and tell you which way it opens.",aside:"And when this is over somebody will write it down as Texians against Mexicans, and I will be standing in the wrong half of that sentence in my own country.",sets:"met-seguin"},{text:"The house on the corner of Soledad \u2014 the one with the ditch in front of it. My uncle was married out of that house. It has a door on the yard side.",needs:"saw-ditch"}],rebuff:"Keep it. Paper is what you are for; the rest of us are here for the other thing."},{id:"burleson",name:"GEN. BURLESON",tx:22,ty:12,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"rider",stance:"wide",skin:f(d,10),hairCol:f(d,3),cloth:f(d,5),cloth2:f(d,2)},lines:[{text:"I will not order it. [He is not refusing. He is being exact.] If three hundred men go in there of their own accord I will hold this camp with the other four hundred and I will hold the road behind them.",aside:"That is the difference between an army and a crowd, and this is a crowd, and I am not going to pretend otherwise in front of a man who writes things down.",sets:"met-burleson"},{text:"The town is taken and I have four hundred men here who have not fired a shot, and that is exactly what four hundred men in reserve are for.",needs:"surrendered"}],rebuff:"Take that to Milam. He is the one proposing to use it."}],props:[{id:"grass-notice",tx:14,ty:15,lines:[{text:"A sheet nailed to the post, in a clerk\u2019s hand, listing what was taken off the pack train on the twenty-sixth of November.",aside:"Item: grass. Item: grass. Item: grass. Somebody has written NO SILVER at the bottom in a different hand and underlined it twice.",sets:"read-grass",gives:"the grass fight"},{text:"NO SILVER, twice underlined. Nobody has taken it down and nobody is going to.",needs:"read-grass"}]},{id:"orders",tx:13,ty:14,lines:[{text:"A half-sheet pinned to the post under the notice, in Johnson\u2019s hand, and men are copying it onto whatever they have.",aside:"Two divisions. Right and left. Form at three, move at four, and NOT ACROSS THE PLAZA underlined twice at the bottom of it.",needs:"has-plan",sets:"read-orders",gives:"the storming of bexar"},{text:"NOT ACROSS THE PLAZA. Underlined twice. Somebody has copied that part out three times as big on the wall of the mill.",needs:"read-orders"}]},{id:"mill",tx:6,ty:5,lines:[{text:"The old mill on the creek, and the army has been using it since October for the officers and the powder and nothing else.",aside:"It is the only roof for a mile. Everybody else has been sleeping in the grass for six weeks, in November, and that is most of why the camp voted to go home."}]},{id:"camp-guns",tx:30,ty:14,lines:[{text:"Two field pieces, and that is the whole of the artillery this army has.",aside:"Against a town with a wall of houses round two plazas and a gun on a roof in the middle of it. You could bombard B\xE9xar with these for a month and knock a hole in one shed."}]}],exits:[{tx:18,ty:22,to:"bexar",entry:{tx:19,ty:24,facing:"up"}}]},Ur={".":l.GRASS_A,",":l.DIRT,"=":l.DIRT_EDGE,"~":l.WATER,a:l.ADOBE,h:l.THATCH,s:l.STONE,g:l.GATE,D:l.DOOR,k:l.CHAPEL_ROOF,K:l.CHAPEL_WALL,E:l.ESPADANA,A:l.CHAPEL_DOOR,"+":l.CROSS,Y:l.TREE,N:l.NOTICE,B:l.BILL_STONE,b:l.BILL_ADOBE,o:l.WELL,f:l.FLAGSTONE,R:l.ROCK,d:l.DOORWAY,G:l.GUN,O:l.BASTION},jr={id:"bexar",name:"B\xE9xar",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R..........Y.......,,......~~~.....R","R..aaaa............,,......~~~.....R","R..aada............,,......~~~..YY.R","R..................,,......~~~.....R","R.......aaaaaaa....,,......~~~.....R","R.......aaadaaa....,,......~~~.....R","R..................,,......~~~.....R","R.......,,,,,,,,,,,,,......~~~.....R","R..................,,.....~~~~.sss.R","R..aaaa............,,.....~~~~.sss.R","R..aada.....sKKKKKs,,.....~~~~.sss.R","R...........sKKEKKs,,,,,,,,~~~~....R","R...........sKKKKKs,ffff,GN~~~~....R","R...........sssAsss,ffff,B,~~~~....R","R..........,,,,,,,,,ffff,,,~~~~....R","R..........,,,,,,,,,,,,,,,,~~~~....R","R...aaaaa..,,,,,,,,,,,,,,,,~~~~....R","R...aadaa..,,,,,,,,,,,,,,,,~~~~....R","R..........,,,,,,,,,,,,,,,,~~~~....R","R....o.....,,,,,,,,,,,,,,,,~~~~....R","R..........,,,,,,,,,,,,,,,,~~~~....R","R..aaaa....,,,,,,,,,,,,,,,,~~~~.YY.R","R..aada....,,,,,,,,,,,,,,,,~~~~....R","R..................,,......~~~~....R","R..................,,......~~~~....R","RRRRRRRRRRRRRRRRRRR,,RRRRRRRRRRRRRRR"],legend:Ur,ridable:!1,start:{tx:6,ty:19,facing:"up"},scenes:[{id:"the-storming",needs:"called",unless:"milam-down",steps:[O(void 0,"Three in the morning, and the column forms up in the dark on the north edge of the town without a single order being shouted."),O(void 0,"You take them up Soledad. Past the ditch, and round it, because you know it is there. Into the corner house through a door on the yard side, because you know that is there too."),O("MILAM","Well. [He looks at the wall between this room and the next one.] Which way is the store?"),Ne(500),O(void 0,"And then it is four days of that. A crowbar, a wall, somebody\u2019s kitchen. The plaza is forty feet away and nobody in either column has stood in it once."),Ne(400),O(void 0,"On the third morning he steps out into the yard behind the Veramendi house, and a rifle goes off a long way away, and that is all of it."),ie("milam-down"),qe("milam is killed")]},{id:"the-terms",needs:"milam-down",unless:"surrendered",steps:[O(void 0,"The ninth. A white flag comes out of the priest\u2019s house at about nine in the morning and the firing stops in the middle of a sentence."),O(void 0,"Five hundred men march out under parole and go south, and there is not a Mexican soldier left in Texas."),Ne(500),O("JOHN W. SMITH","Four days. [He sits down on a step in the plaza he has not been allowed to cross since October.] Come here. Bring the book."),ie("surrendered"),qe("the general asks for terms")]}],npcs:[{id:"smith",name:"JOHN W. SMITH",tx:12,ty:16,facing:"right",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"rider",skin:f(d,11),hairCol:f(d,2),cloth:f(d,5),cloth2:f(d,3)},lines:[{text:"Six weeks. They have not charged us, they have not tried us, and they have not once said how long.",aside:"You keep writing. I keep counting. Between us we will have the whole of it and no use for any of it.",sets:"met-smith"},{text:"Do not walk the same street twice in a day. Once is a man going somewhere. Twice is a man looking at something.",needs:"met-smith",sets:"told-looking",then:!0},{text:"And do not write in the street. Write it after. If they take that book off you we are not prisoners any more, we are spies, and there is a different word for what happens to those.",needs:"told-looking"},{text:"They are letting us out. [He says it flatly, the way you say a thing you do not believe yet.] Both of us, this morning, and no reason given for that either.",needs:"released",sets:"knows-released",gives:"let out of the town"},{text:"Put it all on the table. [He pulls a length of twine out of his coat and does not explain where a man under arrest got twine.] I want to see the whole of it in order.",needs:"surrendered",sets:"to-the-string",opens:"bexar"}],rebuff:"Put it away. Not in the street \u2014 I have told you about the street."},{id:"ana-maria",name:"ANA MAR\xCDA",tx:17,ty:19,facing:"left",look:{build:"adult",hat:"rebozo",hair:"bun",torso:"rebozo",legs:"skirt",skin:f(d,9),hairCol:f(d,1),cloth:f(d,8),cloth2:f(d,4)},lines:[{text:"You are the one they will not let out. [She does not lower her voice, which tells you something about who is listening.] My cousin is in the camp outside.",aside:"Segu\xEDn has raised a company here. From these streets. Men who were baptised in that church behind you and are now sitting in the grass a mile away with rifles.",sets:"told-seguin",gives:"the company of juan seguin"},{text:"Whatever this turns into, do not let anybody tell you afterwards it was your people against mine. My cousin will be in the street on the same side as you.",needs:"told-seguin"},{text:"The general is asking for terms. [She has not moved from her door in four days.] I have lived on this plaza for thirty-one years and I have now seen it fought over twice.",needs:"surrendered"}],rebuff:"I can read. I would rather you did not stand in my doorway doing it."},{id:"sentry",name:"A SENTRY",tx:20,ty:25,facing:"up",distant:!0,absent:"released",look:{build:"adult",hat:"shako",hair:"crop",torso:"uniform",legs:"calzoneras",stance:"wide",skin:f(d,8),hairCol:f(d,1),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"No."}]}],props:[{id:"plaza-gun",tx:25,ty:13,lines:[{text:"They have got a gun up onto the flat roof of the priest\u2019s house, and it is not pointed out of the town. It is pointed across the plaza.",aside:"Anybody coming into this square from any of the four corners walks into that. Write it down tonight. Write down which corner.",sets:"saw-gun"},{text:"Still there, still laid on the square, and now you know the range of it because you have walked it.",needs:"saw-gun"}]},{id:"ditch",tx:14,ty:8,lines:[{text:"A trench cut straight across Soledad street, hip deep, with the spoil thrown up on the town side of it.",aside:"Cut from the north, which is the direction they expect. Every street in from that side has one. A man could go round it \u2014 through the house on the corner, if the house on the corner had a door on both sides. It has.",sets:"saw-ditch"}]},{id:"veramendi",tx:11,ty:6,lines:[{text:"The Veramendi house. Two storeys of stone, a courtyard behind, and the biggest door on this street.",aside:"The governor\u2019s family built it. Bowie married into it. There is a cypress in the yard and an old man on the corner will tell you a story about that tree if you let him.",sets:"saw-veramendi"},{text:"He will tell you a rifleman sat in the cypress. Somebody else will tell you the roof of the priest\u2019s house. Somebody has told you both, this week, in the same afternoon.",needs:"milam-down",sets:"told-tree",gives:"the tree in the veramendi yard"}]},{id:"san-fernando",tx:15,ty:14,lines:[{text:"San Fernando. Stone, a hundred years old, and the tallest thing between here and the coast \u2014 which is why there is a lookout on the tower and not a bell-ringer.",aside:"Everything on both plazas can be seen from up there. That is not a church tower any more, it is an eye."}]},{id:"concepcion-post",tx:25,ty:14,lines:[{text:"A notice on the wall of the priest\u2019s house, in Spanish, and somebody has written a reply on it in English in pencil.",aside:"The notice says the affair below the mission on the twenty-eighth of October was a reconnaissance withdrawn in good order. The pencil says NINETY MEN.",sets:"read-concepcion",gives:"the fight at concepcion"},{text:"The pencil is still there. Nobody has washed it off, which tells you how much of this town is on which side.",needs:"read-concepcion"}]},{id:"alamo-across",tx:25,ty:9,lines:[{text:"Across the water, the old mission. Roofless church, a long barrack, a wall round about three acres, and the Spanish put guns in it forty years ago.",aside:"Everybody calls it the Alamo, after a company of soldiers from \xC1lamo de Parras who were quartered in it. It is a ruin with a wall round it and nobody in this town thinks about it twice."},{text:"The army is going home. What is staying is a hundred-odd men, and they are quartering them in that.",needs:"surrendered",sets:"told-alamo",gives:"the garrison stays in the alamo"}]},{id:"house-north",tx:5,ty:3,lines:[{text:"Barred from the inside, and there is a chest against it \u2014 you can hear the scrape when somebody inside moves and thinks better of it.",aside:"Nobody in this town has opened a street door to a stranger since October."}]},{id:"house-west",tx:5,ty:11,lines:[{text:"Shut. There is a child2019s voice behind it and then a woman2019s, and then no voice at all."}]},{id:"house-south",tx:5,ty:23,lines:[{text:"Shut, and the window beside it has been bricked up with the same adobe as the wall, recently, badly, by somebody in a hurry.",aside:"Half the houses on this side have had that done. A window on a street is a hole a ball comes through."}]},{id:"well-armas",tx:5,ty:20,lines:[{text:"The well on the Plaza de Armas. There is a queue at it in the morning and no queue at all after dark, because after dark there is a curfew."}]}],exits:[{tx:6,ty:18,to:"bexar-house",entry:{tx:7,ty:8,facing:"up"}},{tx:19,ty:26,to:"alazan",entry:{tx:18,ty:22,facing:"up"}},{tx:20,ty:26,to:"alazan",entry:{tx:19,ty:22,facing:"up"}}],triggers:[{tx:14,ty:7,sets:"warned-street",unless:"saw-ditch",text:"There is a sentry on the corner ahead and he has already seen you.",aside:"Whatever you are going to look at, look at it once, and keep walking. Smith is right about the street."},{tx:19,ty:24,sets:"tried-road",unless:"released",text:"The sentry on the road puts a hand up before you are within twenty feet of him. He does not say anything. He does not have to."}]},$r=le({id:"bexar-house",name:"The house on the plaza",build:"adobe",back:{to:"bexar",tx:15,ty:15},place:[[11,1,"H"],[4,5,"t"],[4,6,"e"],[3,1,"r"],[11,5,"b"]],npcs:[{id:"holmes",name:"A. C. HOLMES",tx:10,ty:7,facing:"left",look:{build:"adult",hat:"none",hair:"short",torso:"camisa",legs:"rider",skin:f(d,10),hairCol:f(d,3),cloth:f(d,9),cloth2:f(d,4)},lines:[{text:"You are writing again. [He is not asking. He has watched you do it every evening for six weeks.]",aside:"I have decided I would rather not know what is in it. If they ask me what you have been putting in that book I would like to be telling the truth when I say I have no idea.",sets:"met-holmes"},{text:"Three of us on the order and not one charge between us. I have read it eleven times looking for the charge.",needs:"met-holmes",sets:"told-order"},{text:"Two of you. [He does not say the rest of it. He shakes your hand and goes back to the window.]",needs:"released"}],rebuff:"I have told you. I would rather not have read it."}],props:[{id:"the-order",tx:11,ty:5,lines:[{text:"The order, on the wall where the three of you can all see it, because Holmes put it there and would not take it down.",aside:"Maverick, Smith, Holmes. Not to quit the town on any errand at any hour until further order. It is signed, it is dated to the month, and there is no charge written anywhere on it.",sets:"read-order",gives:"three men confined to the town"},{text:"Still no charge on it. You have looked. Holmes has looked eleven times.",needs:"read-order"}]},{id:"the-diary",tx:4,ty:5,lines:[{text:"Your own book, open on the table, with the ink stoppered beside it because the ink is nearly gone and there is none to be had in a besieged town.",aside:"A day to a line, mostly. What you can see from this window and what you heard on the plaza. It is not a brave document. It is a lawyer taking notes because taking notes is the only thing left that he is allowed to do.",sets:"has-diary",gives:"the diary of a man under arrest"},{text:"You have got the gun on the priest\u2019s house in it now. That one is worth the whole rest of the book.",needs:"saw-gun"}]},{id:"window",tx:3,ty:1,lines:[{text:"The window onto the plaza, and it is the only thing in this room that has been any use in six weeks.",aside:"From here you can see the corner of the priest\u2019s house, the top of the church, and about a third of the square. You have counted everything that crosses it."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Cold. There is firewood in this town and none of it is for sale to the three men on the order."}]}]}),qr=[jr,$r,Lr,zt,So,Sr,Hr,Dr,...Dn,Fr,Vn,Xn,...Yn,Yr,qn,Jn,...Bn],Jr=Object.fromEntries(qr.map(o=>[o.id,o])),Vr={anahuac:["april-law","logan-retainer","travis-in-the-kiln","tenth-of-june","turtle-bayou","velasco","piedras"],bexar:["grass-fight","let-out","milam-call","storming","milam-killed","cos-terms"],goliad:["copano-landing","cos-here","rider-gonzales","cos-gone","roll-bahia","telegraph"],gonzales:["cannon-receipt","corporal-demand","ponton-reply","castaneda-order","old-eighteen","first-shot","castaneda-report"]};function Xr(o,t){const e=Vr[o];return!e||e.includes(t)}class Zr{constructor(t,e){m(this,"spine",[]);m(this,"hand");m(this,"loose");m(this,"log",[]);const n=Ki(t);this.loose=n.filter(a=>!a.when),this.hand=n.filter(a=>a.when&&(!e||Xr(e,a.id))).sort((a,s)=>Zn(a.id)-Zn(s.id))}get holding(){var t;return(t=this.hand[0])!=null?t:null}get done(){return this.hand.length===0}get gaps(){return this.spine.length+1}place(t){var g;const e=this.hand.shift();if(!e)throw new Error("DatelineFile: nothing left in hand");const n=Math.max(0,Math.min(this.spine.length,t)),a=this.legal(e,n),s=a?n:this.settle(e),h=(g=Qr[e.id])!=null?g:"",u=a?h:`${this.slid(e,s)} ${h}`.trim();this.spine.splice(s,0,e);const w={card:e,held:a,at:s,says:u};return this.log.push(w),w}legal(t,e){const n=this.spine[e-1],a=this.spine[e],s=t.when.day;return(!n||n.when.day<=s)&&(!a||s<=a.when.day)}settle(t){const e=t.when.day;let n=0;for(;n<this.spine.length&&this.spine[n].when.day<e;)n++;return n}slid(t,e){const n=this.spine[e-1],a=this.spine[e],s=t.when.shown;return n&&a?`[He slides it along the string.] This one says ${s}. It goes after ${n.when.shown} and before ${a.when.shown}.`:n?`[He slides it to the end of the string.] This one says ${s}, and the latest thing hanging here is ${n.when.shown}.`:a?`[He slides it to the head of the string.] This one says ${s}, and the earliest thing hanging here is ${a.when.shown}.`:"[He hangs it on the string.]"}}function Zn(o){let t=2166136261;for(let e=0;e<o.length;e++)t^=o.charCodeAt(e),t=Math.imul(t,16777619);return t>>>0}const Qr={concepcion:"The twenty-eighth of October, and it is the reason the army stayed. Ninety men beat two hundred and seventy-five and every man in camp decided the town could be taken.","house-arrest":"October, and the order does not say which day and does not say why. Three men held in a town for six weeks on no charge at all. You know how that ends, because you have read it before.","seguin-company":"The autumn, and no day on it. Men from this town, in the army outside this town. Whatever this war is about, it is not one people against another \u2014 put that where you can see it.","grass-fight":"The twenty-sixth of November. A hundred mules and everybody certain it was silver, and it was grass. Certainty is not evidence, and that is the cheapest lesson on this string.","let-out":"The first of December. Two men walk out of a town they have been shut in for six weeks \u2014 and everything after this on the string happens because of what walked out with them.","maverick-diary":"Written a day at a time while it was happening, which almost nothing else here was. Every other account of this siege is a man remembering. This one is a man looking.","milam-call":"The fourth. Six men wrote that sentence down afterwards and no two of them wrote the same sentence. The day is not in doubt. The words are, and I will not pretend otherwise.",storming:"Before dawn on the fifth, and look what is above it. He knew where the guns were because somebody had been made to sit in that town and count them.","johnson-division":"The same morning as the other. Two columns, and neither of them used a street after the first hour. They went through the houses.","milam-killed":"The seventh. He asked three hundred men to go into that town and he did not come out of it, and the town fell two days later.","cos-terms":"The ninth. Four days from the first shot to the white flag, and not one of those four days was fought in the open.","alamo-garrison":"December, no day. The army goes home and something over a hundred men stay in the mission across the river. Leave that at the bottom. It is not finished.","word-tejas":"A hundred and fifty years before anything else you have brought me. Hang it at the head and leave a great deal of string under it.","colony-line":"Six years before any of the rest of it. Two men were given the coast between the rivers and this house was already standing on it \u2014 hang it near the top and leave room.","espiritu-herd":"Older than anybody standing in this room. The mission counted its cattle every year for sixty years, and the counting is the only reason we know how many there were.","mark-signature":"The register gives the year and stops. I can tell you it is this year. I cannot tell you the month, and neither can it.",seamstress:"June, and the bill is the proof of June. Six yards, paid for, and the dress was finished and worn. A story cannot argue with a bill.",circular:"Austin wrote that in September and asked every man who got it to copy it out and read it aloud to his neighbours. That is what we have here instead of a newspaper.","copano-landing":"Five hundred men off the boats at Copano. Everything you are holding after this happens because of that.","copano-road":"The month and not the day. A carter counts loads, not calendars. Put it in September and do not pretend to know more.","cos-here":"The general slept in this building on the first of October. Hold that one where you can see it, and look at what comes next.","rider-gonzales":"A man on a horse, and he was not lying and he was not writing it down either. The second, he says. I have no paper that says so.","cos-gone":"And on the fifth he took the good companies out of that gate and went to B\xE9xar. Four days ago. Now put the ninth after it.","hatch-meeting":"On the sixth they were still forty men in somebody\u2019s front room in Matagorda, voting on who was in charge of them.","marriage-bond":"Tonight. I wrote it in the book myself, an hour before you came in, and both of them made their mark under it.",milam:"Nobody agrees on the day. I will put the man in the week and I will not put him in a day, and you should not either.","roll-bahia":"Somebody counted. That is the entire reason we are able to say three, instead of saying many and meaning nothing.",compact:"The ninth, like everything else tonight. Forty-nine names on it, and a good few of those names are marks.","bexar-cut":"The same day and the same event, looked at from the far end of the road. B\xE9xar will work out what happened when the wagons stop.",telegraph:"That one is dated tomorrow and printed two hundred miles from here, and no honest man in this room can produce it.","april-law":"That is the head of it and everything else on this table is downstream of it. A law in Mexico City, four sentences long, and it is why there is a fort on that bluff at all.","customs-post":"The autumn after the law. They did not put a garrison here because they disliked us; they put one here because the law told them to collect a duty and somebody has to stand where the boats come in.","convict-brick":"Thirty-one and thirty-two, and no closer than that. They were still building it while I was in it, which is the only reason I was in it.","white-herd":"Older than any of the rest and I would put it at the top with the law. Cattle are why anybody is on this bayou, and the meeting happened at White\u2019s because White had beef.","three-who-ran":"May. [He is quiet for a moment.] Three people came across and the colonel would not give them up, and that is the beginning of this, whatever anybody puts in a book afterwards.","logan-retainer":"The same month, and I will not pretend to you that I have forgotten the date. A man engaged me to go and get them back and I took the work.","forged-letter":"A letter that was not true, and I notice you have got it marked as reported rather than as dated. That is correct. I am not going to help you with it.","travis-in-the-kiln":"The seventeenth of May. Six weeks. No charge, no court, and a soldier deciding. Put that one where you can see it.","tenth-of-june":"The tenth. Two hundred yards of dirt nobody crossed and a great deal of shouting over it. First time anybody in this country pointed a gun at a Mexican soldier and meant it.","turtle-bayou":"Two days later, or five, or three \u2014 the sources will not agree and neither will the men who were sitting at the table. Nobody signed it. And it says what it says.",velasco:"The twenty-sixth, at the river mouth, and that is the one nobody is going to tell stories about because it is the one where people were killed.",piedras:"The second of July, and I walked out of an oven into a yard full of daylight. A senior officer read both accounts and let us go, and nobody was ever tried for any of it.","mexia-brazoria":"The eighteenth, at Brazoria. A general came up the coast to put down a rebellion, was handed a piece of paper explaining that there had not been one, and went home. It is the strangest thing in this entire summer.","cannon-receipt":"Four years before any of the rest of it, and everything after it is about this one sheet. Somebody signed for that gun. Hang it at the head and leave a great deal of string underneath.","dewitt-dead":"May. He died at Monclova chasing more land and we did not hear for weeks. That is why you are standing in front of me and not in front of him.","dewitt-marriage":"August, and the month is all it gives me. There was a wedding, it is written down, and I will put it in August and claim nothing about the day.","corporal-demand":"The twenty-fifth. A corporal and five men, forty miles, for one gun. I stood in the square and watched them ask.","ponton-reply":"The twenty-sixth. I wrote that one, at this table, and I was slow about it on purpose. Every hour it took was an hour a rider was on the road.","castaneda-order":"The twenty-seventh. A hundred dragoons for the same gun the corporal asked for politely two days before. Look at what is on either side of it.","old-eighteen":"The twenty-ninth. Eighteen names, and two of them you have shaken hands with. A muster is the only kind of paper that can prove a crowd.","orchard-burial":"The same day, and I cannot do better than the same day. Nobody writes a receipt for burying a gun in an orchard. Three men remembered it afterwards, and that is the whole of my evidence.","williams-camp":"The first of October. He could not cross in front of us, so he went up the river to a place he could, and camped on a man\u2019s own field without asking him.","first-shot":"The second. Before daylight, in fog thick enough to lose a hundred men in, which they did. That is the shot everyone will be talking about in a hundred years.","castaneda-report":"And this is the strangest thing on the table. The men who won wrote almost nothing down. The man who withdrew filed twice, on the second and again on the fourth, and his is the best paper we have about our own fight."},Pt={anahuac:{name:"TRAVIS",opening:["[He clears the table with his forearm, which is a thing he has clearly been looking forward to doing.] Everything. On there, face up, and in no order at all \u2014 the order is the work and I would rather do it myself.","I am a lawyer, which means that almost the only thing I have is the sequence of events. A man who can say what happened first can generally say who is at fault. A man who cannot has got an opinion.","So. One at a time, and you tell me where it goes. Earliest at the top. Put one wrong and I will move it, and I will tell you which two dates made me."],closing:["Now read it back to yourself from the top. A law, in eighteen thirty, that shuts the border and puts a customs house on this bay. A man from Louisiana who wants three people back. Me, and a letter that was not true, and six weeks in an oven.","Then the tenth of June, and men in the north end of the town. Then a table in a cattleman\u2019s yard. Then Velasco, where people actually died. Then a colonel senior to ours, and the boards coming off the kiln.","And in the middle of it \u2014 read that one again \u2014 we wrote down that we are for the constitution of eighteen twenty-four, and for General Santa Anna, who is in the field for it. By name. In writing. In June.","Nobody on that table asked to leave Mexico. Not one of us. Whatever anybody tells you in ten years about what this summer was, you were here, and you have got the paper."],undated:["That one I cannot put anywhere.","A man in a cloak, at the gate, after dark, so the sentry could not name him afterwards. Everybody tells it. I have heard four men tell it and two of them were not in the province at the time.","No name, no day, and the note itself is gone. So it does not go on the table with the things that have a date.","Which is not the same as saying it did not happen. It is worse than that. It means nobody can ever check \u2014 and I would remind you that I am the man it is supposed to be about."],empty:["You have brought me nothing with a date on it.","Then go and find some. There is a register in the customs house with a day beside every line in it, and there is a decree nailed to the post in the square, and both of them are about you."]},bexar:{name:"JOHN W. SMITH",opening:["[He clears the table with his sleeve and puts a length of twine down the middle of it.] Right. Everything you have got. Face up.","You wrote most of this in a room I was sitting in. I watched you do it and I never once asked what was in it, and now I would like to see it in order.","Earliest at the top. Tell me where each one goes and I will hang it. Put one in the wrong gap and I will move it, and I will read you the two dates that made me."],closing:["Now read it back down. In November this army had been sitting in the wet for six weeks and had all but voted to go home, and the last thing it had done was fight over a hundred mules it was certain carried silver.","On the first of December they let two of us out of that town. On the fourth Milam asked three hundred men to go back into it. On the fifth we went in before it was light and we never once crossed the open ground.","And that is the bit I want you to look at. He did not ask them to be brave. He asked them to go through the walls of houses, because by then he knew which houses \u2014 and he knew it because a man who was not allowed to walk down a street had spent six weeks writing down what he could see from a window.","On the seventh they shot him in a yard. On the ninth the general asked for terms. Milam never saw the town taken, and your book is the reason it was.","Now. What is NOT on that string."],undated:["That one will not hang, and you know why as well as I do.","Everybody agrees he was shot in the Veramendi yard. Everybody agrees the shot came from a distance. Which tree, and which man, has been told six ways in four days and there is not one line of it written down from the day itself.","So it stays in your hand. Not because it is a lie \u2014 I do not think it is. Because there is nothing left to check it against, and a thing nobody can check cannot be put in a line with things that can."],empty:["You have not brought me anything. [He looks at the empty twine.] Go back and pick up some paper first."]},goliad:{name:"EL PADRE",opening:["[He sweeps the table clear with his forearm and lays the string down the middle of it.] Everything you have got. Face up, so I can read them.","I keep the register for this parish. Baptisms, marriages, burials. Every line in it has a day written beside it, and that day is the entire reason the book is worth keeping.","So. One at a time, and you tell me where on the string it belongs. Earliest at the top. If you put one in the wrong place I will move it, and I will tell you how I knew."],closing:["Now look at your string. The general was standing in this fort on the first. On the fifth he walked out of that gate with the best companies he had. On the ninth, some men from Matagorda walked in.","Nobody wrote that down. Not one paper on this string says it. You put them in a line and the line said it.","And there is not a newspaper anywhere in it. There is no newspaper in Texas. The nearest press is at Brazoria, it comes out on Saturdays, and it has not heard of any of us.","So this is what a week is made of before anybody prints it. A circular somebody copied out by hand. A bill for cloth. My book. And a man on a horse."],undated:["These I cannot hang anywhere.","Everybody was there. Everybody remembers it. Not one of them wrote down which night, so it does not go on the string with the others.","Understand me \u2014 that is not the same as it being untrue. It is worse than untrue. It means nobody can ever check."],empty:["You have brought me nothing with a date on it.","Go and look again. Anything anybody wrote down has a day on it somewhere, and the ones that do not are the ones you must be most careful with."]},gonzales:{name:"PONTON",opening:["[He sweeps the table clear with his forearm and lays a length of string down the middle of it.] Everything you have
