orso:"camisa",legs:"calzoneras",skin:f(d,9),hairCol:f(d,2),cloth:f(d,11),cloth2:f(d,5)},lines:[{text:"Coffee, no. Sugar, no. Powder \u2014 [he looks at you properly for the first time] \u2014 how old are you?",aside:"The shelves behind him are handsome and mostly empty."},{text:"Everything on this side of the room came up the road from Copano. Nothing has come up it in nine days. You work out what that means, I have stopped enjoying it.",needs:"told-landing"}]}],props:[{id:"shelves",tx:3,ty:1,lines:[{text:"Good shelves, planed and pegged, with four things on them.",aside:"Somebody built these expecting a different decade."}]},{id:"counter",tx:7,ty:5,lines:[{text:"A counter worn pale in one strip, where nine years of elbows have gone."}]}]}),Vi=le({id:"jacal-n",name:"A jacal",build:"adobe",back:{to:"goliad",tx:6,ty:12},place:[[11,1,"H"],[3,3,"r"],[3,4,"r"],[3,5,"r"],[5,6,"e"]],props:[{id:"hides",tx:3,ty:4,lines:[{text:"Hides folded and stacked to the roof pole, and two counts chalked on the wall beside them.",aside:"The second count is lower than the first. Neither has been rubbed out, and there is chalk left on the ledge for a third."}]},{id:"beam",tx:5,ty:6,lines:[{text:"A tanning beam \u2014 a log worn hollow down the middle \u2014 and a knife with an edge on the bottom half only. The top half is for pushing.",aside:"The lime and the oak bark stay out at the yard. What gets done in this house gets done after dark, sitting down."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Cold, laid, and waiting. He left before it was light and he will want this going the moment he is back through the door."}]}]}),Xi=le({id:"jacal-w",name:"A jacal",build:"adobe",back:{to:"goliad",tx:4,ty:17},place:[[11,1,"H"],[4,3,"r"],[9,5,"t"]],light:{base:-4,sources:[{tx:Je.tx,ty:Je.ty,r:6,gain:6},{tx:4,ty:3,r:4,gain:5},{tx:3,ty:2,r:3,gain:2}]},props:[{id:"webs",tx:2,ty:1,lines:[{text:"Webs in the corner, roof pole down to the wall, with enough dust sitting on them to see them by.",aside:"Nobody has swept the threshold either. The dust in the doorway has bird tracks across it and nothing bigger."}]},{id:"loom",tx:4,ty:3,lines:[{text:"A loom with the warp still on it and about a hand\u2019s width woven. The shuttle is on the floor underneath, where it went.",aside:"The light in this room still falls across the work and not across the worker. Somebody arranged that years ago and it is still arranged."}]},{id:"table",tx:9,ty:5,lines:[{text:"Two bowls on the table, and a cup turned upside down on a cloth to drain. The cloth has dried into the shape of the cup.",aside:"None of it has been taken. In a town this short of everything, a whole house left standing full is a thing somebody decided."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Ash, and nothing under the ash. It has been rained on through the smoke hole until it went to a grey crust you could lift out in one piece.",aside:"The sickness came through in the summer of thirty-four. This is one of the houses nobody came back to."}]}]}),Zi=le({id:"jacal-s",name:"A jacal",build:"adobe",back:{to:"goliad",tx:5,ty:25},place:[[11,1,"H"],[5,5,"t"],[3,5,"e"],[3,6,"e"],[11,6,"e"]],props:[{id:"sewing",tx:5,ty:5,lines:[{text:"A table cleared for one piece of work and kept cleared for four months. Chalk, pins in a folded paper, and the shears laid across the middle of it.",aside:"What was on this table is on her daughter tonight. The offcuts are folded in a basket underneath and not one of them is bigger than a hand."}]},{id:"cots",tx:3,ty:5,lines:[{text:"Three cots. The end one has been made up flat since Thursday and slept in on none of the nights since.",aside:"Thursday is when the cooking started."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Swept out and banked low. Everything for tonight was cooked on the fire in the yard, because two hundred people will not fit in a house."}]}]}),Dn=[qi,Ji,Vi,Xi,Zi],Qi=le({id:"davis-house",name:"The house",build:"log",back:{to:"orchard",tx:5,ty:5},place:[[11,1,"H"],[4,5,"t"],[4,6,"e"],[10,6,"e"],[3,1,"r"]],props:[{id:"hearth",tx:11,ty:1,lines:[{text:"Banked for the day. Whatever happens in the square, there will be supper."}]},{id:"table",tx:4,ty:5,lines:[{text:"Four bowls and a slate. The slate is yours, and it is the only one in this house, and everybody in this house is proud of it in a way nobody mentions.",aside:"There is a copied-out alphabet on the back of it in your mother\u2019s hand, from when she was teaching you, from when somebody taught her."}]},{id:"rack",tx:3,ty:1,lines:[{text:"Two muskets on the rack and a shot pouch hung off the end of it. Both of them are for deer and one of them is older than the town."},{text:"One musket. He has taken the other and he did not say anything about taking it.",needs:"dragoons"}]}]}),er=le({id:"ponton-house",name:"The alcalde's",build:"log",back:{to:"gonzales",tx:13,ty:6},place:[[11,1,"H"],[5,1,"b"],[7,4,"t"],[7,5,"e"],[3,2,"r"]],npcs:[{id:"ponton",name:"PONTON",tx:7,ty:3,facing:"down",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"ledger",skin:f(d,10),hairCol:f(d,2),cloth:f(d,5),cloth2:f(d,9)},lines:[{text:"I am the alcalde, which in this town means I keep the book, I marry people, and when five soldiers ride in I am the one who has to be out.",aside:"Sit down. Or stand. You keep a store \u2014 you know better than most men here what waiting looks like."},{text:"You read this to him. [He turns the receipt over twice.] Good. Then you know what it says, which puts you ahead of most of the men in that square.",aside:"It says the gun is ours to hold and theirs to call for. They have called for it. So I am now going to write them a letter.",needs:"errand-ponton",sets:"ponton-writing",then:!0},{text:"Watch what I do here, because you will want it one day. I am going to agree that the gun belongs to the government. I am going to say it was given in perpetuity for our defence. And then I am going to say that a demand of this size is a matter for the political chief.",aside:"And the political chief is at B\xE9xar, and I could not possibly say when he will be back. Every one of those sentences is true and every one of them is an hour.",needs:"ponton-writing",then:!0},{text:"While that letter is being carried to B\xE9xar, four men are riding to Mina and Columbus and Beason\u2019s. That is what the letter is for. It is not for changing anybody\u2019s mind.",aside:"[He blots it, folds it, and hands it to you to take out to the corporal.] Take your time crossing the square.",needs:"ponton-writing",sets:"letter-sent"},{text:"Now we find out how long an hour is worth.",needs:"letter-sent"},{text:"Eighteen names, and I want it nailed up where every man can see his own. Not because they will forget. Because in thirty years somebody will say it was forty men, or six, and there will be a paper.",needs:"dragoons"},{text:"Sit down and put everything you are carrying on this table. Face up. And add this one, which did not come into my hands for months and is dated two days after you were standing in that fog.",aside:"The lieutenant\u2019s own account of it, to his own colonel. It is the best paper anybody has about our fight and not one of us wrote it.",needs:"fought",sets:"strung",gives:"the lieutenant's report",opens:"gonzales"},{text:"Go home. Your mother has been standing at that window since Thursday and she has not once said so.",aside:"And keep that string. Somebody will want it one day, and they will not take your word for any of it.",needs:"strung",sets:"the-end"}]}],props:[{id:"fair-copy",tx:5,ty:1,lines:[{text:"A sheet pinned to the wall at eye height, in a careful hand, with two words crossed out and written again above.",aside:"He keeps the fair copy of everything he sends. That is most of what being the alcalde is."},{text:"You take it down and read it properly. It is four sentences long and it takes you a while, because three of them are doing something other than what they say.",needs:"ponton-writing",sets:"read-reply",gives:"the alcalde says no"},{text:"Back on its pin. He will want it when somebody asks him in ten years what exactly he said.",needs:"read-reply"}]},{id:"ledger",tx:7,ty:4,lines:[{text:"The town book, open, with a rule down the middle and the year at the head of the page. Marriages on the left and land on the right.",aside:"There is no priest in this town and no parish register. There is this, and there is whatever people write in their own Bibles."}]}]}),tr=le({id:"dewitt-house",name:"The DeWitt house",build:"log",back:{to:"gonzales",tx:25,ty:6},place:[[11,1,"H"],[9,1,"b"],[4,4,"t"],[4,5,"e"],[3,2,"r"]],props:[{id:"monclova",tx:9,ty:1,lines:[{text:"A single sheet under glass in a frame that is much too good for it, hung where the light from the door falls on it in the afternoon.",aside:"It has been folded into eight and flattened out again, which is what a letter looks like after it has been carried four hundred miles in somebody\u2019s coat."},{text:"It is dated in May, at Monclova, and it is signed by a man who was there. It says what he died of and where they put him, and it is very short.",sets:"read-monclova",gives:"the empresario is dead"},{text:"The frame is worth more than the paper and the paper is the only thing in this house she would carry out of a fire.",needs:"read-monclova"}]},{id:"bible",tx:4,ty:4,lines:[{text:"A Bible on the table with a strip of ribbon in it, and the ribbon is not at a psalm. It is at the two blank pages in the middle where a family writes itself down.",aside:"Births on the left. Marriages under them. A hand you do not know, and then a hand you do."},{text:"The last line but one is a marriage, in August of this year: Naomi, daughter of Green and Sarah, to William Matthews. There is a month and there is no day, and underneath it there is nothing at all.",sets:"read-bible",gives:"the dewitt wedding"},{text:"You put the ribbon back where it was, because it is not your book.",needs:"read-bible"}]},{id:"cloth",tx:3,ty:2,lines:[{text:"A press with cloth folded in it, and a work basket on top with shears, thread and a paper of pins."},{text:"The shears are out and there is a length of plain white cotton over the arm of the chair, six feet of it, cut square and not hemmed.",aside:"And a saucer of lamp-black and oil on the floor by the window, mixed and going crusty at the edge. Nobody has said one word to you about any of it.",needs:"dragoons",sets:"saw-cloth",gives:"come and take it"},{text:"The cotton is gone off the chair. The saucer is still there.",needs:"saw-cloth"}]}]}),or=le({id:"sowell-shop",name:"Sowell's shop",build:"log",back:{to:"gonzales",tx:13,ty:19},place:[[11,1,"H"],[3,1,"r"],[7,5,"t"]],light:{base:-5,sources:[{tx:11,ty:1,r:8,gain:8},{tx:7,ty:8,r:4,gain:3}]},props:[{id:"forge",tx:11,ty:1,lines:[{text:"The forge, banked and breathing. Everything in this room is the colour of the fire and nothing in it is the colour it would be outside."}]},{id:"bench",tx:7,ty:5,lines:[{text:"Nails in a wooden tray, sorted by length, and a pile of them at one end that have been cut down to about an inch.",aside:"Somebody has been making a great many very small nails this week, and small nails are for paper."}]},{id:"tyres",tx:3,ty:1,lines:[{text:"Wagon tyres, iron hoops, leaning against the wall in order of size like a set of hoops for a game."},{text:"Two of the hoops are gone off the wall and there is a fresh scorch ring on the floor where they were shrunk on to something.",needs:"eighteen"}]}]}),nr=le({id:"darst-house",name:"The Darst place",build:"log",back:{to:"gonzales",tx:25,ty:19},place:[[11,1,"C"],[4,4,"t"],[4,5,"e"],[10,5,"e"],[3,1,"r"]],props:[{id:"darst-hearth",tx:11,ty:1,lines:[{text:"A stick chimney, daubed over, with a fire kept small in it. Half the houses in this town have one and every man in this town knows somebody whose burned down."}]},{id:"darst-table",tx:4,ty:4,lines:[{text:"Supper laid for four and eaten by two, and nobody has cleared it. The bench on the far side has been pushed back and left pushed back.",aside:"There is dried mud on the floor beside it in the shape of a boot, going out and not coming in."}]},{id:"darst-spade",tx:3,ty:1,lines:[{text:"A rack of tools with a gap in it, and two spades leaning against the wall under the gap with the earth still on them.",aside:"Wet earth, and orchard earth \u2014 it is redder than anything in this town and there are peach leaves stuck to the blade of one."},{text:"Two spades, and there were three men. The third one took his home with him, or he did not have one, or he was not there at all.",aside:"You are not going to find that out in this room, and you are not going to find it out anywhere else either.",needs:"told-burial"}]}]}),Bn=[Qi,er,tr,or,nr],ar=le({id:"white-house",name:"The house",build:"log",back:{to:"bayshore",tx:7,ty:6},place:[[11,1,"C"],[4,4,"t"],[4,5,"e"],[10,5,"e"],[3,1,"r"]],props:[{id:"hearth",tx:11,ty:1,lines:[{text:"A stick chimney, daubed over, and a fire kept small because it is June on the Gulf coast and the only reason for a fire at all is bread."}]},{id:"table",tx:4,ty:4,lines:[{text:"A plank table with three drafts of the same letter on it, weighted down with a shot pouch. The first is long and the second is angry and the third is the one she gave you.",aside:"You can see where she stopped and started again. She has written it out for a man who has her husband in an oven and she has been polite three times."}]},{id:"rack",tx:3,ty:1,lines:[{text:"A rifle on the rack with dust on the lock, and a fowling piece under it with none.",aside:"One of these is for deer and the other is for the pot, and neither of them is going anywhere near that fort, because your mother has said so out loud twice."}]}]}),sr=le({id:"customs-house",name:"The customs house",build:"brick",back:{to:"anahuac",tx:7,ty:14},place:[[11,1,"H"],[5,1,"b"],[7,4,"t"],[7,5,"e"],[3,2,"r"]],props:[{id:"schedule",tx:5,ty:1,lines:[{text:"The tariff, pinned to the brick at eye height, with a second sheet under it in a "You can smell the cattle before you can see the house, and then you can see the house, and there are more people in the yard than live in the town.",route:"White\u2019s place",ms:7e3}]},"back-from-the-bayou":{id:"back-from-the-bayou",captions:[{text:"Back along the bayou with the sun going, and the thing in your head is not what they wrote but that nobody put a name to it.",route:"The bayou road",ms:7e3},{text:"Somebody catches you up on the road and tells you a colonel has come down from the north, and that he is senior to ours, and that the town has gone very quiet.",route:"Back to Anahuac",ms:8e3}]},"ride-to-goliad":{id:"ride-to-goliad",mounted:!0,captions:[{text:"The mare knows the road better than you do, which is lucky, because you are not watching it.",route:"Morning \xB7 the river road",ms:8e3},{text:"An hour of mesquite and one long look back at nothing in particular.",route:"To Goliad",ms:8e3},{text:"You get down outside the gate and tie her where everyone ties them. Nobody rides through a town this size.",route:"Goliad \xB7 mid-morning",ms:7e3}]},"walk-to-gonzales":{id:"walk-to-gonzales",captions:[{text:"It is a mile and a half of wagon ruts and you have walked it since before you can remember walking.",route:"Morning \xB7 the town road",ms:7e3},{text:"There is a paper folded in your shirt and you keep putting your hand flat on it to check that it is still there.",route:"To Gonzales",ms:7e3},{text:"You can hear the town before you can see it, which is not usual, and there are more horses in the square than there are on most days in the whole county.",route:"Gonzales \xB7 mid-morning",ms:7e3}]},"the-crossing":{id:"the-crossing",captions:[{text:"The river is cold and higher than a boy of your size has any business being in, and there is a rope, and you hold it.",route:"Night \xB7 the Guadalupe",ms:7e3},{text:"The gun goes over on a raft made of two skiffs and a gate. Nobody speaks above a mutter and the whole town of you smells of wet wool.",route:"Upriver",ms:7e3},{text:"Then the fog comes down off the water, and the man in front of you stops being a man and starts being a shape, and then stops being anything.",route:"Somewhere on the far bank",ms:7e3}]},"back-to-gonzales":{id:"back-to-gonzales",captions:[{text:"It is properly light now. Somebody has your father by the shoulders and is shaking him, and both of them are laughing, and neither of them can hear anything.",route:"Morning \xB7 the river road",ms:7e3},{text:"You walk the whole way back trying to fix the order of it in your head, and it will not stay in order, and that frightens you more than the dark did.",route:"To Gonzales",ms:8e3}]}},vr={".":l.GRASS_A,",":l.DIRT,"=":l.DIRT_EDGE,"~":l.WATER,"-":l.FENCE_H,"|":l.FENCE_V,1:l.FENCE_NW,2:l.FENCE_NE,3:l.FENCE_SW,4:l.FENCE_SE,"#":l.WALL,"^":l.ROOF,'"':l.ROOF_EDGE,D:l.DOOR,d:l.DOORWAY,t:l.TROUGH,c:l.CORN,Y:l.TREE,o:l.WELL,R:l.ROCK},zt={id:"ranch",name:"The ranch",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R..........................YY.R",'R...""""".................YYY.R',"R...^^^^^..............ccc....R","R...##d##..............ccc....R","R.............o........ccc....R","R......................ccc....R","R.....1--.---2................R","R.....|......|................R","R.....|......|.....Y..........R","R.....t......|................R","R.....|......|................R","R.....3------4................R","R.............................R","R......YY..........,,,........R","R..................,=,........R","R~~~~~.............,,,........R","R~~~~~.............,,,........R","RRRRRRRRRRRRRRRRRRR,,,RRRRRRRRR"],legend:vr,ridable:!0,start:{tx:9,ty:6,facing:"down"},npcs:[{id:"mare",name:"THE MARE",tx:9,ty:10,facing:"left",kind:"horse",look:{build:"adult"},lines:[{text:"She looks at you, then at the empty trough, then away. She has made her position clear."},{text:"She comes to the rail while you are still holding the gourd.",aside:"Up you get.",needs:"watered",sets:"mounted"},{text:"She shifts eek ago and it was somewhere else. Ask in the town, and ask somebody who keeps paper.",needs:"told-rider"}]}],triggers:[{tx:20,ty:17,unless:"mounted",sets:"tried-the-road",text:"You get as far as the last of the fence and stop.",aside:"Goliad is an hour south on foot and the wedding is at noon. Not without the mare."}],exits:[{tx:6,ty:4,to:"ranch-house",entry:{tx:7,ty:7,facing:"up"}},{tx:20,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"},{tx:21,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"}],props:[{id:"well",tx:14,ty:5,lines:[{text:"A gourd hangs on the rope, dry as a drum. You take it.",aside:"The rope still runs down into the dark, and the dark is wet.",sets:"gourd"},{text:"You let the rope down and haul it up hand over hand. The gourd fills.",needs:"gourd",sets:"full"},{text:"Full to the neck. Anything more goes on your feet.",needs:"full"}]},{id:"trough",tx:6,ty:10,lines:[{text:"Dry to the boards. Nothing will drink from this."},{text:"Dry to the boards. You turn the gourd over it and nothing comes out of that either.",aside:"It wants filling first. The well is up the slope.",needs:"gourd"},{text:"You tip the gourd in. The mare lifts her head before the water settles.",needs:"full",sets:"watered"},{text:"Full, and already half of it gone. She drinks like she has been waiting all morning, which she has.",needs:"watered"}]},{id:"corn",tx:23,ty:4,lines:[{text:"Corn, and not much of it. It has been a dry year on this side of the river."}]},{id:"road",tx:20,ty:17,lines:[{text:"The road south. Goliad is an hour that way on foot, and you do not have an hour.",aside:"Not without the mare."},{text:"The road south, and the mare under you. Goliad by mid-morning.",aside:"Just ride down it. Nobody is going to stop you.",needs:"mounted"}]}]},Er={".":l.GRASS_A,",":l.DIRT,"=":l.DIRT_EDGE,"~":l.WATER,a:l.ADOBE,h:l.THATCH,s:l.STONE,O:l.BASTION,g:l.GATE,r:l.RACK,D:l.DOOR,k:l.CHAPEL_ROOF,K:l 17,facing:"up"}},{tx:6,ty:4,to:"mission-room",entry:{tx:7,ty:7,facing:"up"}},{tx:7,ty:4,to:"mission-room",entry:{tx:7,ty:7,facing:"up"}},{tx:8,ty:4,to:"mission-room",entry:{tx:7,ty:7,facing:"up"}},{tx:30,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:32,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:31,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"}],triggers:[{tx:31,ty:15,needs:"chapel-open",sets:"under-the-arch",text:"[The doors are open above you. Somebody inside is dragging benches.]",aside:"Straight up the steps."}],npcs:[{id:"refugia",name:"DO\xD1A REFUGIA",absent:"chapel-open",tx:4,ty:25,facing:"up",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:f(d,9),hairCol:f(d,1),cloth:f(d,7),cloth2:f(d,5),accent:"#8b5d55"},lines:[{text:"Two hundred people and one fire. If you are going to stand there, stand there holding something.",aside:"Take these tamales to Anselmo. He is owed a meal and he knows it.",sets:"tamales"},{text:"Go on. The music does not start itself.",needs:"tamales"},{shows:"the circular",text:"[She wipes her hands on the rebozo before she will touch it, and then does not take it.] Read it to me. I can hear better than I can see.",aside:"A committee of correspondence. So there is a committee now. Somebody in San Felipe has decided what the rest of us are, and here it comes up the road nailed to a post.",sets:"read-aloud-refugia"},{text:"You hear that? That is my daughter getting married, and a fiddle, and nobody sick. Two years ago I would not have believed it.",needs:"gut"}],rebuff:"I cannot read it and you holding it closer does not help. Tell me what is on it."},{id:"anselmo",name:"ANSELMO",absent:"chapel-open",tx:18,ty:18,facing:"down",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:f(d,9),hairCol:f(d,8),cloth:f(d,11),cloth2:f(d,5)},lines:[{text:"You are early. Nobody is early to a wedding."},{text:"Tamales. Good. Now the bad news \u2014 I broke a string this morning and there is no gut in this town but at the hide yard.",aside:"A rider came through Tuesday. There was a fight at Gonzales the Friday before, over a cannon. They say the flag was a girl\u2019s wedding dress, cut up.",needs:"tamales",sets:"string"},{text:"A wedding dress. That is what they are saying, anyway. Ask me again in fifty years and it will be two wedding dresses.",needs:"string"},{shows:"the circular",text:"[He puts the fiddle down on his knee to listen, which from him is a great deal.] Again. The part about the meeting.",aside:"Now that is a thing I can carry. I play in four towns between here and Victoria and a fiddler is not searched. Read it once more and slowly.",sets:"read-aloud-anselmo"},{text:"[He strings the fiddle, tunes it against his thumb, and starts to play.]",needs:"gut"}],rebuff:"I read music and nothing else, and not much of that. Say it out loud or put it away."},{id:"casimiro",name:"CASIMIRO",tx:7,ty:30,facing:"left",look:{build:"adult",hat:"kerchief",hair:"crop",torso:"apron",legs:"calzoneras",stance:"wide",skin:f(d,8),hairCol:f(d,1),cloth:f(d,10),cloth2:f(d,6),accent:"#8b5d55"},lines:[{text:"Careful where you stand. Everything on this side of the yard is wet."},{text:"Gut I have. Time I do not. The buyer says eight hundred skins and I say nine hundred and forty, and one of us is wrong.",aside:"Count them. Properly \u2014 walk down the racks and do it yourself. I will cut your string while you wait.",needs:"string",sets:"to-count"},{text:"Well? You went and looked. That is more than the buyer did.",aside:"How many?",needs:"counted",options:[{label:"Eight hundred.",sets:"miscounted",reply:"Eight hundred is his number, not yours. You did not get it off the racks, you got it off him. Go back and add it up."},{label:"Nine hundred and forty.",sets:"gut",reply:"Nine hundred and forty. [He writes it on a slip and hands it over with the gut.] Take that to Se\xF1ora Ocampo. If the buyer argues, you were there and he was not.",aside:"And learn the ford while you are young \u2014 seven miles up, and everybody knows where it is. Some day that will matter more than it does today."},{label:"A lot.",sets:"miscounted",reply:'"A lot." [He puts the knife down.] A lot is what you say when you did not count. Nobody has ever won an argument with a lot. Go back and add it up.'}]},{text:"Take the tally to Se\xF1ora Ocampo, and do not lose it. It is the only copy and it has your counting in it.",needs:"gut"},{text:"Seven miles up. Do not forget it.",needs:"tally"}]},{id:"ocampo",name:"SE\xD1ORA OCAMPO",tx:6,ty:22,facing:"up",look:{build:"adult",hat:"mantilla",hair:"bun",torso:"camisa",legs:"skirt",load:"ledger",skin:f(d,10),hairCol:f(d,1),cloth:f(d,4),cloth2:f(d,3)},lines:[{text:"If you have no money you have no business, and you have no money."},{text:"Eight hundred. That is what my book says and my book does not guess.",aside:"Nine hundred and forty? [She looks at the slip. She looks at you.] You counted them. I did not. Nine hundred and forty.",needs:"gut",sets:"tally",then:!0},{text:"Candles for the chapel. Do not run with them.",needs:"tally",sets:"candles"},{text:"A number beats a story, m\u2019ijo. Remember that the next time somebody tells you one.",needs:"candles"}]},{id:"tomas",name:"TOM\xC1S",tx:32,ty:15,facing:"up",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:f(d,9),hairCol:f(d,1),cloth:f(d,12),cloth2:f(d,5)},lines:[{text:"You cannot go past me. The quarters and the magazine are the garrison\u2019s and they are not in a mood."},{text:"Candles. Finally. [He takes them without looking up and starts setting them along the wall.] Go in. Sit anywhere. It starts when the fiddle starts.",needs:"candles",sets:"chapel-open"},{text:"First wedding since the sickness. My mother counted \u2014 a hundred and eleven of us went into the ground that year.",needs:"chapel-open"},{text:"I am not going in. Somebody has to watch the candles and it is always me.",needs:"wedding"}]},{id:"soldier",name:"SOLDADO",tx:31,ty:9,facing:"down",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",load:"musket",stance:"wide",skin:f(d,8),hairCol:f(d,1),cloth:f(Z,1,.5),cloth2:f(d,12)},lines:[{text:"Chapel is that way, and it is shut until somebody brings candles. [He does not move, exactly, but the gate is wider than it was.]",aside:"The bride\u2019s mother is Do\xF1a Refugia \u2014 far end of town, west, at the cooking fire. The bride you will not see until tonight, and everything before that goes through her mother."},{text:"A wedding. Good. It has been a quiet year for the good kind of noise.",needs:"candles",sets:"asked-general",then:!0},{text:"You know who stood where you are standing, eight days ago? The general. Cos himself. He slept in those quarters and you could have thrown a stone at him from the gate.",aside:"His billeting order is still on the door of those quarters. Nobody has had the heart to take it down.",needs:"asked-general",sets:"told-here",then:!0},{text:"And on the fifth he took the Morelos battalion and his own guard and went to B\xE9xar, on account of something that happened at a place called Gonzales.",aside:"He left us. That is a fact with a date on it, and the date is pinned inside the barracks door. Fifty of us, and a wall built for three hundred.",needs:"told-here",sets:"told-gone"},{text:"Fifty men. Walk the wall yourself and count the gates, and then tell me how you would do it.",needs:"told-gone"}]},{id:"elder",name:"DON PRUDENCIO",tx:15,ty:20,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"folded",legs:"calzoneras",stance:"bowed",skin:f(d,8),hairCol:f(d,12),cloth:f(d,5),cloth2:f(d,3)},lines:[{text:"You are the one who counts hides. Sit a minute. Do you know what this province is called, and why?",aside:"Not Texas. Before that.",sets:"asked-name",then:!0},{text:"Tejas. And it is not a Spanish word at all \u2014 it is Caddo, from the people out east. Tayshas. It means friends. Allies.",aside:'They said it to the first Spaniards as a greeting, and the Spaniards wrote it down as the name of the country. We have been calling this place "friends" for a hundred and fifty years without knowing it.',needs:"asked-name",sets:"told-name",gives:"the word tejas"},{text:"Friends. Remember that when men start arriving who do not speak it.",needs:"told-name",sets:"asked-circular",then:!0},{text:"There is one nailed up on the post at the crossing, if you want to read it. A man read it aloud here and then left a copy for whoever came after him.",aside:"Austin wrote it at San Felipe in September. There is no newspaper in Texas. THAT is the newspaper: one page, copied out by hand, walked from town to town and nailed where people pass.",needs:"asked-circular",sets:"told-circular"},{text:"Copy it out if you can write. If you cannot, read it to somebody who cannot either. That is the whole system and there is no other one.",needs:"told-circular"},{shows:"the circular",needs:"read-aloud-anselmo",text:"I know. I heard you. [He is pleased and will not show it.] Refugia at the fire and Anselmo with his fiddle, and now there are three of us in this square who know what it says.",aside:"That is how it moves. Not the copy \u2014 the reading. A hundred years from now somebody will find the sheet and think the sheet was the thing.",sets:"circular-carried"}],rebuff:"That is a paper about somewhere else. Bring me the one off the post at the crossing."},{id:"carter",name:"THE CARTER",tx:23,ty:25,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"satchel",skin:f(d,8),hairCol:f(d,1),cloth:f(d,6),cloth2:f(d,4)},lines:[{text:"Do not ask me what is in the carts and I will not have to lie to you.",aside:"Coffee. It is coffee. Mostly.",sets:"asked-road",then:!0},{text:"Everything that reaches Bexar comes through here. Copano is forty miles down, the road runs right past that chapel, and there is no other road.",aside:"Which is why this little town has a fort in it and Victoria does not. If you want the numbers, the freight bill is nailed up on the store wall.",needs:"asked-road",sets:"told-road"},{text:"Forty miles to the water. Remember the road, not the town.",needs:"told-road",sets:"asked-landing",then:!0},{text:"And three weeks back I sat on that cart at the end of it and watched five hundred soldiers come off the boats. It took them days. I counted, because what else is a man going to do.",aside:"About the twentieth of September. I would not swear to the day \u2014 but the army wrote it down, and their board is up beside the fort gate.",needs:"asked-landing",sets:"told-landing"},{text:"Five hundred men and one road. You do the arithmetic. I am tired.",needs:"told-landing"}]}],props:[{id:"bastion-nw",tx:26,ty:10,lines:[{text:"The corner does not turn square. It runs out into a drum of dressed limestone with a port cut through it at knee height and a step round the inside.",aside:"A gun standing in that sweeps the whole west wall and the whole north wall without being run out. Whoever laid this out in seventeen forty-nine had done it before."},{text:"The port is empty. Whatever stood in it went to B\xE9xar on the fifth with the general.",needs:"marched"}]},{id:"plaza-post",tx:19,ty:18,lines:[{text:"A post at the crossing, with two bills nailed to it. The lower one is weathered to nothing. The upper one is new.",aside:"Somebody has copied this out by hand. You can see where the pen ran dry and was dipped.",gives:"the circular",sets:"read-circular"},{text:"The same two bills. The upper one is still legible; the lower one has not been for a year.",needs:"read-circular"}]},{id:"gate-post",tx:27,ty:10,lines:[{text:"Garrison paper, nailed to the wall beside the gate: rations, punishments, and a sheet about a landing at the coast.",aside:"Somebody has gone down the list of companies with a thumbnail, scoring off the ones that have marched.",gives:"the landing at copano",sets:"read-landing"},{text:"The same wall. Rations, punishments, and a sheet about a landing at the coast.",needs:"read-landing"}]},{id:"store-bill",tx:4,ty:21,lines:[{text:"A freight bill, nailed up where the carters can argue with it. Loads, dates, and what each one was charged from the coast.",aside:"Somebody has gone down the right-hand column twice and got a different total both times.",gives:"the copano road",sets:"read-freight"},{text:"The freight bill. Loads, dates, and what each was charged from the coast.",needs:"read-freight"}]},{id:"well",tx:5,ty:18,lines:[{text:"The town well. Somebody has scratched a tally of the dry months into the stone and given up partway."}]},{id:"store-door",tx:5,ty:21,lines:[{text:"Ocampo\u2019s. Salt, powder, cloth, coffee, and a ledger she guards like a dog."}]},{id:"racks",tx:4,ty:29,lines:[{text:"Hides on the racks, four deep, stiff as doors. This is what Goliad sells."},{text:"Four racks, four deep. You do the near one twice because you lose your place, and then you go slower.",aside:"Two hundred and thirty-five on the near rack. Two hundred and thirty-five on the next. Two hundred and thirty-four. Two hundred and thirty-six.",needs:"to-count",sets:"counted"},{text:"Four racks, and you have the four numbers. Nine hundred and forty, if you have added them right.",needs:"gut"}]},{id:"chapel",tx:28,ty:15,lines:[{text:"Nuestra Se\xF1ora de Loreto, the chapel of the presidio. The whole town gets married and buried inside a fort, and nobody here thinks that is strange.",aside:"The door faces the parade ground, and it is shut. There is a soldier on the gate who is not moving."},{text:"Still shut. Whoever is setting it up for tonight has not been given what they need to light it.",aside:"You are carrying them. Tom\xE1s is the one on the parade ground with his arms folded \u2014 hand them to him.",needs:"candles"},{text:"Open, and somebody inside is setting candles along the wall in a line that is not straight.",aside:"The way in is the arch, three tiles of it, straight ahead.",needs:"chapel-open"}]},{id:"herd-notice",tx:2,ty:5,lines:[{text:"A board in the yard wall under a ledge, and a sheet nailed to it that fifty years of weather has taken back to nothing.",aside:"One column of it will still just about be read: cattle, in hundreds. Whoever kept this took the good copy in out of the rain, and the church door is standing open.",sets:"told-herd"},{text:"The ruined outer board. Cattle, in hundreds, in a hand the weather has nearly finished with.",needs:"told-herd"}]},{id:"mission",tx:5,ty:4,lines:[{text:"Esp\xEDritu Santo. Secularised five years ago; the great herds are eighty years gone and the east wall with them.",aside:"The door is open and has been for years. There is nobody left here to shut it. The fort is on the far bank \u2014 you cross at the ford, the way everybody does."}]},{id:"quarters",tx:29,ty:18,lines:[{text:"The officers\u2019 quarters. Stone, like everything the crown paid for, and shut \u2014 but there is a billeting order still tacked to the frame, gone soft in the damp.",aside:"It has the general\u2019s own name at the head of it, and a date eight days old.",gives:"the general in the fort",sets:"read-billet"},{text:"The officers\u2019 quarters. The door does not move, and a soldier watches you find that out.",needs:"read-billet"}]},{id:"barracks",tx:29,ty:20,lines:[{text:"The soldiers\u2019 barracks, built against the wall itself. There are fewer men in it than there are beds, and a march order is still pinned inside the door.",aside:"Sandoval has fifty. The wall is longer than fifty men, and the order says where the rest of them went.",gives:"the general marches out",sets:"read-march"},{text:"The barracks. Shut to you, and you are not going to be the one who argues about it.",needs:"read-march"}]},{id:"quarters-door",tx:28,ty:18,lines:[{text:"The door of the officers\u2019 quarters. There is a bar across it on the far side \u2014 you can hear the bar when you push, and pushing is the whole of what happens.",aside:"The paper tacked up beside the frame is as near the inside of that room as anybody from this town gets."}]},{id:"barracks-door",tx:28,ty:20,lines:[{text:"The barracks door, propped open a hand\u2019s width and no wider. A soldier sitting inside it with his boots off looks at you until you stop.",aside:"Neither of you says anything. The width of the gap is the whole conversation."}]},{id:"barracks-east-door",tx:31,ty:20,lines:[{text:"The other barracks door, at the east end, where the rations are issued. Shut, with the issuing table folded up against it, which is the same as shut.",aside:"Nothing is being handed out today. There are fewer men here to hand it to than there were a week ago."}]},{id:"magazine",tx:33,ty:18,lines:[{text:"The powder magazine. The one door in the fort nobody leaves unlocked, and it is locked.",aside:"Two turns of a key you can hear from here. Whatever else this garrison has let slide, it has not let this slide."}]},{id:"cannon",tx:34,ty:15,lines:[{text:"Cannon, on the parade. Eight-pounders \u2014 the fort was built with six of them and nobody has moved one in years.",aside:"They are counted. Everything the crown issued was counted."}]}]},Ar={s:l.STONE,f:l.FLAGSTONE,",":l.DIRT,d:l.DOORWAY,A:l.ALTAR,"+":l.CROSS,b:l.BENCH,t:l.TABLE,H:l.HEARTH,Y:l.TREE},Or={id:"the-wedding",needs:"chapel-open",unless:"wedding",steps:[O(void 0,"Tom\xE1s has lit every candle in the building. There are more candles than there are chairs."),Me("player",5,12),O("EL PADRE","Are we all in? Then somebody shut that door before the wind has it."),Me("manuela",6,9),O(void 0,"Outside, the fiddle stops. Two hundred people stop with it."),Me("manuela",6,3),ht("manuela","up"),ht("eusebio","up"),O("EL PADRE","We have waited a long while for a good reason to fill this room. Most of the last ones were not good reasons.","Sixteen months ago he buried a hundred and eleven people out of this same doorway."),O("MANUELA","S\xED."),O("EUSEBIO","S\xED."),O(void 0,"The room makes a noise like a roof coming off."),ie("wedding"),ht("manuela","down"),ht("eusebio","down"),Me("eusebio",5,7),Me("manuela",6,7),Me("manuela",14,8),Me("eusebio",13,6),O(void 0,"Outside, Anselmo lays the bow across the new string, and the yard finds out what your afternoon at the hide racks bought.")]},Sr={id:"chapel",name:"La Capilla",light:{base:-6,sources:[{tx:5,ty:2,r:7,gain:7},{tx:6,ty:2,r:7,gain:7},{tx:1,ty:6,r:4,gain:4},{tx:10,ty:6,r:4,gain:4},{tx:1,ty:12,r:4,gain:4},{tx:10,ty:12,r:4,gain:4},{tx:11,ty:7,r:3,gain:3},{tx:12,ty:14,r:6,gain:6},{tx:16,ty:9,r:5,gain:4},{tx:16,ty:12,r:5,gain:4},{tx:5,ty:15,r:3,gain:3}]},rows:["sssss++ssssssssssssss","sffffAAffffs,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,Y,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,,,,,,s","sffffffffffd,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,tttt,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,tttt,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffsH,,,,,,,s","sssssdssssss,,,,,,,,s","sssssssssssssssssssss"],legend:Ar,start:{tx:5,ty:14,facing:"up"},scenes:[Or],triggers:[{tx:5,ty:14,needs:"letter",sets:"at-the-door",text:"[You are at the door with her letter in your shirt. Behind you the fiddle is still being tuned.]",aside:"Whatever is said in this room tonight gets said once, and you will not be coming back in."}],exits:[{tx:5,ty:15,to:"bahia",entry:{tx:21,ty:1,facing:"down"},needs:"letter"},{tx:5,ty:15,to:"goliad",entry:{tx:31,ty:15,facing:"down"}}],npcs:[{id:"padre",name:"EL PADRE",tx:6,ty:2,facing:"down",look:{build:"adult",hat:"none",hair:"tonsure",torso:"camisa",legs:"cassock",load:"book",skin:f(d,10),hairCol:f(d,9),cloth:f(d,2),cloth2:f(d,2)},lines:[{text:"You are late. So was I. We will say nothing about it to each other."},{text:"You came in on a horse from out past the river, no? Then answer me something. How far is the nearest priest to your people?",aside:"It is not a trick. I am the answer and I am also the problem.",needs:"wedding",sets:"asked-bond",then:!0},{text:"Up on the Brazos there is one of me for a country the size of Spain. So they do not wait. A man and a woman sign a bond in front of two neighbours, and they live married, and they wait for somebody like me to ride through.",aside:"I have baptised children at the same table where I afterwards married their parents. It is legal. It is a document. It is not what I would have chosen.",needs:"asked-bond",sets:"told-bond",gives:"the marriage bond"},{text:"A bond is a paper two neighbours signed. This is a paper a church signed. One day somebody will ask which one counted, and they will go looking for the paper, not for the two neighbours.",needs:"told-bond",sets:"keep-the-paper",then:!0},{text:"Speaking of which. [He nods at your pockets.] You have been picking paper up all over this town today. I have watched you do it. Keep every piece.",aside:"When this week has finished happening \u2014 and it has not \u2014 bring the lot to me and we will put it in order. Everything I keep has a day written beside it. That is the entire reason the book is worth keeping.",needs:"keep-the-paper",sets:"told-string"},{text:"Keep it all. Every scrap. I will not do it twice and I will not do it tonight.",needs:"told-string"}]},{id:"eusebio",name:"EUSEBIO",tx:5,ty:3,facing:"up",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:f(d,9),hairCol:f(d,1),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"Do not talk to me. If I talk I will keep talking and then I will still be talking when he asks me the question."},{text:"Her mother has not sat down since Thursday. Somebody should make her sit down. It will not be me, I have used up all my courage for one day.",needs:"wedding"}]},{id:"manuela",name:"MANUELA",tx:6,ty:13,facing:"up",look:{build:"adult",hat:"veil",hair:"none",torso:"camisa",legs:"skirt",load:"bouquet",skin:f(d,10),hairCol:f(d,1),cloth:f(d,13),cloth2:f(d,12)},lines:[{text:"Not yet. Nobody sees me before the candles are lit \u2014 that is the entire point of candles."},{text:"You. The one who has been running all over town since noon. My brother is on the Brazos and he could not come. Will you carry this to him?",aside:"Tell him it happened. Tell him who was here.",needs:"wedding",sets:"letter"},{text:"North, past the crossing, and ask for the Ruiz place. He will feed you for it, and he will make you say all the names twice.",needs:"letter"}]},{id:"refugia",name:"DO\xD1A REFUGIA",tx:13,ty:14,facing:"left",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:f(d,9),hairCol:f(d,1),cloth:f(d,7),cloth2:f(d,5),accent:"#8b5d55"},lines:[{text:"Eat something. I did not cook for two days so that people could stand about being polite."},{text:"Anselmo has been telling everyone his story from Gonzales. The flag. Say it back to me \u2014 what was it cut from?",needs:"wedding",sets:"asked-dress"},{text:"A wedding dress. [She does not laugh.] I sewed the one my daughter has on. Four months. It is the only thing in this family worth anything, and when she is done with it her daughter gets it.",aside:"Nobody cuts up a wedding dress to make a bedsheet with writing on it. Go back and ask him whose dress. He will give you a name, and he will be guessing.",needs:"guessed",sets:"told-dress",gives:"a seamstress's objection"},{text:"Ask him whose. That is all. It is a good story and I would like it to be true, and those are two different things.",needs:"told-dress"}]},{id:"anselmo",name:"ANSELMO",tx:17,ty:11,facing:"up",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:f(d,9),hairCol:f(d,8),cloth:f(d,11),cloth2:f(d,5)},lines:[{text:"Gut from a dead cow, and out of it comes that. I have never got over it and I have been doing it for thirty years."},{text:"They will dance until the candles go. Nobody in this town has had a reason to wear out a floor since before the sickness.",needs:"wedding"},{text:"So he put the whole week on a string for you. [He grins and does not stop tuning.] Then you can answer me now, and you will be the only one in this room who can.",needs:"strung"},{text:"The dress? [He does not stop tuning.] Spanish. Brought up from B\xE9xar, I would say, or the coast. You can tell.",aside:"He says it the way a man says a thing he has never once been asked to prove.",needs:"asked-dress",sets:"guessed"},{text:"You are the one who told Do\xF1a Refugia the dress was Spanish. [He is not embarrassed. He is interested.] So. The gun at Gonzales. The lieutenant asked for it back and they would not give it. If you had been standing on that bank, what would you have said to him?",aside:"Take your time. I have watched a great many men lose that argument.",needs:"told-dress",sets:"the-argument",then:!0},{text:"No \u2014 do not answer me. [He lays the bow across his knee.] Ask any four men in this room what happened this week and you will get four different weeks, and not one of us wrote a word of it down.",aside:"Go and see El Padre. He is the only person in this town who puts a date beside a thing on the day it happens, and you have been collecting paper since this morning.",needs:"the-argument"}]},{id:"paquita",name:"PAQUITA",tx:4,ty:12,facing:"right",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:f(d,10),hairCol:f(d,1),cloth:f(d,11),cloth2:f(d,8)},lines:[{text:"I have been sitting on this bench since four o\u2019clock and I am not allowed to say anything about it."},{text:"You are taking me to the food. That is how it is done \u2014 you take me there and you bring me back to my mother, and everybody watches you do it, and then I am allowed to eat.",aside:"Walk. I will keep up. I have been keeping up my whole life.",needs:"wedding",sets:"escorting"},{text:"Out the side door and along. You cannot miss it, it is the only thing in the yard that smells like that.",needs:"escorting"},{text:"Now my mother. Not fast. If you run it does not count.",needs:"fed"},{text:"That was correctly done. I will tell people.",needs:"escorted"}]},{id:"benigno",name:"T\xCDO BENIGNO",tx:15,ty:13,facing:"up",look:{build:"adult",hat:"sombrero",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"reata",stance:"bowed",spurs:!0,sash:!0,skin:f(d,8),hairCol:f(d,8),cloth:f(d,7),cloth2:f(d,4)},lines:[{text:"Forty-one years I have been coming to weddings in that building. I have signed the book at eleven of them."},{text:"You want to see something? Come and look at what I put in the register tonight, next to my name.",aside:"Except it is not next to my name. It is instead of it.",needs:"wedding",sets:"asked-mark",then:!0},{text:"I cannot write. So I sign with my iron \u2014 the same mark that is on every cow of mine and on my gate and in the book at the town hall where they keep the brands.",aside:"On the cattle it means mine. On the register it means I was here and I say so. It is the same mark and it means the same thing, and it will still mean it when I am dead.",needs:"asked-mark",sets:"told-mark",gives:"a mark for a signature"},{text:"Learn your neighbours\u2019 irons before you learn their faces. The face changes.",needs:"told-mark"}]}],props:[{id:"altar",tx:5,ty:1,lines:[{text:"Two candles, a cloth somebody has washed within an inch of its life, and a crucifix older than the fort."}]},{id:"bench",tx:3,ty:13,lines:[{text:"A plank on two frames. Half the town is sitting on the other half of it."}]},{id:"table",tx:16,ty:9,lines:[{text:"Planks laid across frames: tamales in a cloth, cakes, and a coffee pot that has been full since noon."},{text:"Paquita takes a tamal in each hand, which is one more than the ritual strictly allows.",needs:"escorting",sets:"fed"},{text:"Picked over now. Somebody has taken all the cakes with the sugar on.",needs:"escorted"}]},{id:"hearth",tx:12,ty:14,lines:[{text:"The chimney. The coffee and the cakes get their heat here, and so does everybody who stands near it."},{text:"You deliver Paquita to her mother\u2019s elbow and let go of her sleeve. Do\xF1a Refugia looks at you for a second longer than she needs to.",aside:"A fiddle, planks across frames, and a girl walked to the food and back. This is what a fandango is, and you have just been in one.",needs:"fed",sets:"escorted",gives:"the fandango"},{text:"Warm. The only warm thing in the yard that is not a person.",needs:"escorted"}]}]};function Ir(){const o=So.rows.map(e=>e.split("")),t=(e,n,a)=>{o[n][e]=a};return t(30,10,"X"),t(34,22,","),t(35,16,","),t(26,19,","),t(35,11,"B"),o.map(e=>e.join(""))}const Nr={id:"the-road",needs:"letter",unless:"chose",steps:[O(void 0,"You are most of the way home before you understand what you saw on the coast road.","Horses. Not two or three. More than you can count in the dark, and none of them hurrying, which is worse."),O(void 0,"They are not the Mexican army. The Mexican army is in that fort, and it has been all year, and it nodded at you tonight."),ii(void 0,"You are the only person in this valley who knows. You have about a minute.",[{label:"Warn the garrison.",sets:"told-garrison",reply:"You go for the gate. The sentry knows you \u2014 you are the candle kid \u2014 and he believes you, and that is the whole of it. Men come out of the quarters pulling their coats on.",aside:"They will stand to. The fight will be longer and worse than it would have been, and more of them will live through it."},{label:"Warn the town.",sets:"told-town",reply:"You go for the square instead, shouting, and the square empties. Do\xF1a Refugia has her family and half of somebody else\u2019s out the back before you finish the sentence.",aside:"Not one person you woke can fire a musket. That was not the point and you knew it when you turned."},{label:"Say nothing. Run.",sets:"told-nobody",reply:"You do not stop. You put the mare down the river track and you are inside the walls before you have decided anything at all.",aside:"For the next eleven minutes you are the only person in Goliad who knows what is coming. It is heavier than it sounds."}],"Whatever you pick, they are still coming and there are still a hundred and twenty of them."),ie("chose")]},Cr={id:"the-fight",needs:"inside",unless:"fought",steps:[O(void 0,"Eleven o\u2019clock. It starts the way the men who were there always said it started \u2014 all at once, and from the wrong direction."),O(void 0,"You are on your face in the dirt of a courtyard you walked across four hours ago carrying candles.","You cannot see any of it. You can hear all of it, which turns out not to be better."),O(void 0,"What you can see is men. Sandoval\u2019s, in the yard, firing at a wall from the inside of it. Strangers coming out of the dark on the far side of that wall, closer every time you look.","They go down and most of them get up again. Remember that when somebody hands you a number in the morning."),O(void 0,"Tom\xE1s is in this building somewhere. So is a girl in a blue rebozo who was walked to the food and back four hours ago and has not been walked anywhere since.","You are the only person inside these walls who knows three ways out of them. Find both of them, then find the gate."),ie("fought")]},Mr={id:"the-surrender",needs:"got-out",unless:"surrendered",steps:[O(void 0,"It stops. Not gradually \u2014 the way a room goes quiet when somebody senior says a short word in it."),Me("player",29,8),ht("player","up"),O("GEORGE COLLINSWORTH","Sandoval. You have done what you were told to do and there is no more of it to do. Your men keep their coats."),O(void 0,"Half an hour, start to finish. Nobody asks you anything, and nobody will, and you are the alcalde of Victoria and you are standing in the middle of it."),Ne(600),O(void 0,"\u2014 THE ROLL, LA BAH\xCDA, 9 OCTOBER 1835 \u2014","Garrison, under Lt. Col. Francisco Sandoval: three killed. Seven wounded. Twenty-one taken. Volunteers, under Collinsworth: several wounded. None killed."),qe("the roll of la bah\xEDa"),O(void 0,"Somebody writes it down before the sun is up, because somebody always does, and that is the only reason you will ever be able to say it back."),Ne(400),O(void 0,"Morning. The river fog comes up to the walls and stops there."),O(void 0,"Forty-nine of them put their names to one page: that they are here to protect the people of this town from military domination, and that they say so in writing.","Some of them sign with a mark. You know what that means now."),qe("the compact of volunteers"),O(void 0,"You cannot give an order and nobody will take one from you. You can carry a copy of somebody else\u2019s, and you have just watched one being made."),Ne(400),O(void 0,"Two hundred miles east of here, at San Felipe, three men have spent this week setting type by hand. Their first number comes off the press in the morning."),O(void 0,"\u2014 TELEGRAPH AND TEXAS REGISTER, VOL. 1 NO. 1 \u2014","San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens. The first newspaper Texas manages to keep."),qe("the first number"),O(void 0,"Not one word of tonight is in it. It went to press before any of this could reach them \u2014 and that is exactly why everything you are carrying had to be carried by somebody."),ie("surrendered"),O(void 0,"It is getting light. Somebody has opened the chapel and there are men being carried into it, and the priest who married those two yesterday is standing in the middle of the yard with his sleeves rolled up."),He("padre-yard")]},Hr={id:"bahia",name:"La Bah\xEDa",light:{base:-4,sources:[{tx:30,ty:10,r:5,gain:4},{tx:31,ty:15,r:5,gain:4},{tx:19,ty:19,r:6,gain:3},{tx:21,ty:1,r:5,gain:2},{tx:5,ty:21,r:4,gain:2},{tx:32,ty:16,r:4,gain:3}]},flashes:[{tx:38,ty:12,needs:"fought"},{tx:38,ty:19,needs:"fought"},{tx:33,ty:25,needs:"fought"},{tx:28,ty:25,needs:"fought"},{tx:24,ty:14,needs:"fought"},{tx:24,ty:19,needs:"fought"},{tx:27,ty:9,needs:"fought"},{tx:34,ty:9,needs:"fought"},{tx:30,ty:9,needs:"fought"}],attack:{needs:"fought",fighters:[{tx:38,ty:13,toX:36,toY:13,side:"volunteer"},{tx:38,ty:17,toX:36,toY:17,side:"volunteer"},{tx:38,ty:21,toX:36,toY:20,side:"volunteer"},{tx:31,ty:26,toX:30,toY:23,side:"volunteer"},{tx:35,ty:26,toX:34,toY:23,side:"volunteer"},{tx:27,ty:26,toX:28,toY:23,side:"volunteer"},{tx:26,ty:9,toX:29,toY:9,side:"volunteer"},{tx:36,ty:9,toX:34,toY:9,side:"volunteer"},{tx:28,ty:19,toX:29,toY:19,side:"garrison",killed:!0},{tx:33,ty:19,toX:34,toY:19,side:"garrison"},{tx:29,ty:11,toX:29,toY:11,side:"garrison",killed:!0},{tx:33,ty:11,toX:33,toY:11,side:"garrison"},{tx:27,ty:16,toX:27,toY:16,side:"garrison",killed:!0},{tx:34,ty:16,toX:34,toY:16,side:"garrison"}]},pen:{needs:"fought",keep:[26,10,35,22],text:"THAT IS WHERE THEY ARE FIRING FROM"},rows:Ir(),legend:vt(ge({},So.legend),{X:l.BARRED}),start:{tx:21,ty:1,facing:"down"},scenes:[Nr,Cr,Mr],triggers:[{tx:34,ty:22,needs:"chose",sets:"by-ditch",text:"The ditch under the south wall. Casimiro told you about it while you were counting his hides, and you were not listening, and you remembered anyway."},{tx:35,ty:16,needs:"chose",sets:"by-river",text:"The river side, where the stones are wet all year and nobody posts a man because nobody would come this way."},{tx:26,ty:19,needs:"chose",sets:"by-magazine",text:"The gap by the magazine. You are close enough to the powder to be told off for it, and there is nobody left to tell you off."},{tx:31,ty:16,needs:"chose",sets:"inside"},{tx:31,ty:11,needs:"paquita-out",sets:"got-out",text:"You get them both to the gate. It is barred, and the bar is on your side, and lifting it is the only useful thing you do all night."}],npcs:[{id:"padre-yard",name:"EL PADRE",tx:30,ty:17,facing:"down",needs:"surrendered",look:{build:"adult",hat:"none",hair:"tonsure",torso:"chaqueta",legs:"cassock",load:"book",skin:f(d,9),hairCol:f(d,1),cloth:f(d,2),cloth2:f(d,3)},lines:[{text:"Sit down before you fall down. [He looks at you the way he looked at you yesterday, which is not how anybody else in this yard is looking at anybody.]",aside:"Nobody from this town is dead. I have asked twice and it is still true, and I am going to go on asking.",sets:"to-the-string",then:!0},{text:"Now. [He takes a length of string out of his sleeve, of all places, and looks for somewhere to lay it down.] You have been picking paper up off nails since yesterday morning. Every piece of it. On the step, face up.",aside:"One at a time, and you will tell me which of them came first. I will move the ones you put wrong and I will tell you how I knew.",needs:"to-the-string",sets:"strung",opens:"order"},{text:"It is in order and it is yours. Do not lose it. Somebody will want it one day and they will not take your word for any of it.",aside:"Go home. Your sister has been on that road since it got light and she is not going to be reasonable about it.",needs:"strung",sets:"the-end"}]},{id:"tomas",name:"TOM\xC1S",tx:29,ty:15,facing:"down",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:f(d,9),hairCol:f(d,1),cloth:f(d,12),cloth2:f(d,5)},lines:[{text:"Do not stand up. Whatever you do, do not stand up."},{text:"I have been in this building my whole life and I do not know how to get out of it. Isn\u2019t that the stupidest thing you have ever heard.",aside:"You know three ways. You used one of them getting in.",needs:"fought",sets:"tomas-out"},{text:"Behind you. Keep your hand on the wall and do not look at the light.",needs:"tomas-out"}]},{id:"paquita",name:"PAQUITA",tx:33,ty:15,facing:"left",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:f(d,10),hairCol:f(d,1),cloth:f(d,11),cloth2:f(d,8)},lines:[{text:"[She has both hands over her ears and she is not going to take them off for you.]"},{text:"You took me to the food and you brought me back. That is twice you are supposed to walk me somewhere.",aside:"[She puts a hand out. It is the same manoeuvre as the tamales and neither of you says so.]",needs:"tomas-out",sets:"paquita-out"},{text:"Not fast. If you run it does not count.",needs:"paquita-out"}]},{id:"sandoval",name:"LT. COL. SANDOVAL",tx:30,ty:19,facing:"left",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",stance:"wide",skin:f(d,8),hairCol:f(d,1),cloth:f(d,4),cloth2:f(d,11)},lines:[{text:"Get down. I do not care whose child you are, get DOWN."},{text:"Cos took the good half of this garrison to B\xE9xar in the summer and left me the paperwork. Somebody on that road counted us before they came. Somebody always counts first.",needs:"surrendered"}]},{id:"dimmitt",name:"PHILIP DIMMITT",tx:28,ty:19,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:f(d,9),hairCol:f(d,8),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"Out of the way, son."},{text:"I have a wife and a store and a league of land eight miles from where you are standing, and I have known this country twelve years. Ask me why we came here and not somewhere with more in it.",needs:"surrendered",sets:"asked-why"},{text:"Copano is forty miles down that road and every pound of powder Cos eats in B\xE9xar comes up it, through here, past that chapel. We did not take a town tonight. We took a road.",aside:"Which is a thing you already knew, because a carter told you this afternoon while you were trying to get somewhere else.",needs:"asked-why",sets:"told-why",gives:"the road to bexar, cut"},{text:"A road, and a fort nobody will thank us for. Remember which one mattered.",needs:"told-why"}]},{id:"milam",name:"A VOLUNTEER",tx:33,ty:19,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"musket",stance:"wide",skin:f(d,8),hairCol:f(d,12),cloth:f(d,7),cloth2:f(d,4)},lines:[{text:"[He is reloading and he does not look up.]"},{text:"You want to know something worth knowing? That man over there was in a cell in Monterrey three months ago.",needs:"surrendered",sets:"asked-milam"},{text:"Ben Milam. Walked out of a Mexican prison, walked north until he found somebody going the same way, and turned up on this road last week asking whose army it was.",aside:"He will be dead in December in a street in B\xE9xar and there will be a county named after him, and neither of those has happened yet.",needs:"asked-milam",sets:"told-milam",gives:"milam, lately out of monterrey"},{text:"Some men walk out of prisons. Most do not. Learn the difference before you copy anybody.",needs:"told-milam",sets:"asked-matagorda",then:!0},{text:"Us? We are nobody. Tuesday we were forty men in Sylvanus Hatch\u2019s front room at Matagorda, arguing, and the first thing we did was take a vote on who was in charge of us.",aside:"Collinsworth won it. Three days later there were a hundred and twenty of us and we were coming up your road.",needs:"asked-matagorda",sets:"told-matagorda"},{text:"Forty men in a front room on Tuesday. Remember that the next time somebody tells you an army arrived.",needs:"told-matagorda"}]}],props:[{id:"mission-shut-w",tx:6,ty:4,lines:[{text:"The mission door, across the water. Barred from the inside, and there is a light moving behind the shutter that stops moving while you are looking at it.",aside:"Whoever is in there has heard what is happening on this side of the river and has decided, sensibly, to be somewhere else."}]},{id:"mission-shut-c",tx:7,ty:4,lines:[{text:"The mission door, across the water. Barred from the inside, and there is a light moving behind the shutter that stops moving while you are looking at it."}]},{id:"mission-shut-e",tx:8,ty:4,lines:[{text:"The mission door, across the water. Barred from the inside, and there is a light moving behind the shutter that stops moving while you are looking at it."}]},{id:"jacal-n-shut",tx:6,ty:11,lines:[{text:"Casimiro\u2019s door, with a hide pegged across the inside of it. He is not in there \u2014 he was in the square an hour ago telling anybody who would listen that he was too old for this."}]},{id:"jacal-w-shut",tx:4,ty:16,lines:[{text:"The empty one. It was shut this afternoon and it is shut now, and it is the only door in this town that has not changed since the sickness."}]},{id:"store-shut",tx:5,ty:21,lines:[{text:"The store, shuttered, with the bar up on the outside as well \u2014 which is Se\xF1ora Ocampo saying she has gone somewhere and does not want to be misunderstood about it."}]},{id:"jacal-s-shut",tx:5,ty:24,lines:[{text:"Do\xF1a Refugia\u2019s, dark, with the cooking fire outside it raked over and a pot left on the stones. Nobody banks a fire and walks away from it unless they left in a hurry."}]},{id:"chapel-portal-w",tx:30,ty:14,lines:[{text:"The west leaf of the chapel portal, pulled to. There were candles behind this door this afternoon and there are candles behind it now, and a great many more people."}]},{id:"chapel-portal-e",tx:32,ty:14,lines:[{text:"The east leaf, pulled to. Somebody has put a bench against the inside of it, which you can hear when you push and which is the whole of the answer."}]},{id:"magazine-night",tx:33,ty:18,lines:[{text:"The powder magazine. Locked this afternoon and locked now, and tonight it is the one door in this fort that everybody on both sides is glad about."}]},{id:"barracks-east-night",tx:31,ty:20,lines:[{text:"The east barracks door, where the rations were issued. There is a man sitting against it on the outside with his musket across his knees, and he is not a sentry any more, he is just sitting there."}]},{id:"gate",tx:30,ty:10,lines:[{text:"The gate you walked through this afternoon, barred from the inside. The bar is a tree.",aside:"There is no version of tonight where you get in this way."}]},{id:"chapel",tx:31,ty:14,lines:[{text:"The chapel. Four hours ago there were candles in every window of it and a fiddle going in the yard."},{text:"The candles are still lit. Nobody had a reason to put them out and nobody has had a moment to.",needs:"fought"}]},{id:"quarters",tx:35,ty:11,lines:[{text:"The officers\u2019 quarters, shuttered, with a light still in it and somebody moving about behind the shutter in a great hurry."},{text:"The garrison quarters. The door is open, which it has never been \u2014 and somebody coming through it in a hurry has dropped a folded paper on the sill.",aside:"Not garrison paper. It is a muster, in a civilian hand, headed with the name of a house in Matagorda.",gives:"the meeting at matagorda",needs:"fought",sets:"read-muster"},{text:"The garrison quarters, with the door open. Twenty-one men will come out of there with their hands where everybody can see them, and every one of them will be written down by name.",needs:"read-muster"}]}]},Dr=le({id:"mission-room",name:"Esp\xEDritu Santo",build:"stone",back:{to:"goliad",tx:7,ty:5},place:[[5,1,"B"],[4,5,"e"],[10,5,"e"],[11,2,"r"]],light:{base:-4,sources:[{tx:7,ty:8,r:7,gain:6},{tx:12,ty:2,r:5,gain:4},{tx:3,ty:1,r:4,gain:3}]},props:[{id:"tally-board",tx:5,ty:1,lines:[{text:"The board itself, hung on the north wall out of the weather. Tallies in columns, in three different hands, fifty years of them.",aside:"The last column is a count of cattle, and you read it twice, because the number does not look like a number of animals.",gives:"the mission herd",sets:"read-herd"},{text:"The tally board. Cattle, in columns, in three different hands, and every column adds up.",needs:"read-herd"}]},{id:"benches",tx:4,ty:5,lines:[{text:"Benches for a congregation, pushed back against the wall, and marks on the floor where a good many more of them used to stand.",aside:"The town is married and buried across the river now, in the fort. Nobody has taken these out, and nobody sits on them either."}]},{id:"east-end",tx:13,ty:2,lines:[{text:"The east end of the range is stone to about your shoulder and sky above that.",aside:"Five years since the mission was secularised, and this is what five years of nobody being responsible for a wall looks like."}]},{id:"racks",tx:11,ty:2,lines:[{text:"Racks along the wall, built to hold hides and wool, holding neither.",aside:"The herd was not sold and it did not die. It was divided up in 1830 and it went on being cattle for other people."}]}]}),Br={".":l.GRASS_A,",":l.DIRT,"=":l.DIRT_EDGE,"-":l.FENCE_H,"|":l.FENCE_V,1:l.FENCE_NW,2:l.FENCE_NE,3:l.FENCE_SW,4:l.FENCE_SE,"#":l.LOG,"^":l.LOG_ROOF,'"':l.LOG_EAVE,D:l.LOG_DOOR,d:l.DOORWAY,b:l.BILL_LOG,c:l.CORN,W:l.WAGON,Y:l.TREE,C:l.CHIMNEY,o:l.WELL,R:l.ROCK},Yr={id:"orchard",name:"The Davis place",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R.............................R",'R..""""".....................YR',"R..^^^^^....YY...YY...YY.....YR","RC.##d##....YY...YY...YY......R","R...........YY...YY...YY......R","R...........YY...YY...YY......R","R..o........,,...YY...YY......R","R...........,,...YY...YY......R",",,..........YY...YY...YY......R",",,..........YY...YY...YY......R","R.............................R","R..1--.----2..................R","R..|....W..|.............ccc..R","R..|.......|.............ccc..R","R..3-------4.............ccc..R","R.............................R","R.............................R","RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"],legend:Br,ridable:!1,start:{tx:8,ty:6,facing:"down"},npcs:[{id:"father",name:"DAVIS",tx:9,ty:13,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:f(d,9),hairCol:f(d,2),cloth:f(d,10),cloth2:f(d,5)},lines:[{text:"Martin. Good \u2014 there are five soldiers in the square and the alcalde wants every man who can stand there to stand there.",aside:"Before that. There is a paper in my coat and you are the only man between here and the river who can tell me what is on it. Take it out.",sets:"asked-to-read"},{text:"Read it out. Slowly, and all of it, and do not skip the part at the bottom because the bottom is where they put the thing they want you to miss.",aside:"[He does not look at the sheet while you read. He looks at you.]",needs:"asked-to-read",sets:"read-receipt",gives:"the receipt for the cannon",then:!0},{text:"Given back when it is called for. [He takes it out of your hand and folds it into four.] Well. They have called for it.",aside:"I never learned my letters. My father put me on a horse instead and I have never once been sorry until about a minute ago.",needs:"read-receipt",sets:"knows-receipt",then:!0},{text:"You are going back in anyway. Take it to Ponton at his house, and keep your ears open in the square \u2014 I want to know what the corporal actually said, not what people say he said.",needs:"knows-receipt",sets:"errand-ponton"},{text:"The road is west. Ponton keeps the town\u2019s papers at his own table, and he will be at it.",needs:"errand-ponton"},{text:"You want to know where it is. [He looks at the trees.] Third row, between the second and the third tree, about as deep as a grave for a dog.",aside:"Myself, Jacob Darst and one other, and I will not tell you the third. We did not write it down. When you are old somebody will ask you and you will have to remember it right.",needs:"buried",sets:"told-burial",gives:"the cannon in the orchard"},{text:"Leave it in the ground and leave the rake alone. If a man rides in here and sees turned earth under a peach tree he does not need to be clever.",needs:"told-burial"}]},{id:"mother",name:"MRS DAVIS",tx:4,ty:6,facing:"right",look:{build:"adult",hat:"rebozo",hair:"bun",torso:"rebozo",legs:"skirt",skin:f(d,10),hairCol:f(d,1),cloth:f(d,8),cloth2:f(d,4)},lines:[{text:"Five of them, they say, and one corporal, and they asked for it like men asking to borrow a saw.",aside:"Which it seems is what they think it is. Go on, he is at the pen and he has been waiting on you since first light."},{text:"You read it to him? Good. He will not ask me and he will not ask the alcalde, and he will carry it forty years.",needs:"read-receipt",aside:"There is nothing wrong with a man who cannot read. There is something wrong with a town where four of us can, and you are one of the four, and that is why he waited."},{text:"Go carefully in the square. And if there is shouting, you get that store of yours shut before you stop to watch it.",needs:"errand-ponton"}]}],triggers:[{tx:2,ty:9,unless:"errand-ponton",sets:"tried-early",text:"You get as far as the gap in the fence and stop.",aside:"He is standing right there with a paper in his coat and he has not told you what to do with it yet."}],exits:[{tx:5,ty:4,to:"davis-house",entry:{tx:7,ty:7,facing:"up"}},{tx:0,ty:9,to:"gonzales",entry:{tx:33,ty:10,facing:"left"},needs:"errand-ponton",passage:"walk-to-gonzales"},{tx:0,ty:10,to:"gonzales",entry:{tx:33,ty:10,facing:"left"},needs:"errand-ponton",passage:"walk-to-gonzales"}],props:[{id:"well",tx:3,ty:7,lines:[{text:"Sweet water, and the only reason anybody put a house on this particular half-mile."}]},{id:"wagon",tx:8,ty:13,lines:[{text:"The cotton wagon, up on blocks with both wheels off it and leaning on the rail. Man-high, iron-tyred, and heavier than they look.",aside:"Nothing is going anywhere on those until somebody greases the hubs, and nobody has."},{text:"The wagon is up on its blocks and the wheels are gone off the rail, and nobody in this house will tell you where they went.",needs:"buried"}]},{id:"peaches",tx:12,ty:7,lines:[{text:"Peach trees, in rows, four years in the ground and just about earning their room. The bare strip down the middle is where the cart goes at picking."},{text:"The strip between the second and third row has been turned over and raked flat, and then somebody has walked a horse up and down it.",aside:"You would have to know to look. You know to look.",needs:"buried"}]},{id:"cotton",tx:25,ty:13,lines:[{text:"Cotton, half-picked, and it will have to wait. Everybody who would be picking it is standing in the square."}]}]},Kr={".":l.GRASS_A,",":l.DIRT,"=":l.DIRT_EDGE,"~":l.WATER,"#":l.LOG,"^":l.LOG_ROOF,'"':l.LOG_EAVE,N:l.NOTICE,C:l.CHIMNEY,G:l.GUN,d:l.DOORWAY,D:l.LOG_DOOR,Y:l.TREE,o:l.WELL,R:l.ROCK},qn={id:"gonzales",name:"Gonzales",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R....~~~~,...YY.......YY...........R","R....~~~~,.................YY......R",'R....~~~~,.""""".,,,,,.""""".......R',"R....~~~~,.^^^^^.,,,,,.^^^^^.......R","R....~~~~,C##d##.,,,,,C##d##.......R","R....~~~~,.......,,,,,.............R","R....~~~~,......o,,,,,.............R","R....~~~~,.,,,,,,,,,,,,,,,,,,......R","R....~~~~N...,,,,,,,,,,,,,,,,,,....R","R....~~~~,,,,,,,,,,,N,,,,,,,,,,,,,,,","R....~~~~,,,,,,,,,,,,,G,,,,,,,,,,,,,","R....~~~~,.,,,,,,,,,,,,,,,,,,......R","R....~~~~,.,,,,,,,,,,,,,,,,,,......R","R....~~~~,.......,,,,,.............R","R....~~~~,.......,,,,,.............R",'R....~~~~,.""""".,,,,,.""""".......R',"R....~~~~,.^^^^^.,,,,,.^^^^^.......R","R....~~~~,C##d##.,,,,,C##d##.......R","R....~~~~,.......,,,,,.............R","R....~~~~,...YY..,,,,,.............R","RRRRRRRRRRRRRRRRRR,,RRRRRRRRRRRRRRRR"],legend:Kr,ridable:!1,start:{tx:33,ty:10,facing:"left"},pen:{needs:"dragoons",keep:[10,1,35,21],text:"Somebody has a hand on your collar before you are three steps down the bank. Not today. Not while they are standing over there counting us."},scenes:[{id:"the-asking",needs:"errand-ponton",unless:"saw-corporal",steps:[O(void 0,"There are more people in the square than you have ever seen in it, and all of them are looking the same way."),O("THE CORPORAL","I am instructed to receive one piece of ordnance held by this town and to carry it to B\xE9xar. I have the order here. I would like to speak to your alcalde."),O("A MAN IN THE CROWD","He is not here."),O("THE CORPORAL","[He waits.] Then I will wait for him.","He does not raise his voice. He has come forty miles to collect a gun and he has been told the one man he may speak to is out."),O(void 0,"Somebody behind you says that the alcalde is at his own table, two hundred yards away, and has been all morning. Nobody says it loudly."),ie("saw-corporal")]},{id:"the-far-bank",needs:"letter-sent",unless:"dragoons",steps:[O(void 0,"Somebody is ringing something that is not a bell, over and over, and the whole town is walking towards the river."),He("dragoon-a"),He("dragoon-b"),He("dragoon-c"),O(void 0,"On the far bank, across four rods of brown water, men are walking horses in a line and putting up tents in a field that had nothing in it yesterday."),O("SOMEBODY COUNTING","Ninety. Ninety-five. Call it a hundred, and every one of them a dragoon.","The river is up. There is not a boat on their side of it, and there will not be one, because ours are all pulled out and lying in the willows."),O(void 0,"Behind you, four men take the gun off its carriage and put it on a sledge, and walk it out of the square towards the east road without saying a word to anybody."),ie("dragoons"),ie("buried")]},{id:"the-crossing",needs:"eighteen",unless:"crossed",steps:[O(void 0,"It is dark, and there are a hundred and forty men in this square, and nobody from this town knows more than about thirty of them."),O("JOHN HENRY MOORE","They have moved. He has gone seven miles up the river looking for a place to cross, and he has camped on Ezekiel Williams\u2019s field."),O("EZEKIEL WILLIAMS","On my field."),O("JOHN HENRY MOORE","[He does not smile.] On your field. We are going over tonight, and we are taking the gun, and we are going to go and ask him what he wants."),O(void 0,"The cannon comes out of the dark on a pair of wheels you have seen before. They came off a cotton wagon this afternoon and the hubs are still black with new grease."),ie("crossed")]}],npcs:[{id:"corporal",name:"THE CORPORAL",tx:20,ty:12,facing:"up",absent:"letter-sent",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"rider",skin:f(d,8),hairCol:f(d,1),cloth:f(d,6),cloth2:f(d,3)},lines:[{text:"I have five men, an order, and a mule to carry it on. I did not bring a hundred because a hundred is not necessary to collect a gun that was lent.",aside:"That is what I said to your alcalde. He was very courteous about it."},{text:"He has written me an answer and I am to carry it back. [He looks at the paper without opening it.] I do not think the colonel is going to like the answer.",needs:"ponton-writing"},{shows:"the receipt for the cannon",text:"[He reads it properly, holding it away from the dust.] Yes. That is the one. March of thirty-one, signed, and it says exactly what I have been saying it says.",aside:"So we are agreed on the paper. That is the strange part of this. Nobody in your town has told me the paper says anything else.",sets:"showed-receipt",then:!0},{shows:"the receipt for the cannon",needs:"showed-receipt",text:"Then you understand my difficulty. I am not here to argue about a receipt. I am here because a colonel in B\xE9xar told me to bring back a gun, and he did not ask me what the paper said either."}],rebuff:"I cannot read your town\u2019s business and I would not want to. Show me the receipt or do not show me anything."},{id:"dickinson",name:"DICKINSON",tx:14,ty:12,facing:"right",look:{build:"adult",hat:"none",hair:"short",torso:"camisa",legs:"calzoneras",skin:f(d,10),hairCol:f(d,2),cloth:f(d,9),cloth2:f(d,5)},lines:[{text:"Nobody has fired that gun in four years and I am the only man here who has ever laid one. That is not a boast, it is a complaint.",aside:"It has been sat in the square with rain in the muzzle since I came to this town."},{text:"Well, now everybody wants it. [He is enjoying himself, which not many people in this square are.] Ask me again on Friday.",needs:"saw-corporal"},{text:"It is scoured, it is dry, and it is on a pair of cotton-wagon wheels. Whatever happens tomorrow, it will go off.",needs:"eighteen"}]},{id:"sowell",name:"SOWELL",tx:15,ty:19,facing:"down",look:{build:"adult",hat:"none",hair:"crop",torso:"apron",legs:"calzoneras",stance:"wide",skin:f(d,9),hairCol:f(d,1),cloth:f(d,7),cloth2:f(d,3)},lines:[{text:"I shoe horses and I mend wheels and I have not been asked to do either of those things since Tuesday.",aside:"What everybody wants off me this week is nails, and nobody will say what for."},{text:"Ponton wanted a list written out fair and nailed up where every man in this town could see his own name on it. I made the nails.",needs:"dragoons",sets:"told-muster",aside:"Eighteen names. Mine is on it, which I did not ask for and would not take off."},{text:"They have taken the wheels off a cotton wagon and brought them to me to have the tyres shrunk on. I have never in my life been asked to do that for a gun.",needs:"eighteen"}]},{id:"sarah",name:"SE\xD1ORA DeWITT",tx:27,ty:6,facing:"down",look:{build:"adult",hat:"rebozo",hair:"bun",torso:"rebozo",legs:"skirt",skin:f(d,11),hairCol:f(d,1),cloth:f(d,4),cloth2:f(d,8)},lines:[{text:"My husband laid this town out. He put the square where you are standing and he named the streets, and then he went to Monclova in the spring to get more land and he did not come back.",aside:"Go in, if you like. The door is not locked and there is nobody in there to mind."},{text:"They want the gun back. [She looks at the river for a while.] He asked them for that gun. He wrote and asked, and they sent it up, and now they want it, and he is not here to be asked about it.",needs:"saw-corporal"},{text:"There are women in this town cutting up cloth for something and they have not asked me for anything, which I notice.",aside:"And in fifty years they will all of them tell you it came out of my daughter\u2019s wedding dress. Some of them will believe it. One or two of them will have been in the room.",needs:"dragoons",sets:"told-cloth",gives:"the dress and the cotton",then:!0},{text:"I will not tell you it is true and I will not tell you it is a lie. I will tell you that Naomi was married in August and I know what I did with that dress, and that nobody has ever once asked me.",needs:"told-cloth"}]},{id:"williams",name:"WILLIAMS",tx:11,ty:10,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",skin:f(d,8),hairCol:f(d,2),cloth:f(d,10),cloth2:f(d,4)},lines:[{text:"The river is up an
