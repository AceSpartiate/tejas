<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Tejas - Goliad and Presidio La Bahia, 2 to 9 October 1835. A Grade 7 Texas history game." />
<title>Tejas</title>
</head>
<body>
<meta charset="utf-8" />
<title>Tejas</title>

<script>
  // The viewport, set from script because this is published as a body
  // fragment and a <meta> parsed inside the body is ignored. Without it a
  // phone lays the game out in a 980px pretend-desktop and shrinks the whole
  // thing to a postage stamp. Written onto the host's own tag if it has one.
  (function () {
    try {
      var m = document.querySelector('meta[name="viewport"]');
      if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
      m.setAttribute('content',
        'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
    } catch (e) { /* a wrapper with no head is still a page the game can run in */ }
  })();
</script>

<style>
  /* One visual world on purpose: a handheld screen in a dark room. The ground
     is the game's own letterbox void. No theme blocks - a Game Boy does not
     have a light mode - but every colour is painted rather than inherited, so
     the page holds on whatever ground the host puts behind it. */
  html, body { margin: 0; padding: 0; background: #131110; }
  /* Fixed, not 100% tall. A percentage height needs an unbroken chain up to
     the root, and this page is a guest in a document it did not write. */
  /* Longhand offsets, not the inset shorthand: the shorthand is iOS 14.5+ and a stage
     that does not resolve a size is a page with nothing on it. */
  #tj-stage {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; align-items: center;
    justify-content: center; background: #131110; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* max-width defends the integer scale: a host reset that caps media at 100%
     would quietly resample the one thing in this project that may never be
     resampled. */
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    max-width: none !important; max-height: none !important;
  }
  /* Thumb controls are present but unseen until a finger arrives, so on a
     phone the first screen is a game with no visible way to play it. */
  #tj-hint {
    position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; z-index: 20;
    animation: tj-breathe 2.6s ease-in-out infinite;
  }
  [hidden] { display: none !important; }
  @keyframes tj-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #tj-hint { animation: none; opacity: 0.8; } }
  /* The boot notice. Plain HTML, on screen before a line of script runs, and
     taken away by the first frame that actually draws. If the game cannot
     start there is now something to read instead of a black rectangle -
     which is the whole difference between a bug report and a diagnosis. */
  #tj-boot {
    position: fixed; left: 16px; right: 16px; bottom: 50%; transform: translateY(50%);
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    z-index: 30; white-space: pre-wrap; word-break: break-word;
  }
  #tj-boot b { color: #b8463c; font-weight: 700; }
</style>

<div id="tj-stage">
  <canvas id="screen"></canvas>
</div>
<p id="tj-hint" hidden>Touch the screen for controls</p>
<p id="tj-boot">Loading Tejas...</p>

<script>
  // Registered before the game so it catches a parse error in it too.
  (function () {
    var boot = document.getElementById('tj-boot');
    var first = null;
    window.__tjFail = function (what) {
      if (!boot) return;
      // KEEP THE FIRST ONE. The later reports are consequences: the vitals
      // sweep runs on a timer and would cheerfully paint over the exception
      // that caused everything it is describing. Overwriting the first error
      // with a summary of its aftermath cost a whole debugging round.
      if (first !== null) return;
      first = String(what);
      boot.hidden = false;
      boot.innerHTML = '<b>Tejas is not drawing.</b>\n\n' + String(what);
    };
    window.addEventListener('error', function (e) {
      window.__tjFail((e && e.message) || 'unknown error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__tjFail((e && e.reason && e.reason.message) || 'unhandled rejection');
    });
  })();
</script>

.tj-shell { position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  display: grid; place-items: center;

  box-sizing: border-box; touch-action: none; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent; z-index: 10; }
.tj-shell * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* The body. Two-tone, because a single flat slab reads as a div with a
   border-radius; the seam is what says "moulded in two halves". */
.tj-body { position: relative; width: 100%; height: 100%;
  max-width: 100%; max-height: 100%; min-width: 0; min-height: 0; display: flex;
  background: linear-gradient(${c[4]} 0 58%, ${c[3]} 58% 100%);
  border: 1px solid ${c[5]}; box-shadow: inset 0 1px 0 ${c[6]}, inset 0 -2px 6px ${c[1]}; }
.tj-shell[data-chassis="gbc"] .tj-body { flex-direction: column; align-items: center;
  border-radius: 18px 18px 42px 18px; padding: 14px 12px 12px; gap: 10px; }
.tj-shell[data-chassis="gba"] .tj-body { flex-direction: row; align-items: center;
  justify-content: space-between; border-radius: 78px / 46px; padding: 10px 22px; gap: 10px; }

/* The screen well: the void, inset, with the LCD centred in it. A real
   handheld has far more bezel than panel and the integer-scale rule produces
   exactly that on its own \u2014 whatever is left over after the largest whole
   multiple that fits is bezel, which is why this is dark rather than clever. */
.tj-well { background: ${c[0]}; display: grid; place-items: center;
  border: 2px solid ${c[2]}; box-shadow: inset 0 2px 8px #000; overflow: hidden;
  min-width: 0; min-height: 0; }
/* The well has a SHAPE, not "whatever height is going spare". Given the spare
   height on a modern phone it took all of it, and a 3:2 panel adrift in a well
   half again as tall reads as a game lost in a black column rather than as a
   screen set into plastic. */
/* No aspect-ratio here, deliberately. It is iOS 15+, and where it does not
   resolve the well has NO HEIGHT - and overflow:hidden then clips the game
   to nothing, which is a beautifully moulded case with a black screen in it.
   Flex alone always yields a real box; the proportion is applied afterwards
   as a max-height in px, which every browser has always understood and which
   can only ever make the well smaller, never zero. */
.tj-shell[data-chassis="gbc"] .tj-well { width: 100%; flex: 1 1 auto; min-height: 0;
  border-radius: 10px 10px 4px 4px; }
.tj-shell[data-chassis="gba"] .tj-well { flex: 1 1 auto; min-height: 0; min-width: 0;
  max-width: 100%; border-radius: 8px; }
.tj-well > canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* Moulding: things that are shaped but not pressable. The wordmark, the
   speaker slots, the power lamp. They are what makes the silhouette read,
   and none of them is styled like a button, because a control that does
   nothing is worse than no control. */
.tj-mark { font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.22em; color: ${c[9]}; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.tj-lamp { width: 6px; height: 6px; border-radius: 50%; background: ${rt};
  box-shadow: 0 0 5px ${rt}; flex: 0 0 auto; }

/* Controls. Raised, coloured, and the only things here that move. */
.tj-deck { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 1 1 auto; min-width: 0; }
.tj-shell[data-chassis="gbc"] .tj-deck { padding: 0 2px; gap: 8px; }
.tj-shell[data-chassis="gba"] .tj-deck { width: auto; height: 100%; }

/* Moulding under the screen: the wordmark left, the speaker right, the way
   the row of print under a handheld's panel actually sits. */
.tj-strip { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 0 0 auto; padding: 0 4px; gap: 10px; }

/* Sideways, the body is three columns: a hand, the screen, the other hand. */
.tj-side { display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; flex: 0 0 auto; }
.tj-centre { display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; flex: 1 1 auto; min-width: 0; height: 100%; }
.tj-shell[data-chassis="gba"] .tj-centre .tj-strip { justify-content: center; }

/* The cross: four arms that are four switches. It was one hit area reading an
   angle from the centre, with a hub that slid toward the thumb, which is a
   joystick wearing a plus-shaped hat and read as one immediately. An arm
   lights when it is the one being pressed, and nothing on it ever slides. */
.tj-cross { position: relative; flex: 0 0 auto; touch-action: none; }
.tj-arm { position: absolute; background: ${c[2]}; border: 1px solid ${c[4]};
  pointer-events: none; transition: background 50ms linear; }
.tj-arm.on { background: ${c[5]}; }
.tj-up { left: 34%; right: 34%; top: 2%; height: 34%; border-radius: 5px 5px 0 0; border-bottom: 0; }
.tj-down { left: 34%; right: 34%; bottom: 2%; height: 34%; border-radius: 0 0 5px 5px; border-top: 0; }
.tj-left { top: 34%; bottom: 34%; left: 2%; width: 34%; border-radius: 5px 0 0 5px; border-right: 0; }
.tj-right { top: 34%; bottom: 34%; right: 2%; width: 34%; border-radius: 0 5px 5px 0; border-left: 0; }
/* The hub is moulding: it joins the arms and it never moves. */
.tj-hub { position: absolute; left: 34%; top: 34%; width: 32%; height: 32%;
  background: ${c[2]}; border-top: 1px solid ${c[4]}; border-bottom: 1px solid ${c[4]};
  pointer-events: none; }
.tj-hub::after { content: ""; position: absolute; left: 30%; top: 30%; width: 40%; height: 40%;
  border-radius: 50%; background: ${c[3]}; }

.tj-face { position: relative; flex: 0 0 auto; }
.tj-btn { position: absolute; border-radius: 50%; display: grid; place-items: center;
  font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: ${c[13]}; touch-action: none;
  box-shadow: 0 2px 0 ${c[1]}; transition: transform 60ms linear, box-shadow 60ms linear; }
.tj-btn.on { transform: translateY(2px); box-shadow: 0 0 0 ${c[1]}; }
.tj-a { background: ${rt}; border: 1px solid ${c[10]}; }
.tj-b { background: ${c[6]}; border: 1px solid ${c[8]}; }

/* Start and Select. Moulded first \u2014 the silhouette of a handheld is wrong
   without them \u2014 and now each has a verb: Start the Archive, Select the mare. */
.tj-pills { display: flex; gap: 10px; flex: 0 0 auto; }
/* The pause pill is the odd one out and says so by being shorter. */
.tj-pill-pause { width: 20px; }
.tj-shell[data-chassis="gba"] .tj-pill-pause { width: 16px; }
.tj-pill { width: 34px; height: 8px; border-radius: 4px; background: ${c[2]};
  border: 1px solid ${c[4]}; transform: rotate(-20deg);
  cursor: pointer; touch-action: none; }
.tj-shell[data-chassis="gba"] .tj-pills { flex-direction: column; gap: 6px; }
.tj-shell[data-chassis="gba"] .tj-pill { transform: none; width: 26px; }
/* Pressed. The rotation is part of the moulding rather than of the press, so
   it has to be restated per chassis \u2014 a bare translate here would stand the
   GBC's pills up straight the moment a thumb landed on one. */
.tj-pill.on { background: ${c[8]}; border-color: ${c[10]}; }
.tj-shell[data-chassis="gbc"] .tj-pill.on { transform: rotate(-20deg) translateY(2px); }
.tj-shell[data-chassis="gba"] .tj-pill.on { transform: translateY(2px); }

/* Speaker: slots, not a grid of dots \u2014 cheaper to read at this size. */
.tj-speaker { display: flex; gap: 3px; flex: 0 0 auto; transform: rotate(-20deg); }
.tj-slot { width: 3px; height: 20px; border-radius: 2px; background: ${c[2]};
  border: 1px solid ${c[3]}; }
.tj-shell[data-chassis="gba"] .tj-speaker { transform: none; }

ridable:!0,start:{tx:9,ty:6,facing:"down"},npcs:[{id:"mare",name:"THE MARE",tx:9,ty:10,facing:"left",kind:"horse",look:{build:"adult"},lines:[{text:"She looks at you, then at the empty trough, then away. She has made her position clear."},{text:"She comes to the rail while you are still holding the gourd.",aside:"Up you get.",needs:"watered",sets:"mounted"},{text:"She shifts her weight and waits. The road is south.",needs:"mounted"}]},{id:"sister",name:"ANA",tx:7,ty:5,facing:"down",look:{build:"youth",hat:"none",hair:"long",torso:"camisa",legs:"skirt",skin:y(c,10),hairCol:y(c,1),cloth:y(c,11),cloth2:y(c,6)},lines:[{text:"You're up. Good \u2014 the whole town will be at the chapel today, and Mama says we are not arriving last.",aside:"Fill the trough before you go. The mare will not come to the rail in this heat.",sets:"told"},{text:"The gourd is on the well rope. Water first, then the mare, then the road.",needs:"told"},{text:"You are carrying it around empty. Fill it at the well \u2014 that is what the rope is for.",needs:"gourd"},{text:"Now the trough, before you spill it. She will not come to the rail for a kind word.",needs:"full"},{text:"Get up on her, then. I am not waiting in this sun.",needs:"watered"},{text:"Go on, then \u2014 south, and do not let her stop to eat. I will see you at the chapel.",needs:"mounted"}]},{id:"hand",name:"BENITO",tx:14,ty:13,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:y(c,8),hairCol:y(c,1),cloth:y(c,9),cloth2:y(c,4)},lines:[{text:"Rail post rotted through. Third one this year.",aside:"That trough has been dry since Tuesday. Fill it and she'll come to the rail, and I'll tell you about the ford."},{text:"The ford is seven miles up and everybody knows where it is. Remember that \u2014 someday it will matter more than it does today.",needs:"watered"}]}],triggers:[{tx:20,ty:17,unless:"mounted",sets:"tried-the-road",text:"You get as far as the last of the fence and stop.",aside:"Goliad is an hour south on foot and the wedding is at noon. Not without the mare."}],exits:[{tx:20,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"},{tx:21,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"}],props:[{id:"well",tx:14,ty:5,lines:[{text:"A gourd hangs on the rope, dry as a drum. You take it.",aside:"The rope still runs down into the dark, and the dark is wet.",sets:"gourd"},{text:"You let the rope down and haul it up hand over hand. The gourd fills.",needs:"gourd",sets:"full"},{text:"Full to the neck. Anything more goes on your feet.",needs:"full"}]},{id:"trough",tx:6,ty:10,lines:[{text:"Dry to the boards. Nothing will drink from this."},{text:"Dry to the boards. You turn the gourd over it and nothing comes out of that either.",aside:"It wants filling first. The well is up the slope.",needs:"gourd"},{text:"You tip the gourd in. The mare lifts her head before the water settles.",needs:"full",sets:"watered"},{text:"Full, and already half of it gone. She drinks like she has been waiting all morning, which she has.",needs:"watered"}]},{id:"corn",tx:23,ty:4,lines:[{text:"Corn, and not much of it. It has been a dry year on this side of the river."}]},{id:"road",tx:20,ty:17,lines:[{text:"The road south. Goliad is an hour that way on foot, and you do not have an hour.",aside:"Not without the mare."},{text:"The road south, and the mare under you. Goliad by mid-morning.",aside:"Just ride down it. Nobody is going to stop you.",needs:"mounted"}]}]},fi={".":p.GRASS_A,",":p.DIRT,"=":p.DIRT_EDGE,"~":p.WATER,a:p.ADOBE,h:p.THATCH,s:p.STONE,g:p.GATE,r:p.RACK,D:p.DOOR,k:p.CHAPEL_ROOF,K:p.CHAPEL_WALL,E:p.ESPADANA,A:p.CHAPEL_DOOR,"+":p.CROSS,Y:p.TREE,o:p.WELL,f:p.FLAGSTONE,R:p.ROCK,d:p.DOORWAY},qe={id:"goliad",name:"Goliad",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRR,,RRRRRRRRRRRRRRRRRR","R.............Y.....,,.................R","R...sssss...........,,.................R","R...s,,,s...........,,.................R","R...s,,,............,,.................R","R...ss,ss...........,,.................R","R........Y..........,,.................R","R~~~~~~~~~~~~~~~~~~~,,~~~~~~~~~~~~~~~~~R","R~~~~~~~~~~~~~~~~~~~,,~~~~~~~~~~~~~~~~~R","R...................,,.................R","R...hhhh............,,....ssssgsssss...R","R...aaDa............,,....s,,,,,,,,s...R","R...................,,....skkkkkkk,s...R","R........Y..........,,....skkkkEkk,s...R","R...................,,....sKKKAAAK,s...R","R.hhhh..............,,....sffffffffs...R","R.aaDa.......,,,,,,,,,,,,,sffffffffs...R","R............,,,,,,,,,,,,,ssssffssfs...R","R....o.......,,,,,,,,,,,,,ssDsffsDfs...R","R............,,,,,,,,,,,,,sffffffffs...R","R..sssss.....,,,,,,,,,,,,,ssDssDsffs...R","R..ssDss.....,,,,,,,,,,,,,sssssssffs...R","R............,,,,,,,,,,,,,ssssssssss...R","R..hhhh......,,,,,,,,,,,,,.....Y.......R","R..aaDa......,,,,,,,,,,,,,.............R","R............,,,,,,,,,,,,,.............R","R........Y...,,,,,,,,,,,,,.............R","R............,,,,,,,,,,,,,.............R","R...................,,.................R","R..rrrr.........Y...,,.................R","R..rrrr.............,,.................R","R...................,,.................R","RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"],legend:fi,start:{tx:21,ty:1,facing:"down"},exits:[{tx:20,ty:0,to:"ranch",entry:{tx:20,ty:17,facing:"up"}},{tx:21,ty:0,to:"ranch",entry:{tx:20,ty:17,facing:"up"}},{tx:30,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:32,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:31,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"}],triggers:[{tx:31,ty:15,needs:"chapel-open",sets:"under-the-arch",text:"[The doors are open above you. Somebody inside is dragging benches.]",aside:"Straight up the steps."}],npcs:[{id:"refugia",name:"DO\xD1A REFUGIA",absent:"chapel-open",tx:5,ty:25,facing:"up",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:y(c,9),hairCol:y(c,1),cloth:y(c,7),cloth2:y(c,5),accent:"#8b5d55"},lines:[{text:"Two hundred people and one fire. If you are going to stand there, stand there holding something.",aside:"Take these tamales to Anselmo. He is owed a meal and he knows it.",sets:"tamales"},{text:"Go on. The music does not start itself.",needs:"tamales"},{text:"You hear that? That is my daughter getting married, and a fiddle, and nobody sick. Two years ago I would not have believed it.",needs:"gut"}]},{id:"anselmo",name:"ANSELMO",absent:"chapel-open",tx:18,ty:18,facing:"down",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:y(c,9),hairCol:y(c,8),cloth:y(c,11),cloth2:y(c,5)},lines:[{text:"You are early. Nobody is early to a wedding."},{text:"Tamales. Good. Now the bad news \u2014 I broke a string this morning and there is no gut in this town but at the hide yard.",aside:"A rider came through Tuesday. There was a fight at Gonzales the Friday before, over a cannon. They say the flag was a girl\u2019s wedding dress, cut up.",needs:"tamales",sets:"string"},{text:"A wedding dress. That is what they are saying, anyway. Ask me again in fifty years and it will be two wedding dresses.",needs:"string"},{text:"[He strings the fiddle, tunes it against his thumb, and starts to play.]",needs:"gut"}]},{id:"casimiro",name:"CASIMIRO",tx:7,ty:30,facing:"left",look:{build:"adult",hat:"kerchief",hair:"crop",torso:"apron",legs:"calzoneras",stance:"wide",skin:y(c,8),hairCol:y(c,1),cloth:y(c,10),cloth2:y(c,6),accent:"#8b5d55"},lines:[{text:"Careful where you stand. Everything on this side of the yard is wet."},{text:"Gut I have. Time I do not. The buyer says eight hundred skins and I say nine hundred and forty, and one of us is wrong.",aside:"Count them. Properly \u2014 walk down the racks and do it yourself. I will cut your string while you wait.",needs:"string",sets:"to-count"},{text:"Well? You went and looked. That is more than the buyer did.",aside:"How many?",needs:"counted",options:[{label:"Eight hundred.",sets:"miscounted",reply:"Eight hundred is his number, not yours. You did not get it off the racks, you got it off him. Go back and add it up."},{label:"Nine hundred and forty.",sets:"gut",reply:"Nine hundred and forty. [He writes it on a slip and hands it over with the gut.] Take that to Se\xF1ora Ocampo. If the buyer argues, you were there and he was not.",aside:"And learn the ford while you are young \u2014 seven miles up, and everybody knows where it is. Some day that will matter more than it does today."},{label:"A lot.",sets:"miscounted",reply:'"A lot." [He puts the knife down.] A lot is what you say when you did not count. Nobody has ever won an argument with a lot. Go back and add it up.'}]},{text:"Take the tally to Se\xF1ora Ocampo, and do not lose it. It is the only copy and it has your counting in it.",needs:"gut"},{text:"Seven miles up. Do not forget it.",needs:"tally"}]},{id:"ocampo",name:"SE\xD1ORA OCAMPO",tx:6,ty:22,facing:"up",look:{build:"adult",hat:"mantilla",hair:"bun",torso:"camisa",legs:"skirt",load:"ledger",skin:y(c,10),hairCol:y(c,1),cloth:y(c,4),cloth2:y(c,3)},lines:[{text:"If you have no money you have no business, and you have no money."},{text:"Eight hundred. That is what my book says and my book does not guess.",aside:"Nine hundred and forty? [She looks at the slip. She looks at you.] You counted them. I did not. Nine hundred and forty.",needs:"gut",sets:"tally",then:!0},{text:"Candles for the chapel. Do not run with them.",needs:"tally",sets:"candles"},{text:"A number beats a story, m\u2019ijo. Remember that the next time somebody tells you one.",needs:"candles"}]},{id:"tomas",name:"TOM\xC1S",tx:32,ty:15,facing:"up",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:y(c,9),hairCol:y(c,1),cloth:y(c,12),cloth2:y(c,5)},lines:[{text:"You cannot go past me. The quarters and the magazine are the garrison\u2019s and they are not in a mood."},{text:"Candles. Finally. [He takes them without looking up and starts setting them along the wall.] Go in. Sit anywhere. It starts when the fiddle starts.",needs:"candles",sets:"chapel-open"},{text:"First wedding since the sickness. My mother counted \u2014 a hundred and eleven of us went into the ground that year.",needs:"chapel-open"},{text:"I am not going in. Somebody has to watch the candles and it is always me.",needs:"wedding"}]},{id:"soldier",name:"SOLDADO",tx:31,ty:9,facing:"down",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",load:"musket",stance:"wide",skin:y(c,8),hairCol:y(c,1),cloth:y(z,1,.5),cloth2:y(c,12)},lines:[{text:"Chapel is that way, and it is shut until somebody brings candles. [He does not move, exactly, but the gate is wider than it was.]",aside:"The bride\u2019s mother is Do\xF1a Refugia \u2014 far end of town, west, at the cooking fire. The bride you will not see until tonight, and everything before that goes through her mother."},{text:"A wedding. Good. It has been a quiet year for the good kind of noise.",needs:"candles"}]},{id:"elder",name:"DON PRUDENCIO",tx:15,ty:20,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"folded",legs:"calzoneras",stance:"bowed",skin:y(c,8),hairCol:y(c,12),cloth:y(c,5),cloth2:y(c,3)},lines:[{text:"You are the one who counts hides. Sit a minute. Do you know what this province is called, and why?",aside:"Not Texas. Before that.",sets:"asked-name",then:!0},{text:"Tejas. And it is not a Spanish word at all \u2014 it is Caddo, from the people out east. Tayshas. It means friends. Allies.",aside:'They said it to the first Spaniards as a greeting, and the Spaniards wrote it down as the name of the country. We have been calling this place "friends" for a hundred and fifty years without knowing it.',needs:"asked-name",sets:"told-name",gives:"the word tejas"},{text:"Friends. Remember that when men start arriving who do not speak it.",needs:"told-name"}]},{id:"carter",name:"THE CARTER",tx:23,ty:25,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"satchel",skin:y(c,8),hairCol:y(c,1),cloth:y(c,6),cloth2:y(c,4)},lines:[{text:"Do not ask me what is in the carts and I will not have to lie to you.",aside:"Coffee. It is coffee. Mostly.",sets:"asked-road",then:!0},{text:"Everything that reaches Bexar comes through here. Copano is forty miles down, the road runs right past that chapel, and there is no other road.",aside:"Which is why this little town has a fort in it and Victoria does not. Somebody worked out a long time ago that whoever holds Goliad holds the coast.",needs:"asked-road",sets:"told-road",gives:"the copano road"},{text:"Forty miles to the water. Remember the road, not the town.",needs:"told-road"}]}],props:[{id:"well",tx:5,ty:18,lines:[{text:"The town well. Somebody has scratched a tally of the dry months into the stone and given up partway."}]},{id:"store-door",tx:5,ty:21,lines:[{text:"Ocampo\u2019s. Salt, powder, cloth, coffee, and a ledger she guards like a dog."}]},{id:"racks",tx:4,ty:29,lines:[{text:"Hides on the racks, four deep, stiff as doors. This is what Goliad sells."},{text:"Four racks, four deep. You do the near one twice because you lose your place, and then you go slower.",aside:"Two hundred and thirty-five on the near rack. Two hundred and thirty-five on the next. Two hundred and thirty-four. Two hundred and thirty-six.",needs:"to-count",sets:"counted"},{text:"Four racks, and you have the four numbers. Nine hundred and forty, if you have added them right.",needs:"gut"}]},{id:"chapel",tx:28,ty:15,lines:[{text:"Nuestra Se\xF1ora de Loreto, the chapel of the presidio. The whole town gets married and buried inside a fort, and nobody here thinks that is strange.",aside:"The door faces the parade ground, and it is shut. There is a soldier on the gate who is not moving."},{text:"Still shut. Whoever is setting it up for tonight has not been given what they need to light it.",aside:"You are carrying them. Tom\xE1s is the one on the parade ground with his arms folded \u2014 hand them to him.",needs:"candles"},{text:"Open, and somebody inside is setting candles along the wall in a line that is not straight.",aside:"The way in is the arch, three tiles of it, straight ahead.",needs:"chapel-open"}]},{id:"mission",tx:6,ty:4,lines:[{text:"Esp\xEDritu Santo. Secularised five years ago; the great herds are eighty years gone and the east wall with them.",aside:"The fort is on the far bank. You cross at the ford, the way everybody does."}]},{id:"quarters",tx:28,ty:18,lines:[{text:"The officers\u2019 quarters. Stone, like everything the crown paid for, and shut."}]},{id:"barracks",tx:28,ty:20,lines:[{text:"The soldiers\u2019 barracks, built against the wall itself. There are fewer men in it than there are beds.",aside:"Sandoval has fifty. The wall is longer than fifty men."}]},{id:"magazine",tx:33,ty:18,lines:[{text:"The powder magazine. The one door in the fort nobody leaves unlocked."}]},{id:"cannon",tx:34,ty:15,lines:[{text:"Cannon, on the parade. Eight-pounders \u2014 the fort was built with six of them and nobody has moved one in years.",aside:"They are counted. Everything the crown issued was counted."}]}]},mi={s:p.STONE,f:p.FLAGSTONE,",":p.DIRT,d:p.DOORWAY,A:p.ALTAR,"+":p.CROSS,b:p.BENCH,t:p.TABLE,H:p.HEARTH,Y:p.TREE},pi={id:"the-wedding",needs:"chapel-open",unless:"wedding",steps:[U(void 0,"Tom\xE1s has lit every candle in the building. There are more candles than there are chairs."),mt("player",5,12),U("EL PADRE","Are we all in? Then somebody shut that door before the wind has it."),mt("manuela",6,9),U(void 0,"Outside, the fiddle stops. Two hundred people stop with it."),mt("manuela",6,3),Bt("manuela","up"),Bt("eusebio","up"),U("EL PADRE","We have waited a long while for a good reason to fill this room. Most of the last ones were not good reasons.","Sixteen months ago he buried a hundred and eleven people out of this same doorway."),U("MANUELA","S\xED."),U("EUSEBIO","S\xED."),U(void 0,"The room makes a noise like a roof coming off."),ce("wedding"),Bt("manuela","down"),Bt("eusebio","down"),mt("eusebio",5,7),mt("manuela",6,7),mt("manuela",14,8),mt("eusebio",13,6),U(void 0,"Outside, Anselmo lays the bow across the new string, and the yard finds out what your afternoon at the hide racks bought.")]},gi={id:"chapel",name:"La Capilla",light:{base:-6,sources:[{tx:5,ty:2,r:7,gain:7},{tx:6,ty:2,r:7,gain:7},{tx:1,ty:6,r:4,gain:4},{tx:10,ty:6,r:4,gain:4},{tx:1,ty:12,r:4,gain:4},{tx:10,ty:12,r:4,gain:4},{tx:11,ty:7,r:3,gain:3},{tx:12,ty:14,r:6,gain:6},{tx:16,ty:9,r:5,gain:4},{tx:16,ty:12,r:5,gain:4},{tx:5,ty:15,r:3,gain:3}]},rows:["sssss++ssssssssssssss","sffffAAffffs,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,Y,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,,,,,,s","sffffffffffd,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,tttt,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,tttt,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffsH,,,,,,,s","sssssdssssss,,,,,,,,s","sssssssssssssssssssss"],legend:mi,start:{tx:5,ty:14,facing:"up"},scenes:[pi],triggers:[{tx:5,ty:14,needs:"letter",sets:"at-the-door",text:"[You are at the door with her letter in your shirt. Behind you the fiddle is still being tuned.]",aside:"Whatever is said in this room tonight gets said once, and you will not be coming back in."}],exits:[{tx:5,ty:15,to:"bahia",entry:{tx:21,ty:1,facing:"down"},needs:"letter"},{tx:5,ty:15,to:"goliad",entry:{tx:29,ty:6,facing:"down"}}],npcs:[{id:"padre",name:"EL PADRE",tx:6,ty:2,facing:"down",look:{build:"adult",hat:"none",hair:"tonsure",torso:"camisa",legs:"cassock",load:"book",skin:y(c,10),hairCol:y(c,9),cloth:y(c,2),cloth2:y(c,2)},lines:[{text:"You are late. So was I. We will say nothing about it to each other."},{text:"You came in on a horse from out past the river, no? Then answer me something. How far is the nearest priest to your people?",aside:"It is not a trick. I am the answer and I am also the problem.",needs:"wedding",sets:"asked-bond",then:!0},{text:"Up on the Brazos there is one of me for a country the size of Spain. So they do not wait. A man and a woman sign a bond in front of two neighbours, and they live married, and they wait for somebody like me to ride through.",aside:"I have baptised children at the same table where I afterwards married their parents. It is legal. It is a document. It is not what I would have chosen.",needs:"asked-bond",sets:"told-bond",gives:"the marriage bond"},{text:"A bond is a paper two neighbours signed. This is a paper a church signed. One day somebody will ask which one counted, and they will go looking for the paper, not for the two neighbours.",needs:"told-bond"}]},{id:"eusebio",name:"EUSEBIO",tx:5,ty:3,facing:"up",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:y(c,9),hairCol:y(c,1),cloth:y(c,6),cloth2:y(c,3)},lines:[{text:"Do not talk to me. If I talk I will keep talking and then I will still be talking when he asks me the question."},{text:"Her mother has not sat down since Thursday. Somebody should make her sit down. It will not be me, I have used up all my courage for one day.",needs:"wedding"}]},{id:"manuela",name:"MANUELA",tx:6,ty:13,facing:"up",look:{build:"adult",hat:"veil",hair:"none",torso:"camisa",legs:"skirt",load:"bouquet",skin:y(c,10),hairCol:y(c,1),cloth:y(c,13),cloth2:y(c,12)},lines:[{text:"Not yet. Nobody sees me before the candles are lit \u2014 that is the entire point of candles."},{text:"You. The one who has been running all over town since noon. My brother is on the Brazos and he could not come. Will you carry this to him?",aside:"Tell him it happened. Tell him who was here.",needs:"wedding",sets:"letter"},{text:"North, past the crossing, and ask for the Ruiz place. He will feed you for it, and he will make you say all the names twice.",needs:"letter"}]},{id:"refugia",name:"DO\xD1A REFUGIA",tx:13,ty:14,facing:"left",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:y(c,9),hairCol:y(c,1),cloth:y(c,7),cloth2:y(c,5),accent:"#8b5d55"},lines:[{text:"Eat something. I did not cook for two days so that people could stand about being polite."},{text:"Anselmo has been telling everyone his story from Gonzales. The flag. Say it back to me \u2014 what was it cut from?",needs:"wedding",sets:"asked-dress"},{text:"A wedding dress. [She does not laugh.] I sewed the one my daughter has on. Four months. It is the only thing in this family worth anything, and when she is done with it her daughter gets it.",aside:"Nobody cuts up a wedding dress to make a bedsheet with writing on it. Go back and ask him whose dress. He will give you a name, and he will be guessing.",needs:"guessed",sets:"told-dress",gives:"a seamstress's objection"},{text:"Ask him whose. That is all. It is a good story and I would like it to be true, and those are two different things.",needs:"told-dress"}]},{id:"anselmo",name:"ANSELMO",tx:17,ty:11,facing:"up",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:y(c,9),hairCol:y(c,8),cloth:y(c,11),cloth2:y(c,5)},lines:[{text:"Gut from a dead cow, and out of it comes that. I have never got over it and I have been doing it for thirty years."},{text:"They will dance until the candles go. Nobody in this town has had a reason to wear out a floor since before the sickness.",needs:"wedding"},{text:"The dress? [He does not stop tuning.] Spanish. Brought up from B\xE9xar, I would say, or the coast. You can tell.",aside:"He says it the way a man says a thing he has never once been asked to prove.",needs:"asked-dress",sets:"guessed"},{text:"You are the one who told Do\xF1a Refugia the dress was Spanish. [He is not embarrassed. He is interested.] So. The gun at Gonzales. The lieutenant asked for it back and they would not give it. If you had been standing on that bank, what would you have said to him?",aside:"Everything you have got. Papers first.",needs:"told-dress",sets:"the-argument",opens:"cannon"},{text:"That is the whole of it, then. A man asks you whose gun it is and you had better have something in your hands when you answer.",needs:"the-argument"}]},{id:"paquita",name:"PAQUITA",tx:4,ty:12,facing:"right",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:y(c,10),hairCol:y(c,1),cloth:y(c,11),cloth2:y(c,8)},lines:[{text:"I have been sitting on this bench since four o\u2019clock and I am not allowed to say anything about it."},{text:"You are taking me to the food. That is how it is done \u2014 you take me there and you bring me back to my mother, and everybody watches you do it, and then I am allowed to eat.",aside:"Walk. I will keep up. I have been keeping up my whole life.",needs:"wedding",sets:"escorting"},{text:"Out the side door and along. You cannot miss it, it is the only thing in the yard that smells like that.",needs:"escorting"},{text:"Now my mother. Not fast. If you run it does not count.",needs:"fed"},{text:"That was correctly done. I will tell people.",needs:"escorted"}]},{id:"benigno",name:"T\xCDO BENIGNO",tx:15,ty:13,facing:"up",look:{build:"adult",hat:"sombrero",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"reata",stance:"bowed",spurs:!0,sash:!0,skin:y(c,8),hairCol:y(c,8),cloth:y(c,7),cloth2:y(c,4)},lines:[{text:"Forty-one years I have been coming to weddings in that building. I have signed the book at eleven of them."},{text:"You want to see something? Come and look at what I put in the register tonight, next to my name.",aside:"Except it is not next to my name. It is instead of it.",needs:"wedding",sets:"asked-mark",then:!0},{text:"I cannot write. So I sign with my iron \u2014 the same mark that is on every cow of mine and on my gate and in the book at the town hall where they keep the brands.",aside:"On the cattle it means mine. On the register it means I was here and I say so. It is the same mark and it means the same thing, and it will still mean it when I am dead.",needs:"asked-mark",sets:"told-mark",gives:"a mark for a signature"},{text:"Learn your neighbours\u2019 irons before you learn their faces. The face changes.",needs:"told-mark"}]}],props:[{id:"altar",tx:5,ty:1,lines:[{text:"Two candles, a cloth somebody has washed within an inch of its life, and a crucifix older than the fort."}]},{id:"bench",tx:3,ty:13,lines:[{text:"A plank on two frames. Half the town is sitting on the other half of it."}]},{id:"table",tx:16,ty:9,lines:[{text:"Planks laid across frames: tamales in a cloth, cakes, and a coffee pot that has been full since noon."},{text:"Paquita takes a tamal in each hand, which is one more than the ritual strictly allows.",needs:"escorting",sets:"fed"},{text:"Picked over now. Somebody has taken all the cakes with the sugar on.",needs:"escorted"}]},{id:"hearth",tx:12,ty:14,lines:[{text:"The chimney. The coffee and the cakes get their heat here, and so does everybody who stands near it."},{text:"You deliver Paquita to her mother\u2019s elbow and let go of her sleeve. Do\xF1a Refugia looks at you for a second longer than she needs to.",aside:"A fiddle, planks across frames, and a girl walked to the food and back. This is what a fandango is, and you have just been in one.",needs:"fed",sets:"escorted",gives:"the fandango"},{text:"Warm. The only warm thing in the yard that is not a person.",needs:"escorted"}]}]};function wi(){const o=qe.rows.map(t=>t.split("")),e=(t,s,n)=>{o[s][t]=n};return e(30,10,"B"),e(34,22,","),e(35,16,","),e(26,19,","),o.map(t=>t.join(""))}const yi={id:"the-road",needs:"letter",unless:"chose",steps:[U(void 0,"You are most of the way home before you understand what you saw on the coast road.","Horses. Not two or three. More than you can count in the dark, and none of them hurrying, which is worse."),U(void 0,"They are not the Mexican army. The Mexican army is in that fort, and it has been all year, and it nodded at you tonight."),Wn(void 0,"You are the only person in this valley who knows. You have about a minute.",[{label:"Warn the garrison.",sets:"told-garrison",reply:"You go for the gate. The sentry knows you \u2014 you are the candle kid \u2014 and he believes you, and that is the whole of it. Men come out of the quarters pulling their coats on.",aside:"They will stand to. The fight will be longer and worse than it would have been, and more of them will live through it."},{label:"Warn the town.",sets:"told-town",reply:"You go for the square instead, shouting, and the square empties. Do\xF1a Refugia has her family and half of somebody else\u2019s out the back before you finish the sentence.",aside:"Not one person you woke can fire a musket. That was not the point and you knew it when you turned."},{label:"Say nothing. Run.",sets:"told-nobody",reply:"You do not stop. You put the mare down the river track and you are inside the walls before you have decided anything at all.",aside:"For the next eleven minutes you are the only person in Goliad who knows what is coming. It is heavier than it sounds."}],"Whatever you pick, they are still coming and there are still a hundred and twenty of them."),ce("chose")]},bi={id:"the-fight",needs:"inside",unless:"fought",steps:[U(void 0,"Eleven o\u2019clock. It starts the way the men who were there always said it started \u2014 all at once, and from the wrong direction."),U(void 0,"You are on your face in the dirt of a courtyard you walked across four hours ago carrying candles.","You cannot see any of it. You can hear all of it, which turns out not to be better."),U(void 0,"What you can see is the flashes. Over the east wall, over the south wall, and a few from the strip by the river, going off out of order like somebody striking matches in a wind.","The garrison is answering off the parapet above you. Everything else about tonight will arrive tomorrow, on paper."),ce("fought")]},ki={id:"the-surrender",needs:"got-out",unless:"surrendered",steps:[U(void 0,"It stops. Not gradually \u2014 the way a room goes quiet when somebody senior says a short word in it."),mt("player",29,8),Bt("player","up"),U("GEORGE COLLINSWORTH","Sandoval. You have done what you were told to do and there is no more of it to do. Your men keep their coats."),U(void 0,"Half an hour, start to finish. Nobody asks you anything, and nobody will, and you are thirteen years old and standing in the middle of it."),jo(600),U(void 0,"\u2014 THE ROLL, LA BAH\xCDA, 9 OCTOBER 1835 \u2014","Garrison, under Lt. Col. Francisco Sandoval: three killed. Seven wounded. Twenty-one taken. Volunteers, under Collinsworth: several wounded. None killed."),Bo("the roll of la bah\xEDa"),U(void 0,"Somebody writes it down before the sun is up, because somebody always does, and that is the only reason you will ever be able to say it back."),jo(400),U(void 0,"Morning. The river fog comes up to the walls and stops there."),U(void 0,"Forty-nine of them put their names to one page: that they are here to protect the people of this town from military domination, and that they say so in writing.","Some of them sign with a mark. You know what that means now."),Bo("the compact of volunteers"),U(void 0,"You cannot give an order and nobody will take one from you. You can carry a copy of somebody else\u2019s, and you have just watched one being made."),ce("surrendered")]},Ri={id:"bahia",name:"La Bah\xEDa",light:{base:-4,sources:[{tx:30,ty:10,r:5,gain:4},{tx:31,ty:15,r:5,gain:4},{tx:19,ty:19,r:6,gain:3},{tx:21,ty:1,r:5,gain:2},{tx:5,ty:21,r:4,gain:2},{tx:32,ty:16,r:4,gain:3}]},flashes:[{tx:38,ty:12,needs:"fought"},{tx:38,ty:19,needs:"fought"},{tx:33,ty:25,needs:"fought"},{tx:28,ty:25,needs:"fought"},{tx:24,ty:14,needs:"fought"},{tx:24,ty:19,needs:"fought"},{tx:27,ty:9,needs:"fought"},{tx:34,ty:9,needs:"fought"},{tx:30,ty:9,needs:"fought"},{tx:28,ty:10,needs:"fought"},{tx:35,ty:14,needs:"fought"},{tx:30,ty:22,needs:"fought"},{tx:27,ty:16,needs:"fought"},{tx:33,ty:19,needs:"fought"}],rows:wi(),legend:De(bt({},qe.legend),{B:p.BARRED}),start:{tx:21,ty:1,facing:"down"},scenes:[yi,bi,ki],triggers:[{tx:34,ty:22,needs:"chose",sets:"by-ditch",text:"The ditch under the south wall. Casimiro told you about it while you were counting his hides, and you were not listening, and you remembered anyway."},{tx:35,ty:16,needs:"chose",sets:"by-river",text:"The river side, where the stones are wet all year and nobody posts a man because nobody would come this way."},{tx:26,ty:19,needs:"chose",sets:"by-magazine",text:"The gap by the magazine. You are close enough to the powder to be told off for it, and there is nobody left to tell you off."},{tx:31,ty:16,needs:"chose",sets:"inside"},{tx:31,ty:11,needs:"paquita-out",sets:"got-out",text:"You get them both to the gate. It is barred, and the bar is on your side, and lifting it is the only useful thing you do all night."}],npcs:[{id:"tomas",name:"TOM\xC1S",tx:29,ty:15,facing:"down",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:y(c,9),hairCol:y(c,1),cloth:y(c,12),cloth2:y(c,5)},lines:[{text:"Do not stand up. Whatever you do, do not stand up."},{text:"I have been in this building my whole life and I do not know how to get out of it. Isn\u2019t that the stupidest thing you have ever heard.",aside:"You know three ways. You used one of them getting in.",needs:"fought",sets:"tomas-out"},{text:"Behind you. Keep your hand on the wall and do not look at the light.",needs:"tomas-out"}]},{id:"paquita",name:"PAQUITA",tx:33,ty:15,facing:"left",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:y(c,10),hairCol:y(c,1),cloth:y(c,11),cloth2:y(c,8)},lines:[{text:"[She has both hands over her ears and she is not going to take them off for you.]"},{text:"You took me to the food and you brought me back. That is twice you are supposed to walk me somewhere.",aside:"[She puts a hand out. It is the same manoeuvre as the tamales and neither of you says so.]",needs:"tomas-out",sets:"paquita-out"},{text:"Not fast. If you run it does not count.",needs:"paquita-out"}]},{id:"sandoval",name:"LT. COL. SANDOVAL",tx:30,ty:19,facing:"left",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",stance:"wide",skin:y(c,8),hairCol:y(c,1),cloth:y(c,4),cloth2:y(c,11)},lines:[{text:"Get down. I do not care whose child you are, get DOWN."},{text:"Cos took the good half of this garrison to B\xE9xar in the summer and left me the paperwork. Somebody on that road counted us before they came. Somebody always counts first.",needs:"surrendered"}]},{id:"dimmitt",name:"PHILIP DIMMITT",tx:28,ty:19,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:y(c,9),hairCol:y(c,8),cloth:y(c,6),cloth2:y(c,3)},lines:[{text:"Out of the way, son."},{text:"I have a wife and a store and a league of land eight miles from where you are standing, and I have known this country twelve years. Ask me why we came here and not somewhere with more in it.",needs:"surrendered",sets:"asked-why"},{text:"Copano is forty miles down that road and every pound of powder Cos eats in B\xE9xar comes up it, through here, past that chapel. We did not take a town tonight. We took a road.",aside:"Which is a thing you already knew, because a carter told you this afternoon while you were trying to get somewhere else.",needs:"asked-why",sets:"told-why",gives:"the road to bexar, cut"},{text:"A road, and a fort nobody will thank us for. Remember which one mattered.",needs:"told-why"}]},{id:"milam",name:"A VOLUNTEER",tx:33,ty:19,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"musket",stance:"wide",skin:y(c,8),hairCol:y(c,12),cloth:y(c,7),cloth2:y(c,4)},lines:[{text:"[He is reloading and he does not look up.]"},{text:"You want to know something worth knowing? That man over there was in a cell in Monterrey three months ago.",needs:"surrendered",sets:"asked-milam"},{text:"Ben Milam. Walked out of a Mexican prison, walked north until he found somebody going the same way, and turned up on this road last week asking whose army it was.",aside:"He will be dead in December in a street in B\xE9xar and there will be a county named after him, and neither of those has happened yet.",needs:"asked-milam",sets:"told-milam",gives:"milam, lately out of monterrey"},{text:"Some men walk out of prisons. Most do not. Learn the difference before you copy anybody.",needs:"told-milam"}]}],props:[{id:"gate",tx:30,ty:10,lines:[{text:"The gate you walked through this afternoon, barred from the inside. The bar is a tree.",aside:"There is no version of tonight where you get in this way."}]},{id:"chapel",tx:31,ty:14,lines:[{text:"The chapel. Four hours ago there were candles in every window of it and a fiddle going in the yard."},{text:"The candles are still lit. Nobody had a reason to put them out and nobody has had a moment to.",needs:"fought"}]},{id:"quarters",tx:31,ty:9,lines:[{text:"The garrison quarters. The door is open, which it has never been."},{text:"Twenty-one men will come out of there with their hands where everyone can see them, and every one of them will be written down by name.",needs:"surrendered"}]}]};function Vo(o,e){return o==="word"&&e==="law"||o==="law"&&e==="count"||o==="count"&&e==="word"}function Ue(o,e){return e==="land"?0:o.favors===e?1:o.resists===e?-1:0}function Zo(o){return o.force<=0}function Lo(o){return o.map(e=>bt({},e))}const Xe=5,zt=12;class Jo{constructor(e,t=[]){g(this,"def");g(this,"hand");g(this,"log",[]);g(this,"struck",[]);g(this,"conviction",0);g(this,"index",0);g(this,"ground");this.def=e,this.hand=[...Lo(e.hand),...Lo(t)];const s=e.grounds.find(n=>n.id===e.startingGround);if(!s)throw new Error(`Case ${e.id}: unknown startingGround "${e.startingGround}"`);this.ground=s}get claim(){var e;return(e=this.def.claims[this.index])!=null?e:null}get exchangesLeft(){return Math.min(Xe,this.def.claims.length)-this.index}get status <script>
  // Did it actually draw? Screen is the only thing that ever writes an inline
  // width onto the canvas, so that is the honest signal. Reading canvas.width
  // instead would call a legitimate 1x scale a failure, since 240 is smaller
  // than the 300 an untouched canvas starts at.
  (function () {
    var boot = document.getElementById('tj-boot');
    var hint = document.getElementById('tj-hint');
    requestAnimationFrame(function () {
      var c = document.getElementById('screen');
      // Drawn is not the same as VISIBLE. A canvas can be correctly sized and
      // still be clipped to nothing by a container that collapsed - which is
      // what a case with a black screen in it actually is - and that reads to
      // a player as "the game is broken" with nothing to report but the
      // colour. So measure what is really on screen, and say so if it is
      // nothing.
      var box = c ? c.getBoundingClientRect() : null;
      if (c && c.style.width && box && box.width >= 1 && box.height >= 1) {
        if (boot) boot.hidden = true;

        // up they always are, so there is nothing to point at and saying so
        // would just be a line of text over somebody's game.

        );

    // answer. Not "is the canvas there and the right size" - it was, on the
    // phone this was written for - but "is there anything ON it". A canvas

    // state is indistinguishable from a broken game by looking at it. So
