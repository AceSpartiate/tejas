:16,toX:34,toY:16,side:"garrison"}]},pen:{needs:"fought",keep:[26,10,35,22],text:"THAT IS WHERE THEY ARE FIRING FROM"},rows:Xi(),legend:kt(me({},Ro.legend),{B:c.BARRED}),start:{tx:21,ty:1,facing:"down"},scenes:[Vi,Ji,Zi],triggers:[{tx:34,ty:22,needs:"chose",sets:"by-ditch",text:"The ditch under the south wall. Casimiro told you about it while you were counting his hides, and you were not listening, and you remembered anyway."},{tx:35,ty:16,needs:"chose",sets:"by-river",text:"The river side, where the stones are wet all year and nobody posts a man because nobody would come this way."},{tx:26,ty:19,needs:"chose",sets:"by-magazine",text:"The gap by the magazine. You are close enough to the powder to be told off for it, and there is nobody left to tell you off."},{tx:31,ty:16,needs:"chose",sets:"inside"},{tx:31,ty:11,needs:"paquita-out",sets:"got-out",text:"You get them both to the gate. It is barred, and the bar is on your side, and lifting it is the only useful thing you do all night."}],npcs:[{id:"padre-yard",name:"EL PADRE",tx:30,ty:17,facing:"down",needs:"surrendered",look:{build:"adult",hat:"none",hair:"tonsure",torso:"chaqueta",legs:"cassock",load:"book",skin:y(l,9),hairCol:y(l,1),cloth:y(l,2),cloth2:y(l,3)},lines:[{text:"Sit down before you fall down. [He looks at you the way he looked at you yesterday, which is not how anybody else in this yard is looking at anybody.]",aside:"Nobody from this town is dead. I have asked twice and it is still true, and I am going to go on asking.",sets:"to-the-string",then:!0},{text:"Now. [He takes a length of string out of his sleeve, of all places, and looks for somewhere to lay it down.] You have been picking paper up off nails since yesterday morning. Every piece of it. On the step, face up.",aside:"One at a time, and you will tell me which of them came first. I will move the ones you put wrong and I will tell you how I knew.",needs:"to-the-string",sets:"strung",opens:"order"},{text:"It is in order and it is yours. Do not lose it. Somebody will want it one day and they will not take your word for any of it.",aside:"Go home. Your sister has been on that road since it got light and she is not going to be reasonable about it.",needs:"strung",sets:"the-end"}]},{id:"tomas",name:"TOM\xC1S",tx:29,ty:15,facing:"down",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:y(l,9),hairCol:y(l,1),cloth:y(l,12),cloth2:y(l,5)},lines:[{text:"Do not stand up. Whatever you do, do not stand up."},{text:"I have been in this building my whole life and I do not know how to get out of it. Isn\u2019t that the stupidest thing you have ever heard.",aside:"You know three ways. You used one of them getting in.",needs:"fought",sets:"tomas-out"},{text:"Behind you. Keep your hand on the wall and do not look at the light.",needs:"tomas-out"}]},{id:"paquita",name:"PAQUITA",tx:33,ty:15,facing:"left",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:y(l,10),hairCol:y(l,1),cloth:y(l,11),cloth2:y(l,8)},lines:[{text:"[She has both hands over her ears and she is not going to take them off for you.]"},{text:"You took me to the food and you brought me back. That is twice you are supposed to walk me somewhere.",aside:"[She puts a hand out. It is the same manoeuvre as the tamales and neither of you says so.]",needs:"tomas-out",sets:"paquita-out"},{text:"Not fast. If you run it does not count.",needs:"paquita-out"}]},{id:"sandoval",name:"LT. COL. SANDOVAL",tx:30,ty:19,facing:"left",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",stance:"wide",skin:y(l,8),hairCol:y(l,1),cloth:y(l,4),cloth2:y(l,11)},lines:[{text:"Get down. I do not care whose child you are, get DOWN."},{text:"Cos took the good half of this garrison to B\xE9xar in the summer and left me the paperwork. Somebody on that road counted us before they came. Somebody always counts first.",needs:"surrendered"}]},{id:"dimmitt",name:"PHILIP DIMMITT",tx:28,ty:19,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:y(l,9),hairCol:y(l,8),cloth:y(l,6),cloth2:y(l,3)},lines:[{text:"Out of the way, son."},{text:"I have a wife and a store and a league of land eight miles from where you are standing, and I have known this country twelve years. Ask me why we came here and not somewhere with more in it.",needs:"surrendered",sets:"asked-why"},{text:"Copano is forty miles down that road and every pound of powder Cos eats in B\xE9xar comes up it, through here, past that chapel. We did not take a town tonight. We took a road.",aside:"Which is a thing you already knew, because a carter told you this afternoon while you were trying to get somewhere else.",needs:"asked-why",sets:"told-why",gives:"the road to bexar, cut"},{text:"A road, and a fort nobody will thank us for. Remember which one mattered.",needs:"told-why"}]},{id:"milam",name:"A VOLUNTEER",tx:33,ty:19,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"musket",stance:"wide",skin:y(l,8),hairCol:y(l,12),cloth:y(l,7),cloth2:y(l,4)},lines:[{text:"[He is reloading and he does not look up.]"},{text:"You want to know something worth knowing? That man over there was in a cell in Monterrey three months ago.",needs:"surrendered",sets:"asked-milam"},{text:"Ben Milam. Walked out of a Mexican prison, walked north until he found somebody going the same way, and turned up on this road last week asking whose army it was.",aside:"He will be dead in December in a street in B\xE9xar and there will be a county named after him, and neither of those has happened yet.",needs:"asked-milam",sets:"told-milam",gives:"milam, lately out of monterrey"},{text:"Some men walk out of prisons. Most do not. Learn the difference before you copy anybody.",needs:"told-milam",sets:"asked-matagorda",then:!0},{text:"Us? We are nobody. Tuesday we were forty men in Sylvanus Hatch\u2019s front room at Matagorda, arguing, and the first thing we did was take a vote on who was in charge of us.",aside:"Collinsworth won it. Three days later there were a hundred and twenty of us and we were coming up your road.",needs:"asked-matagorda",sets:"told-matagorda"},{text:"Forty men in a front room on Tuesday. Remember that the next time somebody tells you an army arrived.",needs:"told-matagorda"}]}],props:[{id:"mission-shut-w",tx:6,ty:4,lines:[{text:"The mission door, across the water. Barred from the inside, and there is a light moving behind the shutter that stops moving while you are looking at it.",aside:"Whoever is in there has heard what is happening on this side of the river and has decided, sensibly, to be somewhere else."}]},{id:"mission-shut-c",tx:7,ty:4,lines:[{text:"The mission door, across the water. Barred from the inside, and there is a light moving behind the shutter that stops moving while you are looking at it."}]},{id:"mission-shut-e",tx:8,ty:4,lines:[{text:"The mission door, across the water. Barred from the inside, and there is a light moving behind the shutter that stops moving while you are looking at it."}]},{id:"jacal-n-shut",tx:6,ty:11,lines:[{text:"Casimiro\u2019s door, with a hide pegged across the inside of it. He is not in there \u2014 he was in the square an hour ago telling anybody who would listen that he was too old for this."}]},{id:"jacal-w-shut",tx:4,ty:16,lines:[{text:"The empty one. It was shut this afternoon and it is shut now, and it is the only door in this town that has not changed since the sickness."}]},{id:"store-shut",tx:5,ty:21,lines:[{text:"The store, shuttered, with the bar up on the outside as well \u2014 which is Se\xF1ora Ocampo saying she has gone somewhere and does not want to be misunderstood about it."}]},{id:"jacal-s-shut",tx:5,ty:24,lines:[{text:"Do\xF1a Refugia\u2019s, dark, with the cooking fire outside it raked over and a pot left on the stones. Nobody banks a fire and walks away from it unless they left in a hurry."}]},{id:"chapel-portal-w",tx:30,ty:14,lines:[{text:"The west leaf of the chapel portal, pulled to. There were candles behind this door this afternoon and there are candles behind it now, and a great many more people."}]},{id:"chapel-portal-e",tx:32,ty:14,lines:[{text:"The east leaf, pulled to. Somebody has put a bench against the inside of it, which you can hear when you push and which is the whole of the answer."}]},{id:"magazine-night",tx:33,ty:18,lines:[{text:"The powder magazine. Locked this afternoon and locked now, and tonight it is the one door in this fort that everybody on both sides is glad about."}]},{id:"barracks-east-night",tx:31,ty:20,lines:[{text:"The east barracks door, where the rations were issued. There is a man sitting against it on the outside with his musket across his knees, and he is not a sentry any more, he is just sitting there."}]},{id:"gate",tx:30,ty:10,lines:[{text:"The gate you walked through this afternoon, barred from the inside. The bar is a tree.",aside:"There is no version of tonight where you get in this way."}]},{id:"chapel",tx:31,ty:14,lines:[{text:"The chapel. Four hours ago there were candles in every window of it and a fiddle going in the yard."},{text:"The candles are still lit. Nobody had a reason to put them out and nobody has had a moment to.",needs:"fought"}]},{id:"quarters",tx:31,ty:9,lines:[{text:"Twenty-one men will come out of there with their hands where everyone can see them, and every one of them will be written down by name.",needs:"surrendered"},{text:"The garrison quarters. The door is open, which it has never been \u2014 and somebody coming through it in a hurry has dropped a folded paper on the sill.",aside:"Not garrison paper. It is a muster, in a civilian hand, headed with the name of a house in Matagorda.",gives:"the meeting at matagorda",needs:"fought",sets:"read-muster"},{text:"The garrison quarters. The door is open, which it has never been.",needs:"read-muster"}]}]},er=["wwwwwwwwwwwwwww","wwwwwwwwwwwwwww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","wwwwwwwdwwwwwww","wwwwwwwwwwwwwww"],Le={tx:7,ty:8},xo={tx:7,ty:7,facing:"up"};function tr(){return{base:-4,sources:[{tx:Le.tx,ty:Le.ty,r:6,gain:6},{tx:11,ty:1,r:5,gain:5},{tx:3,ty:2,r:3,gain:2}]}}function pe(o){var a,i,d,w;const t=er.map(f=>f.split(""));for(const[f,u,b]of(a=o.place)!=null?a:[])t[u][f]=b;o.also&&(t[o.also.ty][o.also.tx]="d");const e=o.build==="adobe"?c.ADOBE:o.build==="log"?c.LOG:c.STONE,n=o.build==="adobe"?c.DIRT:o.build==="log"?c.PUNCHEON:c.FLAGSTONE,s=[{tx:Le.tx,ty:Le.ty,to:o.back.to,entry:{tx:o.back.tx,ty:o.back.ty,facing:"down"}}];return o.also&&s.push({tx:o.also.tx,ty:o.also.ty,to:o.back.to,entry:{tx:o.back.tx,ty:o.back.ty,facing:"down"}}),{id:o.id,name:o.name,rows:t.map(f=>f.join("")),legend:{w:e,".":n,d:c.DOORWAY,B:c.BILL_STONE,b:o.build==="log"?c.BILL_LOG:c.BILL_ADOBE,C:c.CHIMNEY,H:c.HEARTH,t:c.TABLE,e:c.BENCH,r:c.RACK,D:c.DOOR},start:{tx:xo.tx,ty:xo.ty,facing:xo.facing},npcs:(i=o.npcs)!=null?i:[],props:(d=o.props)!=null?d:[],exits:s,light:(w=o.light)!=null?w:tr()}}const or=pe({id:"ranch-house",name:"The house",build:"adobe",back:{to:"ranch",tx:6,ty:5},place:[[11,1,"H"],[5,1,"b"],[4,5,"t"],[4,6,"e"],[10,6,"e"]],props:[{id:"title",tx:5,ty:1,lines:[{text:"The title, in a frame your grandfather made, hung where anyone coming in has to look at it.",aside:"Spanish on one side of the sheet and the surveyor\u2019s Spanish on the other, and a seal at the foot the size of a fist.",gives:"the colony line",sets:"read-title"},{text:"The title, in its frame. Nobody in this house needs to read it twice.",needs:"read-title"}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Banked, not out. Somebody will want coffee before the ride and nobody has said so yet."}]},{id:"table",tx:4,ty:5,lines:[{text:"Four bowls, three chairs, and a fourth chair that has been a stool since the sickness.",aside:"Nobody moved it and nobody mentions it."}]}]}),nr=pe({id:"store",name:"The store",build:"stone",back:{to:"goliad",tx:5,ty:22},place:[[3,1,"r"],[4,1,"r"],[10,1,"r"],[11,1,"r"],[6,5,"t"],[7,5,"t"],[8,5,"t"]],npcs:[{id:"keeper",name:"SE\xD1OR PE\xD1A",tx:7,ty:4,facing:"down",look:{build:"adult",hat:"none",hair:"short",torso:"camisa",legs:"calzoneras",skin:y(l,9),hairCol:y(l,2),cloth:y(l,11),cloth2:y(l,5)},lines:[{text:"Coffee, no. Sugar, no. Powder \u2014 [he looks at you properly for the first time] \u2014 how old are you?",aside:"The shelves behind him are handsome and mostly empty."},{text:"Everything on this side of the room came up the road from Copano. Nothing has come up it in nine days. You work out what that means, I have stopped enjoying it.",needs:"told-landing"}]}],props:[{id:"shelves",tx:3,ty:1,lines:[{text:"Good shelves, planed and pegged, with four things on them.",aside:"Somebody built these expecting a different decade."}]},{id:"counter",tx:7,ty:5,lines:[{text:"A counter worn pale in one strip, where nine years of elbows have gone."}]}]}),sr=pe({id:"jacal-n",name:"A jacal",build:"adobe",back:{to:"goliad",tx:6,ty:12},place:[[11,1,"H"],[3,3,"r"],[3,4,"r"],[3,5,"r"],[5,6,"e"]],props:[{id:"hides",tx:3,ty:4,lines:[{text:"Hides folded and stacked to the roof pole, and two counts chalked on the wall beside them.",aside:"The second count is lower than the first. Neither has been rubbed out, and there is chalk left on the ledge for a third."}]},{id:"beam",tx:5,ty:6,lines:[{text:"A tanning beam \u2014 a log worn hollow down the middle \u2014 and a knife with an edge on the bottom half only. The top half is for pushing.",aside:"The lime and the oak bark stay out at the yard. What gets done in this house gets done after dark, sitting down."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Cold, laid, and waiting. He left before it was light and he will want this going the moment he is back through the door."}]}]}),ar=pe({id:"jacal-w",name:"A jacal",build:"adobe",back:{to:"goliad",tx:4,ty:17},place:[[11,1,"H"],[4,3,"r"],[9,5,"t"]],light:{base:-4,sources:[{tx:Le.tx,ty:Le.ty,r:6,gain:6},{tx:4,ty:3,r:4,gain:5},{tx:3,ty:2,r:3,gain:2}]},props:[{id:"webs",tx:2,ty:1,lines:[{text:"Webs in the corner, roof pole down to the wall, with enough dust sitting on them to see them by.",aside:"Nobody has swept the threshold either. The dust in the doorway has bird tracks across it and nothing bigger."}]},{id:"loom",tx:4,ty:3,lines:[{text:"A loom with the warp still on it and about a hand\u2019s width woven. The shuttle is on the floor underneath, where it went.",aside:"The light in this room still falls across the work and not across the worker. Somebody arranged that years ago and it is still arranged."}]},{id:"table",tx:9,ty:5,lines:[{text:"Two bowls on the table, and a cup turned upside down on a cloth to drain. The cloth has dried into the shape of the cup.",aside:"None of it has been taken. In a town this short of everything, a whole house left standing full is a thing somebody decided."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Ash, and nothing under the ash. It has been rained on through the smoke hole until it went to a grey crust you could lift out in one piece.",aside:"The sickness came through in the summer of thirty-four. This is one of the houses nobody came back to."}]}]}),ir=pe({id:"jacal-s",name:"A jacal",build:"adobe",back:{to:"goliad",tx:5,ty:25},place:[[11,1,"H"],[5,5,"t"],[3,5,"e"],[3,6,"e"],[11,6,"e"]],props:[{id:"sewing",tx:5,ty:5,lines:[{text:"A table cleared for one piece of work and kept cleared for four months. Chalk, pins in a folded paper, and the shears laid across the middle of it.",aside:"What was on this table is on her daughter tonight. The offcuts are folded in a basket underneath and not one of them is bigger than a hand."}]},{id:"cots",tx:3,ty:5,lines:[{text:"Three cots. The end one has been made up flat since Thursday and slept in on none of the nights since.",aside:"Thursday is when the cooking started."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Swept out and banked low. Everything for tonight was cooked on the fire in the yard, because two hundred people will not fit in a house."}]}]}),Bn=[or,nr,sr,ar,ir],rr=pe({id:"mission-room",name:"Esp\xEDritu Santo",build:"stone",back:{to:"goliad",tx:7,ty:5},place:[[5,1,"B"],[4,5,"e"],[10,5,"e"],[11,2,"r"]],light:{base:-4,sources:[{tx:7,ty:8,r:7,gain:6},{tx:12,ty:2,r:5,gain:4},{tx:3,ty:1,r:4,gain:3}]},props:[{id:"tally-board",tx:5,ty:1,lines:[{text:"The board itself, hung on the north wall out of the weather. Tallies in columns, in three different hands, fifty years of them.",aside:"The last column is a count of cattle, and you read it twice, because the number does not look like a number of animals.",gives:"the mission herd",sets:"read-herd"},{text:"The tally board. Cattle, in columns, in three different hands, and every column adds up.",needs:"read-herd"}]},{id:"benches",tx:4,ty:5,lines:[{text:"Benches for a congregation, pushed back against the wall, and marks on the floor where a good many more of them used to stand.",aside:"The town is married and buried across the river now, in the fort. Nobody has taken these out, and nobody sits on them either."}]},{id:"east-end",tx:13,ty:2,lines:[{text:"The east end of the range is stone to about your shoulder and sky above that.",aside:"Five years since the mission was secularised, and this is what five years of nobody being responsible for a wall looks like."}]},{id:"racks",tx:11,ty:2,lines:[{text:"Racks along the wall, built to hold hides and wool, holding neither.",aside:"The herd was not sold and it did not die. It was divided up in 1830 and it went on being cattle for other people."}]}]}),hr={".":c.GRASS_A,",":c.DIRT,"=":c.DIRT_EDGE,"-":c.FENCE_H,"|":c.FENCE_V,1:c.FENCE_NW,2:c.FENCE_NE,3:c.FENCE_SW,4:c.FENCE_SE,"#":c.LOG,"^":c.LOG_ROOF,'"':c.LOG_EAVE,D:c.LOG_DOOR,d:c.DOORWAY,b:c.BILL_LOG,c:c.CORN,Y:c.TREE,C:c.CHIMNEY,o:c.WELL,R:c.ROCK},dr={id:"orchard",name:"The Davis place",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R.............................R",'R..""""".....................YR',"R..^^^^^....YY...YY...YY.....YR","RC.##d##....YY...YY...YY......R","R...........YY...YY...YY......R","R...........YY...YY...YY......R","R..o........,,...YY...YY......R","R...........,,...YY...YY......R",",,..........YY...YY...YY......R",",,..........YY...YY...YY......R","R.............................R","R..1--.----2..................R","R..|.......|.............ccc..R","R..|.......|.............ccc..R","R..3-------4.............ccc..R","R.............................R","R.............................R","RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"],legend:hr,ridable:!1,start:{tx:8,ty:6,facing:"down"},npcs:[{id:"father",name:"MY FATHER",tx:9,ty:13,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:y(l,9),hairCol:y(l,2),cloth:y(l,10),cloth2:y(l,5)},lines:[{text:"Up. Good. There are five soldiers in the square and the alcalde wants every man who can stand there to stand there.",aside:"Before that \u2014 there is a paper in my coat and I want to know what it says before I carry it in to Ponton. Take it out.",sets:"asked-to-read"},{text:"Read it out. Slowly, and all of it, and do not skip the part at the bottom because the bottom is where they put the thing they want you to miss.",aside:"[He does not look at the sheet while you read. He looks at you.]",needs:"asked-to-read",sets:"read-receipt",gives:"the receipt for the cannon",then:!0},{text:"Given back when it is called for. [He takes it out of your hand and folds it into four.] Well. They have called for it.",aside:"I never learned my letters. My father put me on a horse instead and I have never once been sorry until about a minute ago.",needs:"read-receipt",sets:"knows-receipt",then:!0},{text:"Go on into town, and take this to Ponton at his house. And keep your ears open in the square \u2014 I want to know what the corporal actually said, not what people say he said.",needs:"knows-receipt",sets:"errand-ponton"},{text:"The road is west. Ponton keeps the town\u2019s papers at his own table, and he will be at it.",needs:"errand-ponton"},{text:"You want to know where it is. [He looks at the trees.] Third row, between the second and the third tree, about as deep as a grave for a dog.",aside:"Myself, Jacob Darst and one other, and I will not tell you the third. We did not write it down. When you are old somebody will ask you and you will have to remember it right.",needs:"buried",sets:"told-burial",gives:"the cannon in the orchard"},{text:"Leave it in the ground and leave the rake alone. If a man rides in here and sees turned earth under a peach tree he does not need to be clever.",needs:"told-burial"}]},{id:"mother",name:"MY MOTHER",tx:4,ty:6,facing:"right",look:{build:"adult",hat:"rebozo",hair:"bun",torso:"rebozo",legs:"skirt",skin:y(l,10),hairCol:y(l,1),cloth:y(l,8),cloth2:y(l,4)},lines:[{text:"Five of them, they say, and one corporal, and they asked for it like men asking to borrow a saw.",aside:"Which it seems is what they think it is. Go on, your father is at the pen."},{text:"You read it to him? Good. He will not ask me and he will not ask the alcalde, and he will carry it forty years.",needs:"read-receipt",aside:"There is nothing wrong with a man who cannot read. There is something wrong with a town where only four of us can."},{text:"Go carefully in the square. And if there is shouting, you come home and you do not stop to watch it.",needs:"errand-ponton"}]}],triggers:[{tx:2,ty:9,unless:"errand-ponton",sets:"tried-early",text:"You get as far as the gap in the fence and stop.",aside:"He is standing right there with a paper in his coat and he has not told you what to do with it yet."}],exits:[{tx:5,ty:4,to:"davis-house",entry:{tx:5,ty:5,facing:"down"}},{tx:0,ty:9,to:"gonzales",entry:{tx:33,ty:10,facing:"left"},needs:"errand-ponton",passage:"walk-to-gonzales"},{tx:0,ty:10,to:"gonzales",entry:{tx:33,ty:10,facing:"left"},needs:"errand-ponton",passage:"walk-to-gonzales"}],props:[{id:"well",tx:3,ty:7,lines:[{text:"Sweet water, and the only reason anybody put a house on this particular half-mile."}]},{id:"wagon",tx:8,ty:13,lines:[{text:"The cotton wagon, up on blocks with both wheels off it and leaning on the rail. Man-high, iron-tyred, and heavier than they look.",aside:"Nothing is going anywhere on those until somebody greases the hubs, and nobody has."},{text:"The wagon is up on its blocks and the wheels are gone off the rail, and nobody in this house will tell you where they went.",needs:"buried"}]},{id:"peaches",tx:12,ty:7,lines:[{text:"Peach trees, in rows, four years in the ground and just about earning their room. The bare strip down the middle is where the cart goes at picking."},{text:"The strip between the second and third row has been turned over and raked flat, and then somebody has walked a horse up and down it.",aside:"You would have to know to look. You know to look.",needs:"buried"}]},{id:"cotton",tx:25,ty:13,lines:[{text:"Cotton, half-picked, and it will have to wait. Everybody who would be picking it is standing in the square."}]}]},lr={".":c.GRASS_A,",":c.DIRT,"=":c.DIRT_EDGE,"~":c.WATER,"#":c.LOG,"^":c.LOG_ROOF,'"':c.LOG_EAVE,N:c.NOTICE,C:c.CHIMNEY,d:c.DOORWAY,D:c.LOG_DOOR,Y:c.TREE,o:c.WELL,R:c.ROCK},Fn={id:"gonzales",name:"Gonzales",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R....~~~~....YY.......YY...........R","R....~~~~..................YY......R",'R....~~~~..""""".......""""".......R',"R....~~~~..^^^^^.......^^^^^.......R","R....~~~~.C##d##......C##d##.......R","R....~~~~..........................R","R....~~~~.......o..................R","R....~~~~..,,,,,,,,,,,,,,,,,,......R","R....~~~~N...,,,,,,,,,,,,,,,,,,....R","R....~~~~,,,,,,,,,,,N,,,,,,,,,,,,,,,","R....~~~~,,,,,,,,,,,,,,,,,,,,,,,,,,,","R....~~~~..,,,,,,,,,,,,,,,,,,......R","R....~~~~..,,,,,,,,,,,,,,,,,,......R","R....~~~~..........................R","R....~~~~..........................R",'R....~~~~..""""".......""""".......R',"R....~~~~..^^^^^.......^^^^^.......R","R....~~~~.C##d##......C##d##.......R","R....~~~~..........................R","R....~~~~....YY....................R","RRRRRRRRRRRRRRRRRR,,RRRRRRRRRRRRRRRR"],legend:lr,ridable:!1,start:{tx:33,ty:10,facing:"left"},pen:{needs:"dragoons",keep:[10,1,34,20],text:"Somebody has a hand on your collar before you are three steps down the bank. Not today. Not while they are standing over there counting us."},scenes:[{id:"the-asking",needs:"errand-ponton",unless:"saw-corporal",steps:[D(void 0,"There are more people in the square than you have ever seen in it, and all of them are looking the same way."),D("THE CORPORAL","I am instructed to receive one piece of ordnance held by this town and to carry it to B\xE9xar. I have the order here. I would like to speak to your alcalde."),D("A MAN IN THE CROWD","He is not here."),D("THE CORPORAL","[He waits.] Then I will wait for him.","He does not raise his voice. He has come forty miles to collect a gun and he has been told the one man he may speak to is out."),D(void 0,"Somebody behind you says that the alcalde is at his own table, two hundred yards away, and has been all morning. Nobody says it loudly."),ge("saw-corporal")]},{id:"the-far-bank",needs:"letter-sent",unless:"dragoons",steps:[D(void 0,"Somebody is ringing something that is not a bell, over and over, and the whole town is walking towards the river."),Nt("dragoon-a"),Nt("dragoon-b"),Nt("dragoon-c"),D(void 0,"On the far bank, across four rods of brown water, men are walking horses in a line and putting up tents in a field that had nothing in it yesterday."),D("SOMEBODY COUNTING","Ninety. Ninety-five. Call it a hundred, and every one of them a dragoon.","The river is up. There is not a boat on their side of it, and there will not be one, because ours are all pulled out and lying in the willows."),D(void 0,"Behind you, four men take the gun off its carriage and put it on a sledge, and walk it out of the square towards the east road without saying a word to anybody."),ge("dragoons"),ge("buried")]},{id:"the-crossing",needs:"eighteen",unless:"crossed",steps:[D(void 0,"It is dark, and there are a hundred and forty men in this square, and nobody from this town knows more than about thirty of them."),D("JOHN HENRY MOORE","They have moved. He has gone seven miles up the river looking for a place to cross, and he has camped on Ezekiel Williams\u2019s field."),D("EZEKIEL WILLIAMS","On my field."),D("JOHN HENRY MOORE","[He does not smile.] On your field. We are going over tonight, and we are taking the gun, and we are going to go and ask him what he wants."),D(void 0,"The cannon comes out of the dark on a pair of wheels you have seen before. They came off a cotton wagon this afternoon and the hubs are still black with new grease."),ge("crossed")]}],npcs:[{id:"corporal",name:"THE CORPORAL",tx:20,ty:12,facing:"up",absent:"letter-sent",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"rider",skin:y(l,8),hairCol:y(l,1),cloth:y(l,6),cloth2:y(l,3)},lines:[{text:"I have five men, an order, and a mule to carry it on. I did not bring a hundred because a hundred is not necessary to collect a gun that was lent.",aside:"That is what I said to your alcalde. He was very courteous about it."},{text:"He has written me an answer and I am to carry it back. [He looks at the paper without opening it.] I do not think the colonel is going to like the answer.",needs:"ponton-writing"}]},{id:"dickinson",name:"DICKINSON",tx:14,ty:12,facing:"right",look:{build:"adult",hat:"none",hair:"short",torso:"camisa",legs:"calzoneras",skin:y(l,10),hairCol:y(l,2),cloth:y(l,9),cloth2:y(l,5)},lines:[{text:"Nobody has fired that gun in four years and I am the only man here who has ever laid one. That is not a boast, it is a complaint.",aside:"It has been sat in the square with rain in the muzzle since I came to this town."},{text:"Well, now everybody wants it. [He is enjoying himself, which not many people in this square are.] Ask me again on Friday.",needs:"saw-corporal"},{text:"It is scoured, it is dry, and it is on a pair of cotton-wagon wheels. Whatever happens tomorrow, it will go off.",needs:"eighteen"}]},{id:"sowell",name:"SOWELL",tx:15,ty:19,facing:"down",look:{build:"adult",hat:"none",hair:"crop",torso:"apron",legs:"calzoneras",stance:"wide",skin:y(l,9),hairCol:y(l,1),cloth:y(l,7),cloth2:y(l,3)},lines:[{text:"I shoe horses and I mend wheels and I have not been asked to do either of those things since Tuesday.",aside:"What everybody wants off me this week is nails, and nobody will say what for."},{text:"Ponton wanted a list written out fair and nailed up where every man in this town could see his own name on it. I made the nails.",needs:"dragoons",sets:"told-muster",aside:"Eighteen names. Mine is on it, which I did not ask for and would not take off."},{text:"They have taken the wheels off a cotton wagon and brought them to me to have the tyres shrunk on. I have never in my life been asked to do that for a gun.",needs:"eighteen"}]},{id:"sarah",name:"SE\xD1ORA DeWITT",tx:27,ty:6,facing:"down",look:{build:"adult",hat:"rebozo",hair:"bun",torso:"rebozo",legs:"skirt",skin:y(l,11),hairCol:y(l,1),cloth:y(l,4),cloth2:y(l,8)},lines:[{text:"My husband laid this town out. He put the square where you are standing and he named the streets, and then he went to Monclova in the spring to get more land and he did not come back.",aside:"Go in, if you like. The door is not locked and there is nobody in there to mind."},{text:"They want the gun back. [She looks at the river for a while.] He asked them for that gun. He wrote and asked, and they sent it up, and now they want it, and he is not here to be asked about it.",needs:"saw-corporal"},{text:"There are women in this town cutting up cloth for something and they have not asked me for anything, which I notice.",aside:"And in fifty years they will all of them tell you it came out of my daughter\u2019s wedding dress. Some of them will believe it. One or two of them will have been in the room.",needs:"dragoons",sets:"told-cloth",gives:"the dress and the cotton",then:!0},{text:"I will not tell you it is true and I will not tell you it is a lie. I will tell you that Naomi was married in August and I know what I did with that dress, and that nobody has ever once asked me.",needs:"told-cloth"}]},{id:"williams",name:"WILLIAMS",tx:11,ty:10,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",skin:y(l,8),hairCol:y(l,2),cloth:y(l,10),cloth2:y(l,4)},lines:[{text:"The river is up and every boat on it is on this side, and that took four of us most of a night. If it goes down we have a different problem."},{text:"They cannot get over and we are not going over, so we all stand here and look at each other. That suits me. Every hour of it is another man riding in from Mina.",needs:"dragoons"},{text:"He has gone up the river. Seven miles, on my own field, in my own corn stubble, and he did not ask me because there was nobody there to ask.",aside:"I could walk you to it in the dark. I have walked it in the dark a hundred times, which is a thing worth being, this week.",needs:"eighteen",sets:"told-camp",gives:"the camp upriver"}]},{id:"dragoon-a",name:"A DRAGOON",distant:!0,tx:2,ty:9,facing:"right",needs:"dragoons",look:{build:"adult",hat:"shako",torso:"uniform",legs:"rider",skin:y(l,8),cloth:y(l,6),cloth2:y(l,3)},lines:[{text:"Too far to hear, and near enough to count."}]},{id:"dragoon-b",name:"A DRAGOON",distant:!0,tx:3,ty:11,facing:"right",needs:"dragoons",look:{build:"adult",hat:"shako",torso:"uniform",legs:"rider",skin:y(l,9),cloth:y(l,6),cloth2:y(l,3)},lines:[{text:"Too far to hear, and near enough to count."}]},{id:"dragoon-c",name:"A DRAGOON",distant:!0,tx:2,ty:13,facing:"right",needs:"dragoons",look:{build:"adult",hat:"shako",torso:"uniform",legs:"rider",skin:y(l,7),cloth:y(l,6),cloth2:y(l,3)},lines:[{text:"Too far to hear, and near enough to count."}]}],exits:[{tx:13,ty:5,to:"ponton-house",entry:{tx:13,ty:6,facing:"down"}},{tx:25,ty:5,to:"dewitt-house",entry:{tx:25,ty:6,facing:"down"}},{tx:13,ty:18,to:"sowell-shop",entry:{tx:13,ty:19,facing:"down"}},{tx:25,ty:18,to:"darst-house",entry:{tx:25,ty:19,facing:"down"}},{tx:35,ty:10,to:"orchard",entry:{tx:1,ty:9,facing:"right"}},{tx:35,ty:11,to:"orchard",entry:{tx:1,ty:10,facing:"right"}},{tx:18,ty:21,to:"williams",entry:{tx:15,ty:17,facing:"up"},needs:"crossed",passage:"the-crossing"},{tx:19,ty:21,to:"williams",entry:{tx:15,ty:17,facing:"up"},needs:"crossed",passage:"the-crossing"}],props:[{id:"the-post",tx:20,ty:10,lines:[{text:"The post in the middle of the square, with four old notices weathered onto it and one new one that is still white.",aside:"Somebody has nailed it up at the height of a man on a horse, which tells you who nailed it up."},{text:"You get it off the nail without tearing it. It is an order, in a clerk\u2019s hand, and it is shorter than you expected.",needs:"saw-corporal",sets:"read-order",gives:"the corporal asks"},{text:"The nail is still in the post and the corner of the paper is still on the nail.",needs:"read-order"}]},{id:"landing",tx:9,ty:9,lines:[{text:"The ferry landing, and no ferry. The cable is cut and coiled on this side and the flat is pulled up into the willows with water in the bottom of it."},{text:"A sheet of paper is nailed to the landing post, out in the weather, where a man on the far bank could see that there was one without being able to read it.",aside:"Which is, you understand, the point of nailing it there.",needs:"dragoons",sets:"read-muster",gives:"the eighteen at the ford",then:!0},{text:"Davis. Dickinson. Sowell. Williams. You have to stop and start again twice, because they are not names on a list, they are people whose kitchens you have been in.",needs:"read-muster",sets:"eighteen"},{text:"Eighteen names, in the rain, where a hundred men can see there is a paper and not what is on it.",needs:"eighteen"}]},{id:"well",tx:16,ty:7,lines:[{text:"The town well, and the reason the square is where it is rather than somewhere with a better view."}]},{id:"the-gun",tx:22,ty:11,lines:[{text:"The cannon. It is smaller than every story about it will be: a stubby bronze six-pounder on a rotten carriage, with a bird\u2019s nest in the muzzle.",aside:"It has sat here since you were eight. Nobody has ever fired it at anything."},{text:"The carriage is here and the gun is not on it, and there is a drag-mark across the square that somebody has swept and not swept well.",needs:"buried"},{text:"On a pair of cotton-wagon wheels, scoured down to the bronze, with Dickinson walking round it for the ninth time.",needs:"eighteen"}]}]};(Bs=Fn.scenes)!=null;const ur={".":c.GRASS_A,",":c.DIRT,"~":c.WATER,Y:c.TREE,R:c.ROCK},zn={id:"williams",name:"Williams's field",light:{base:-6,sources:[{tx:8,ty:7,r:6,gain:7},{tx:17,ty:6,r:6,gain:7},{tx:23,ty:9,r:5,gain:6}]},rows:["RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","R~~~~~~~~~~~~~~~~~~~~~~~~~~~~~R","R.............................R","R...YY..................YY....R","R.............................R","R.......,,,......,,,..........R","R.......,,,......,,,......,,..R","R.........................,,..R","R.............................R","R.............................R","R.....YY................YY....R","R.............................R","R.............................R","R.............................R","R.......YY..........YY........R","R.............................R","R.............................R","RRRRRRRRRRRRRRR,,RRRRRRRRRRRRRR"],legend:ur,ridable:!1,start:{tx:15,ty:17,facing:"up"},pen:{needs:"fought",keep:[1,3,29,17],text:"Somebody takes a fistful of your collar without looking at you and puts you back down behind the wheel. Not out there. Not now."},triggers:[{tx:15,ty:12,sets:"lost",text:"You have been walking for two hours and the man in front of you is a shape and then is not there.",aside:"You can hear a hundred and forty men within fifty yards of you and you cannot see one of them. Somewhere ahead there is a light."},{tx:15,ty:9,needs:"lost",unless:"fought",sets:"at-the-camp",text:"Close enough now to hear a horse shift its feet, and somebody on the other side of the fire says something and somebody else laughs.",aside:"They do not know you are here. Two hundred men are standing in a field in the dark and one of them is about to decide."}],scenes:[{id:"the-second",needs:"at-the-camp",unless:"fought",steps:[D(void 0,"Somewhere off to the right, a shot."),D(void 0,"Nobody ever finds out who fired it."),ge("fought"),$e(900),D("DICKINSON","Stand clear of the wheels!","The gun goes off and the fog goes white and then orange and then white, and you do not hear the rest of it for a while."),$e(2600),D(void 0,"It goes on like that, in the dark, for a length of time you could not afterwards put a number to. Then it begins to get light, and the fog starts to lift off the stubble in pieces, and both sides can see what they have been shooting at."),$e(1200),D(void 0,"A hundred men on that side. A hundred and forty on this one. One man on the ground over there and nobody moving to him, which tells you what that means."),ge("daylight")]},{id:"the-parley",needs:"daylight",unless:"parley",steps:[D(void 0,"A white rag on a ramrod, and the shooting stops, and two men walk out into the middle of a field that neither of them owns."),D("JOHN HENRY MOORE","Surrender the field, lieutenant, and go home."),D("CASTA\xD1EDA","I will tell you plainly. I am a federalist. I am for the constitution of 1824, the same as you say you are, and I have no quarrel with any man standing behind you."),D("CASTA\xD1EDA","And I have my orders, which are to recover a gun that belongs to the government of Mexico and to do it without compromising the honour of Mexican arms. You may read them if you like. They are not secret and they are not unreasonable."),Ct("the order out of bexar"),D("CASTA\xD1EDA","[He folds them back into his coat.] There are a hundred and forty of you. I am withdrawing. Whatever this becomes, it did not have to become it here."),ge("parley")]}],attack:{needs:"fought",fighters:[{tx:11,ty:13,toX:11,toY:10,side:"volunteer"},{tx:15,ty:13,toX:15,toY:10,side:"volunteer"},{tx:19,ty:13,toX:19,toY:10,side:"volunteer"},{tx:8,ty:14,toX:9,toY:11,side:"volunteer"},{tx:22,ty:14,toX:21,toY:11,side:"volunteer"},{tx:13,ty:15,toX:13,toY:12,side:"volunteer"},{tx:9,ty:6,toX:9,toY:8,side:"garrison",killed:!0},{tx:12,ty:6,toX:12,toY:8,side:"garrison"},{tx:17,ty:5,toX:17,toY:8,side:"garrison"},{tx:20,ty:6,toX:20,toY:8,side:"garrison"},{tx:23,ty:7,toX:22,toY:9,side:"garrison"}]},hunt:{needs:"armed",quarry:[{id:"shape-a",tx:9,ty:7,kind:"shape",said:"Something out there stops making noise for a moment, and then makes a different one."},{id:"shape-b",tx:12,ty:6,kind:"shape",said:"A shout, off to the left, in a voice you do not know, in a language you do."},{id:"shape-c",tx:15,ty:6,kind:"shape",said:"You hear it go into wood. A wagon, or a tree, or the stock of somebody else\u2019s piece."},{id:"shape-d",tx:18,ty:7,kind:"shape",said:"Nothing. No cry, no fall, no answer. You will be asked about this for the rest of your life and this is all you will have."},{id:"shape-e",tx:21,ty:8,kind:"shape",said:"A horse goes over somewhere ahead and keeps going, and a man swears at it, and that is all of it."}]},flashes:[{tx:10,ty:9,needs:"fought"},{tx:16,ty:8,needs:"fought"},{tx:21,ty:10,needs:"fought"},{tx:13,ty:7,needs:"fought"}],npcs:[{id:"moore",name:"MOORE",tx:14,ty:11,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:y(l,9),hairCol:y(l,2),cloth:y(l,7),cloth2:y(l,4)},lines:[{text:"Stay behind the wheel and stay down. You are here because your father is here and for no other reason I can think of."},{text:"One of theirs is dead. Some will tell you two, and I was standing in it and I saw one.",aside:"And on our side a man came off his horse in the dark and bloodied his nose, and that is the whole of it. Write that down somewhere, because nobody else is going to.",needs:"parley",sets:"told-shot",gives:"the first shot",then:!0},{text:"Go home. Tell Ponton what you saw, and tell him exactly what you saw and not one word more than that.",needs:"told-shot",sets:"go-back"},{text:"The road is behind you and it is light now. Go on.",needs:"go-back"}]},{id:"father-here",name:"MY FATHER",tx:16,ty:12,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:y(l,9),hairCol:y(l,2),cloth:y(l,10),cloth2:y(l,5)},lines:[{text:"I said you could come as far as the river. [He does not send you back. There is nowhere to send you back to, in this, at three in the morning.]",aside:"Here. It is loaded and it is primed and it is the one you have shot rabbits with. Keep it pointed at the ground until it is not.",sets:"armed",then:!0},{text:"One shot. That is what you have and that is what everybody out there has, and after it you are holding a stick for as long as it takes you to load it again.",aside:"So do not throw it away at a noise. Wait until you have got something, and be steady, and let your breath out.",needs:"armed"},{text:"You saw it and I did not read a word of it. So you are going to have to be the one who remembers it right.",needs:"parley"}]}],props:[{id:"the-fire",tx:17,ty:6,lines:[{text:"Their fire, with a pot still on it and nobody near it. Somebody was cooking twenty minutes ago and is now somewhere in the fog with a musket."}]}],exits:[{tx:15,ty:18,to:"gonzales",entry:{tx:18,ty:20,facing:"up"},needs:"go-back",passage:"back-to-gonzales"},{tx:16,ty:18,to:"gonzales",entry:{tx:18,ty:20,facing:"up"},needs:"go-back",passage:"back-to-gonzales"}]};(Fs=zn.scenes)!=null;const cr=pe({id:"davis-house",name:"The house",build:"log",back:{to:"orchard",tx:5,ty:5},place:[[11,1,"H"],[4,5,"t"],[4,6,"e"],[10,6,"e"],[3,1,"r"]],props:[{id:"hearth",tx:11,ty:1,lines:[{text:"Banked for the day. Whatever happens in the square, there will be supper."}]},{id:"table",tx:4,ty:5,lines:[{text:"Four bowls and a slate. The slate is yours, and it is the only one in this house, and everybody in this house is proud of it in a way nobody mentions.",aside:"There is a copied-out alphabet on the back of it in your mother\u2019s hand, from when she was teaching you, from when somebody taught her."}]},{id:"rack",tx:3,ty:1,lines:[{text:"Two muskets on the rack and a shot pouch hung off the end of it. Both of them are for deer and one of them is older than your father."},{text:"One musket. He has taken the other and he did not say anything about taking it.",needs:"dragoons"}]}]}),fr=pe({id:"ponton-house",name:"The alcalde's",build:"log",back:{to:"gonzales",tx:13,ty:6},place:[[11,1,"H"],[5,1,"b"],[7,4,"t"],[7,5,"e"],[3,2,"r"]],npcs:[{id:"ponton",name:"PONTON",tx:7,ty:3,facing:"down",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"ledger",skin:y(l,10),hairCol:y(l,2),cloth:y(l,5),cloth2:y(l,9)},lines:[{text:"I am the alcalde, which in this town means I keep the book, I marry people, and when five soldiers ride in I am the one who has to be out.",aside:"Sit down. Or stand. Whichever your father would rather I told him you did."},{text:"You read this to him. [He turns the receipt over twice.] Good. Then you know what it says, which puts you ahead of most of the men in that square.",aside:"It says the gun is ours to hold and theirs to call for. They have called for it. So I am now going to write them a letter.",needs:"errand-ponton",sets:"ponton-writing",then:!0},{text:"Watch what I do here, because you will want it one day. I am going to agree that the gun belongs to the government. I am going to say it was given in perpetuity for our defence. And then I am going to say that a demand of this size is a matter for the political chief.",aside:"And the political chief is at B\xE9xar, and I could not possibly say when he will be back. Every one of those sentences is true and every one of them is an hour.",needs:"ponton-writing",then:!0},{text:"While that letter is being carried to B\xE9xar, four men are riding to Mina and Columbus and Beason\u2019s. That is what the letter is for. It is not for changing anybody\u2019s mind.",aside:"[He blots it, folds it, and hands it to you to take out to the corporal.] Take your time crossing the square.",needs:"ponton-writing",sets:"letter-sent"},{text:"Now we find out how long an hour is worth.",needs:"letter-sent"},{text:"Eighteen names, and I want it nailed up where every man can see his own. Not because they will forget. Because in thirty years somebody will say it was forty men, or six, and there will be a paper.",needs:"dragoons"},{text:"Sit down and put everything you are carrying on this table. Face up. And add this one, which did not come into my hands for months and is dated two days after you were standing in that fog.",aside:"The lieutenant\u2019s own account of it, to his own colonel. It is the best paper anybody has about our fight and not one of us wrote it.",needs:"fought",sets:"strung",gives:"the lieutenant's report",opens:"gonzales"},{text:"Go home. Your mother has been standing at that window since Thursday and she has not once said so.",aside:"And keep that string. Somebody will want it one day, and they will not take your word for any of it.",needs:"strung",sets:"the-end"}]}],props:[{id:"fair-copy",tx:5,ty:1,lines:[{text:"A sheet pinned to the wall at eye height, in a careful hand, with two words crossed out and written again above.",aside:"He keeps the fair copy of everything he sends. That is most of what being the alcalde is."},{text:"You take it down and read it properly. It is four sentences long and it takes you a while, because three of them are doing something other than what they say.",needs:"ponton-writing",sets:"read-reply",gives:"the alcalde says no"},{text:"Back on its pin. He will want it when somebody asks him in ten years what exactly he said.",needs:"read-reply"}]},{id:"ledger",tx:7,ty:4,lines:[{text:"The town book, open, with a rule down the middle and the year at the head of the page. Marriages on the left and land on the right.",aside:"There is no priest in this town and no parish register. There is this, and there is whatever people write in their own Bibles."}]}]}),gr=pe({id:"dewitt-house",name:"The DeWitt house",build:"log",back:{to:"gonzales",tx:25,ty:6},place:[[11,1,"H"],[9,1,"b"],[4,4,"t"],[4,5,"e"],[3,2,"r"]],props:[{id:"monclova",tx:9,ty:1,lines:[{text:"A single sheet under glass in a frame that is much too good for it, hung where the light from the door falls on it in the afternoon.",aside:"It has been folded into eight and flattened out again, which is what a letter looks like after it has been carried four hundred miles in somebody\u2019s coat."},{text:"It is dated in May, at Monclova, and it is signed by a man who was there. It says what he died of and where they put him, and it is very short.",sets:"read-monclova",gives:"the empresario is dead"},{text:"The frame is worth more than the paper and the paper is the only thing in this house she would carry out of a fire.",needs:"read-monclova"}]},{id:"bible",tx:4,ty:4,lines:[{text:"A Bible on the table with a strip of ribbon in it, and the ribbon is not at a psalm. It is at the two blank pages in the middle where a family writes itself down.",aside:"Births on the left. Marriages under them. A hand you do not know, and then a hand you do."},{text:"The last line but one is a marriage, in August of this year: Naomi, daughter of Green and Sarah, to William Matthews. There is a month and there is no day, and underneath it there is nothing at all.",sets:"read-bible",gives:"the dewitt wedding"},{text:"You put the ribbon back where it was, because it is not your book.",needs:"read-bible"}]},{id:"cloth",tx:3,ty:2,lines:[{text:"A press with cloth folded in it, and a work basket on top with shears, thread and a paper of pins."},{text:"The shears are out and there is a length of plain white cotton over the arm of the chair, six feet o  Four days ago. Now put the ninth after it.","hatch-meeting":"On the sixth they were still forty men in somebody\u2019s front room in Matagorda, voting on who was in charge of them.","marriage-bond":"Tonight. I wrote it in the book myself, an hour before you came in, and both of them made their mark under it.",milam:"Nobody agrees on the day. I will put the man in the week and I will not put him in a day, and you should not either.","roll-bahia":"Somebody counted. That is the entire reason we are able to say three, instead of saying many and meaning nothing.",compact:"The ninth, like everything else tonight. Forty-nine names on it, and a good few of those names are marks.","bexar-cut":"The same day and the same event, looked at from the far end of the road. B\xE9xar will work out what happened when the wagons stop.",telegraph:"That one is dated tomorrow and printed two hundred miles from here, and no honest man in this room can produce it.","cannon-receipt":"Four years before any of the rest of it, and everything after it is about this one sheet. Somebody signed for that gun. Hang it at the head and leave a great deal of string underneath.","dewitt-dead":"May. He died at Monclova chasing more land and we did not hear for weeks. That is why you are standing in front of me and not in front of him.","dewitt-marriage":"August, and the month is all it gives me. There was a wedding, it is written down, and I will put it in August and claim nothing about the day.","corporal-demand":"The twenty-fifth. A corporal and five men, forty miles, for one gun. I stood in the square and watched them ask.","ponton-reply":"The twenty-sixth. I wrote that one, at this table, and I was slow about it on purpose. Every hour it took was an hour a rider was on the road.","castaneda-order":"The twenty-seventh. A hundred dragoons for the same gun the corporal asked for politely two days before. Look at what is on either side of it.","old-eighteen":"The twenty-ninth. Eighteen names, and two of them you have shaken hands with. A muster is the only kind of paper that can prove a crowd.","orchard-burial":"The same day, and I cannot do better than the same day. Nobody writes a receipt for burying a gun in an orchard. Three men remembered it afterwards, and that is the whole of my evidence.","williams-camp":"The first of October. He could not cross in front of us, so he went up the river to a place he could, and camped on a man\u2019s own field without asking him.","first-shot":"The second. Before daylight, in fog thick enough to lose a hundred men in, which they did. That is the shot everyone will be talking about in a hundred years.","castaneda-report":"And this is the strangest thing on the table. The men who won wrote almost nothing down. The man who withdrew filed twice, on the second and again on the fourth, and his is the best paper we have about our own fight."},Bt={goliad:{name:"EL PADRE",opening:["[He sweeps the table clear with his forearm and lays the string down the middle of it.] Everything you have got. Face up, so I can read them.","I keep the register for this parish. Baptisms, marriages, burials. Every line in it has a day written beside it, and that day is the entire reason the book is worth keeping.","So. One at a time, and you tell me where on the string it belongs. Earliest at the top. If you put one in the wrong place I will move it, and I will tell you how I knew."],closing:["Now look at your string. The general was standing in this fort on the first. On the fifth he walked out of that gate with the best companies he had. On the ninth, some men from Matagorda walked in.","Nobody wrote that down. Not one paper on this string says it. You put them in a line and the line said it.","And there is not a newspaper anywhere in it. There is no newspaper in Texas. The nearest press is at Brazoria, it comes out on Saturdays, and it has not heard of any of us.","So this is what a week is made of before anybody prints it. A circular somebody copied out by hand. A bill for cloth. My book. And a man on a horse."],undated:["These I cannot hang anywhere.","Everybody was there. Everybody remembers it. Not one of them wrote down which night, so it does not go on the string with the others.","Understand me \u2014 that is not the same as it being untrue. It is worse than untrue. It means nobody can ever check."],empty:["You have brought me nothing with a date on it.","Go and look again. Anything anybody wrote down has a day on it somewhere, and the ones that do not are the ones you must be most careful with."]},gonzales:{name:"PONTON",opening:["[He sweeps the table clear with his forearm and lays a length of string down the middle of it.] Everything you have. Face up, where I can read them.","I am the alcalde of this town. I keep its papers \u2014 and four days ago I wrote one of the ones you are holding. A date at the head of a letter is not decoration. It is the whole of how anybody proves later what was known, and when it was known.","So. One at a time, and you tell me where on the string it goes. Earliest at the top. Put one in the wrong place and I will move it, and I will tell you which two dates told me to."],closing:["Now read your own string back, from the top. In 1831 this town asked for a gun, and a man signed a paper saying we would give it back when it was called for.","On the twenty-fifth they came and called for it. On the twenty-sixth I wrote out that they could not have it, and I took my time over it. On the twenty-seventh a hundred dragoons rode out of B\xE9xar. On the second we shot at them.","Nothing on that string says we were in the right, and nothing on it says we were in the wrong. It says we were asked for a thing we had promised to return, and we said no, and here is what that cost. You may make of it what you please. But you will make it out of that.","And now I will tell you what is not on your string."],undated:["These two I cannot hang anywhere at all.","A flag. White cotton, a cannon painted on it black, one star and four words. Ask anybody in this town and they will tell you it flew over the gun. Ask them which day it was made, and watch what happens to their face.","I have the lieutenant\u2019s own written report of the fight in front of me and he does not mention a flag. Nor does anything else anybody wrote at the time. The first man to set down what it looked like did it sixty-five years afterwards, in his nineties, out of his memory.","Understand me. I am not telling you it was not there. I am telling you that nobody can ever check, and those are not the same thing, and the second one is worse."],empty:["You have brought me nothing with a date on it.","Go and look again, then. This town is four days from a war and every man in it is writing something down. Find me the ones that say when."]}};Object.values(Bt).flatMap(o=>[o.name,...o.opening,...o.closing,...o.undated,...o.empty]);const ie={x:6,y:22,w:R-12,h:64},To=ie.y+4,Tr=5,_n=G+2,Ye=5,Z={x:4,y:102,w:R-8,h:F-102-4},Kn=20,Er=ie.w-Kn-14;class vr{constructor(t,e="goliad"){p(this,"file");p(this,"closed",!1);p(this,"box",new un);p(this,"phase","open");p(this,"at",0);p(this,"scroll",0);p(this,"step",0);p(this,"justAt",-1);p(this,"justHeld",!0);p(this,"reading",null);p(this,"readAt",-1);p(this,"moved",0);p(this,"filer");var n;this.file=new Rr(t,e),this.filer=(n=Bt[e])!=null?n:Bt.goliad,this.say(this.filer.opening[0])}get showing(){return this.phase}get spine(){return this.file.spine.map(t=>t.title)}get gap(){return this.at}say(t,e){this.box.set(t,e,nt(Z.w),Z.h)}get slid(){return this.moved}get open(){var t,e;return(e=(t=this.reading)==null?void 0:t.sheet.head)!=null?e:null}readable(){const t=this.file.holding;return[...t?[t]:[],...this.file.spine]}openSheet(t,e){const n=this.readable();n.length&&(this.readAt=(t%n.length+n.length)%n.length,this.reading=new po(n[this.readAt],e,!1))}update(t,e){if(this.reading){const n=(t.pressed("right")?1:0)-(t.pressed("left")?1:0);if(n!==0){this.openSheet(this.readAt <script>
  // Did it actually draw? Screen is the only thing that ever writes an inline
  // width onto the canvas, so that is the honest signal. Reading canvas.width
  // instead would call a legitimate 1x scale a failure, since 240 is smaller
  // than the 300 an untouched canvas starts at.
  (function () {
    var boot = document.getElementById('tj-boot');
    var hint = document.getElementById('tj-hint');
    requestAnimationFrame(function () {
      var c = document.getElementById('screen');
      // Drawn is not the same as VISIBLE. A canvas can be correctly sized and
      // still be clipped to nothing by a container that collapsed - which is
      // what a case with a black screen in it actually is - and that reads to
      // a player as "the game is broken" with nothing to report but the
      // colour. So measure what is really on screen, and say so if it is
      // nothing.
      var box = c ? c.getBoundingClientRect() : null;

        if (boot) boot.hidden = true;

        // up they always are, so there is nothing to point at and saying so
        // would just be a line of text over somebody's game.
        var cased = !!document.querySelector('.tj-shell');

        );
      }
    });

    // answer. Not "is the canvas there and the right size" - it was, on the
    // phone this was written for - but "is there anything ON it". A canvas
    // can be present, correctly sized, visible and uniformly black, and that
    // state is indistinguishable from a broken game by looking at it. So

      // Never accuse a hidden page. A browser pauses requestAnimationFrame

      // perfectly healthy has drawn nothing and every symptom this looks for

          'window: ' + window.innerWidth + 'x' + window.innerHeight + ' dpr ' + (window.devicePixelRatio || 1),
