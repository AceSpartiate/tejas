<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Tejas - Goliad and Presidio La Bahia, 2 to 9 October 1835. A Grade 7 Texas history game." />
<title>Tejas</title>
</head>
<body>
<meta charset="utf-8" />
<title>Tejas</title>

<script>
  // The viewport, set from script because this is published as a body
  // fragment and a <meta> parsed inside the body is ignored. Without it a
  // phone lays the game out in a 980px pretend-desktop and shrinks the whole
  // thing to a postage stamp. Written onto the host's own tag if it has one.
  (function () {
    try {
      var m = document.querySelector('meta[name="viewport"]');
      if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
      m.setAttribute('content',
        'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
    } catch (e) { /* a wrapper with no head is still a page the game can run in */ }
  })();
</script>

<style>
  /* One visual world on purpose: a handheld screen in a dark room. The ground
     is the game's own letterbox void. No theme blocks - a Game Boy does not
     have a light mode - but every colour is painted rather than inherited, so
     the page holds on whatever ground the host puts behind it. */
  html, body { margin: 0; padding: 0; background: #131110; }
  /* Fixed, not 100% tall. A percentage height needs an unbroken chain up to
     the root, and this page is a guest in a document it did not write. */
  /* Longhand offsets, not the inset shorthand: the shorthand is iOS 14.5+ and a stage
     that does not resolve a size is a page with nothing on it. */
  #tj-stage {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; align-items: center;
    justify-content: center; background: #131110; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* max-width defends the integer scale: a host reset that caps media at 100%
     would quietly resample the one thing in this project that may never be
     resampled. */
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    max-width: none !important; max-height: none !important;
  }
  /* Thumb controls are present but unseen until a finger arrives, so on a
     phone the first screen is a game with no visible way to play it. */
  #tj-hint {
    position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; z-index: 20;
    animation: tj-breathe 2.6s ease-in-out infinite;
  }
  [hidden] { display: none !important; }
  @keyframes tj-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #tj-hint { animation: none; opacity: 0.8; } }
  /* The boot notice. Plain HTML, on screen before a line of script runs, and
     taken away by the first frame that actually draws. If the game cannot
     start there is now something to read instead of a black rectangle -
     which is the whole difference between a bug report and a diagnosis. */
  #tj-boot {
    position: fixed; left: 16px; right: 16px; bottom: 50%; transform: translateY(50%);
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    z-index: 30; white-space: pre-wrap; word-break: break-word;
  }
  #tj-boot b { color: #b8463c; font-weight: 700; }
</style>

<div id="tj-stage">
  <canvas id="screen"></canvas>
</div>
<p id="tj-hint" hidden>Touch the screen for controls</p>
<p id="tj-boot">Loading Tejas...</p>

<script>
  // Registered before the game so it catches a parse error in it too.
  (function () {
    var boot = document.getElementById('tj-boot');
    var first = null;
    window.__tjFail = function (what) {
      if (!boot) return;
      // KEEP THE FIRST ONE. The later reports are consequences: the vitals
      // sweep runs on a timer and would cheerfully paint over the exception
      // that caused everything it is describing. Overwriting the first error
      // with a summary of its aftermath cost a whole debugging round.
      if (first !== null) return;
      first = String(what);
      boot.hidden = false;
      boot.innerHTML = '<b>Tejas is not drawing.</b>\n\n' + String(what);
    };
    window.addEventListener('error', function (e) {
      window.__tjFail((e && e.message) || 'unknown error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__tjFail((e && e.reason && e.reason.message) || 'unhandled rejection');
    });
  })();
</script>

/* The body. Two-tone, because a single flat slab reads as a div with a
   border-radius; the seam is what says "moulded in two halves". */
.tj-body { position: relative; width: 100%; height: 100%;
  max-width: 100%; max-height: 100%; min-width: 0; min-height: 0; display: flex;
  background: linear-gradient(${l[4]} 0 58%, ${l[3]} 58% 100%);
  border: 1px solid ${l[5]}; box-shadow: inset 0 1px 0 ${l[6]}, inset 0 -2px 6px ${l[1]}; }
.tj-shell[data-chassis="gbc"] .tj-body { flex-direction: column; align-items: center;
  border-radius: 18px 18px 42px 18px; padding: 14px 12px 12px; gap: 10px; }
.tj-shell[data-chassis="gba"] .tj-body { flex-direction: row; align-items: center;
  justify-content: space-between; border-radius: 78px / 46px; padding: 10px 22px; gap: 10px; }

/* The screen well: the void, inset, with the LCD centred in it. A real
   handheld has far more bezel than panel and the integer-scale rule produces
   exactly that on its own \u2014 whatever is left over after the largest whole
   multiple that fits is bezel, which is why this is dark rather than clever. */
.tj-well { background: ${l[0]}; display: grid; place-items: center;
  border: 2px solid ${l[2]}; box-shadow: inset 0 2px 8px #000; overflow: hidden;
  min-width: 0; min-height: 0; }
/* The well has a SHAPE, not "whatever height is going spare". Given the spare
   height on a modern phone it took all of it, and a 3:2 panel adrift in a well
   half again as tall reads as a game lost in a black column rather than as a
   screen set into plastic. */
/* No aspect-ratio here, deliberately. It is iOS 15+, and where it does not
   resolve the well has NO HEIGHT - and overflow:hidden then clips the game
   to nothing, which is a beautifully moulded case with a black screen in it.
   Flex alone always yields a real box; the proportion is applied afterwards
   as a max-height in px, which every browser has always understood and which
   can only ever make the well smaller, never zero. */
.tj-shell[data-chassis="gbc"] .tj-well { width: 100%; flex: 1 1 auto; min-height: 0;
  border-radius: 10px 10px 4px 4px; }
/* WIDTH 100%, and it is the whole of why the wide body had a tiny screen.
   flex 1-1-auto in a COLUMN governs height; across the column axis the well
   was shrink-to-fit, so it took the width of its only child \u2014 the canvas \u2014
   and Screen then measured the well to size that canvas. Each one asked the
   other and neither ever grew: a 542px column with a 244px screen in it,
   stuck at the floor scale no matter how big the phone was. */
.tj-shell[data-chassis="gba"] .tj-well { width: 100%; flex: 1 1 auto; min-height: 0;
  min-width: 0; border-radius: 8px; }
.tj-well > canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* Moulding: things that are shaped but not pressable. The wordmark, the
   speaker slots, the power lamp. They are what makes the silhouette read,
   and none of them is styled like a button, because a control that does
   nothing is worse than no control. */
.tj-mark { font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.22em; color: ${l[9]}; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.tj-lamp { width: 6px; height: 6px; border-radius: 50%; background: ${de};
  box-shadow: 0 0 5px ${de}; flex: 0 0 auto; }

/* Controls. Raised, coloured, and the only things here that move. */
.tj-deck { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 1 1 auto; min-width: 0; }
.tj-shell[data-chassis="gbc"] .tj-deck { padding: 0 2px; gap: 8px; }

/* Moulding under the screen: the wordmark left, the speaker right, the way
   the row of print under a handheld's panel actually sits. */
.tj-strip { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 0 0 auto; padding: 0 4px; gap: 10px; }

/* Sideways, the body is three columns: a hand, the screen, the other hand.
   Nothing but the well is in the middle column \u2014 a printed strip under the
   panel there is a row of moulding charging the screen its own height, on the
   one axis a wide body has none to spare. Sideways the print goes beside the
   hands, which is where a wide machine actually carries it. */
.tj-side { display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; flex: 0 0 auto; }
.tj-centre { display: flex; flex-direction: column; align-items: center;
  justify-content: center; flex: 1 1 auto; min-width: 0; height: 100%; }

/* The cross: four arms that are four switches. It was one hit area reading an
   angle from the centre, with a hub that slid toward the thumb, which is a
   joystick wearing a plus-shaped hat and read as one immediately. An arm
   lights when it is the one being pressed, and nothing on it ever slides. */
.tj-cross { position: relative; flex: 0 0 auto; touch-action: none; }
.tj-arm { position: absolute; background: ${l[2]}; border: 1px solid ${l[4]};
  pointer-events: none; transition: background 50ms linear; }
.tj-arm.on { background: ${l[5]}; }
.tj-up { left: 34%; right: 34%; top: 2%; height: 34%; border-radius: 5px 5px 0 0; border-bottom: 0; }
.tj-down { left: 34%; right: 34%; bottom: 2%; height: 34%; border-radius: 0 0 5px 5px; border-top: 0; }
.tj-left { top: 34%; bottom: 34%; left: 2%; width: 34%; border-radius: 5px 0 0 5px; border-right: 0; }
.tj-right { top: 34%; bottom: 34%; right: 2%; width: 34%; border-radius: 0 5px 5px 0; border-left: 0; }
/* The hub is moulding: it joins the arms and it never moves. */
.tj-hub { position: absolute; left: 34%; top: 34%; width: 32%; height: 32%;
  background: ${l[2]}; border-top: 1px solid ${l[4]}; border-bottom: 1px solid ${l[4]};
  pointer-events: none; }
.tj-hub::after { content: ""; position: absolute; left: 30%; top: 30%; width: 40%; height: 40%;
  border-radius: 50%; background: ${l[3]}; }

.tj-face { position: relative; flex: 0 0 auto; }
.tj-btn { position: absolute; border-radius: 50%; display: grid; place-items: center;
  font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: ${l[13]}; touch-action: none;

.tj-btn.on { transform: translateY(2px); box-shadow: 0 0 0 ${l[1]}; }
.tj-a { background: ${de}; border: 1px solid ${l[10]}; }
.tj-b { background: ${l[6]}; border: 1px solid ${l[8]}; }

/* Start and Select, and there are TWO of them, because that is how many a
   Game Boy has. A third pill in this row was read on sight as a machine that
   is not the one it is drawn as \u2014 "there should only be a start and select
   button" was the first thing a player said about it. Each is printed with
   its name the way the real ones are, so the row states its own count. */
.tj-pills { display: flex; align-items: flex-start; gap: 12px; flex: 0 0 auto; }
.tj-pill-set { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tj-pill { position: relative; width: 34px; height: 8px; border-radius: 4px;
  background: ${l[2]}; border: 1px solid ${l[4]}; transform: rotate(-20deg);
  cursor: pointer; touch-action: none; }
/* A pill is 8px tall and a thumb is not. The moulding stays the size it is
   printed and the hit area is grown underneath it \u2014 the gap between the two
   is 12px, so the two zones never meet. */
.tj-pill::after { content: ""; position: absolute; inset: -11px -5px; }
.tj-pill-label { font: 600 7px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.14em; color: ${l[8]}; text-transform: uppercase;
  pointer-events: none; }
.tj-shell[data-chassis="gba"] .tj-pill { transform: none; width: 30px; }
/* Pressed. The rotation is part of the moulding rather than of the press, so
   it has to be restated per chassis \u2014 a bare translate here would stand the
   GBC's pills up straight the moment a thumb landed on one. */
.tj-pill.on { background: ${l[8]}; border-color: ${l[10]}; }
.tj-shell[data-chassis="gbc"] .tj-pill.on { transform: rotate(-20deg) translateY(2px); }
.tj-shell[data-chassis="gba"] .tj-pill.on { transform: translateY(2px); }

/* The way to the pause menu, on the TOP EDGE \u2014 which is where a handheld puts
   a control that is not one of the six. A phone has no Escape key and the menu
   behind it holds the only route to the settings, the keybinds and the way
   back to the title, so it cannot simply be deleted; what it can stop doing is
   standing in the Start/Select row pretending to be a third pill. Sideways it
   is the right shoulder, which that machine really has. Upright it is the
   switch on the top edge, which that one really has too. Top right either way,
   the same corner the world prints ESC MENU in. */
.tj-edge { position: absolute; top: 0; display: grid; place-items: center;
  background: ${l[2]}; border: 1px solid ${l[4]}; border-top: 0;
  color: ${l[9]}; font: 700 7px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.16em; cursor: pointer; touch-action: none; }
/* The hit area grows sideways and UPWARD, into the shell's own padding, where
   there is nothing to hit by accident. Downward is where the screen is. */
.tj-edge::after { content: ""; position: absolute; inset: -7px -10px -2px; }
.tj-edge.on { background: ${l[8]}; border-color: ${l[10]}; color: ${l[13]}; }
.tj-shell[data-chassis="gbc"] .tj-edge { right: 16px; width: 48px; height: 12px;
  border-radius: 0 0 6px 6px; }
.tj-shell[data-chassis="gba"] .tj-edge { right: 30px; width: 72px; height: 14px;
  border-radius: 0 0 12px 12px; }

/* Speaker: slots, not a grid of dots \u2014 cheaper to read at this size. */
.tj-speaker { display: flex; gap: 3px; flex: 0 0 auto; transform: rotate(-20deg); }
.tj-slot { width: 3px; height: 20px; border-radius: 2px; background: ${l[2]};

.tj-shell[data-chassis="gba"] .tj-speaker { transform: none; }

...........","...............####..###..###.####......................",".............#####....##.#.#...##.......................",".......#########......###...#.###.......................",".......#######.........####.####........................",".......#######..........#######.........................","########################################################","::::::::::::::::::::::::::::::::::::::::::::::::::::::::","::::::::::::::::::::::::::::::::::::::::::::::::::::::::"]};function Ti(o,t,e,n,s=m.outline){const a=xi[t];o.fillStyle=s;for(let i=0;i<go;i++){const d=a[i];for(let w=0;w<fo;w++){const f=d[w];if(f===".")continue;const u=e+w*be,b=n+i*be;if(f==="#"){o.fillRect(u,b,be,be);continue}for(let v=0;v<be;v++)for(let O=0;O<be;O++)u+O+b+v&1||o.fillRect(u+O,b+v,1,1)}}}const Ei={"word-tejas":{head:"THE NAME OF THE COUNTRY",cut:"NOTICE",body:["East of here live the Caddo. When the first Spanish parties reached them they were greeted with a word of their own \u2014 t\xE1ysha, meaning friends, or allies.","The Spaniards wrote the word down and used it for the whole province. For a hundred and fifty years this country has been called friends, and almost nobody who says it knows that."]},"colony-line":{head:"GRANT: THE COAST BETWEEN THE RIVERS",cut:"CART",body:["By the colonisation law of 1825 the state of Coahuila y Tejas contracts with empresarios, who bring in families and are paid in land. James Power and James Hewetson hold the coast.","On 12 April 1829 their grant is extended from the Guadalupe to the Nueces \u2014 which draws a line straight through country that Goliad families had been ranching for two generations.","Goliad lies outside their colony. Its people say their title is older. Both sides have paper, and the paper does not agree."]},"espiritu-herd":{head:"TALLY: THE MISSION HERD",cut:"CART",body:["Mission Esp\xEDritu Santo was moved to the north bank of this river in 1749, and the presidio to the south bank, one facing the other. That is the pair this town grew between.","It was a ranching mission. By 1788 the tallies run past fifteen thousand head of cattle, with horses, mules and sheep besides, and corn, cotton, melons and peaches in the fields.","That herd is why there is a hide yard here, and a carter, and a road worth forty miles of anybody's attention. The mission was secularised in 1830 and the cattle went on without it."]},"mark-signature":{head:"A MARK, IN PLACE OF A NAME",cut:"NOTICE",body:["On the civil registers of this province a man who cannot write draws his mark \u2014 a cross, or the brand he burns on his cattle \u2014 and two witnesses sign beside it.","The register takes it, and the law takes it. A man who cannot read a word of what he is agreeing to has still signed it, and can still be held to it."]},seamstress:{head:"ACCOUNT: SIX YARDS OF SILK",cut:"CART",body:["Bought in June. Cut, sewn over four months, and worn. The woman who made the dress kept the account for the cloth and can produce it.","She is answering a story that the dress was cut up to make a flag. It was not. Her paper is dated; the story is not, and that is the whole of the difference."]},circular:{head:"CIRCULAR \u2014 COMMITTEE OF SAFETY",cut:"NOTICE",body:["San Felipe de Austin, 19 September 1835. Issued by the Committee of Safety over the hand of Stephen F. Austin.","It warns that General Cos is coming into Texas with troops, and calls on every district to organise its militia.","At the foot it asks that whoever receives it copy it out and pass it on, and read it aloud to those who cannot read. There is no newspaper. This is how news travels."]},"copano-landing":{head:"FIVE HUNDRED MEN, AT COPANO",cut:"SHIP",body:["About the twentieth of September, General Mart\xEDn Perfecto de Cos came ashore at the port of Copano with something near five hundred soldiers.","It took days to put them all on the beach. From Copano there is one road inland, and it runs up through Goliad to B\xE9xar."]},"copano-road":{head:"THE ROAD FROM THE WATER",cut:"CART",body:["Forty miles from the port of Copano to this town, and on from here to B\xE9xar. Coffee, powder, cloth, iron \u2014 everything that reaches the interior comes up it.","There is no other road. Whoever holds Goliad holds what B\xE9xar eats, and that is why this small town has a fort in it and Victoria does not."]},"cos-here":{head:"THE GENERAL, AT LA BAH\xCDA",cut:"PRESIDIO",body:["On the first of October General Cos reached Goliad with the Morelos battalion and quartered in the presidio of La Bah\xEDa.","He is the brother-in-law of Santa Anna and he has come to put down the disturbances in Texas. For four days the highest authority in the province slept inside these walls."]},"rider-gonzales":{head:"REPORT FROM GONZALES",cut:"RIDER",body:["Carried by an express rider, and written down by nobody at the time. He gave it at a gallop and did not stop.","That the soldiers came to Gonzales for the little cannon the town was lent. That the town would not give it back. That there was firing on the second of October, and the soldiers went away again.","Nothing here is confirmed. It is one man\u2019s account of a thing that happened seventy miles off, and it is the only account anybody in this town has."]},"cos-gone":{head:"THE GARRISON MARCHES FOR B\xC9XAR",cut:"COLUMN",body:["On the fifth of October General Cos left Goliad for B\xE9xar with his honour guard and the Morelos battalion. He marched unmolested and arrived without a shot.","Word of the affair at Gonzales had reached him. What he left behind in the presidio was a holding garrison of some fifty men, in a work built for far more."]},"hatch-meeting":{head:"RESOLVED, AT MATAGORDA",cut:"HEARTH",body:["On the sixth of October some forty men of the Matagorda militia met at the house of Sylvanus Hatch.","Their first act was to elect a captain, and they elected George Collinsworth. Three days later there were near a hundred and twenty of them and they were on the Goliad road."]},"marriage-bond":{head:"ENTERED IN THE PARISH BOOK",cut:"HEARTH",body:["Nuestra Se\xF1ora de Loreto, at the presidio of La Bah\xEDa. Both names, both marks, two witnesses, and the day.","Away up the Brazos there is one priest for a country the size of Spain, so a couple sign a bond before their neighbours and live married until somebody like this one rides through. Both are documents. Only one of them is in a book."]},milam:{head:"A MAN LATELY OUT OF MONTERREY",cut:"RIDER",body:["Benjamin Milam, taken and held at Monterrey, is reported to have got out and come north until he fell in with men going the same way.","The accounts do not agree on the day he reached the Goliad party, and no paper anywhere gives one. That he is with them is not in doubt. When he arrived is."]},"roll-bahia":{head:"RETURN OF KILLED AND WOUNDED",cut:"PRESIDIO",body:["Presidio La Bah\xEDa, 9-10 October 1835. Of the garrison under Lieutenant Colonel Sandoval: three killed, seven wounded, twenty-one taken.","Of the volunteers: several wounded, none killed. Somebody counted, before the sun was up, and wrote the numbers on a page \u2014 which is the only reason anyone can say three instead of saying many."]},compact:{head:"COMPACT OF VOLUNTEERS",cut:"NOTICE",body:["Goliad, 9 October 1835. Signed by forty-nine of the men who took the presidio, under Captain George Collinsworth.","They declare themselves for the federal government of Mexico and against military rule, and undertake to do no harm to any person who remains loyal to it.","A good number of the forty-nine signed with a mark."]},"bexar-cut":{head:"NOTHING COMES UP THE ROAD",cut:"CART",body:["With Goliad taken, the road from Copano to B\xE9xar is shut, and the supplies and correspondence for the general\u2019s command stop with it.","Men may argue about who was right at Gonzales for a hundred years. Nobody can argue about the wagons. They are not arriving, and the date they stopped is on paper."]},telegraph:{head:"TELEGRAPH AND TEXAS REGISTER",cut:"PRESS",body:["Vol. 1, No. 1. San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens \u2014 Gail Borden Jr., Thomas H. Borden and Joseph Baker.","The first newspaper Texas manages to keep. It went to press the morning after the presidio fell, two hundred miles from it, and there is not one word of that night in it.","Everything this book holds was gathered in the week before this sheet existed."]},fandango:{head:"THE FANDANGO",cut:"HEARTH",body:["They danced until the candles went out. Everybody in this town will tell you so, and every one of them was there.","Not one of them wrote down which night. There is no bill, no register, no letter, and no date \u2014 so it cannot be set beside anything that has one.","That is not the same as saying it did not happen. It is worse than that. It means nobody, ever, can check."]},"cannon-receipt":{head:"RECEIVED: ONE PIECE OF ORDNANCE",cut:"CANNON",body:["In January 1831 Green DeWitt asked the authorities at B\xE9xar for a cannon. The colony had been attacked twice, the town had been abandoned once already, and it had nothing to answer a raid with.","The gun came up in March, and James Tumlinson, Jr., took delivery of it for the town. It was small \u2014 a six-pounder, Spanish, old. The condition was written down: it belonged to the government, and it would go back when the government called for it.","Nobody thought about that sentence again for four years."]},"dewitt-dead":{head:"DIED AT MONCLOVA",cut:"NOTICE",body:["Green DeWitt, who contracted in 1825 to settle four hundred families on the Guadalupe and who gave this colony its name, died at Monclova on 18 May 1835. Cholera, they say. He was buried in a grave with nothing on it.","He had gone down there to get more land. The colony heard weeks afterwards.","What that means in practice is that when the soldiers come for the cannon in September there is no empresario to send them to. There is an alcalde, elected, and there is a town meeting, and that is the whole of the government here."]},"dewitt-marriage":{head:"MARRIED, AT GONZALES",cut:"HEARTH",body:["In August 1835, at Gonzales, Naomi DeWitt \u2014 daughter of the late empresario and of Sarah Seely DeWitt \u2014 was married to William Matthews.","The month is recorded. The day is not, which is ordinary: this town has no priest and no parish book, and a wedding in a colony like this one is written into a family Bible or into nothing at all.","Six weeks later people will begin telling a story about what happened to her dress. Nothing about that story is written into anything."]},"corporal-demand":{head:"A CORPORAL, AND FIVE MEN",cut:"CANNON",body:["Colonel Ugartechea, commanding at B\xE9xar, wanted the cannon back. He did not send an army for it. He sent a corporal named De Le\xF3n and five soldiers, with an order in writing, forty miles across country, to collect one gun and bring it in.","They reached Gonzales about the twenty-fifth of September and asked for it politely, which tells you what B\xE9xar expected to happen.","The town called a meeting. Three men voted to hand it over. Everybody else voted not to."]},"ponton-reply":{head:"THE ALCALDE ANSWERS",cut:"NOTICE",body:["Andrew Ponton, alcalde of Gonzales, wrote to Ugartechea on 26 September 1835. He wrote that the gun was, as he had always been informed, given to this town in perpetuity for its defence against the Indians.","Then he wrote that a demand of this kind was properly a matter for the political chief of the department \u2014 and that the political chief was not there, and he could not say when he would be back.","Every line of it is an argument, and every line is also a delay. While it was written and while it was carried, riders went out to Mina, to Columbus, to every settlement within two days. That was the point."]},"castaneda-order":{head:"ONE HUNDRED DRAGOONS",cut:"COLUMN",body:["Ugartechea did not accept the answer. On 27 September he ordered Lieutenant Francisco de Casta\xF1eda out of B\xE9xar with about a hundred dragoons, to go and get the gun.","His orders were careful, and they are the reason this ends the way it does: recover the cannon, and do it without compromising the honour of Mexican arms. Which is to say \u2014 bring it back, and do not start a war over it.","A hundred men were sent to collect an object that six men had been sent to collect two days earlier. Nothing about the object had changed."]},"old-eighteen":{head:"MUSTER: THE MEN ON THE BANK",cut:"NOTICE",body:["When Casta\xF1eda reached the Guadalupe on 29 September the river was up, and every boat and the ferry itself had been taken over to the far side. On the east bank stood eighteen men of this town.","Arrington. Bennet. Bateman. Clements. Cottle. Darst. Davis. Dickinson. Fulchear. Fuqua. Hinds. Jackson. Martin. Mason. Miller. Sowell. Turner. Williams.","They were not there to win anything. They were there to be a reason to wait, and every hour they bought was an hour more for the riders. By the first of October there were a hundred and forty men in Gonzales."]},"orchard-burial":{head:"BURIED, IN A PEACH ORCHARD",cut:"CANNON",body:["While the town argued, the gun was taken out of the square, carried to George W. Davis\u2019s peach orchard, and put in a hole. The earth was raked back over it and the trees were left to look like trees.","It came out again a few days later, was scoured of rust, and was mounted on a pair of cart wheels taken off a cotton wagon.","There is no paper for any of this. Nobody writes a receipt for burying a cannon. What we have is men remembering it afterwards \u2014 which is why this sheet is marked as reported and not as dated, even though nobody doubts a word of it."]},"williams-camp":{head:"THE CAMP ON WILLIAMS\u2019S LAND",cut:"COLUMN",body:["Casta\xF1eda could not cross opposite the town: the river was high, the boats were gone, and the far bank had men on it. So on 1 October he broke camp and went up the Guadalupe looking for a ford he could use.","He stopped on land belonging to Ezekiel Williams, a colonist \u2014 who was at that moment standing on the riverbank in the town, being one of the eighteen.","A hundred men made camp in his field without asking him, because there was nobody there to ask."]},"first-shot":{head:"THE SECOND OF OCTOBER",cut:"CANNON",body:["They crossed in the dark on the night of the first, the gun on its cotton-wagon wheels, to come at the camp from behind.","Then the fog came down. A hundred and forty men lost each other in it and spent three hours finding a camp that was close by. Somewhere in that, the first shot of the revolution was fired, and nobody is sure who fired it.","When it lifted, the two sides could see each other. Castaneda asked to talk. Moore told him to surrender the field. He answered that he was a federalist himself and had no quarrel with them, but that he was a soldier with orders."]},"castaneda-report":{head:"THE LIEUTENANT WRITES TO B\xC9XAR",cut:"RIDER",body:["Castaneda reported twice, on the second of October and again on the fourth. He had a hundred men, there were a hundred and forty in front of him, and his orders were to recover the gun without compromising the honour of Mexican arms. He withdrew.","One or two of his soldiers were killed, depending which account you read. On the other side a man fell off his horse and bloodied his nose. That was the whole of the Texian casualties.","This is the best paper we have about the fight, and the man who wrote it lost it. The winners wrote almost nothing down. That happens more often than you would think."]},"come-and-take-it":{head:"COME AND TAKE IT",cut:"NOTICE",body:["Six feet of white cotton, a black cannon painted on it, a star, and four words. The most famous object in Texas.","The two reports the lieutenant filed do not mention a flag. Nor does anything else written at the time, on either side. The banner went to Bexar with the gun and was never seen again.","The first description of it was set down by Noah Smithwick, in a memoir dictated in his nineties and printed in 1900 -- sixty-five years after. That does not make it false. It makes it uncheckable, which is a different problem and a worse one."]},"naomi-dress":{head:"WHAT THE FLAG WAS MADE OF",cut:"HEARTH",body:["One account says Sarah Seely DeWitt and her daughter Evaline made the flag out of Naomi DeWitt's silk wedding dress, six weeks after the wedding.","Another says it was Evaline and Caroline Zumwalt, and that it was plain white cotton, painted.","Both are told, both are in books. Neither carries a date, neither names anybody who wrote it down at the time, and they disagree about the cloth, the women and the dress.","Somebody made a flag, probably. Past that, this is a story about a story \u2014 and the honest thing is to say so and go on telling it."]}},bn={documented:{short:"DATED",long:"Dated, on paper",color:m.positive},traditional:{short:"NO DATE",long:"Told, never dated",color:m.alert},uncertain:{short:"REPORTED",long:"Dated by report only",color:m.uiLabel}};function Mt(o){return bn[o]}function vi(o){return o.map(t=>me({},t))}const K={x:4,y:4,w:R-8,h:F-8},Dt={w:Math.round(K.w/2),h:Math.round(K.h/2)},kn=Math.round((R-fo*be)/2),wo=34,Rn=wo+go*be+8,xn=5,Ai=G+1,Oi=K.w-16,Tn=10,En=46;class po{constructor(t,e,n=!0){p(this,"card");p(this,"sheet");p(this,"closed",!1);p(this,"phase");p(this,"opened");p(this,"at",0);p(this,"pages");var s;this.card=t,this.sheet=(s=Ei[t.id])!=null?s:yo,this.opened=e,this.phase=n?"unfold":"read",this.pages=Si(this.sheet.body)}get showing(){return this.phase}get page(){return this.at}update(t,e){if(this.phase==="unfold"){(e-this.opened>=Tn*En||t.pressed("confirm"))&&(this.phase="read");return}if(t.pressed("cancel")){this.closed=!0;return}t.pressed("confirm")&&(this.at++,this.at>=this.pages.length&&(this.closed=!0))}draw(t,e){if(this.phase==="unfold"){this.drawUnfold(t,e);return}Oe(t,K.x,K.y,K.w,K.h),this.drawCreases(t),this.drawHead(t);const n=kn-4,s=wo-4,a=fo*be+8,i=go*be+8;Y(t,n,s,a,1,m.outl e condition that it be returned when called for.",line:"One small cannon, for the defence of this town against the Indians, to be given back when it is asked for. Somebody signed for it.",when:{day:18310300,short:"1831",shown:"MARCH 1831",place:"Gonzales"}},"the empresario is dead":{id:"dewitt-dead",title:"The empresario is dead",standing:"documented",citation:"Green DeWitt, empresario of DeWitt's Colony, died at Monclova on 18 May 1835, probably of cholera, and was buried in an unmarked grave.",line:"The man whose name is on this colony died in Monclova in the spring, and the town he laid out heard about it weeks afterwards.",when:{day:18350518,short:"18 MAY",shown:"18 MAY 1835",place:"Monclova"}},"the dewitt wedding":{id:"dewitt-marriage",title:"The DeWitt wedding",standing:"documented",citation:"Naomi DeWitt, daughter of Green and Sarah Seely DeWitt, married William Matthews at Gonzales in August 1835. The month is recorded; the day is not.",line:"Married in August, in this town, six weeks before any of it. That much is written down. What happened to the dress afterwards is not.",when:{day:18350800,short:"AUG",shown:"AUGUST 1835 \u2014 NO DAY",place:"Gonzales"}},"the corporal asks":{id:"corporal-demand",title:"The corporal asks",standing:"documented",citation:"Col. Domingo de Ugartechea, commanding at B\xE9xar, sent Corporal De Le\xF3n with five soldiers to collect the cannon; they reached Gonzales about 25 September 1835 and were refused.",line:"Five soldiers and a corporal, sent forty miles to collect one gun, carrying an order and no idea what they are riding into.",when:{day:18350925,short:"25 SEP",shown:"25 SEPT 1835",place:"Gonzales"}},"the alcalde says no":{id:"ponton-reply",title:"The alcalde says no",standing:"documented",citation:'Alcalde Andrew Ponton to Col. Domingo de Ugartechea, Gonzales, 26 September 1835. Ponton wrote that the cannon "was as I have always been informed given in perpetuity to this Town for its defence against the Indians", and referred the demand to a political chief who was not there.',line:"Given to this town in perpetuity, for its defence against the Indians. And the man who could overrule me is away, and I could not say when he returns.",when:{day:18350926,short:"26 SEP",shown:"26 SEPT 1835",place:"Gonzales"}},"the order out of bexar":{id:"castaneda-order",title:"The order out of B\xE9xar",standing:"documented",citation:"Ugartechea ordered Lt. Francisco de Casta\xF1eda to Gonzales with about one hundred dragoons. They left B\xE9xar on 27 September 1835, under instructions to recover the gun without compromising the honour of Mexican arms.",line:"A hundred dragoons for one small gun, and an order that says: get it back, and do not start anything.",when:{day:18350927,short:"27 SEP",shown:"27 SEPT 1835",place:"B\xE9xar"}},"the eighteen at the ford":{id:"old-eighteen",title:"The eighteen at the ford",standing:"documented",citation:'The "Old Eighteen": W. W. Arrington, Valentine Bennet, Simeon Bateman, Joseph D. Clements, Almon Cottle, Jacob C. Darst, George W. Davis, Almeron Dickinson, Graves Fulchear, Benjamin Fuqua, James Hinds, Thomas Jackson, Albert Martin, Charles Mason, Thomas R. Miller, John Sowell, Winslow Turner and Ezekiel Williams, who held the east bank of the Guadalupe on 29 September 1835.',line:"Eighteen men, a river running high, and every boat on this side of it. Count us. Then count how long you are prepared to wait.",when:{day:18350929,short:"29 SEP",shown:"29 SEPT 1835",place:"the Guadalupe"}},"the cannon in the orchard":{id:"orchard-burial",title:"The cannon in the orchard",standing:"uncertain",citation:"Reported afterwards by men who were there: the cannon was buried in George W. Davis's peach orchard at Gonzales about 29 September 1835 and dug up again before the fight. No contemporary document records it \u2014 nobody files paper for burying a gun.",line:"Under the peach trees, in a shallow hole, with the earth raked back over it. Three men know where. None of them wrote it down.",when:{day:18350929,short:"29 SEP?",shown:"29 SEPT 1835",place:"Davis's orchard"}},"the camp upriver":{id:"williams-camp",title:"The camp upriver",standing:"documented",citation:"Unable to cross opposite the town, Casta\xF1eda moved his camp on 1 October 1835 to land belonging to the colonist Ezekiel Williams, some miles up the Guadalupe.",line:"He could not cross here, so he went looking for somewhere he could, and made camp on a man's field without asking the man.",when:{day:18351001,short:"1 OCT",shown:"1 OCT 1835",place:"Ezekiel Williams's land"}},"the first shot":{id:"first-shot",title:"The first shot",standing:"documented",citation:"The engagement of 2 October 1835 on the west bank of the Guadalupe. Accounts give one or two Mexican soldiers killed; the only Texian hurt was a man whose horse threw him, who bloodied his nose.",line:"They crossed in the dark, lost each other in fog for three hours, and fired the first shot of the revolution at a camp they could not see.",when:{day:18351002,short:"2 OCT",shown:"2 OCT 1835",place:"the Guadalupe"}},"the lieutenant's report":{id:"castaneda-report",title:"The lieutenant's report",standing:"documented",citation:"Lt. Francisco de Casta\xF1eda reported the affair to Ugartechea twice, on 2 and 4 October 1835. He wrote that since his orders were to withdraw without compromising the honour of Mexican arms, he did so.",line:"My orders were to recover the gun without compromising the honour of Mexican arms. I withdrew. I am at a loss to add anything further.",when:{day:18351004,short:"4 OCT",shown:"4 OCT 1835",place:"on the road to B\xE9xar"}},"come and take it":{id:"come-and-take-it",title:"Come and take it",standing:"traditional",citation:`No contemporary document mentions a flag at Gonzales, and Casta\xF1eda's reports do not. The banner was said to have been carried toward B\xE9xar with the gun and was lost. The earliest description in print is Noah Smithwick's "The Evolution of a State", dictated in his nineties and published in 1900 \u2014 sixty-five years afterwards.`,line:"White cotton, a black cannon, one star, and four words. Every child in Texas can draw it from memory. Nobody wrote it down for sixty-five years."},"the dress and the cotton":{id:"naomi-dress",title:"The dress, and the cotton",standing:"traditional",citation:"One account has Sarah Seely DeWitt and her daughter Evaline making the flag from Naomi DeWitt's wedding dress; another has Evaline and Caroline Zumwalt painting a length of plain white cotton. Both are told, neither is dated, and they do not agree.",line:"A silk wedding dress, says one. Six feet of plain cotton, says another. They cannot both be right and there is no way left to find out which."}};function On(o,t){return Object.fromEntries(Object.entries(o).map(([e,n])=>[e,kt(me({},n),{session:t})]))}const Me=me(me({},On({"the word tejas":{id:"word-tejas",title:"The name of the country",standing:"documented",citation:'Caddo t\xE1ysha, "friend"; written down by Spanish expeditions from the 1680s.',line:"The people already here said a word that meant friends, and the men writing it down kept it for the whole country.",when:{day:168e5,short:"1680s",shown:"THE 1680s",place:"the Caddo country"}},"the colony line":{id:"colony-line",title:"The colony line",standing:"documented",citation:"Power and Hewetson's empresario grant, extended from the Guadalupe to the Nueces, 12 April 1829; Goliad families claimed prior title within it.",line:"The line runs from one river to the other, and this house is on the wrong side of it depending on who you ask.",when:{day:18290412,short:"1829",shown:"12 APRIL 1829",place:"Coahuila y Tejas"}},"the mission herd":{id:"espiritu-herd",title:"The mission herd",standing:"documented",citation:"Mission Nuestra Se\xF1ora del Esp\xEDritu Santo de Z\xFA\xF1iga, on the north bank opposite the presidio since 1749: over fifteen thousand head of cattle by 1788. Secularised in 1830.",line:"Fifteen thousand head, counted, in a column, b he rail for a kind word.",needs:"full"},{text:"Get up on her, then. I am not waiting in this sun.",needs:"watered"},{text:"Go on, then \u2014 south, and do not let her stop to eat. I will see you at the chapel.",needs:"mounted"}]},{id:"hand",name:"BENITO",tx:14,ty:13,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:y(l,8),hairCol:y(l,1),cloth:y(l,9),cloth2:y(l,4)},lines:[{text:"Rail post rotted through. Third one this year.",aside:"That trough has been dry since Tuesday. Fill it and she'll come to the rail, and I'll tell you about the ford."},{text:"The ford is seven miles up and everybody knows where it is. Remember that \u2014 someday it will matter more than it does today.",needs:"watered",sets:"asked-ford",then:!0},{text:"And a man came through it Sunday going hard and would not stop for water. Shouted it at us off the horse. Gonzales \u2014 the little cannon \u2014 the soldiers asked for it back and did not get it.",aside:"That is the whole of what I have. He did not write it down and neither did I. Somebody in the town will have more of it than a shout.",needs:"asked-ford",sets:"told-rider",gives:"what the rider said"},{text:"Whatever it was, it was a week ago and it was somewhere else. Ask in the town, and ask somebody who keeps paper.",needs:"told-rider"}]}],triggers:[{tx:20,ty:17,unless:"mounted",sets:"tried-the-road",text:"You get as far as the last of the fence and stop.",aside:"Goliad is an hour south on foot and the wedding is at noon. Not without the mare."}],exits:[{tx:6,ty:4,to:"ranch-house",entry:{tx:7,ty:7,facing:"up"}},{tx:20,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"},{tx:21,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"}],props:[{id:"well",tx:14,ty:5,lines:[{text:"A gourd hangs on the rope, dry as a drum. You take it.",aside:"The rope still runs down into the dark, and the dark is wet.",sets:"gourd"},{text:"You let the rope down and haul it up hand over hand. The gourd fills.",needs:"gourd",sets:"full"},{text:"Full to the neck. Anything more goes on your feet.",needs:"full"}]},{id:"trough",tx:6,ty:10,lines:[{text:"Dry to the boards. Nothing will drink from this."},{text:"Dry to the boards. You turn the gourd over it and nothing comes out of that either.",aside:"It wants filling first. The well is up the slope.",needs:"gourd"},{text:"You tip the gourd in. The mare lifts her head before the water settles.",needs:"full",sets:"watered"},{text:"Full, and already half of it gone. She drinks like she has been waiting all morning, which she has.",needs:"watered"}]},{id:"corn",tx:23,ty:4,lines:[{text:"Corn, and not much of it. It has been a dry year on this side of the river."}]},{id:"road",tx:20,ty:17,lines:[{text:"The road south. Goliad is an hour that way on foot, and you do not have an hour.",aside:"Not without the mare."},{text:"The road south, and the mare under you. Goliad by mid-morning.",aside:"Just ride down it. Nobody is going to stop you.",needs:"mounted"}]}]},ji={".":c.GRASS_A,",":c.DIRT,"=":c.DIRT_EDGE,"~":c.WATER,a:c.ADOBE,h:c.THATCH,s:c.STONE,g:c.GATE,r:c.RACK,D:c.DOOR,k:c.CHAPEL_ROOF,K:c.CHAPEL_WALL,E:c.ESPADANA,A:c.CHAPEL_DOOR,"+":c.CROSS,Y:c.TREE,N:c.NOTICE,B:c.BILL_STONE,b:c.BILL_ADOBE,o:c.WELL,f:c.FLAGSTONE,R:c.ROCK,d:c.DOORWAY},Ro={id:"goliad",name:"Goliad",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRR,,RRRRRRRRRRRRRRRRRR","R.sssssssssss.Y.....,,.................R","R.skkkkkkkkks.......,,.................R","R.skkkkEkkkks.......,,.................R","R.sKKKAAAKKKs.......,,.................R","R.B,,,,,,,,,........,,.................R","R.sssssssssss.......,,.................R","R~~~~~~~~~~~~~~~~~~~,,~~~~~~~~~~~~~~~~~R","R~~~~~~~~~~~~~~~~~~~,,~~~~~~~~~~~~~~~~~R","R...................,,.................R","R...hhhh............,,....sBssgsssss...R","R...aada............,,....s,,,,,,,,s...R","R...................,,....skkkkkkk,s...R","R........Y..........,,....skkkkEkk,s...R","R...................,,....sKKKAAAK,s...R","R.hhhh..............,,....sffffffffs...R","R.aada.......,,,,,,,,,,,,,sffffffffs...R","R............,,,,,,,,,,,,,ssssffssfs...R","R....o.......,,,,,,N,,,,,,ssDBffsDfs...R","R............,,,,,,,,,,,,,sffffffffs...R","R..sssss.....,,,,,,,,,,,,,ssDBsDsffs...R","R..sBdss.....,,,,,,,,,,,,,sssssssffs...R","R............,,,,,,,,,,,,,ssssssssss...R","R..hhhh......,,,,,,,,,,,,,.....Y.......R","R..aada......,,,,,,,,,,,,,.............R","R............,,,,,,,,,,,,,.............R","R........Y...,,,,,,,,,,,,,.............R","R............,,,,,,,,,,,,,.............R","R...................,,.................R","R..rrrr.........Y...,,.................R","R..rrrr.............,,.................R","R...................,,.................R","RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"],legend:ji,start:{tx:21,ty:1,facing:"down"},exits:[{tx:6,ty:11,to:"jacal-n",entry:{tx:7,ty:7,facing:"up"}},{tx:4,ty:16,to:"jacal-w",entry:{tx:7,ty:7,facing:"up"}},{tx:5,ty:21,to:"store",entry:{tx:7,ty:7,facing:"up"}},{tx:5,ty:24,to:"jacal-s",entry:{tx:7,ty:7,facing:"up"}},{tx:20,ty:0,to:"ranch",entry:{tx:20,ty:17,facing:"up"}},{tx:21,ty:0,to:"ranch",entry:{tx:20,ty:17,facing:"up"}},{tx:6,ty:4,to:"mission-room",entry:{tx:7,ty:7,facing:"up"}},{tx:7,ty:4,to:"mission-room",entry:{tx:7,ty:7,facing:"up"}},{tx:8,ty:4,to:"mission-room",entry:{tx:7,ty:7,facing:"up"}},{tx:30,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:32,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:31,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"}],triggers:[{tx:31,ty:15,needs:"chapel-open",sets:"under-the-arch",text:"[The doors are open above you. Somebody inside is dragging benches.]",aside:"Straight up the steps."}],npcs:[{id:"refugia",name:"DO\xD1A REFUGIA",absent:"chapel-open",tx:4,ty:25,facing:"up",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:y(l,9),hairCol:y(l,1),cloth:y(l,7),cloth2:y(l,5),accent:"#8b5d55"},lines:[{text:"Two hundred people and one fire. If you are going to stand there, stand there holding something.",aside:"Take these tamales to Anselmo. He is owed a meal and he knows it.",sets:"tamales"},{text:"Go on. The music does not start itself.",needs:"tamales"},{text:"You hear that? That is my daughter getting married, and a fiddle, and nobody sick. Two years ago I would not have believed it.",needs:"gut"}]},{id:"anselmo",name:"ANSELMO",absent:"chapel-open",tx:18,ty:18,facing:"down",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:y(l,9),hairCol:y(l,8),cloth:y(l,11),cloth2:y(l,5)},lines:[{text:"You are early. Nobody is early to a wedding."},{text:"Tamales. Good. Now the bad news \u2014 I broke a string this morning and there is no gut in this town but at the hide yard.",aside:"A rider came through Tuesday. There was a fight at Gonzales the Friday before, over a cannon. They say the flag was a girl\u2019s wedding dress, cut up.",needs:"tamales",sets:"string"},{text:"A wedding dress. That is what they are saying, anyway. Ask me again in fifty years and it will be two wedding dresses.",needs:"string"},{text:"[He strings the fiddle, tunes it against his thumb, and starts to play.]",needs:"gut"}]},{id:"casimiro",name:"CASIMIRO",tx:7,ty:30,facing:"left",look:{build:"adult",hat:"kerchief",hair:"crop",torso:"apron",legs:"calzoneras",stance:"wide",skin:y(l,8),hairCol:y(l,1),cloth:y(l,10),cloth2:y(l,6),accent:"#8b5d55"},lines:[{text:"Careful where you stand. Everything on this side of the yard is wet."},{text:"Gut I have. Time I do not. The buyer says eight hundred skins and I say nine hundred and forty, and one of us is wrong.",aside:"Count them. Properly \u2014 walk down the racks and do it yourself. I will cut your string while you wait.",needs:"string",sets:"to-count"},{text:"Well? You went and looked. That is more than the buyer did.",aside:"How many?",needs:"counted",options:[{label:"Eight hundred.",sets:"miscounted",reply:"Eight hundred is his number, not yours. You did not get it off the racks, you got it off him. Go back and add it up."},{label:"Nine hundred and forty.",sets:"gut",reply:"Nine hundred and forty. [He writes it on a slip and hands it over with the gut.] Take that to Se\xF1ora Ocampo. If the buyer argues, you were there and he was not.",aside:"And learn the ford while you are young \u2014 seven miles up, and everybody knows where it is. Some day that will matter more than it does today."},{label:"A lot.",sets:"miscounted",reply:'"A lot." [He puts the knife down.] A lot is what you say when you did not count. Nobody has ever won an argument with a lot. Go back and add it up.'}]},{text:"Take the tally to Se\xF1ora Ocampo, and do not lose it. It is the only copy and it has your counting in it.",needs:"gut"},{text:"Seven miles up. Do not forget it.",needs:"tally"}]},{id:"ocampo",name:"SE\xD1ORA OCAMPO",tx:6,ty:22,facing:"up",look:{build:"adult",hat:"mantilla",hair:"bun",torso:"camisa",legs:"skirt",load:"ledger",skin:y(l,10),hairCol:y(l,1),cloth:y(l,4),cloth2:y(l,3)},lines:[{text:"If you have no money you have no business, and you have no money."},{text:"Eight hundred. That is what my book says and my book does not guess.",aside:"Nine hundred and forty? [She looks at the slip. She looks at you.] You counted them. I did not. Nine hundred and forty.",needs:"gut",sets:"tally",then:!0},{text:"Candles for the chapel. Do not run with them.",needs:"tally",sets:"candles"},{text:"A number beats a story, m\u2019ijo. Remember that the next time somebody tells you one.",needs:"candles"}]},{id:"tomas",name:"TOM\xC1S",tx:32,ty:15,facing:"up",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:y(l,9),hairCol:y(l,1),cloth:y(l,12),cloth2:y(l,5)},lines:[{text:"You cannot go past me. The quarters and the magazine are the garrison\u2019s and they are not in a mood."},{text:"Candles. Finally. [He takes them without looking up and starts setting them along the wall.] Go in. Sit anywhere. It starts when the fiddle starts.",needs:"candles",sets:"chapel-open"},{text:"First wedding since the sickness. My mother counted \u2014 a hundred and eleven of us went into the ground that year.",needs:"chapel-open"},{text:"I am not going in. Somebody has to watch the candles and it is always me.",needs:"wedding"}]},{id:"soldier",name:"SOLDADO",tx:31,ty:9,facing:"down",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",load:"musket",stance:"wide",skin:y(l,8),hairCol:y(l,1),cloth:y(q,1,.5),cloth2:y(l,12)},lines:[{text:"Chapel is that way, and it is shut until somebody brings candles. [He does not move, exactly, but the gate is wider than it was.]",aside:"The bride\u2019s mother is Do\xF1a Refugia \u2014 far end of town, west, at the cooking fire. The bride you will not see until tonight, and everything before that goes through her mother."},{text:"A wedding. Good. It has been a quiet year for the good kind of noise.",needs:"candles",sets:"asked-general",then:!0},{text:"You know who stood where you are standing, eight days ago? The general. Cos himself. He slept in those quarters and you could have thrown a stone at him from the gate.",aside:"His billeting order is still on the door of those quarters. Nobody has had the heart to take it down.",needs:"asked-general",sets:"told-here",then:!0},{text:"And on the fifth he took the Morelos battalion and his own guard and went to B\xE9xar, on account of something that happened at a place called Gonzales.",aside:"He left us. That is a fact with a date on it, and the date is pinned inside the barracks door. Fifty of us, and a wall built for three hundred.",needs:"told-here",sets:"told-gone"},{text:"Fifty men. Walk the wall yourself and count the gates, and then tell me how you would do it.",needs:"told-gone"}]},{id:"elder",name:"DON PRUDENCIO",tx:15,ty:20,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"folded",legs:"calzoneras",stance:"bowed",skin:y(l,8),hairCol:y(l,12),cloth:y(l,5),cloth2:y(l,3)},lines:[{text:"You are the one who counts hides. Sit a minute. Do you know what this province is called, and why?",aside:"Not Texas. Before that.",sets:"asked-name",then:!0},{text:"Tejas. And it is not a Spanish word at all \u2014 it is Caddo, from the people out east. Tayshas. It means friends. Allies.",aside:'They said it to the first Spaniards as a greeting, and the Spaniards wrote it down as the name of the country. We have been calling this place "friends" for a hundred and fifty years without knowing it.',needs:"asked-name",sets:"told-name",gives:"the word tejas"},{text:"Friends. Remember that when men start arriving who do not speak it.",needs:"told-name",sets:"asked-circular",then:!0},{text:"There is one nailed up on the post at the crossing, if you want to read it. A man read it aloud here and then left a copy for whoever came after him.",aside:"Austin wrote it at San Felipe in September. There is no newspaper in Texas. THAT is the newspaper: one page, copied out by hand, walked from town to town and nailed where people pass.",needs:"asked-circular",sets:"told-circular"},{text:"Copy it out if you can write. If you cannot, read it to somebody who cannot either. That is the whole system and there is no other one.",needs:"told-circular"}]},{id:"carter",name:"THE CARTER",tx:23,ty:25,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"satchel",skin:y(l,8),hairCol:y(l,1),cloth:y(l,6),cloth2:y(l,4)},lines:[{text:"Do not ask me what is in the carts and I will not have to lie to you.",aside:"Coffee. It is coffee. Mostly.",sets:"asked-road",then:!0},{text:"Everything that reaches Bexar comes through here. Copano is forty miles down, the road runs right past that chapel, and there is no other road.",aside:"Which is why this little town has a fort in it and Victoria does not. If you want the numbers, the freight bill is nailed up on the store wall.",needs:"asked-road",sets:"told-road"},{text:"Forty miles to the water. Remember the road, not the town.",needs:"told-road",sets:"asked-landing",then:!0},{text:"And three weeks back I sat on that cart at the end of it and watched five hundred soldiers come off the boats. It took them days. I counted, because what else is a man going to do.",aside:"About the twentieth of September. I would not swear to the day \u2014 but the army wrote it down, and their board is up beside the fort gate.",needs:"asked-landing",sets:"told-landing"},{text:"Five hundred men and one road. You do the arithmetic. I am tired.",needs:"told-landing"}]}],props:[{id:"plaza-post",tx:19,ty:18,lines:[{text:"A post at the crossing, with two bills nailed to it. The lower one is weathered to nothing. The upper one is new.",aside:"Somebody has copied this out by hand. You can see where the pen ran dry and was dipped.",gives:"the circular",sets:"read-circular"},{text:"The same two bills. The upper one is still legible; the lower one has not been for a year.",needs:"read-circular"}]},{id:"gate-post",tx:27,ty:10,lines:[{text:"Garrison paper, nailed to the wall beside the gate: rations, punishments, and a sheet about a landing at the coast.",aside:"Somebody has gone down the list of companies with a thumbnail, scoring off the ones that have marched.",gives:"the landing at copano",sets:"read-landing"},{text:"The same wall. Rations, punishments, and a sheet about a landing at the coast.",needs:"read-landing"}]},{id:"store-bill",tx:4,ty:21,lines:[{text:"A freight bill, nailed up where the carters can argue with it. Loads, dates, and what each one was charged from the coast.",aside:"Somebody has gone down the right-hand column twice and got a different total both times.",gives:"the copano road",sets:"read-freight"},{text:"The freight bill. Loads, dates, and what each was charged from the coast.",needs:"read-freight"}]},{id:"well",tx:5,ty:18,lines:[{text:"The town well. Somebody has scratched a tally of the dry months into the stone and given up partway."}]},{id:"store-door",tx:5,ty:21,lines:[{text:"Ocampo\u2019s. Salt, powder, cloth, coffee, and a ledger she guards like a dog."}]},{id:"racks",tx:4,ty:29,lines:[{text:"Hides on the racks, four deep, stiff as doors. This is what Goliad sells."},{text:"Four racks, four deep. You do the near one twice because you lose your place, and then you go slower.",aside:"Two hundred and thirty-five on the near rack. Two hundred and thirty-five on the next. Two hundred and thirty-four. Two hundred and thirty-six.",needs:"to-count",sets:"counted"},{text:"Four racks, and you have the four numbers. Nine hundred and forty, if you have added them right.",needs:"gut"}]},{id:"chapel",tx:28,ty:15,lines:[{text:"Nuestra Se\xF1ora de Loreto, the chapel of the presidio. The whole town gets married and buried inside a fort, and nobody here thinks that is strange.",aside:"The door faces the parade ground, and it is shut. There is a soldier on the gate who is not moving."},{text:"Still shut. Whoever is setting it up for tonight has not been given what they need to light it.",aside:"You are carrying them. Tom\xE1s is the one on the parade ground with his arms folded \u2014 hand them to him.",needs:"candles"},{text:"Open, and somebody inside is setting candles along the wall in a line that is not straight.",aside:"The way in is the arch, three tiles of it, straight ahead.",needs:"chapel-open"}]},{id:"herd-notice",tx:2,ty:5,lines:[{text:"A board in the yard wall under a ledge, and a sheet nailed to it that fifty years of weather has taken back to nothing.",aside:"One column of it will still just about be read: cattle, in hundreds. Whoever kept this took the good copy in out of the rain, and the church door is standing open.",sets:"told-herd"},{text:"The ruined outer board. Cattle, in hundreds, in a hand the weather has nearly finished with.",needs:"told-herd"}]},{id:"mission",tx:5,ty:4,lines:[{text:"Esp\xEDritu Santo. Secularised five years ago; the great herds are eighty years gone and the east wall with them.",aside:"The door is open and has been for years. There is nobody left here to shut it. The fort is on the far bank \u2014 you cross at the ford, the way everybody does."}]},{id:"quarters",tx:29,ty:18,lines:[{text:"The officers\u2019 quarters. Stone, like everything the crown paid for, and shut \u2014 but there is a billeting order still tacked to the frame, gone soft in the damp.",aside:"It has the general\u2019s own name at the head of it, and a date eight days old.",gives:"the general in the fort",sets:"read-billet"},{text:"The officers\u2019 quarters. The door does not move, and a soldier watches you find that out.",needs:"read-billet"}]},{id:"barracks",tx:29,ty:20,lines:[{text:"The soldiers\u2019 barracks, built against the wall itself. There are fewer men in it than there are beds, and a march order is still pinned inside the door.",aside:"Sandoval has fifty. The wall is longer than fifty men, and the order says where the rest of them went.",gives:"the general marches out",sets:"read-march"},{text:"The barracks. Shut to you, and you are not going to be the one who argues about it.",needs:"read-march"}]},{id:"quarters-door",tx:28,ty:18,lines:[{text:"The door of the officers\u2019 quarters. There is a bar across it on the far side \u2014 you can hear the bar when you push, and pushing is the whole of what happens.",aside:"The paper tacked up beside the frame is as near the inside of that room as anybody from this town gets."}]},{id:"barracks-door",tx:28,ty:20,lines:[{text:"The barracks door, propped open a hand\u2019s width and no wider. A soldier sitting inside it with his boots off looks at you until you stop.",aside:"Neither of you says anything. The width of the gap is the whole conversation."}]},{id:"barracks-east-door",tx:31,ty:20,lines:[{text:"The other barracks door, at the east end, where the rations are issued. Shut, with the issuing table folded up against it, which is the same as shut.",aside:"Nothing is being handed out today. There are fewer men here to hand it to than there were a week ago."}]},{id:"magazine",tx:33,ty:18,lines:[{text:"The powder magazine. The one door in the fort nobody leaves unlocked, and it is locked.",aside:"Two turns of a key you can hear from here. Whatever else this garrison has let slide, it has not let this slide."}]},{id:"cannon",tx:34,ty:15,lines:[{text:"Cannon, on the parade. Eight-pounders \u2014 the fort was built with six of them and nobody has moved one in years.",aside:"They are counted. Everything the crown issued was counted."}]}]},Li={s:c.STONE,f:c.FLAGSTONE,",":c.DIRT,d:c.DOORWAY,A:c.ALTAR,"+":c.CROSS,b:c.BENCH,t:c.TABLE,H:c.HEARTH,Y:c.TREE},Ui={id:"the-wedding",needs:"chapel-open",unless:"wedding",steps:[D(void 0,"Tom\xE1s has lit every candle in the building. There are more candles than there are chairs."),Se("player",5,12),D("EL PADRE","Are we all in? Then somebody shut that door before the wind has it."),Se("manuela",6,9),D(void 0,"Outside, the fiddle stops. Two hundred people stop with it."),Se("manuela",6,3),at("manuela","up"),at("eusebio","up"),D("EL PADRE","We have waited a long while for a good reason to fill this room. Most of the last ones were not good reasons.","Sixteen months ago he buried a hundred and eleven people out of this same doorway."),D("MANUELA","S\xED."),D("EUSEBIO","S\xED."),D(void 0,"The room makes a noise like a roof coming off."),ge("wedding"),at("manuela","down"),at("eusebio","down"),Se("eusebio",5,7),Se("manuela",6,7),Se("manuela",14,8),Se("eusebio",13,6),D(void 0,"Outside, Anselmo lays the bow across the new string, and the yard finds out what your afternoon at the hide racks bought.")]},qi={id:"chapel",name:"La Capilla",light:{base:-6,sources:[{tx:5,ty:2,r:7,gain:7},{tx:6,ty:2,r:7,gain:7},{tx:1,ty:6,r:4,gain:4},{tx:10,ty:6,r:4,gain:4},{tx:1,ty:12,r:4,gain:4},{tx:10,ty:12,r:4,gain:4},{tx:11,ty:7,r:3,gain:3},{tx:12,ty:14,r:6,gain:6},{tx:16,ty:9,r:5,gain:4},{tx:16,ty:12,r:5,gain:4},{tx:5,ty:15,r:3,gain:3}]},rows:["sssss++ssssssssssssss","sffffAAffffs,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,Y,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,,,,,,s","sffffffffffd,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,tttt,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,tttt,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffsH,,,,,,,s","sssssdssssss,,,,,,,,s","sssssssssssssssssssss"],legend:Li,start:{tx:5,ty:14,facing:"up"},scenes:[Ui],triggers:[{tx:5,ty:14,needs:"letter",sets:"at-the-door",text:"[You are at the door with her letter in your shirt. Behind you the fiddle is still being tuned.]",aside:"Whatever is said in this room tonight gets said once, and you will not be coming back in."}],exits:[{tx:5,ty:15,to:"bahia",entry:{tx:21,ty:1,facing:"down"},needs:"letter"},{tx:5,ty:15,to:"goliad",entry:{tx:29,ty:6,facing:"down"}}],npcs:[{id:"padre",name:"EL PADRE",tx:6,ty:2,facing:"down",look:{build:"adult",hat:"none",hair:"tonsure",torso:"camisa",legs:"cassock",load:"book",skin:y(l,10),hairCol:y(l,9),cloth:y(l,2),cloth2:y(l,2)},lines:[{text:"You are late. So was I. We will say nothing about it to each other."},{text:"You came in on a horse from out past the river, no? Then answer me something. How far is the nearest priest to your people?",aside:"It is not a trick. I am the answer and I am also the problem.",needs:"wedding",sets:"asked-bond",then:!0},{text:"Up on the Brazos there is one of me for a country the size of Spain. So they do not wait. A man and a woman sign a bond in front of two neighbours, and they live married, and they wait for somebody like me to ride through.",aside:"I have baptised children at the same table where I afterwards married their parents. It is legal. It is a document. It is not what I would have chosen.",needs:"asked-bond",sets:"told-bond",gives:"the marriage bond"},{text:"A bond is a paper two neighbours signed. This is a paper a church signed. One day somebody will ask which one counted, and they will go looking for the paper, not for the two neighbours.",needs:"told-bond",sets:"keep-the-paper",then:!0},{text:"Speaking of which. [He nods at your pockets.] You have been picking paper up all over this town today. I have watched you do it. Keep every piece.",aside:"When this week has finished happening \u2014 and it has not \u2014 bring the lot to me and we will put it in order. Everything I keep has a day written beside it. That is the entire reason the book is worth keeping.",needs:"keep-the-paper",sets:"told-string"},{text:"Keep it all. Every scrap. I will not do it twice and I will not do it tonight.",needs:"told-string"}]},{id:"eusebio",name:"EUSEBIO",tx:5,ty:3,facing:"up",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:y(l,9),hairCol:y(l,1),cloth:y(l,6),cloth2:y(l,3)},lines:[{text:"Do not talk to me. If I talk I will keep talking and then I will still be talking when he asks me the question."},{text:"Her mother has not sat down since Thursday. Somebody should make her sit down. It will not be me, I have used up all my courage for one day.",needs:"wedding"}]},{id:"manuela",name:"MANUELA",tx:6,ty:13,facing:"up",look:{build:"adult",hat:"veil",hair:"none",torso:"camisa",legs:"skirt",load:"bouquet",skin:y(l,10),hairCol:y(l,1),cloth:y(l,13),cloth2:y(l,12)},lines:[{text:"Not yet. Nobody sees me before the candles are lit \u2014 that is the entire point of candles."},{text:"You. The one who has been running all over town since noon. My brother is on the Brazos and he could not come. Will you carry this to him?",aside:"Tell him it happened. Tell him who was here.",needs:"wedding",sets:"letter"},{text:"North, past the crossing, and ask for the Ruiz place. He will feed you for it, and he will make you say all the names twice.",needs:"letter"}]},{id:"refugia",name:"DO\xD1A REFUGIA",tx:13,ty:14,facing:"left",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:y(l,9),hairCol:y(l,1),cloth:y(l,7),cloth2:y(l,5),accent:"#8b5d55"},lines:[{text:"Eat something. I did not cook for two days so that people could stand about being polite."},{text:"Anselmo has been telling everyone his story from Gonzales. The flag. Say it back to me \u2014 what was it cut from?",needs:"wedding",sets:"asked-dress"},{text:"A wedding dress. [She does not laugh.] I sewed the one my daughter has on. Four months. It is the only thing in this family worth anything, and when she is done with it her daughter gets it.",aside:"Nobody cuts up a wedding dress to make a bedsheet with writing on it. Go back and ask him whose dress. He will give you a name, and he will be guessing.",needs:"guessed",sets:"told-dress",gives:"a seamstress's objection"},{text:"Ask him whose. That is all. It is a good story and I would like it to be true, and those are two different things.",needs:"told-dress"}]},{id:"anselmo",name:"ANSELMO",tx:17,ty:11,facing:"up",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:y(l,9),hairCol:y(l,8),cloth:y(l,11),cloth2:y(l,5)},lines:[{text:"Gut from a dead cow, and out of it comes that. I have never got over it and I have been doing it for thirty years."},{text:"They will dance until the candles go. Nobody in this town has had a reason to wear out a floor since before the sickness.",needs:"wedding"},{text:"So he put the whole week on a string for you. [He grins and does not stop tuning.] Then you can answer me now, and you will be the only one in this room who can.",needs:"strung"},{text:"The dress? [He does not stop tuning.] Spanish. Brought up from B\xE9xar, I would say, or the coast. You can tell.",aside:"He says it the way a man says a thing he has never once been asked to prove.",needs:"asked-dress",sets:"guessed"},{text:"You are the one who told Do\xF1a Refugia the dress was Spanish. [He is not embarrassed. He is interested.] So. The gun at Gonzales. The lieutenant asked for it back and they would not give it. If you had been standing on that bank, what would you have said to him?",aside:"Take your time. I have watched a great many men lose that argument.",needs:"told-dress",sets:"the-argument",then:!0},{text:"No \u2014 do not answer me. [He lays the bow across his knee.] Ask any four men in this room what happened this week and you will get four different weeks, and not one of us wrote a word of it down.",aside:"Go and see El Padre. He is the only person in this town who puts a date beside a thing on the day it happens, and you have been collecting paper since this morning.",needs:"the-argument"}]},{id:"paquita",name:"PAQUITA",tx:4,ty:12,facing:"right",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:y(l,10),hairCol:y(l,1),cloth:y(l,11),cloth2:y(l,8)},lines:[{text:"I have been sitting on this bench since four o\u2019clock and I am not allowed to say anything about it."},{text:"You are taking me to the food. That is how it is done \u2014 you take me there and you bring me back to my mother, and everybody watches you do it, and then I am allowed to eat.",aside:"Walk. I will keep up. I have been keeping up my whole life.",needs:"wedding",sets:"escorting"},{text:"Out the side door and along. You cannot miss it, it is the only thing in the yard that smells like that.",needs:"escorting"},{text:"Now my mother. Not fast. If you run it does not count.",needs:"fed"},{text:"That was correctly done. I will tell people.",needs:"escorted"}]},{id:"benigno",name:"T\xCDO BENIGNO",tx:15,ty:13,facing:"up",look:{build:"adult",hat:"sombrero",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"reata",stance:"bowed",spurs:!0,sash:!0,skin:y(l,8),hairCol:y(l,8),cloth:y(l,7),cloth2:y(l,4)},lines:[{text:"Forty-one years I have been coming to weddings in that building. I have signed the book at eleven of them."},{text:"You want to see something? Come and look at what I put in the register tonight, next to my name.",aside:"Except it is not next to my name. It is instead of it.",needs:"wedding",sets:"asked-mark",then:!0},{text:"I cannot write. So I sign with my iron \u2014 the same mark that is on every cow of mine and on my gate and in the book at the town hall where they keep the brands.",aside:"On the cattle it means mine. On the register it means I was here and I say so. It is the same mark and it means the same thing, and it will still mean it when I am dead.",needs:"asked-mark",sets:"told-mark",gives:"a mark for a signature"},{text:"Learn your neighbours\u2019 irons before you learn their faces. The face changes.",needs:"told-mark"}]}],props:[{id:"altar",tx:5,ty:1,lines:[{text:"Two candles, a cloth somebody has washed within an inch of its life, and a crucifix older than the fort."}]},{id:"bench",tx:3,ty:13,lines:[{text:"A plank on two frames. Half the town is sitting on the other half of it."}]},{id:"table",tx:16,ty:9,lines:[{text:"Planks laid across frames: tamales in a cloth, cakes, and a coffee pot that has been full since noon."},{text:"Paquita takes a tamal in each hand, which is one more than the ritual strictly allows.",needs:"escorting",sets:"fed"},{text:"Picked over now. Somebody has taken all the cakes with the sugar on.",needs:"escorted"}]},{id:"hearth",tx:12,ty:14,lines:[{text:"The chimney. The coffee and the cakes get their heat here, and so does everybody who stands near it."},{text:"You deliver Paquita to her mother\u2019s elbow and let go of her sleeve. Do\xF1a Refugia looks at you for a second longer than she needs to.",aside:"A fiddle, planks across frames, and a girl walked to the food and back. This is what a fandango is, and you have just been in one.",needs:"fed",sets:"escorted",gives:"the fandango"},{text:"Warm. The only warm thing in the yard that is not a person.",needs:"escorted"}]}]};function Xi(){const o=Ro.rows.map(e=>e.split("")),t=(e,n,s)=>{o[n][e]=s};return t(30,10,"B"),t(34,22,","),t(35,16,","),t(26,19,","),o.map(e=>e.join(""))}const Vi={id:"the-road",needs:"letter",unless:"chose",steps:[D(void 0,"You are most of the way home before you understand what you saw on the coast road.","Horses. Not two or three. More than you can count in the dark, and none of them hurrying, which is worse."),D(void 0,"They are not the Mexican army. The Mexican army is in that fort, and it has been all year, and it nodded at you tonight."),qa(void 0,"You are the only person in this valley who knows. You have about a minute.",[{label:"Warn the garrison.",sets:"told-garrison",reply:"You go for the gate. The sentry knows you \u2014 you are the candle kid \u2014 and he believes you, and that is the whole of it. Men come out of the quarters pulling their coats on.",aside:"They will stand to. The fight will be longer and worse than it would have been, and more of them will live through it."},{label:"Warn the town.",sets:"told-town",reply:"You go for the square instead, shouting, and the square empties. Do\xF1a Refugia has her family and half of somebody else\u2019s out the back before you finish the sentence.",aside:"Not one person you woke can fire a musket. That was not the point and you knew it when you turned."},{label:"Say nothing. Run.",sets:"told-nobody",reply:"You do not stop. You put the mare down the river track and you are inside the walls before you have decided anything at all.",aside:"For the next eleven minutes you are the only person in Goliad who knows what is coming. It is heavier than it sounds."}],"Whatever you pick, they are still coming and there are still a hundred and twenty of them."),ge("chose")]},Ji={id:"the-fight",needs:"inside",unless:"fought",steps:[D(void 0,"Eleven o\u2019clock. It starts the way the men who were there always said it started \u2014 all at once, and from the wrong direction."),D(void 0,"You are on your face in the dirt of a courtyard you walked across four hours ago carrying candles.","You cannot see any of it. You can hear all of it, which turns out not to be better."),D(void 0,"What you can see is men. Sandoval\u2019s, in the yard, firing at a wall from the inside of it. Strangers coming out of the dark on the far side of that wall, closer every time you look.","They go down and most of them get up again. Remember that when somebody hands you a number in the morning."),D(void 0,"Tom\xE1s is in this building somewhere. So is a girl in a blue rebozo who was walked to the food and back four hours ago and has not been walked anywhere since.","You are the only person inside these walls who knows three ways out of them. Find both of them, then find the gate."),ge("fought")]},Zi={id:"the-surrender",needs:"got-out",unless:"surrendered",steps:[D(void 0,"It stops. Not gradually \u2014 the way a room goes quiet when somebody senior says a short word in it."),Se("player",29,8),at("player","up"),D("GEORGE COLLINSWORTH","Sandoval. You have done what you were told to do and there is no more of it to do. Your men keep their coats."),D(void 0,"Half an hour, start to finish. Nobody asks you anything, and nobody will, and you are thirteen years old and standing in the middle of it."),$e(600),D(void 0,"\u2014 THE ROLL, LA BAH\xCDA, 9 OCTOBER 1835 \u2014","Garrison, under Lt. Col. Francisco Sandoval: three killed. Seven wounded. Twenty-one taken. Volunteers, under Collinsworth: several wounded. None killed."),Ct("the roll of la bah\xEDa"),D(void 0,"Somebody writes it down before the sun is up, because somebody always does, and that is the only reason you will ever be able to say it back."),$e(400),D(void 0,"Morning. The river fog comes up to the walls and stops there."),D(void 0,"Forty-nine of them put their names to one page: that they are here to protect the people of this town from military domination, and that they say so in writing.","Some of them sign with a mark. You know what that means now."),Ct("the compact of volunteers"),D(void 0,"You cannot give an order and nobody will take one from you. You can carry a copy of somebody else\u2019s, and you have just watched one being made."),$e(400),D(void 0,"Two hundred miles east of here, at San Felipe, three men have spent this week setting type by hand. Their first number comes off the press in the morning."),D(void 0,"\u2014 TELEGRAPH AND TEXAS REGISTER, VOL. 1 NO. 1 \u2014","San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens. The first newspaper Texas manages to keep."),Ct("the first number"),D(void 0,"Not one word of tonight is in it. It went to press before any of this could reach them \u2014 and that is exactly why everything you are carrying had to be carried by somebody."),ge("surrendered"),D(void 0,"It is getting light. Somebody has opened the chapel and there are men being carried into it, and the priest who married those two yesterday is standing in the middle of the yard with his sleeves rolled up."),Nt("padre-yard")]},Qi={id:"bahia",name:"La Bah\xEDa",light:{base:-4,sources:[{tx:30,ty:10,r:5,gain:4},{tx:31,ty:15,r:5,gain:4},{tx:19,ty:19,r:6,gain:3},{tx:21,ty:1,r:5,gain:2},{tx:5,ty:21,r:4,gain:2},{tx:32,ty:16,r:4,gain:3}]},flashes:[{tx:38,ty:12,needs:"fought"},{tx:38,ty:19,needs:"fought"},{tx:33,ty:25,needs:"fought"},{tx:28,ty:25,needs:"fought"},{tx:24,ty:14,needs:"fought"},{tx:24,ty:19,needs:"fought"},{tx:27,ty:9,needs:"fought"},{tx:34,ty:9,needs:"fought"},{tx:30,ty:9,needs:"fought"}],attack:{needs:"fought",fighters:[{tx:38,ty:13,toX:36,toY:13,side:"volunteer"},{tx:38,ty:17,toX:36,toY:17,side:"volunteer"},{tx:38,ty:21,toX:36,toY:20,side:"volunteer"},{tx:31,ty:26,toX:30,toY:23,side:"volunteer"},{tx:35,ty:26,toX:34,toY:23,side:"volunteer"},{tx:27,ty:26,toX:28,toY:23,side:"volunteer"},{tx:26,ty:9,toX:29,toY:9,side:"volunteer"},{tx:36,ty:9,toX:34,toY:9,side:"volunteer"},{tx:28,ty:19,toX:29,toY:19,side:"garrison",killed:!0},{tx:33,ty:19,toX:34,toY:19,side:"garrison"},{tx:29,ty:11,toX:29,toY:11,side:"garrison",killed:!0},{tx:33,ty:11,toX:33,toY:11,side:"garrison"},{tx:27,ty:16,toX:27,toY:16,side:"garrison",killed:!0},{tx:34,ty
