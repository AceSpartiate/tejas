<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Tejas - Goliad and Presidio La Bahia, 2 to 9 October 1835. A Grade 7 Texas history game." />
<title>Tejas</title>
</head>
<body>
<meta charset="utf-8" />
<title>Tejas</title>

<script>
  // The viewport, set from script because this is published as a body
  // fragment and a <meta> parsed inside the body is ignored. Without it a
  // phone lays the game out in a 980px pretend-desktop and shrinks the whole
  // thing to a postage stamp. Written onto the host's own tag if it has one.
  (function () {
    try {
      var m = document.querySelector('meta[name="viewport"]');
      if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
      m.setAttribute('content',
        'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
    } catch (e) { /* a wrapper with no head is still a page the game can run in */ }
  })();
</script>

<style>
  /* One visual world on purpose: a handheld screen in a dark room. The ground
     is the game's own letterbox void. No theme blocks - a Game Boy does not
     have a light mode - but every colour is painted rather than inherited, so
     the page holds on whatever ground the host puts behind it. */
  html, body { margin: 0; padding: 0; background: #131110; }
  /* Fixed, not 100% tall. A percentage height needs an unbroken chain up to
     the root, and this page is a guest in a document it did not write. */
  /* Longhand offsets, not the inset shorthand: the shorthand is iOS 14.5+ and a stage
     that does not resolve a size is a page with nothing on it. */
  #tj-stage {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; align-items: center;
    justify-content: center; background: #131110; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* max-width defends the integer scale: a host reset that caps media at 100%
     would quietly resample the one thing in this project that may never be
     resampled. */
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    max-width: none !important; max-height: none !important;
  }
  /* Thumb controls are present but unseen until a finger arrives, so on a
     phone the first screen is a game with no visible way to play it. */
  #tj-hint {
    position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; z-index: 20;
    animation: tj-breathe 2.6s ease-in-out infinite;
  }
  [hidden] { display: none !important; }
  @keyframes tj-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #tj-hint { animation: none; opacity: 0.8; } }
  /* The boot notice. Plain HTML, on screen before a line of script runs, and
     taken away by the first frame that actually draws. If the game cannot
     start there is now something to read instead of a black rectangle -
     which is the whole difference between a bug report and a diagnosis. */
  #tj-boot {
    position: fixed; left: 16px; right: 16px; bottom: 50%; transform: translateY(50%);
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    z-index: 30; white-space: pre-wrap; word-break: break-word;
  }
  #tj-boot b { color: #b8463c; font-weight: 700; }
</style>

<div id="tj-stage">
  <canvas id="screen"></canvas>
</div>
<p id="tj-hint" hidden>Touch the screen for controls</p>
<p id="tj-boot">Loading Tejas...</p>

<script>
  // Registered before the game so it catches a parse error in it too.
  (function () {
    var boot = document.getElementById('tj-boot');
    var first = null;
    window.__tjFail = function (what) {
      if (!boot) return;
      // KEEP THE FIRST ONE. The later reports are consequences: the vitals
      // sweep runs on a timer and would cheerfully paint over the exception
      // that caused everything it is describing. Overwriting the first error
      // with a summary of its aftermath cost a whole debugging round.
      if (first !== null) return;
      first = String(what);
      boot.hidden = false;
      boot.innerHTML = '<b>Tejas is not drawing.</b>\n\n' + String(what);
    };
    window.addEventListener('error', function (e) {
      window.__tjFail((e && e.message) || 'unknown error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__tjFail((e && e.reason && e.reason.message) || 'unhandled rejection');
    });
  })();
</script>

/* The body. Two-tone, because a single flat slab reads as a div with a
   border-radius; the seam is what says "moulded in two halves". */
.tj-body { position: relative; width: 100%; height: 100%;
  max-width: 100%; max-height: 100%; min-width: 0; min-height: 0; display: flex;
  background: linear-gradient(${d[4]} 0 58%, ${d[3]} 58% 100%);
  border: 1px solid ${d[5]}; box-shadow: inset 0 1px 0 ${d[6]}, inset 0 -2px 6px ${d[1]}; }
.tj-shell[data-chassis="gbc"] .tj-body { flex-direction: column; align-items: center;
  border-radius: 18px 18px 42px 18px; padding: 14px 12px 12px; gap: 10px; }
.tj-shell[data-chassis="gba"] .tj-body { flex-direction: row; align-items: center;
  justify-content: space-between; border-radius: 78px / 46px; padding: 10px 22px; gap: 10px; }

/* The screen well: the void, inset, with the LCD centred in it. A real
   handheld has far more bezel than panel and the integer-scale rule produces
   exactly that on its own \u2014 whatever is left over after the largest whole
   multiple that fits is bezel, which is why this is dark rather than clever. */
.tj-well { background: ${d[0]}; display: grid; place-items: center;
  border: 2px solid ${d[2]}; box-shadow: inset 0 2px 8px #000; overflow: hidden;
  min-width: 0; min-height: 0; }
/* The well has a SHAPE, not "whatever height is going spare". Given the spare
   height on a modern phone it took all of it, and a 3:2 panel adrift in a well
   half again as tall reads as a game lost in a black column rather than as a
   screen set into plastic. */
/* No aspect-ratio here, deliberately. It is iOS 15+, and where it does not
   resolve the well has NO HEIGHT - and overflow:hidden then clips the game
   to nothing, which is a beautifully moulded case with a black screen in it.
   Flex alone always yields a real box; the proportion is applied afterwards
   as a max-height in px, which every browser has always understood and which
   can only ever make the well smaller, never zero. */
.tj-shell[data-chassis="gbc"] .tj-well { width: 100%; flex: 1 1 auto; min-height: 0;
  border-radius: 10px 10px 4px 4px; }
/* WIDTH 100%, and it is the whole of why the wide body had a tiny screen.
   flex 1-1-auto in a COLUMN governs height; across the column axis the well
   was shrink-to-fit, so it took the width of its only child \u2014 the canvas \u2014
   and Screen then measured the well to size that canvas. Each one asked the
   other and neither ever grew: a 542px column with a 244px screen in it,
   stuck at the floor scale no matter how big the phone was. */
.tj-shell[data-chassis="gba"] .tj-well { width: 100%; flex: 1 1 auto; min-height: 0;
  min-width: 0; border-radius: 8px; }
.tj-well > canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* Moulding: things that are shaped but not pressable. The wordmark, the
   speaker slots, the power lamp. They are what makes the silhouette read,
   and none of them is styled like a button, because a control that does
   nothing is worse than no control. */
.tj-mark { font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.22em; color: ${d[9]}; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.tj-lamp { width: 6px; height: 6px; border-radius: 50%; background: ${ye};
  box-shadow: 0 0 5px ${ye}; flex: 0 0 auto; }

/* Controls. Raised, coloured, and the only things here that move. */
.tj-deck { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 1 1 auto; min-width: 0; }
.tj-shell[data-chassis="gbc"] .tj-deck { padding: 0 2px; gap: 8px; }

/* Moulding under the screen: the wordmark left, the speaker right, the way
   the row of print under a handheld's panel actually sits. */
.tj-strip { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 0 0 auto; padding: 0 4px; gap: 10px; }

/* Sideways, the body is three columns: a hand, the screen, the other hand.
   Nothing but the well is in the middle column \u2014 a printed strip under the
   panel there is a row of moulding charging the screen its own height, on the
   one axis a wide body has none to spare. Sideways the print goes beside the
   hands, which is where a wide machine actually carries it. */
.tj-side { display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; flex: 0 0 auto; }
.tj-centre { display: flex; flex-direction: column; align-items: center;
  justify-content: center; flex: 1 1 auto; min-width: 0; height: 100%; }

/* The cross: four arms that are four switches. It was one hit area reading an
   angle from the centre, with a hub that slid toward the thumb, which is a
   joystick wearing a plus-shaped hat and read as one immediately. An arm
   lights when it is the one being pressed, and nothing on it ever slides. */
.tj-cross { position: relative; flex: 0 0 auto; touch-action: none; }
.tj-arm { position: absolute; background: ${d[2]}; border: 1px solid ${d[4]};

   Game Boy has. A third pill in this row was read on sight as a machine that
   is not the one it is drawn as \u2014 "there should only be a start and select
   button" was the first thing a player said about it. Each is printed with
   its name the way the real ones are, so the row states its own count. */
.tj-pills { display: flex; align-items: flex-start; gap: 12px; flex: 0 0 auto; }
.tj-pill-set { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tj-pill { position: relative; width: 34px; height: 8px; border-radius: 4px;
  background: ${d[2]}; border: 1px solid ${d[4]}; transform: rotate(-20deg);
  cursor: pointer; touch-action: none; }

.tj-pill::after { content: ""; position: absolute; inset: -11px -5px; }

.tj-shell[data-chassis="gbc"] .tj-pill.on { transform: rotate(-20deg) translateY(2px); }
.tj-shell[data-chassis="gba"] .tj-pill.on { transform: translateY(2px); }

/* The way to the pause menu, on the TOP EDGE \u2014 which is where a handheld puts
   a control that is not one of the six. A phone has no Escape key and the menu
   behind it holds the only route to the settings, the keybinds and the way
   back to the title, so it cannot simply be deleted; what it can stop doing is
   standing in the Start/Select row pretending to be a third pill. Sideways it
   is the right shoulder, which that machine really has. Upright it is the
   switch on the top edge, which that one really has too. Top right either way,
   the same corner the world prints ESC MENU in. */

.tj-shell[data-chassis="gba"] .tj-edge { right: 30px; width: 72px; height: 14px;

#####..#.........###..........",".......................####.####........................","......................###.#...###.......................","....................####...#.#.##.......................","..................#######.###..###......................",".................######..#####..##......................","...............####..###..###.####......................",".............#####....##.#.#...##.......................",".......#########......###...#.###.......................",".......#######.........####.####........................",".......#######..........#######.........................","########################################################","::::::::::::::::::::::::::::::::::::::::::::::::::::::::","::::::::::::::::::::::::::::::::::::::::::::::::::::::::"]};function Bi(o,t,e,n,a=p.outline){const s=Di[t];o.fillStyle=a;for(let h=0;h<bo;h++){const u=s[h];for(let w=0;w<po;w++){const g=u[w];if(g===".")continue;const c=e+w*ke,R=n+h*ke;if(g==="#"){o.fillRect(c,R,ke,ke);continue}for(let v=0;v<ke;v++)for(let C=0;C<ke;C++)c+C+R+v&1||o.fillRect(c+C,R+v,1,1)}}}const Yi={concepcion:{head:"NINETY MEN UNDER THE RIVER BANK",cut:"COLUMN",body:["On 27 October General Austin sent Colonel Bowie and Captain Fannin forward with about ninety men to find a camp nearer the town. They halted in a bend of the river below Mission Concepcion.","Cos sent Colonel Ugartechea against them with two hundred and seventy-five. The ninety were under the bank, in fog, firing upward at men standing in the open, and the Mexican force withdrew."]},"house-arrest":{head:"THREE MEN MAY NOT LEAVE THE TOWN",cut:"NOTICE",body:["By order of the General: Samuel A. Maverick, John W. Smith and A. C. Holmes are confined to San Antonio de Bexar and are not to quit it on any errand or at any hour until further order.","No charge is stated on the order, and none was ever brought. They are held because of where they are from."]},"seguin-company":{head:"A COMPANY RAISED IN THE TOWN ITSELF",cut:"RIDER",body:["Juan N. Seguin has raised a company from Bexar and from the ranches down the San Antonio river, and it is serving with the army now camped outside his own town.","Every man in it was born here. Most of them can name the family in every house on the plaza, which is worth more to an army in a street fight than a field gun."]},"grass-fight":{head:"A HUNDRED MULES AND NO SILVER",cut:"CART",body:["On the twenty-sixth of November a pack train was seen coming up the Alazan. The camp had been told for a fortnight that the garrison was expecting its pay, and every man who went out went out believing it.","The mules were carrying grass, cut for the horses in the town. The fight cost lives on both sides and the whole of what was taken was fodder."]},"let-out":{head:"RELEASED, AND WALKED OUT AT THE FORD",cut:"NOTICE",body:["On the first of December the order confining Maverick and Smith to the town was lifted. They went out by the ford and reached the army the same day.","They had been shut inside San Antonio for six weeks with nothing to do but look at it, and they came out knowing where every gun in it was laid."]},"maverick-diary":{head:"THE BOOK A PRISONER KEPT",cut:"PRESS",body:["A lawyer of Pendleton in South Carolina, shut in a house on the plaza and forbidden the street, wrote down what he could see from it. A gun on the roof of the priest\u2019s house. Ditches cut across the two streets from the north.","It is one of the few day-by-day records of the siege made while the siege was happening. Everything else anybody knows about these six weeks is a man remembering."]},"milam-call":{head:"WHO WILL GO WITH OLD BEN MILAM",cut:"COLUMN",body:["On the fourth of December, with the army half decided to break camp and go home for the winter, Colonel Milam is said to have called for volunteers in front of the whole camp. Three hundred answered.","Several men who were standing there wrote the sentence down afterwards and no two of them give it the same way. Some tellings have him draw a line on the ground with his boot. Others do not. The DAY is not in doubt; the words are."]},storming:{head:"INTO THE TOWN BEFORE IT WAS LIGHT",cut:"COLUMN",body:["Before dawn on the fifth of December two divisions went into Bexar, Milam on the right and Johnson on the left, while Burleson held the camp with four hundred men.","Nobody crossed the plaza. The plaza is what the guns are laid on. They went along the streets and then into the houses, and after the first morning they stopped using the streets at all."]},"johnson-division":{head:"THROUGH THE WALLS, NOT UP THE STREET",cut:"PRESIDIO",body:["The left division under Francis W. Johnson worked inward from the north. Where a street was swept by a gun they did not use the street: they went through the wall of the next house with crowbars and picks.","Four days of this, room by room, in somebody\u2019s kitchen and then somebody\u2019s store. It is the least famous kind of fighting and it is how the town was actually taken."]},"milam-killed":{head:"ONE SHOT, ON THE THIRD MORNING",cut:"NOTICE",body:["Benjamin Rush Milam was killed on the seventh of December by a rifle ball, in the yard of the Veramendi house on Soledad street, two days into the assault he had asked three hundred men to make.","He had escaped a prison at Monterrey earlier the same year and walked north into a war he did not know had started. He did not see the town taken and he is the reason it was."]},"veramendi-tree":{head:"NOBODY WROTE DOWN WHICH TREE",cut:"HEARTH",body:["That Milam was shot in the Veramendi yard is not in question, and that the shot came from a long way off is not either. Where the marksman was, and who he was, has been told a dozen ways.","A cypress by the ditch, say some. The roof of the priest\u2019s house, say others. People have said both in the same afternoon. Not one account of it was written on the day, so there is nothing left to check any of them against."]},"cos-terms":{head:"THE GENERAL ASKS FOR TERMS",cut:"PRESIDIO",body:["On the morning of the ninth of December, after four days of fighting from room to room, General Cos asked for terms. His force was paroled and marched south of the Rio Grande.","Five hundred of them came ashore at Copano in September and walked up this road in October. Now they walk back down it, and there is not a Mexican soldier left in Texas."]},"alamo-garrison":{head:"WHAT STAYS BEHIND IN THE MISSION",cut:"PRESIDIO",body:["With the town taken, most of the army goes home for the winter or south toward Matamoros. A garrison remains, and quarters itself in the old mission across the river that the Spanish fortified and everybody calls the Alamo.","A hundred-odd men, in a compound with no roof on the church, holding a town nobody expects to be attacked again."]},"word-tejas":{head:"THE NAME OF THE COUNTRY",cut:"NOTICE",body:["East of here live the Caddo. When the first Spanish parties reached them they were greeted with a word of their own \u2014 t\xE1ysha, meaning friends, or allies.","The Spaniards wrote the word down and used it for the whole province. For a hundred and fifty years this country has been called friends, and almost nobody who says it knows that."]},"colony-line":{head:"GRANT: THE COAST BETWEEN THE RIVERS",cut:"CART",body:["By the colonisation law of 1825 the state of Coahuila y Tejas contracts with empresarios, who bring in families and are paid in land. James Power and James Hewetson hold the coast.","On 12 April 1829 their grant is extended from the Guadalupe to the Nueces \u2014 which draws a line straight through country that Goliad families had been ranching for two generations.","Goliad lies outside their colony. Its people say their title is older. Both sides have paper, and the paper does not agree."]},"espiritu-herd":{head:"TALLY: THE MISSION HERD",cut:"CART",body:["Mission Esp\xEDritu Santo was moved to the north bank of this river in 1749, and the presidio to the south bank, one facing the other. That is the pair this town grew between.","It was a ranching mission. By 1788 the tallies run past fifteen thousand head of cattle, with horses, mules and sheep besides, and corn, cotton, melons and peaches in the fields.","That herd is why there is a hide yard here, and a carter, and a road worth forty miles of anybody's attention. The mission was secularised in 1830 and the cattle went on without it."]},"mark-signature":{head:"A MARK, IN PLACE OF A NAME",cut:"NOTICE",body:["On the civil registers of this province a man who cannot write draws his mark \u2014 a cross, or the brand he burns on his cattle \u2014 and two witnesses sign beside it.","The register takes it, and the law takes it. A man who cannot read a word of what he is agreeing to has still signed it, and can still be held to it."]},seamstress:{head:"ACCOUNT: SIX YARDS OF SILK",cut:"CART",body:["Bought in June. Cut, sewn over four months, and worn. The woman who made the dress kept the account for the cloth and can produce it.","She is answering a story that the dress was cut up to make a flag. It was not. Her paper is dated; the story is not, and that is the whole of the difference."]},circular:{head:"CIRCULAR \u2014 COMMITTEE OF SAFETY",cut:"NOTICE",body:["San Felipe de Austin, 19 September 1835. Issued by the Committee of Safety over the hand of Stephen F. Austin.","It warns that General Cos is coming into Texas with troops, and calls on every district to organise its militia.","At the foot it asks that whoever receives it copy it out and pass it on, and read it aloud to those who cannot read. There is no newspaper. This is how news travels."]},"copano-landing":{head:"FIVE HUNDRED MEN, AT COPANO",cut:"SHIP",body:["About the twentieth of September, General Mart\xEDn Perfecto de Cos came ashore at the port of Copano with something near five hundred soldiers.","It took days to put them all on the beach. From Copano there is one road inland, and it runs up through Goliad to B\xE9xar."]},"copano-road":{head:"THE ROAD FROM THE WATER",cut:"CART",body:["Forty miles from the port of Copano to this town, and on from here to B\xE9xar. Coffee, powder, cloth, iron \u2014 everything that reaches the interior comes up it.","There is no other road. Whoever holds Goliad holds what B\xE9xar eats, and that is why this small town has a fort in it and Victoria does not."]},"cos-here":{head:"THE GENERAL, AT LA BAH\xCDA",cut:"PRESIDIO",body:["On the first of October General Cos reached Goliad with the Morelos battalion and quartered in the presidio of La Bah\xEDa.","He is the brother-in-law of Santa Anna and he has come to put down the disturbances in Texas. For four days the highest authority in the province slept inside these walls."]},"rider-gonzales":{head:"REPORT FROM GONZALES",cut:"RIDER",body:["Carried by an express rider, and written down by nobody at the time. He gave it at a gallop and did not stop.","That the soldiers came to Gonzales for the little cannon the town was lent. That the town would not give it back. That there was firing on the second of October, and the soldiers went away again.","Nothing here is confirmed. It is one man\u2019s account of a thing that happened seventy miles off, and it is the only account anybody in this town has."]},"cos-gone":{head:"THE GARRISON MARCHES FOR B\xC9XAR",cut:"COLUMN",body:["On the fifth of October General Cos left Goliad for B\xE9xar with his honour guard and the Morelos battalion. He marched unmolested and arrived without a shot.","Word of the affair at Gonzales had reached him. What he left behind in the presidio was a holding garrison of some fifty men, in a work built for far more."]},"hatch-meeting":{head:"RESOLVED, AT MATAGORDA",cut:"HEARTH",body:["On the sixth of October some forty men of the Matagorda militia met at the house of Sylvanus Hatch.","Their first act was to elect a captain, and they elected George Collinsworth. Three days later there were near a hundred and twenty of them and they were on the Goliad road."]},"marriage-bond":{head:"ENTERED IN THE PARISH BOOK",cut:"HEARTH",body:["Nuestra Se\xF1ora de Loreto, at the presidio of La Bah\xEDa. Both names, both marks, two witnesses, and the day.","Away up the Brazos there is one priest for a country the size of Spain, so a couple sign a bond before their neighbours and live married until somebody like this one rides through. Both are documents. Only one of them is in a book."]},milam:{head:"A MAN LATELY OUT OF MONTERREY",cut:"RIDER",body:["Benjamin Milam, taken and held at Monterrey, is reported to have got out and come north until he fell in with men going the same way.","The accounts do not agree on the day he reached the Goliad party, and no paper anywhere gives one. That he is with them is not in doubt. When he arrived is."]},"roll-bahia":{head:"RETURN OF KILLED AND WOUNDED",cut:"PRESIDIO",body:["Presidio La Bah\xEDa, 9-10 October 1835. Of the garrison under Lieutenant Colonel Sandoval: three killed, seven wounded, twenty-one taken.","Of the volunteers: several wounded, none killed. Somebody counted, before the sun was up, and wrote the numbers on a page \u2014 which is the only reason anyone can say three instead of saying many."]},compact:{head:"COMPACT OF VOLUNTEERS",cut:"NOTICE",body:["Goliad, 9 October 1835. Signed by forty-nine of the men who took the presidio, under Captain George Collinsworth.","They declare themselves for the federal government of Mexico and against military rule, and undertake to do no harm to any person who remains loyal to it.","A good number of the forty-nine signed with a mark."]},"bexar-cut":{head:"NOTHING COMES UP THE ROAD",cut:"CART",body:["With Goliad taken, the road from Copano to B\xE9xar is shut, and the supplies and correspondence for the general\u2019s command stop with it.","Men may argue about who was right at Gonzales for a hundred years. Nobody can argue about the wagons. They are not arriving, and the date they stopped is on paper."]},telegraph:{head:"TELEGRAPH AND TEXAS REGISTER",cut:"PRESS",body:["Vol. 1, No. 1. San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens \u2014 Gail Borden Jr., Thomas H. Borden and Joseph Baker.","The first newspaper Texas manages to keep. It went to press the morning after the presidio fell, two hundred miles from it, and there is not one word of that night in it.","Everything this book holds was gathered in the week before this sheet existed."]},fandango:{head:"THE FANDANGO",cut:"HEARTH",body:["They danced until the candles went out. Everybody in this town will tell you so, and every one of them was there.","Not one of them wrote down which night. There is no bill, no register, no letter, and no date \u2014 so it cannot be set beside anything that has one.","That is not the same as saying it did not happen. It is worse than that. It means nobody, ever, can check."]},"cannon-receipt":{head:"RECEIVED: ONE PIECE OF ORDNANCE",cut:"CANNON",body:["In January 1831 Green DeWitt asked the authorities at B\xE9xar for a cannon. The colony had been attacked twice, the town had been abandoned once already, and it had nothing to answer a raid with.","The gun came up in March, and James Tumlinson, Jr., took delivery of it for the town. It was small \u2014 a six-pounder, Spanish, old. The condition was written down: it belonged to the government, and it would go back when the government called for it.","Nobody thought about that sentence again for four years."]},"dewitt-dead":{head:"DIED AT MONCLOVA",cut:"NOTICE",body:["Green DeWitt, who contracted in 1825 to settle four hundred families on the Guadalupe and who gave this colony its name, died at Monclova on 18 May 1835. Cholera, they say. He was buried in a grave with nothing on it.","He had gone down there to get more land. The colony heard weeks afterwards.","What that means in practice is that when the soldiers come for the cannon in September there is no empresario to send them to. There is an alcalde, elected, and there is a town meeting, and that is the whole of the government here."]},"dewitt-marriage":{head:"MARRIED, AT GONZALES",cut:"HEARTH",body:["In August 1835, at Gonzales, Naomi DeWitt \u2014 daughter of the late empresario and of Sarah Seely DeWitt \u2014 was married to William Matthews.","The month is recorded. The day is not, which is ordinary: this town has no priest and no parish book, and a wedding in a colony like this one is written into a family Bible or into nothing at all.","Six weeks later people will begin telling a story about what happened to her dress. Nothing about that story is written into anything."]},"corporal-demand":{head:"A CORPORAL, AND FIVE MEN",cut:"CANNON",body:["Colonel Ugartechea, commanding at B\xE9xar, wanted the cannon back. He did not send an army for it. He sent a corporal named De Le\xF3n and five soldiers, with an order in writing, forty miles across country, to collect one gun and bring it in.","They reached Gonzales about the twenty-fifth of September and asked for it politely, which tells you what B\xE9xar expected to happen.","The town called a meeting. Three men voted to hand it over. Everybody else voted not to."]},"ponton-reply":{head:"THE ALCALDE ANSWERS",cut:"NOTICE",body:["Andrew Ponton, alcalde of Gonzales, wrote to Ugartechea on 26 September 1835. He wrote that the gun was, as he had always been informed, given to this town in perpetuity for its defence against the Indians.","Then he wrote that a demand of this kind was properly a matter for the political chief of the department \u2014 and that the political chief was not there, and he could not say when he would be back.","Every line of it is an argument, and every line is also a delay. While it was written and while it was carried, riders went out to Mina, to Columbus, to every settlement within two days. That was the point."]},"castaneda-order":{head:"ONE HUNDRED DRAGOONS",cut:"COLUMN",body:["Ugartechea did not accept the answer. On 27 September he ordered Lieutenant Francisco de Casta\xF1eda out of B\xE9xar with about a hundred dragoons, to go and get the gun.","His orders were careful, and they are the reason this ends the way it does: recover the cannon, and do it without compromising the honour of Mexican arms. Which is to say \u2014 bring it back, and do not start a war over it.","A hundred men were sent to collect an object that six men had been sent to collect two days earlier. Nothing about the object had changed."]},"old-eighteen":{head:"MUSTER: THE MEN ON THE BANK",cut:"NOTICE",body:["When Casta\xF1eda reached the Guadalupe on 29 September the river was up, and every boat and the ferry itself had been taken over to the far side. On the east bank stood eighteen men of this town.","Arrington. Bennet. Bateman. Clements. Cottle. Darst. Davis. Dickinson. Fulchear. Fuqua. Hinds. Jackson. Martin. Mason. Miller. Sowell. Turner. Williams.","They were not there to win anything. They were there to be a reason to wait, and every hour they bought was an hour more for the riders. By the first of October there were a hundred and forty men in Gonzales."]},"orchard-burial":{head:"BURIED, IN A PEACH ORCHARD",cut:"CANNON",body:["While the town argued, the gun was taken out of the square, carried to George W. Davis\u2019s peach orchard, and put in a hole. The earth was raked back over it and the trees were left to look like trees.","It came out again a few days later, was scoured of rust, and was mounted on a pair of cart wheels taken off a cotton wagon.","There is no paper for any of this. Nobody writes a receipt for burying a cannon. What we have is men remembering it afterwards \u2014 which is why this sheet is marked as reported and not as dated, even though nobody doubts a word of it."]},"williams-camp":{head:"THE CAMP ON WILLIAMS\u2019S LAND",cut:"COLUMN",body:["Casta\xF1eda could not cross opposite the town: the river was high, the boats were gone, and the far bank had men on it. So on 1 October he broke camp and went up the Guadalupe looking for a ford he could use.","He stopped on land belonging to Ezekiel Williams, a colonist \u2014 who was at that moment standing on the riverbank in the town, being one of the eighteen.","A hundred men made camp in his field without asking him, because there was nobody there to ask."]},"first-shot":{head:"THE SECOND OF OCTOBER",cut:"CANNON",body:["They crossed in the dark on the night of the first, the gun on its cotton-wagon wheels, to come at the camp from behind.","Then the fog came down. A hundred and forty men lost each other in it and spent three hours finding a camp that was close by. Somewhere in that, the first shot of the revolution was fired, and nobody is sure who fired it.","When it lifted, the two sides could see each other. Castaneda asked to talk. Moore told him to surrender the field. He answered that he was a federalist himself and had no quarrel with them, but that he was a soldier with orders."]},"castaneda-report":{head:"THE LIEUTENANT WRITES TO B\xC9XAR",cut:"RIDER",body:["Castaneda reported twice, on the second of October and again on the fourth. He had a hundred men, there were a hundred and forty in front of him, and his orders were to recover the gun without compromising the honour of Mexican arms. He withdrew.","One or two of his soldiers were killed, depending which account you read. On the other side a man fell off his horse and bloodied his nose. That was the whole of the Texian casualties.","This is the best paper we have about the fight, and the man who wrote it lost it. The winners wrote almost nothing down. That happens more often than you would think."]},"come-and-take-it":{head:"COME AND TAKE IT",cut:"NOTICE",body:["Six feet of white cotton, a black cannon painted on it, a star, and four words. The most famous object in Texas.","The two reports the lieutenant filed do not mention a flag. Nor does anything else written at the time, on either side. The banner went to Bexar with the gun and was never seen again.","The first description of it was set down by Noah Smithwick, in a memoir dictated in his nineties and printed in 1900 -- sixty-five years after. That does not make it false. It makes it uncheckable, which is a different problem and a worse one."]},"naomi-dress":{head:"WHAT THE FLAG WAS MADE OF",cut:"HEARTH",body:["One account says Sarah Seely DeWitt and her daughter Evaline made the flag out of Naomi DeWitt's silk wedding dress, six weeks after the wedding.","Another says it was Evaline and Caroline Zumwalt, and that it was plain white cotton, painted.","Both are told, both are in books. Neither carries a date, neither names anybody who wrote it down at the time, and they disagree about the cloth, the women and the dress.","Somebody made a flag, probably. Past that, this is a story about a story \u2014 and the honest thing is to say so and go on telling it."]},"april-law":{head:"DECREE OF THE SIXTH OF APRIL",cut:"NOTICE",body:["Mexico City, 1830. Congress suspends further immigration into Texas from the United States, voids empresario contracts not yet filled, and orders customs houses and garrisons to collect the duties.","The colonies have paid no duty for years, under an exemption that has now run out. Every grievance anybody in Texas has for the next six years starts on this sheet."]},"customs-post":{head:"A GARRISON AT PERRY\u2019S POINT",cut:"PRESIDIO",body:["October 1830. Col. Juan Davis Bradburn puts a post on the bluff where the Trinity comes into Galveston Bay \u2014 the point every boat bound up to the settlements has to pass.","Bradburn is from Kentucky. He took Mexican service years ago, he is an officer of Mexico, and the men he is now collecting duty from are men he might have grown up beside."]},"convict-brick":{head:"BUILT OF ITS OWN GROUND",cut:"PRESIDIO",body:["The fort goes up in 1831 and 1832 in brick: a bastion with walls reported at seven feet through, mounting two eighteen-pounders, with barracks against it.","The clay is dug here and burned here, largely by convict labour, because there is no other way to get brick to this bluff.","Which is why there is a kiln standing empty in the yard, and why the most famous thing that happens here happens inside it."]},"white-herd":{head:"CATTLE ON TURTLE BAYOU",cut:"CART",body:["James Taylor White has run cattle out on the bayou since the twenties and is reckoned the first great cattleman in Texas.","Marsh grass will carry cattle where it will not carry a plough, which is the whole reason anybody is living out here at all \u2014 and why, when the colonists want somewhere to gather, they gather at his place."]},"three-who-ran":{head:"THREE PEOPLE WHO RAN",cut:"NOTICE",body:["Slavery is illegal in Mexico. In 1832 two or three people who had escaped from a man in Louisiana reach Anahuac, and Bradburn gives them shelter and work on the fort.","He is asked to hand them back. He refuses, on the grounds that under the law of this country there is nothing to hand back.","The record names the colonel, it names the lawyer, and it names the man in Louisiana. It does not name them."]},"logan-retainer":{head:"RETAINED, AT ANAHUAC",cut:"NOTICE",body:["William M. Logan comes across from Louisiana to recover what he says is his, and engages the young lawyer practising at Anahuac to do it for him.","The lawyer is twenty-two years old and his name is William Barret Travis. Four years from now every child in Texas will know it."]},"forged-letter":{head:"A LETTER THAT WAS NOT TRUE",cut:"RIDER",body:["A note reaches the colonel. A hundred armed men are coming up from Louisiana to take the fugitives by force; give them up and there will be no trouble.","There were no hundred men. Travis is generally supposed to have been behind it and it has never been established, and the note itself does not survive \u2014 so this paper is marked as reported rather than as dated."]},"travis-in-the-kiln":{head:"HELD, IN A BRICK KILN",cut:"PRESIDIO",body:["Travis and Patrick Jack are arrested in May 1832. The guardhouse is thought insecure, so they go into the brick kiln in the fort yard with a sentry on the mouth of it.","They are held by a soldier, on a soldier\u2019s say-so, with no charge before any court. That \u2014 not the kiln \u2014 is the complaint the colonists will put in writing."]},"tenth-of-june":{head:"THE NORTH END OF THE TOWN",cut:"COLUMN",body:["On 10 June 1832 armed colonists come in along the bay road and take the northern part of Anahuac. There is firing on and off for two days.","It is the first armed confrontation between Anglo colonists and Mexican troops in Texas, and almost nobody outside this bay has heard of it."]},"turtle-bayou":{head:"RESOLVED, AT TURTLE BAYOU",cut:"NOTICE",body:["Four resolutions, adopted at James Taylor White\u2019s place in June 1832. They condemn the Bustamante government for violating the constitution of 1824 \u2014 and they pledge support to Gen. Antonio Lopez de Santa Anna, who is in arms for it.","Read that twice. In 1832 these men are not asking to leave Mexico. They are declaring for a Mexican constitution and a Mexican general, by name, in writing.","The document bears no signatures at all, and the sources give its date as the fifth, the twelfth and the thirteenth."]},velasco:{head:"THE FIGHT AT VELASCO",cut:"SHIP",body:["Colonists bringing a cannon down the Brazos to Anahuac find the garrison at Fort Velasco in the way, and on 26 June 1832 they take it. The garrison gives in when its ammunition runs out.","A few dozen men are killed or hurt between the two sides. This is the part of the summer that is not an argument."]},piedras:{head:"THE COLONEL IS RELIEVED",cut:"COLUMN",body:["Col. Jose de las Piedras comes down from Nacogdoches, listens for a day, agrees terms on the twenty-eighth of June, and takes the command away from Bradburn.","On the first and second of July the prisoners are handed over to the civil authorities and let go. Nobody is ever tried for any of it."]},"mexia-brazoria":{head:"PRESENTED, AT BRAZORIA",cut:"SHIP",body:["Gen. Jose Antonio Mexia arrives with ships and men to put down what has been reported to him as a rebellion against Mexico.","On 18 July 1832 he is handed the resolutions, under a covering sheet with seven names on it. He reads it, decides there has been no rebellion, and takes his fleet home.","Seven signatures on the cover. None at all on the resolutions themselves."]},"man-in-the-cloak":{head:"THE MAN IN THE CLOAK",cut:"RIDER",body:["The note is said to have come to the gate after dark, carried by a man muffled up so the sentry could not name him afterwards.","Every account of this affair tells it. Not one of them names him, not one of them was written at the time, and the note does not survive.","So it cannot be put in order with things that can. That is not the same as it being untrue \u2014 it is worse, because nobody can ever check."]}},En={documented:{short:"DATED",long:"Dated, on paper",color:p.positive},traditional:{short:"NO DATE",long:"Told, never dated",color:p.alert},uncertain:{short:"REPORTED",long:"Dated by report only",color:p.uiLabel}};function Bt(o){return En[o]}function Ki(o){return o.map(t=>ge({},t))}const L={x:4,y:4,w:k-8,h:W-8},Yt={w:Math.round(L.w/2),h:Math.round(L.h/2)},An=Math.round((k-po*ke)/2),Ro=34,On=Ro+bo*ke+8,Sn=5,Gi=H+1,Wi=L.w-16,In=10,Nn=46;class ko{constructor(t,e,n=!0){m(this,"card");m(this,"sheet");m(this,"closed",!1);m(this,"phase");m(this,"opened");m(this,"at",0);m(this,"pages");var a;this.card=t,this.sheet=(a=Yi[t.id])!=null?a:To,this.opened=e,this.phase=n?"unfold":"read",this.pages=Fi(this.sheet.body)}get showing(){return this.phase}get page(){return this.at}update(t,e){if(this.phase==="unfold"){(e-this.opened>=In*Nn||t.pressed("confirm"))&&(this.phase="read");return}if(t.pressed("cancel")){this.closed=!0;return}t.pressed("confirm")&&(this.at++,this.at>=this.pages.length&&(this.closed=!0))}draw(t,e){if(this.phase==="unfold"){this.drawUnfold(t,e);return}Ie(t,L.x,L.y,L.w,L.h),this.drawCreases(t),this.drawHead(t);const n=An-4,a=Ro-4,s=po*ke+8,h= 275. The Texians held the riverbank below Mission Concepci\xF3n and the Mexican force withdrew.",line:"Ninety men in a bend of the river, firing from under the bank, against two hundred and seventy-five in the open.",when:{day:18351028,short:"28 OCT",shown:"28 OCTOBER 1835",place:"B\xE9xar"}},"three men confined to the town":{id:"house-arrest",title:"Three men confined to the town",standing:"documented",citation:"General Mart\xEDn Perfecto de Cos placed Samuel A. Maverick, John W. Smith and A. C. Holmes under house arrest at San Antonio and forbade them to leave the town.",line:"These three are not to quit the town, on any errand, at any hour, until further order.",when:{day:18351001,short:"OCT",shown:"OCTOBER 1835 \u2014 NO DAY",place:"B\xE9xar"}},"the company of juan seguin":{id:"seguin-company",title:"The company of Juan Segu\xEDn",standing:"documented",citation:"Juan N. Segu\xEDn raised a company of Tejano volunteers from B\xE9xar and the ranches on the San Antonio River, which served with the Texian army through the siege.",line:"The men in this company were born in the town the army is besieging, and most of them can name the family in every house on the plaza.",when:{day:18351101,short:"NOV",shown:"AUTUMN 1835 \u2014 NO DAY",place:"B\xE9xar"}},"the grass fight":{id:"grass-fight",title:"The grass fight",standing:"documented",citation:"On 26 November 1835 a Texian force under James Bowie attacked a Mexican pack train near Alaz\xE1n Creek in the belief that it carried silver for the garrison. The train was carrying cut grass for the horses.",line:"A hundred mules came up the Alaz\xE1n and every man in this camp knew what was on them, and every man was wrong.",when:{day:18351126,short:"26 NOV",shown:"26 NOVEMBER 1835",place:"Alaz\xE1n Creek"}},"let out of the town":{id:"let-out",title:"Let out of the town",standing:"documented",citation:"Maverick and John W. Smith were released from confinement at San Antonio on 1 December 1835 and reached the Texian camp, carrying what they had spent six weeks under arrest learning about the town.",line:"Released this day. Walked out at the ford and did not look back until the second bend.",when:{day:18351201,short:"1 DEC",shown:"1 DECEMBER 1835",place:"B\xE9xar"}},"the diary of a man under arrest":{id:"maverick-diary",title:"The diary of a man under arrest",standing:"documented",citation:"Samuel A. Maverick, a lawyer of Pendleton, South Carolina, kept a diary through his confinement at San Antonio. It is one of the primary sources for the siege of B\xE9xar.",line:"A house on the plaza. A gun on the roof of the priest\u2019s house. Ditches across the two streets that come in from the north.",when:{day:18351201,short:"1 DEC",shown:"1 DECEMBER 1835",place:"B\xE9xar"}},"who will go with old ben milam":{id:"milam-call",title:"Who will go with old Ben Milam",standing:"uncertain",citation:"Reported by several men who were present in camp on 4 December 1835, all of them writing afterwards, and no two of them giving the words the same way. Benjamin Rush Milam had escaped a prison at Monterrey earlier that year.",line:"He is supposed to have drawn a line on the ground with the toe of his boot. That part is in some tellings and not in others.",when:{day:18351204,short:"4 DEC",shown:"4 DECEMBER 1835 \u2014 REPORTED",place:"the camp"}},"the storming of bexar":{id:"storming",title:"The storming of B\xE9xar",standing:"documented",citation:"The assault began before dawn on 5 December 1835. Milam led the right division and Francis W. Johnson the left; Burleson held the camp with some four hundred men in support. The attack went house to house rather than across the plaza.",line:"Two columns, into the streets, before it was light. Nobody crossed the open ground, because the open ground is what the guns are laid on.",when:{day:18351205,short:"5 DEC",shown:"5 DECEMBER 1835",place:"B\xE9xar"}},"the left division":{id:"johnson-division",title:"The left division",standing:"documented",citation:"Francis W. Johnson commanded the left of the two assault divisions on 5 December 1835. The two columns worked inward from the north through the walls of the houses themselves, breaking from room to room with crowbars and picks.",line:"They did not fight up the street. They fought THROUGH the houses, one wall at a time, and the street never saw them.",when:{day:18351205,short:"5 DEC",shown:"5 DECEMBER 1835",place:"B\xE9xar"}},"milam is killed":{id:"milam-killed",title:"Milam is killed",standing:"documented",citation:"Benjamin Rush Milam was killed on 7 December 1835 by a rifle shot, in the yard of the Veramendi house on Soledad Street, two days into the assault he had called for.",line:"One shot, in a yard, on the third morning. He did not see the town taken and he is the reason it was.",when:{day:18351207,short:"7 DEC",shown:"7 DECEMBER 1835",place:"B\xE9xar"}},"the tree in the veramendi yard":{id:"veramendi-tree",title:"The tree in the Veramendi yard",standing:"traditional",citation:"Everybody agrees Milam was shot in the Veramendi yard and that the shot came from a distance. Which tree the marksman was in, and who he was, has been told a dozen ways and settled by nobody. No account of it was written on the day.",line:"A cypress by the ditch, they say. Others say the roof of the priest\u2019s house. Somebody has said both in the same afternoon."},"the general asks for terms":{id:"cos-terms",title:"The general asks for terms",standing:"documented",citation:"On the morning of 9 December 1835, after four days of house-to-house fighting, General Cos requested terms. Under the capitulation his force was paroled and withdrew south of the Rio Grande.",line:"Five hundred men walked out of this town under parole, and every last one of them had come ashore at Copano in September.",when:{day:18351209,short:"9 DEC",shown:"9 DECEMBER 1835",place:"B\xE9xar"}},"the garrison stays in the alamo":{id:"alamo-garrison",title:"The garrison stays in the Alamo",standing:"documented",citation:"After the capitulation most of the Texian army went home or south toward Matamoros. A garrison remained at B\xE9xar and occupied the old mission across the river, which the Spanish had fortified and everybody called the Alamo.",line:"The army that took this town is leaving it. What stays behind is a hundred-odd men in a mission with no roof on the church.",when:{day:18351215,short:"DEC",shown:"DECEMBER 1835 \u2014 NO DAY",place:"B\xE9xar"}}},Pi={"the receipt for the cannon":{id:"cannon-receipt",title:"The receipt for the cannon",standing:"documented",citation:"Green DeWitt petitioned Mexican authorities at B\xE9xar for a cannon in January 1831; James Tumlinson, Jr., received it for the town in March 1831, on the condition that it be returned when called for.",line:"One small cannon, for the defence of this town against the Indians, to be given back when it is asked for. Somebody signed for it.",when:{day:18310300,short:"1831",shown:"MARCH 1831",place:"Gonzales"}},"the empresario is dead":{id:"dewitt-dead",title:"The empresario is dead",standing:"documented",citation:"Green DeWitt, empresario of DeWitt's Colony, died at Monclova on 18 May 1835, probably of cholera, and was buried in an unmarked grave.",line:"The man whose name is on this colony died in Monclova in the spring, and the town he laid out heard about it weeks afterwards.",when:{day:18350518,short:"18 MAY",shown:"18 MAY 1835",place:"Monclova"}},"the dewitt wedding":{id:"dewitt-marriage",title:"The DeWitt wedding",standing:"documented",citation:"Naomi DeWitt, daughter of Green and Sarah Seely DeWitt, married William Matthews at Gonzales in August 1835. The month is recorded; the day is not.",line:"Married in August, in this town, six weeks before any of it. That much is written down. What happened to the dress afterwards is not.",when:{day:18350800,short:"AUG",shown:"AUGUST 1835 \u2014 NO DAY",place:"Gonzales"}},"the corporal asks":{id:"corporal-demand",title:"The corporal asks",standing:"documented",citation:"Col. Domingo de Ugartechea, commanding at B\xE9xar, sent Corporal De Le\xF3n with five soldiers to collect the cannon; they reached Gonzales about 25 September 1835 and were refused.",line:"Five soldiers and a corporal, sent forty miles to collect one gun, carrying an order and no idea what they are riding into.",when:{day:18350925,short:"25 SEP",shown:"25 SEPT 1835",place:"Gonzales"}},"the alcalde says no":{id:"ponton-reply",title:"The alcalde says no",standing:"documented",citation:'Alcalde Andrew Ponton to Col. Domingo de Ugartechea, Gonzales, 26 September 1835. Ponton wrote that the cannon "was as I have always been informed given in perpetuity to this Town for its defence against the Indians", and referred the demand to a political chief who was not there.',line:"Given to this town in perpetuity, for its defence against the Indians. And the man who could overrule me is away, and I could not say when he returns.",when:{day:18350926,short:"26 SEP",shown:"26 SEPT 1835",place:"Gonzales"}},"the order out of bexar":{id:"castaneda-order",title:"The order out of B\xE9xar",standing:"documented",citation:"Ugartechea ordered Lt. Francisco de Casta\xF1eda to Gonzales with about one hundred dragoons. They left B\xE9xar on 27 September 1835, under instructions to recover the gun without compromising the honour of Mexican arms.",line:"A hundred dragoons for one small gun, and an order that says: get it back, and do not start anything.",when:{day:18350927,short:"27 SEP",shown:"27 SEPT 1835",place:"B\xE9xar"}},"the eighteen at the ford":{id:"old-eighteen",title:"The eighteen at the ford",standing:"documented",citation:'The "Old Eighteen": W. W. Arrington, Valentine Bennet, Simeon Bateman, Joseph D. Clements, Almon Cottle, Jacob C. Darst, George W. Davis, Almeron Dickinson, Graves Fulchear, Benjamin Fuqua, James Hinds, Thomas Jackson, Albert Martin, Charles Mason, Thomas R. Miller, John Sowell, Winslow Turner and Ezekiel Williams, who held the east bank of the Guadalupe on 29 September 1835.',line:"Eighteen men, a river running high, and every boat on this side of it. Count us. Then count how long you are prepared to wait.",when:{day:18350929,short:"29 SEP",shown:"29 SEPT 1835",place:"the Guadalupe"}},"the cannon in the orchard":{id:"orchard-burial",title:"The cannon in the orchard",standing:"uncertain",citation:"Reported afterwards by men who were there: the cannon was buried in George W. Davis's peach orchard at Gonzales about 29 September 1835 and dug up again before the fight. No contemporary document records it \u2014 nobody files paper for burying a gun.",line:"Under the peach trees, in a shallow hole, with the earth raked back over it. Three men know where. None of them wrote it down.",when:{day:18350929,short:"29 SEP?",shown:"29 SEPT 1835",place:"Davis's orchard"}},"the camp upriver":{id:"williams-camp",title:"The camp upriver",standing:"documented",citation:"Unable to cross opposite the town, Casta\xF1eda moved his camp on 1 October 1835 to land belonging to the colonist Ezekiel Williams, some miles up the Guadalupe.",line:"He could not cross here, so he went looking for somewhere he could, and made camp on a man's field without asking the man.",when:{day:18351001,short:"1 OCT",shown:"1 OCT 1835",place:"Ezekiel Williams's land"}},"the first shot":{id:"first-shot",title:"The first shot",standing:"documented",citation:"The engagement of 2 October 1835 on the west bank of the Guadalupe. Accounts give one or two Mexican soldiers killed; the only Texian hurt was a man whose horse threw him, who bloodied his nose.",line:"They crossed in the dark, lost each other in fog for three hours, and fired the first shot of the revolution at a camp they could not see.",when:{day:18351002,short:"2 OCT",shown:"2 OCT 1835",place:"the Guadalupe"}},"the lieutenant's report":{id:"castaneda-report",title:"The lieutenant's report",standing:"documented",citation:"Lt. Francisco de Casta\xF1eda reported the affair to Ugartechea twice, on 2 and 4 October 1835. He wrote that since his orders were to withdraw without compromising the honour of Mexican arms, he did so.",line:"My orders were to recover the gun without compromising the honour of Mexican arms. I withdrew. I am at a loss to add anything further.",when:{day:18351004,short:"4 OCT",shown:"4 OCT 1835",place:"on the road to B\xE9xar"}},"come and take it":{id:"come-and-take-it",title:"Come and take it",standing:"traditional",citation:`No contemporary document mentions a flag at Gonzales, and Casta\xF1eda's reports do not. The banner was said to have been carried toward B\xE9xar with the gun and was lost. The earliest description in print is Noah Smithwick's "The Evolution of a State", dictated in his nineties and published in 1900 \u2014 sixty-five years afterwards.`,line:"White cotton, a black cannon, one star, and four words. Every child in Texas can draw it from memory. Nobody wrote it down for sixty-five years."},"the dress and the cotton":{id:"naomi-dress",title:"The dress, and the cotton",standing:"traditional",citation:"One account has Sarah Seely DeWitt and her daughter Evaline making the flag from Naomi DeWitt's wedding dress; another has Evaline and Caroline Zumwalt painting a length of plain white cotton. Both are told, neither is dated, and they do not agree.",line:"A silk wedding dress, says one. Six feet of plain cotton, says another. They cannot both be right and there is no way left to find out which."}},_i={"the law of the sixth of april":{id:"april-law",title:"The law of the sixth of April",standing:"documented",citation:"Decree of the Mexican Congress, 6 April 1830. It suspended further immigration from the United States into Texas, voided unfilled empresario contracts, and provided for customs houses and garrisons to enforce the tariff.",line:"No more of them are to come in from the north. The duties will be collected. Soldiers will be posted to see that they are.",when:{day:18300406,short:"6 APR",shown:"6 APRIL 1830",place:"Mexico City"}},"a post at the mouth of the trinity":{id:"customs-post",title:"The post on the Trinity",standing:"documented",citation:"Col. Juan Davis Bradburn established the garrison at Anahuac in October 1830, on the bluff at Perry's Point where the Trinity River enters Galveston Bay, to enforce the law of 6 April 1830.",line:"On the bluff, where the river comes into the bay, where every boat going up to the settlements has to pass and can be stopped.",when:{day:18301e3,short:"OCT",shown:"OCTOBER 1830 \u2014 NO DAY",place:"Anahuac"}},"the fort is made of its own ground":{id:"convict-brick",title:"Built of its own ground",standing:"documented",citation:"Fort Anahuac was raised in 1831 and 1832 in brick \u2014 a bastion with walls reported at seven feet thick mounting two eighteen-pounders, and adjoining barracks \u2014 built substantially by convict labour, with the brick fired on site.",line:"They dug the clay here, they burned it here, and they laid it here. The kiln is still standing in the yard because they have not finished building yet.",when:{day:1831e4,short:"1831",shown:"1831 \u2014 NO MONTH",place:"Anahuac"}},"the cattle on turtle bayou":{id:"white-herd",title:"The cattle on Turtle Bayou",standing:"documented",citation:"James Taylor White ran cattle on Turtle Bayou from the 1820s and is generally reckoned the first great cattle rancher in Texas. His place is where the colonists gathered in June 1832.",line:"Marsh grass, all the way to the bay, and it will carry cattle where it will not carry a plough. That is why anybody is out here at all.",when:{day:1828e4,short:"1820s",shown:"THE 1820s",place:"Turtle Bayou"}},"three people who ran":{id:"three-who-ran",title:"Three people who ran",standing:"documented",citation:"Slavery had been abolished in Mexico. In 1832 two or three people who had escaped from William M. Logan of Louisiana reached Anahuac; Bradburn gave them shelter, put them to work on the fort, and refused to return them.",line:"They came in off the road and the colonel would not give them up, because under the law of this country there was nothing to give up.",when:{day:18320500,short:"MAY",shown:"MAY 1832 \u2014 NO DAY",place:"Anahuac"}},"a lawyer is retained":{id:"logan-retainer",title:"A lawyer is retained",standing:"documented",citation:"William M. Logan of Louisiana engaged William B. Travis, a young lawyer then practising at Anahuac, to recover the people who had escaped from him. Travis was twenty-two.",line:"A man from Louisiana comes across looking for property that is not property here, and hires the only lawyer in town to go and get it.",when:{day:18320501,short:"MAY",shown:"MAY 1832 \u2014 NO DAY",place:"Anahuac"}},"the letter that was not true":{id:"forged-letter",title:"The letter that was not true",standing:"uncertain",citation:"A note reached Bradburn warning that a hundred armed men under Logan were coming from Louisiana to take the fugitives by force. It was false. Travis is generally supposed to have been behind it; it has never been established, and the note itself does not survive.",line:"A hundred men are coming up from Louisiana for what you are holding. Give them up and there will be no trouble. \u2014 And there were no hundred men.",when:{day:18320510,short:"MAY?",shown:"MAY 1832 \u2014 REPORTED",place:"Anahuac"}},"the lawyer goes into the kiln":{id:"travis-in-the-kiln",title:"The lawyer goes into the kiln",standing:"documented",citation:"Bradburn arrested William B. Travis and Patrick C. Jack in May 1832 and held them, with others, in a brick kiln in the fort yard, the guardhouse being thought insecure. They were held under military rather than civil authority, which became the colonists' central complaint.",line:"There was nowhere to put them. So they were put in the kiln, which is a brick oven with the fire out, and a sentry on the mouth of it.",when:{day:18320517,short:"17 MAY",shown:"17 MAY 1832",place:"Anahuac"}},"the tenth of june":{id:"tenth-of-june",title:"The tenth of June",standing:"documented",citation:"On 10 June 1832 armed colonists occupied the northern part of Anahuac and skirmished with the garrison over the following two days \u2014 the first armed confrontation between Anglo colonists and Mexican troops in Texas.",line:"They came in along the bay road and took the north end of the town, and for two days nobody could cross the square without being shot at.",when:{day:18320610,short:"10 JUN",shown:"10 JUNE 1832",place:"Anahuac"}},"the turtle bayou resolutions":{id:"turtle-bayou",title:"The Turtle Bayou Resolutions",standing:"uncertain",citation:"Adopted by colonists gathered at Turtle Bayou near James Taylor White's place. Four resolutions condemning the Bustamante government's violations of the Constitution of 1824 and pledging support to Gen. Antonio L\xF3pez de Santa Anna's federalist rising. The document bears no signatures, and sources give the date as the fifth, the twelfth and the thirteenth of June 1832.",line:"We are not rebels against Mexico. We are for the constitution of eighteen twenty-four, and we are for General Santa Anna, who is fighting for it.",when:{day:18320612,short:"12 JUN?",shown:"JUNE 1832 \u2014 DISPUTED",place:"Turtle Bayou"}},velasco:{id:"velasco",title:"Velasco",standing:"documented",citation:"On 26 June 1832 colonists moving a cannon down the Brazos to Anahuac fought the Mexican garrison at Fort Velasco. The garrison surrendered after running short of ammunition. Casualties on both sides ran to a few dozen.",line:"They wanted to bring a gun round by sea and there was a fort in the way, so they took the fort. That is the part of this summer that got people killed.",when:{day:18320626,short:"26 JUN",shown:"26 JUNE 1832",place:"Velasco"}},"the colonel is removed":{id:"piedras",title:"The colonel is removed",standing:"documented",citation:"Col. Jos\xE9 de las Piedras came down from Nacogdoches, agreed terms with the colonists on 28 June 1832, relieved Bradburn of command, and on 1 and 2 July released the prisoners to the civil authorities.",line:"A senior officer rode down, listened for a day, took the command off him, and let the men out. Nobody was tried for anything.",when:{day:18320702,short:"2 JUL",shown:"2 JULY 1832",place:"Anahuac"}},"handed to mexia at brazoria":{id:"mexia-brazoria",title:"Handed to Mex\xEDa at Brazoria",standing:"documented",citation:"On 18 July 1832 the resolutions, with a covering statement signed by Wyly Martin, John Austin, Luke Lesassier, William H. Jack, Hugh B. Johnston, Francis W. Johnson and Robert M. Williamson, were presented at Brazoria to Gen. Jos\xE9 Antonio Mex\xEDa \u2014 who had come to put down a rebellion and went away satisfied there had not been one.",line:"Seven names on the covering sheet, and none at all on the resolutions themselves. He read it, and he took the fleet home.",when:{day:18320718,short:"18 JUL",shown:"18 JULY 1832",place:"Brazoria"}},"the man in the cloak":{id:"man-in-the-cloak",title:"The man in the cloak",standing:"traditional",citation:"The note is said to have been brought to the fort after dark by a man muffled in a cloak so that the sentry could not name him afterwards. The story is told in every account of the affair. No account names him, none is contemporary, and the note does not survive.",line:"Somebody walked up to that gate in the dark with his face covered and handed a lie to a colonel. Everybody knows the story. Nobody knows the man."}};function Kt(o,t){return Object.fromEntries(Object.entries(o).map(([e,n])=>[e,vt(ge({},n),{session:t})]))}const Li={"the word tejas":{id:"word-tejas",title:"The name of the country",standing:"documented",citation:'Caddo t\xE1ysha, "friend"; written down by Spanish expeditions from the 1680s.',line:"The people already here said a word that meant friends, and the men writing it down kept it for the whole country.",when:{day:168e5,short:"1680s",shown:"THE 1680s",place:"the Caddo country"}},"the colony line":{id:"colony-line",title:"The colony line",standing:"documented",citation:"Power and Hewetson's empresario grant, extended from the Guadalupe to the Nueces, 12 April 1829; Goliad families claimed prior title within it.",line:"The line runs from one river to the other, and this house is on the wrong side of it depending on who you ask.",when:{day:18290412,short:"1829",shown:"12 APRIL 1829",place:"Coahuila y Tejas"}},"the mission herd":{id:"espiritu-herd",title:"The mission herd",standing:"documented",citation:"Mission Nuestra Se\xF1ora del Esp\xEDritu Santo de Z\xFA\xF1iga, on the north bank opposite the presidio since 1749: over fifteen thousand head of cattle by 1788. Secularised in 1830.",line:"Fifteen thousand head, counted, in a column, by men who had to feed them. That is not a church. That is a business with a bell on it.",when:{day:1788e4,short:"1788",shown:"1788 \u2014 NO MONTH",place:"Misi\xF3n Esp\xEDritu Santo"}},"a mark for a signature":{id:"mark-signature",title:"A mark for a signature",standing:"documented",citation:"Marks and brands entered in place of signatures on Texas civil registers, 1835.",line:"He cannot write his name, so he draws his brand, and the register takes it. A man who cannot read still signs.",when:{day:1835e4,short:"1835",shown:"1835 \u2014 NO MONTH",place:"Goliad"}},"a seamstress's objection":{id:"seamstress",title:"A bill for six yards of silk",standing:"documented",citation:"The cloth account of the woman who made the dress, against the story told about it.",line:"Bought in June and finished in August, and the girl wore it. It was never cut up for anybody. Here is what it cost.",when:{day:18350600,short:"JUN",shown:"JUNE 1835",place:"Goliad"}},"the circular":{id:"circular",title:"Committee of Safety circular",standing:"documented",citation:"Circular of the Committee of Safety, San Felipe, 19 September 1835, written by Stephen F. Austin. Texas State Library.",line:"Forward this and read it to as many as will hear it. There is no other way to tell anybody anything.",when:{day:18350919,short:"19 SEP",shown:"19 SEPT 1835",place:"San Felipe de Austin"}},"the landing at copano":{id:"copano-landing",title:"The landing at Copano",standing:"documented",citation:"General Mart\xEDn Perfecto de Cos came ashore at the port of Copano about 20 September 1835 with roughly five hundred men.",line:"Five hundred of them off the boats in one week, and every one of them has to walk up this road to get anywhere.",when:{day:18350920,short:"20 SEP?",shown:"ABOUT 20 SEPT 1835",place:"the port of Copano"}},"the copano road":{id:"copano-road",title:"The Copano road",standing:"documented",citation:"A carter's account of the freight road from the port of Copano to B\xE9xar.",line:"Everything that reaches B\xE9xar comes up this road. Count the loads a week and you know what B\xE9xar has got.",when:{day:18350900,short:"SEP",shown:"SEPT 1835 \u2014 NO DAY",place:"the Copano road"}},"the general in the fort":{id:"cos-here",title:"The general, in this fort",standing:"documented",citation:"Cos reached Goliad on 1 October 1835 and quartered at Presidio La Bah\xEDa with the Morelos battalion.",line:"He slept in this building. You can be shown the room. That is eight days ago and nobody has swept it.",when:{day:18351001,short:"1 OCT",shown:"1 OCT 1835",place:"Presidio La Bah\xEDa"}},"what the rider said":{id:"rider-gonzales",title:"What the rider shouted",standing:"uncertain",citation:"The account carried to Goliad by express rider of the fight over the cannon at Gonzales, 2 October 1835.",line:"They would not give the gun back, and there was firing, and the soldiers went away again. That is what he had.",when:{day:18351002,short:"2 OCT?",shown:"2 OCT 1835, BY REPORT",place:"carried from Gonzales"}},"the general marches out":{id:"cos-gone",title:"The general marches out",standing:"documented",citation:"Cos left Goliad on 5 October 1835 with his honour guard and the Morelos battalion and marched for B\xE9xar unmolested.",line:"He took the good companies with him and left what would fit in the walls. Four days ago.",when:{day:18351005,short:"5 OCT",shown:"5 OCT 1835",place:"Presidio La Bah\xEDa"}},"the meeting at matagorda":{id:"hatch-meeting",title:"The meeting at Hatch's house",standing:"documented",citation:"Militia from Matagorda met at Sylvanus Hatch's home on 6 October 1835 and elected George Collinsworth their captain.",line:"Forty of them in a front room, and the first thing they did was vote on who was in charge of them.",when:{day:18351006,short:"6 OCT",shown:"6 OCT 1835",place:"Sylvanus Hatch's house, Matagorda"}},"the marriage bond":{id:"marriage-bond",title:"The marriage bond",standing:"documented",citation:"Parish marriage records, Nuestra Se\xF1ora de Loreto, Presidio La Bah\xEDa.",line:"It is written in the book with both their names and the date. That is not a story about them. That is them.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Nuestra Se\xF1ora de Loreto"}},"milam, lately out of monterrey":{id:"milam",title:"Milam, out of Monterrey",standing:"uncertain",citation:"Contemporary reports of Benjamin Milam reaching the Goliad party after escaping imprisonment at Monterrey.",line:"The man was in a Mexican prison a month ago. Nobody agrees on the day he turned up.",when:{day:18351e3,short:"OCT?",shown:"EARLY OCT 1835, THEY SAY",place:"somewhere on the Guadalupe"}},"the roll of la bah\xEDa":{id:"roll-bahia",title:"The roll of La Bah\xEDa",standing:"documented",citation:"Casualty return, the taking of Goliad, 9-10 October 1835: three killed, seven wounded, twenty-one taken.",line:"Three killed, seven wounded, twenty-one taken. Somebody counted, and this is the paper they counted on.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Presidio La Bah\xEDa"}},"the compact of volunteers":{id:"compact",title:"The Compact of Volunteers",standing:"documented",citation:"The Compact of Volunteers under Collinsworth, signed at Goliad, 9 October 1835, by forty-nine of the men who took it.",line:"Forty-nine of them signed it, and what they promised was to harm nobody who stayed loyal to the federal government.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Goliad"}},"the road to bexar, cut":{id:"bexar-cut",title:"The road to B\xE9xar, cut",standing:"documented",citation:"Supply and correspondence for Cos's command at B\xE9xar, after the loss of the Copano road.",line:"Nothing has gone up that road since. You can argue about the reason. You cannot argue about the wagons.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Presidio La Bah\xEDa"}},"the first number":{id:"telegraph",title:"Telegraph, No. 1",standing:"documented",citation:"Telegraph and Texas Register, Vol. 1 No. 1, San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens.",line:"The first newspaper Texas managed to keep. It is dated the morning after all of this, and none of this is in it.",when:{day:18351010,short:"10 OCT",shown:"10 OCT 1835",place:"San Felipe de Austin"}},"the fandango":{id:"fandango",title:"The fandango",standing:"traditional",citation:"Told, and loved, and written down by nobody who was in the room.",line:"They danced until the candles went. Everybody says so. Nobody says when."}},Ke=ge(ge(ge(ge({},Kt(_i,"anahuac")),Kt(Li,"goliad")),Kt(Pi,"gonzales")),Kt(zi,"bexar"));function Ui(o){return Object.keys(Ke).filter(t=>Ke[t].session===o)}function Hn(o){return Ui(o).length}function xo(o,t=!0,e){const n=[];for(const a of o){const s=Ke[a];s&&(e&&s.session!==e||n.push(ge({},s)))}return t?n.sort((a,s)=>{var h,u,w,g;return((u=(h=a.when)==null?void 0:h.day)!=null?u:1/0)-((g=(w=s.when)==null?void 0:w.day)!=null?g:1/0)}):n}const ji=["wwwwwwwwwwwwwww","wwwwwwwwwwwwwww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","wwwwwwwdwwwwwww","wwwwwwwwwwwwwww"],Je={tx:7,ty:8},vo={tx:7,ty:7,facing:"up"};function $i(){return{base:-4,sources:[{tx:Je.tx,ty:Je.ty,r:6,gain:6},{tx:11,ty:1,r:5,gain:5},{tx:3,ty:2,r:3,gain:2}]}}function le(o){var s,h
