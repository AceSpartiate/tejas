<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Tejas - Goliad and Presidio La Bahia, 2 to 9 October 1835. A Grade 7 Texas history game." />
<title>Tejas</title>
</head>
<body>
<meta charset="utf-8" />
<title>Tejas</title>

<script>
  // The viewport, set from script because this is published as a body
  // fragment and a <meta> parsed inside the body is ignored. Without it a
  // phone lays the game out in a 980px pretend-desktop and shrinks the whole
  // thing to a postage stamp. Written onto the host's own tag if it has one.
  (function () {
    try {
      var m = document.querySelector('meta[name="viewport"]');
      if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
      m.setAttribute('content',
        'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
    } catch (e) { /* a wrapper with no head is still a page the game can run in */ }
  })();
</script>

<style>
  /* One visual world on purpose: a handheld screen in a dark room. The ground
     is the game's own letterbox void. No theme blocks - a Game Boy does not
     have a light mode - but every colour is painted rather than inherited, so
     the page holds on whatever ground the host puts behind it. */
  html, body { margin: 0; padding: 0; background: #131110; }
  /* Fixed, not 100% tall. A percentage height needs an unbroken chain up to
     the root, and this page is a guest in a document it did not write. */
  /* Longhand offsets, not the inset shorthand: the shorthand is iOS 14.5+ and a stage
     that does not resolve a size is a page with nothing on it. */
  #tj-stage {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; align-items: center;
    justify-content: center; background: #131110; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* max-width defends the integer scale: a host reset that caps media at 100%
     would quietly resample the one thing in this project that may never be
     resampled. */
  #screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    max-width: none !important; max-height: none !important;
  }
  /* Thumb controls are present but unseen until a finger arrives, so on a
     phone the first screen is a game with no visible way to play it. */
  #tj-hint {
    position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; z-index: 20;
    animation: tj-breathe 2.6s ease-in-out infinite;
  }
  [hidden] { display: none !important; }
  @keyframes tj-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #tj-hint { animation: none; opacity: 0.8; } }
  /* The boot notice. Plain HTML, on screen before a line of script runs, and
     taken away by the first frame that actually draws. If the game cannot
     start there is now something to read instead of a black rectangle -
     which is the whole difference between a bug report and a diagnosis. */
  #tj-boot {
    position: fixed; left: 16px; right: 16px; bottom: 50%; transform: translateY(50%);
    margin: 0; text-align: center; color: #dda85c;
    font: 500 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    z-index: 30; white-space: pre-wrap; word-break: break-word;
  }
  #tj-boot b { color: #b8463c; font-weight: 700; }
</style>

<div id="tj-stage">
  <canvas id="screen"></canvas>
</div>
<p id="tj-hint" hidden>Touch the screen for controls</p>
<p id="tj-boot">Loading Tejas...</p>

<script>
  // Registered before the game so it catches a parse error in it too.
  (function () {
    var boot = document.getElementById('tj-boot');
    var first = null;
    window.__tjFail = function (what) {
      if (!boot) return;
      // KEEP THE FIRST ONE. The later reports are consequences: the vitals
      // sweep runs on a timer and would cheerfully paint over the exception
      // that caused everything it is describing. Overwriting the first error
      // with a summary of its aftermath cost a whole debugging round.
      if (first !== null) return;
      first = String(what);
      boot.hidden = false;
      boot.innerHTML = '<b>Tejas is not drawing.</b>\n\n' + String(what);
    };
    window.addEventListener('error', function (e) {
      window.__tjFail((e && e.message) || 'unknown error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__tjFail((e && e.reason && e.reason.message) || 'unhandled rejection');
    });
  })();
</script>

.tj-shell { position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  display: grid; place-items: center;
  padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right))
           max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
  box-sizing: border-box; touch-action: none; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent; z-index: 10; }
.tj-shell * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* The body. Two-tone, because a single flat slab reads as a div with a
   border-radius; the seam is what says "moulded in two halves". */
.tj-body { position: relative; width: 100%; height: 100%;
  max-width: 100%; max-height: 100%; min-width: 0; min-height: 0; display: flex;
  background: linear-gradient(${u[4]} 0 58%, ${u[3]} 58% 100%);
  border: 1px solid ${u[5]}; box-shadow: inset 0 1px 0 ${u[6]}, inset 0 -2px 6px ${u[1]}; }
.tj-shell[data-chassis="gbc"] .tj-body { flex-direction: column; align-items: center;
  border-radius: 18px 18px 42px 18px; padding: 14px 12px 12px; gap: 10px; }
.tj-shell[data-chassis="gba"] .tj-body { flex-direction: row; align-items: center;
  justify-content: space-between; border-radius: 78px / 46px; padding: 10px 22px; gap: 10px; }

/* The screen well: the void, inset, with the LCD centred in it. A real
   handheld has far more bezel than panel and the integer-scale rule produces
   exactly that on its own \u2014 whatever is left over after the largest whole
   multiple that fits is bezel, which is why this is dark rather than clever. */
.tj-well { background: ${u[0]}; display: grid; place-items: center;
  border: 2px solid ${u[2]}; box-shadow: inset 0 2px 8px #000; overflow: hidden;
  min-width: 0; min-height: 0; }
/* The well has a SHAPE, not "whatever height is going spare". Given the spare
   height on a modern phone it took all of it, and a 3:2 panel adrift in a well
   half again as tall reads as a game lost in a black column rather than as a
   screen set into plastic. */
/* No aspect-ratio here, deliberately. It is iOS 15+, and where it does not
   resolve the well has NO HEIGHT - and overflow:hidden then clips the game
   to nothing, which is a beautifully moulded case with a black screen in it.
   Flex alone always yields a real box; the proportion is applied afterwards
   as a max-height in px, which every browser has always understood and which
   can only ever make the well smaller, never zero. */
.tj-shell[data-chassis="gbc"] .tj-well { width: 100%; flex: 1 1 auto; min-height: 0;
  border-radius: 10px 10px 4px 4px; }
.tj-shell[data-chassis="gba"] .tj-well { flex: 1 1 auto; min-height: 0; min-width: 0;
  max-width: 100%; border-radius: 8px; }
.tj-well > canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

/* Moulding: things that are shaped but not pressable. The wordmark, the
   speaker slots, the power lamp. They are what makes the silhouette read,
   and none of them is styled like a button, because a control that does
   nothing is worse than no control. */
.tj-mark { font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.22em; color: ${u[9]}; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.tj-lamp { width: 6px; height: 6px; border-radius: 50%; background: ${ae};
  box-shadow: 0 0 5px ${ae}; flex: 0 0 auto; }

/* Controls. Raised, coloured, and the only things here that move. */
.tj-deck { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 1 1 auto; min-width: 0; }
.tj-shell[data-chassis="gbc"] .tj-deck { padding: 0 2px; gap: 8px; }
.tj-shell[data-chassis="gba"] .tj-deck { width: auto; height: 100%; }

/* Moulding under the screen: the wordmark left, the speaker right, the way
   the row of print under a handheld's panel actually sits. */
.tj-strip { display: flex; align-items: center; justify-content: space-between;
  width: 100%; flex: 0 0 auto; padding: 0 4px; gap: 10px; }

/* Sideways, the body is three columns: a hand, the screen, the other hand. */
.tj-side { display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; flex: 0 0 auto; }
.tj-centre { display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; flex: 1 1 auto; min-width: 0; height: 100%; }
.tj-shell[data-chassis="gba"] .tj-centre .tj-strip { justify-content: center; }

/* The cross: four arms that are four switches. It was one hit area reading an
   angle from the centre, with a hub that slid toward the thumb, which is a
   joystick wearing a plus-shaped hat and read as one immediately. An arm
   lights when it is the one being pressed, and nothing on it ever slides. */
.tj-cross { position: relative; flex: 0 0 auto; touch-action: none; }
.tj-arm { position: absolute; background: ${u[2]}; border: 1px solid ${u[4]};
  pointer-events: none; transition: background 50ms linear; }
.tj-arm.on { background: ${u[5]}; }
.tj-up { left: 34%; right: 34%; top: 2%; height: 34%; border-radius: 5px 5px 0 0; border-bottom: 0; }
.tj-down { left: 34%; right: 34%; bottom: 2%; height: 34%; border-radius: 0 0 5px 5px; border-top: 0; }
.tj-left { top: 34%; bottom: 34%; left: 2%; width: 34%; border-radius: 5px 0 0 5px; border-right: 0; }
.tj-right { top: 34%; bottom: 34%; right: 2%; width: 34%; border-radius: 0 5px 5px 0; border-left: 0; }
/* The hub is moulding: it joins the arms and it never moves. */
.tj-hub { position: absolute; left: 34%; top: 34%; width: 32%; height: 32%;
  background: ${u[2]}; border-top: 1px solid ${u[4]}; border-bottom: 1px solid ${u[4]};
  pointer-events: none; }
.tj-hub::after { content: ""; position: absolute; left: 30%; top: 30%; width: 40%; height: 40%;
  border-radius: 50%; background: ${u[3]}; }

.tj-face { position: relative; flex: 0 0 auto; }
.tj-btn { position: absolute; border-radius: 50%; display: grid; place-items: center;
  font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: ${u[13]}; touch-action: none;
  box-shadow: 0 2px 0 ${u[1]}; transition: transform 60ms linear, box-shadow 60ms linear; }
.tj-btn.on { transform: translateY(2px); box-shadow: 0 0 0 ${u[1]}; }
.tj-a { background: ${ae}; border: 1px solid ${u[10]}; }
.tj-b { background: ${u[6]}; border: 1px solid ${u[8]}; }

/* Start and Select. Moulded first \u2014 the silhouette of a handheld is wrong

.tj-pills { display: flex; gap: 10px; flex: 0 0 auto; }

....####..########################..####..#:::::::#.","........####################################..#:::::::#.","........####################################..#:::::::#.","........####################################..#########.","::::::::::::::::::::::::::::::::::::::::::::::::::::::::"],HEARTH:["........................................................",".######################################################.",".#.........................#####......................#.",".#..........................##....##.......##########.#.",".#..........................##....##.......#::::::::#.#.",".#.###########.............#####.#####.....#::::::::#.#.",".#.#:::::::::#.............#####.#####.....#:######:#.#.",".#.#:::::::::#.............#####.#####.....#:######:#.#.",".#.#:::::::::#....##........###...###......#:######:#.#.",".#.#:::::::::#....##........###...###......#:######:#.#.",".#.#:::::::::#...#####......#.#...#.#......#:######:#.#.",".#.#:#######:#...#####......#.#...#.#......#:######:#.#.",".#.#:#######:#...######################....#:######:#.#.",".#.#:#######:#....###.#################....#:######:#.#.",".#.#:#######:#....###..###.........###.....#:######:#.#.",".#.#:#######:#....#.#..###.........###.....#:######:#.#.",".#.#:#######:#....#.#..###.........###.....#:######:#.#.",".######################################################.",".#::::::::::::::::::::::::::::::::::::::::::::::::::::#.",".#::::::::::::::::::::::::::::::::::::::::::::::::::::#.",".#::::::::::::::::::::::::::::::::::::::::::::::::::::#.",".#::::::::::::::::::::::::::::::::::::::::::::::::::::#.",".######################################################.","........................................................"],CART:["........................................................","........................................................","........................................................","................................................#......#",".................................................#....#.","....#############################................#######","....#:::::::::::::::::::::::::::#.................######","....#:::::::::::::::::::::::::::#.................######","....#:::::::::::::::::::::::::::###...............######","....#:::::::::::::::::::::::::::######............######","....#####:#:#############:#:#####.######.....###....##..",".......:::#:::.........:::#:::.......#################..","......#:::#:::#.......#:::#:::#........###############..",".....::#::#::#::.....::#::#::#::.......###############..",".....:::#:#:#:::.....:::#:#:#:::......#################.","....:::::###:::::...:::::###:::::......###############..","....#############...#############......###############..","....:::::###:::::...:::::###:::::........############...",".....:::#:#:#:::.....:::#:#:#:::.........##..###...##...",".....::#::#::#::.....::#::#::#::.........##........##...","......#:::#:::#.......#:::#:::#.........###........###..",".......:::#:::.........:::#:::..........##..........##..","#########:#:#############:#:############################","::::::::::::::::::::::::::::::::::::::::##::::::::::##::"]};function ai(o,t,e,s,n=w.outline){const a=ni[t];o.fillStyle=n;for(let i=0;i<ho;i++){const d=a[i];for(let m=0;m<ro;m++){const f=d[m];if(f===".")continue;const l=e+m*me,k=s+i*me;if(f==="#"){o.fillRect(l,k,me,me);continue}for(let A=0;A<me;A++)for(let O=0;O<me;O++)l+O+k+A&1||o.fillRect(l+O,k+A,1,1)}}}const ii={"word-tejas":{head:"THE NAME OF THE COUNTRY",cut:"NOTICE",body:["East of here live the Caddo. When the first Spanish parties reached them they were greeted with a word of their own \u2014 t\xE1ysha, meaning friends, or allies.","The Spaniards wrote the word down and used it for the whole province. For a hundred and fifty years this country has been called friends, and almost nobody who says it knows that."]},"colony-line":{head:"GRANT: THE COAST BETWEEN THE RIVERS",cut:"CART",body:["By the colonisation law of 1825 the state of Coahuila y Tejas contracts with empresarios, who bring in families and are paid in land. James Power and James Hewetson hold the coast.","On 12 April 1829 their grant is extended from the Guadalupe to the Nueces \u2014 which draws a line straight through country that Goliad families had been ranching for two generations.","Goliad lies outside their colony. Its people say their title is older. Both sides have paper, and the paper does not agree."]},"espiritu-herd":{head:"TALLY: THE MISSION HERD",cut:"CART",body:["Mission Esp\xEDritu Santo was moved to the north bank of this river in 1749, and the presidio to the south bank, one facing the other. That is the pair this town grew between.","It was a ranching mission. By 1788 the tallies run past fifteen thousand head of cattle, with horses, mules and sheep besides, and corn, cotton, melons and peaches in the fields.","That herd is why there is a hide yard here, and a carter, and a road worth forty miles of anybody's attention. The mission was secularised in 1830 and the cattle went on without it."]},"mark-signature":{head:"A MARK, IN PLACE OF A NAME",cut:"NOTICE",body:["On the civil registers of this province a man who cannot write draws his mark \u2014 a cross, or the brand he burns on his cattle \u2014 and two witnesses sign beside it.","The register takes it, and the law takes it. A man who cannot read a word of what he is agreeing to has still signed it, and can still be held to it."]},seamstress:{head:"ACCOUNT: SIX YARDS OF SILK",cut:"CART",body:["Bought in June. Cut, sewn over four months, and worn. The woman who made the dress kept the account for the cloth and can produce it.","She is answering a story that the dress was cut up to make a flag. It was not. Her paper is dated; the story is not, and that is the whole of the difference."]},circular:{head:"CIRCULAR \u2014 COMMITTEE OF SAFETY",cut:"NOTICE",body:["San Felipe de Austin, 19 September 1835. Issued by the Committee of Safety over the hand of Stephen F. Austin.","It warns that General Cos is coming into Texas with troops, and calls on every district to organise its militia.","At the foot it asks that whoever receives it copy it out and pass it on, and read it aloud to those who cannot read. There is no newspaper. This is how news travels."]},"copano-landing":{head:"FIVE HUNDRED MEN, AT COPANO",cut:"SHIP",body:["About the twentieth of September, General Mart\xEDn Perfecto de Cos came ashore at the port of Copano with something near five hundred soldiers.","It took days to put them all on the beach. From Copano there is one road inland, and it runs up through Goliad to B\xE9xar."]},"copano-road":{head:"THE ROAD FROM THE WATER",cut:"CART",body:["Forty miles from the port of Copano to this town, and on from here to B\xE9xar. Coffee, powder, cloth, iron \u2014 everything that reaches the interior comes up it.","There is no other road. Whoever holds Goliad holds what B\xE9xar eats, and that is why this small town has a fort in it and Victoria does not."]},"cos-here":{head:"THE GENERAL, AT LA BAH\xCDA",cut:"PRESIDIO",body:["On the first of October General Cos reached Goliad with the Morelos battalion and quartered in the presidio of La Bah\xEDa.","He is the brother-in-law of Santa Anna and he has come to put down the disturbances in Texas. For four days the highest authority in the province slept inside these walls."]},"rider-gonzales":{head:"REPORT FROM GONZALES",cut:"RIDER",body:["Carried by an express rider, and written down by nobody at the time. He gave it at a gallop and did not stop.","That the soldiers came to Gonzales for the little cannon the town was lent. That the town would not give it back. That there was firing on the second of October, and the soldiers went away again.","Nothing here is confirmed. It is one man\u2019s account of a thing that happened seventy miles off, and it is the only account anybody in this town has."]},"cos-gone":{head:"THE GARRISON MARCHES FOR B\xC9XAR",cut:"COLUMN",body:["On the fifth of October General Cos left Goliad for B\xE9xar with his honour guard and the Morelos battalion. He marched unmolested and arrived without a shot.","Word of the affair at Gonzales had reached him. What he left behind in the presidio was a holding garrison of some fifty men, in a work built for far more."]},"hatch-meeting":{head:"RESOLVED, AT MATAGORDA",cut:"HEARTH",body:["On the sixth of October some forty men of the Matagorda militia met at the house of Sylvanus Hatch.","Their first act was to elect a captain, and they elected George Collinsworth. Three days later there were near a hundred and twenty of them and they were on the Goliad road."]},"marriage-bond":{head:"ENTERED IN THE PARISH BOOK",cut:"HEARTH",body:["Nuestra Se\xF1ora de Loreto, at the presidio of La Bah\xEDa. Both names, both marks, two witnesses, and the day.","Away up the Brazos there is one priest for a country the size of Spain, so a couple sign a bond before their neighbours and live married until somebody like this one rides through. Both are documents. Only one of them is in a book."]},milam:{head:"A MAN LATELY OUT OF MONTERREY",cut:"RIDER",body:["Benjamin Milam, taken and held at Monterrey, is reported to have got out and come north until he fell in with men going the same way.","The accounts do not agree on the day he reached the Goliad party, and no paper anywhere gives one. That he is with them is not in doubt. When he arrived is."]},"roll-bahia":{head:"RETURN OF KILLED AND WOUNDED",cut:"PRESIDIO",body:["Presidio La Bah\xEDa, 9-10 October 1835. Of the garrison under Lieutenant Colonel Sandoval: three killed, seven wounded, twenty-one taken.","Of the volunteers: several wounded, none killed. Somebody counted, before the sun was up, and wrote the numbers on a page \u2014 which is the only reason anyone can say three instead of saying many."]},compact:{head:"COMPACT OF VOLUNTEERS",cut:"NOTICE",body:["Goliad, 9 October 1835. Signed by forty-nine of the men who took the presidio, under Captain George Collinsworth.","They declare themselves for the federal government of Mexico and against military rule, and undertake to do no harm to any person who remains loyal to it.","A good number of the forty-nine signed with a mark."]},"bexar-cut":{head:"NOTHING COMES UP THE ROAD",cut:"CART",body:["With Goliad taken, the road from Copano to B\xE9xar is shut, and the supplies and correspondence for the general\u2019s command stop with it.","Men may argue about who was right at Gonzales for a hundred years. Nobody can argue about the wagons. They are not arriving, and the date they stopped is on paper."]},telegraph:{head:"TELEGRAPH AND TEXAS REGISTER",cut:"PRESS",body:["Vol. 1, No. 1. San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens \u2014 Gail Borden Jr., Thomas H. Borden and Joseph Baker.","The first newspaper Texas manages to keep. It went to press the morning after the presidio fell, two hundred miles from it, and there is not one word of that night in it.","Everything this book holds was gathered in the week before this sheet existed."]},fandango:{head:"THE FANDANGO",cut:"HEARTH",body:["They danced until the candles went out. Everybody in this town will tell you so, and every one of them was there.","Not one of them wrote down which night. There is no bill, no register, no letter, and no date \u2014 so it cannot be set beside anything that has one.","That is not the same as saying it did not happen. It is worse than that. It means nobody, ever, can check."]}},ps={documented:{short:"DATED",long:"Dated, on paper",color:w.positive},traditional:{short:"NO DATE",long:"Told, never dated",color:w.alert},uncertain:{short:"REPORTED",long:"Dated by report only",color:w.uiLabel}};function At(o){return ps[o]}function ri(o){return o.map(t=>xe({},t))}const P={x:4,y:4,w:b-8,h:B-8},vt={w:Math.round(P.w/2),h:Math.round(P.h/2)},gs=Math.round((b-ro*me)/2),lo=34,ws=lo+ho*me+8,ys=5,hi=D+1,di=P.w-16,bs=10,ks=46;class uo{constructor(t,e,s=!0){p(this,"card");p(this,"sheet");p(this,  takes it. A man who cannot read still signs.",when:{day:1835e4,short:"1835",shown:"1835 \u2014 NO MONTH",place:"Goliad"}},"a seamstress's objection":{id:"seamstress",title:"A bill for six yards of silk",standing:"documented",citation:"The cloth account of the woman who made the dress, against the story told about it.",line:"Bought in June and finished in August, and the girl wore it. It was never cut up for anybody. Here is what it cost.",when:{day:18350600,short:"JUN",shown:"JUNE 1835",place:"Goliad"}},"the circular":{id:"circular",title:"Committee of Safety circular",standing:"documented",citation:"Circular of the Committee of Safety, San Felipe, 19 September 1835, written by Stephen F. Austin. Texas State Library.",line:"Forward this and read it to as many as will hear it. There is no other way to tell anybody anything.",when:{day:18350919,short:"19 SEP",shown:"19 SEPT 1835",place:"San Felipe de Austin"}},"the landing at copano":{id:"copano-landing",title:"The landing at Copano",standing:"documented",citation:"General Mart\xEDn Perfecto de Cos came ashore at the port of Copano about 20 September 1835 with roughly five hundred men.",line:"Five hundred of them off the boats in one week, and every one of them has to walk up this road to get anywhere.",when:{day:18350920,short:"20 SEP?",shown:"ABOUT 20 SEPT 1835",place:"the port of Copano"}},"the copano road":{id:"copano-road",title:"The Copano road",standing:"documented",citation:"A carter's account of the freight road from the port of Copano to B\xE9xar.",line:"Everything that reaches B\xE9xar comes up this road. Count the loads a week and you know what B\xE9xar has got.",when:{day:18350900,short:"SEP",shown:"SEPT 1835 \u2014 NO DAY",place:"the Copano road"}},"the general in the fort":{id:"cos-here",title:"The general, in this fort",standing:"documented",citation:"Cos reached Goliad on 1 October 1835 and quartered at Presidio La Bah\xEDa with the Morelos battalion.",line:"He slept in this building. You can be shown the room. That is eight days ago and nobody has swept it.",when:{day:18351001,short:"1 OCT",shown:"1 OCT 1835",place:"Presidio La Bah\xEDa"}},"what the rider said":{id:"rider-gonzales",title:"What the rider shouted",standing:"uncertain",citation:"The account carried to Goliad by express rider of the fight over the cannon at Gonzales, 2 October 1835.",line:"They would not give the gun back, and there was firing, and the soldiers went away again. That is what he had.",when:{day:18351002,short:"2 OCT?",shown:"2 OCT 1835, BY REPORT",place:"carried from Gonzales"}},"the general marches out":{id:"cos-gone",title:"The general marches out",standing:"documented",citation:"Cos left Goliad on 5 October 1835 with his honour guard and the Morelos battalion and marched for B\xE9xar unmolested.",line:"He took the good companies with him and left what would fit in the walls. Four days ago.",when:{day:18351005,short:"5 OCT",shown:"5 OCT 1835",place:"Presidio La Bah\xEDa"}},"the meeting at matagorda":{id:"hatch-meeting",title:"The meeting at Hatch's house",standing:"documented",citation:"Militia from Matagorda met at Sylvanus Hatch's home on 6 October 1835 and elected George Collinsworth their captain.",line:"Forty of them in a front room, and the first thing they did was vote on who was in charge of them.",when:{day:18351006,short:"6 OCT",shown:"6 OCT 1835",place:"Sylvanus Hatch's house, Matagorda"}},"the marriage bond":{id:"marriage-bond",title:"The marriage bond",standing:"documented",citation:"Parish marriage records, Nuestra Se\xF1ora de Loreto, Presidio La Bah\xEDa.",line:"It is written in the book with both their names and the date. That is not a story about them. That is them.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Nuestra Se\xF1ora de Loreto"}},"milam, lately out of monterrey":{id:"milam",title:"Milam, out of Monterrey",standing:"uncertain",citation:"Contemporary reports of Benjamin Milam reaching the Goliad party after escaping imprisonment at Monterrey.",line:"The man was in a Mexican prison a month ago. Nobody agrees on the day he turned up.",when:{day:18351e3,short:"OCT?",shown:"EARLY OCT 1835, THEY SAY",place:"somewhere on the Guadalupe"}},"the roll of la bah\xEDa":{id:"roll-bahia",title:"The roll of La Bah\xEDa",standing:"documented",citation:"Casualty return, the taking of Goliad, 9-10 October 1835: three killed, seven wounded, twenty-one taken.",line:"Three killed, seven wounded, twenty-one taken. Somebody counted, and this is the paper they counted on.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Presidio La Bah\xEDa"}},"the compact of volunteers":{id:"compact",title:"The Compact of Volunteers",standing:"documented",citation:"The Compact of Volunteers under Collinsworth, signed at Goliad, 9 October 1835, by forty-nine of the men who took it.",line:"Forty-nine of them signed it, and what they promised was to harm nobody who stayed loyal to the federal government.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Goliad"}},"the road to bexar, cut":{id:"bexar-cut",title:"The road to B\xE9xar, cut",standing:"documented",citation:"Supply and correspondence for Cos's command at B\xE9xar, after the loss of the Copano road.",line:"Nothing has gone up that road since. You can argue about the reason. You cannot argue about the wagons.",when:{day:18351009,short:"9 OCT",shown:"9 OCT 1835",place:"Presidio La Bah\xEDa"}},"the first number":{id:"telegraph",title:"Telegraph, No. 1",standing:"documented",citation:"Telegraph and Texas Register, Vol. 1 No. 1, San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens.",line:"The first newspaper Texas managed to keep. It is dated the morning after all of this, and none of this is in it.",when:{day:18351010,short:"10 OCT",shown:"10 OCT 1835",place:"San Felipe de Austin"}},"the fandango":{id:"fandango",title:"The fandango",standing:"traditional",citation:"Told, and loved, and written down by nobody who was in the room.",line:"They danc  to the rail while you are still holding the gourd.",aside:"Up you get.",needs:"watered",sets:"mounted"},{text:"She shifts her weight and waits. The road is south.",needs:"mounted"}]},{id:"sister",name:"ANA",tx:7,ty:5,facing:"down",look:{build:"youth",hat:"none",hair:"long",torso:"camisa",legs:"skirt",skin:y(u,10),hairCol:y(u,1),cloth:y(u,11),cloth2:y(u,6)},lines:[{text:"You're up. Good \u2014 the whole town will be at the chapel today, and Mama says we are not arriving last.",aside:"Fill the trough before you go. The mare will not come to the rail in this heat.",sets:"told"},{text:"The gourd is on the well rope. Water first, then the mare, then the road.",needs:"told"},{text:"You are carrying it around empty. Fill it at the well \u2014 that is what the rope is for.",needs:"gourd"},{text:"Now the trough, before you spill it. She will not come to the rail for a kind word.",needs:"full"},{text:"Get up on her, then. I am not waiting in this sun.",needs:"watered"},{text:"Go on, then \u2014 south, and do not let her stop to eat. I will see you at the chapel.",needs:"mounted"}]},{id:"hand",name:"BENITO",tx:14,ty:13,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",stance:"wide",skin:y(u,8),hairCol:y(u,1),cloth:y(u,9),cloth2:y(u,4)},lines:[{text:"Rail post rotted through. Third one this year.",aside:"That trough has been dry since Tuesday. Fill it and she'll come to the rail, and I'll tell you about the ford."},{text:"The ford is seven miles up and everybody knows where it is. Remember that \u2014 someday it will matter more than it does today.",needs:"watered",sets:"asked-ford",then:!0},{text:"And a man came through it Sunday going hard and would not stop for water. Shouted it at us off the horse. Gonzales \u2014 the little cannon \u2014 the soldiers asked for it back and did not get it.",aside:"That is the whole of what I have. He did not write it down and neither did I. Somebody in the town will have more of it than a shout.",needs:"asked-ford",sets:"told-rider",gives:"what the rider said"},{text:"Whatever it was, it was a week ago and it was somewhere else. Ask in the town, and ask somebody who keeps paper.",needs:"told-rider"}]}],triggers:[{tx:20,ty:17,unless:"mounted",sets:"tried-the-road",text:"You get as far as the last of the fence and stop.",aside:"Goliad is an hour south on foot and the wedding is at noon. Not without the mare."}],exits:[{tx:6,ty:4,to:"ranch-house",entry:{tx:7,ty:7,facing:"up"}},{tx:20,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"},{tx:21,ty:18,to:"goliad",entry:{tx:21,ty:1,facing:"down"},needs:"mounted",passage:"ride-to-goliad"}],props:[{id:"well",tx:14,ty:5,lines:[{text:"A gourd hangs on the rope, dry as a drum. You take it.",aside:"The rope still runs down into the dark, and the dark is wet.",sets:"gourd"},{text:"You let the rope down and haul it up hand over hand. The gourd fills.",needs:"gourd",sets:"full"},{text:"Full to the neck. Anything more goes on your feet.",needs:"full"}]},{id:"trough",tx:6,ty:10,lines:[{text:"Dry to the boards. Nothing will drink from this."},{text:"Dry to the boards. You turn the gourd over it and nothing comes out of that either.",aside:"It wants filling first. The well is up the slope.",needs:"gourd"},{text:"You tip the gourd in. The mare lifts her head before the water settles.",needs:"full",sets:"watered"},{text:"Full, and already half of it gone. She drinks like she has been waiting all morning, which she has.",needs:"watered"}]},{id:"corn",tx:23,ty:4,lines:[{text:"Corn, and not much of it. It has been a dry year on this side of the river."}]},{id:"road",tx:20,ty:17,lines:[{text:"The road south. Goliad is an hour that way on foot, and you do not have an hour.",aside:"Not without the mare."},{text:"The road south, and the mare under you. Goliad by mid-morning.",aside:"Just ride down it. Nobody is going to stop you.",needs:"mounted"}]}]},ki={".":g.GRASS_A,",":g.DIRT,"=":g.DIRT_EDGE,"~":g.WATER,a:g.ADOBE,h:g.THATCH,s:g.STONE,g:g.GATE,r:g.RACK,D:g.DOOR,k:g.CHAPEL_ROOF,K:g.CHAPEL_WALL,E:g.ESPADANA,A:g.CHAPEL_DOOR,"+":g.CROSS,Y:g.TREE,N:g.NOTICE,B:g.BILL_STONE,b:g.BILL_ADOBE,o:g.WELL,f:g.FLAGSTONE,R:g.ROCK,d:g.DOORWAY},mo={id:"goliad",name:"Goliad",light:{base:0,sun:{drop:2}},rows:["RRRRRRRRRRRRRRRRRRRR,,RRRRRRRRRRRRRRRRRR","R.sssssssssss.Y.....,,.................R","R.skkkkkkkkks.......,,.................R","R.skkkkEkkkks.......,,.................R","R.sKKKAAAKKKs.......,,.................R","R.B,,,,,,,,,........,,.................R","R.sssssssssss.......,,.................R","R~~~~~~~~~~~~~~~~~~~,,~~~~~~~~~~~~~~~~~R","R~~~~~~~~~~~~~~~~~~~,,~~~~~~~~~~~~~~~~~R","R...................,,.................R","R...hhhh............,,....sBssgsssss...R","R...aada............,,....s,,,,,,,,s...R","R...................,,....skkkkkkk,s...R","R........Y..........,,....skkkkEkk,s...R","R...................,,....sKKKAAAK,s...R","R.hhhh..............,,....sffffffffs...R","R.aada.......,,,,,,,,,,,,,sffffffffs...R","R............,,,,,,,,,,,,,ssssffssfs...R","R....o.......,,,,,,N,,,,,,ssDBffsDfs...R","R............,,,,,,,,,,,,,sffffffffs...R","R..sssss.....,,,,,,,,,,,,,ssDBsDsffs...R","R..sBdss.....,,,,,,,,,,,,,sssssssffs...R","R............,,,,,,,,,,,,,ssssssssss...R","R..hhhh......,,,,,,,,,,,,,.....Y.......R","R..aada......,,,,,,,,,,,,,.............R","R............,,,,,,,,,,,,,.............R","R........Y...,,,,,,,,,,,,,.............R","R............,,,,,,,,,,,,,.............R","R...................,,.................R","R..rrrr.........Y...,,.................R","R..rrrr.............,,.................R","R...................,,.................R","RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"],legend:ki,start:{tx:21,ty:1,facing:"down"},exits:[{tx:6,ty:11,to:"jacal-n",entry:{tx:7,ty:7,facing:"up"}},{tx:4,ty:16,to:"jacal-w",entry:{tx:7,ty:7,facing:"up"}},{tx:5,ty:21,to:"store",entry:{tx:7,ty:7,facing:"up"}},{tx:5,ty:24,to:"jacal-s",entry:{tx:7,ty:7,facing:"up"}},{tx:20,ty:0,to:"ranch",entry:{tx:20,ty:17,facing:"up"}},{tx:21,ty:0,to:"ranch",entry:{tx:20,ty:17,facing:"up"}},{tx:30,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:32,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"},{tx:31,ty:14,to:"chapel",entry:{tx:5,ty:12,facing:"up"},needs:"chapel-open"}],triggers:[{tx:31,ty:15,needs:"chapel-open",sets:"under-the-arch",text:"[The doors are open above you. Somebody inside is dragging benches.]",aside:"Straight up the steps."}],npcs:[{id:"refugia",name:"DO\xD1A REFUGIA",absent:"chapel-open",tx:4,ty:25,facing:"up",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:y(u,9),hairCol:y(u,1),cloth:y(u,7),cloth2:y(u,5),accent:"#8b5d55"},lines:[{text:"Two hundred people and one fire. If you are going to stand there, stand there holding something.",aside:"Take these tamales to Anselmo. He is owed a meal and he knows it.",sets:"tamales"},{text:"Go on. The music does not start itself.",needs:"tamales"},{text:"You hear that? That is my daughter getting married, and a fiddle, and nobody sick. Two years ago I would not have believed it.",needs:"gut"}]},{id:"anselmo",name:"ANSELMO",absent:"chapel-open",tx:18,ty:18,facing:"down",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:y(u,9),hairCol:y(u,8),cloth:y(u,11),cloth2:y(u,5)},lines:[{text:"You are early. Nobody is early to a wedding."},{text:"Tamales. Good. Now the bad news \u2014 I broke a string this morning and there is no gut in this town but at the hide yard.",aside:"A rider came through Tuesday. There was a fight at Gonzales the Friday before, over a cannon. They say the flag was a girl\u2019s wedding dress, cut up.",needs:"tamales",sets:"string"},{text:"A wedding dress. That is what they are saying, anyway. Ask me again in fifty years and it will be two wedding dresses.",needs:"string"},{text:"[He strings the fiddle, tunes it against his thumb, and starts to play.]",needs:"gut"}]},{id:"casimiro",name:"CASIMIRO",tx:7,ty:30,facing:"left",look:{build:"adult",hat:"kerchief",hair:"crop",torso:"apron",legs:"calzoneras",stance:"wide",skin:y(u,8),hairCol:y(u,1),cloth:y(u,10),cloth2:y(u,6),accent:"#8b5d55"},lines:[{text:"Careful where you stand. Everything on this side of the yard is wet."},{text:"Gut I have. Time I do not. The buyer says eight hundred skins and I say nine hundred and forty, and one of us is wrong.",aside:"Count them. Properly \u2014 walk down the racks and do it yourself. I will cut your string while you wait.",needs:"string",sets:"to-count"},{text:"Well? You went and looked. That is more than the buyer did.",aside:"How many?",needs:"counted",options:[{label:"Eight hundred.",sets:"miscounted",reply:"Eight hundred is his number, not yours. You did not get it off the racks, you got it off him. Go back and add it up."},{label:"Nine hundred and forty.",sets:"gut",reply:"Nine hundred and forty. [He writes it on a slip and hands it over with the gut.] Take that to Se\xF1ora Ocampo. If the buyer argues, you were there and he was not.",aside:"And learn the ford while you are young \u2014 seven miles up, and everybody knows where it is. Some day that will matter more than it does today."},{label:"A lot.",sets:"miscounted",reply:'"A lot." [He puts the knife down.] A lot is what you say when you did not count. Nobody has ever won an argument with a lot. Go back and add it up.'}]},{text:"Take the tally to Se\xF1ora Ocampo, and do not lose it. It is the only copy and it has your counting in it.",needs:"gut"},{text:"Seven miles up. Do not forget it.",needs:"tally"}]},{id:"ocampo",name:"SE\xD1ORA OCAMPO",tx:6,ty:22,facing:"up",look:{build:"adult",hat:"mantilla",hair:"bun",torso:"camisa",legs:"skirt",load:"ledger",skin:y(u,10),hairCol:y(u,1),cloth:y(u,4),cloth2:y(u,3)},lines:[{text:"If you have no money you have no business, and you have no money."},{text:"Eight hundred. That is what my book says and my book does not guess.",aside:"Nine hundred and forty? [She looks at the slip. She looks at you.] You counted them. I did not. Nine hundred and forty.",needs:"gut",sets:"tally",then:!0},{text:"Candles for the chapel. Do not run with them.",needs:"tally",sets:"candles"},{text:"A number beats a story, m\u2019ijo. Remember that the next time somebody tells you one.",needs:"candles"}]},{id:"tomas",name:"TOM\xC1S",tx:32,ty:15,facing:"up",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:y(u,9),hairCol:y(u,1),cloth:y(u,12),cloth2:y(u,5)},lines:[{text:"You cannot go past me. The quarters and the magazine are the garrison\u2019s and they are not in a mood."},{text:"Candles. Finally. [He takes them without looking up and starts setting them along the wall.] Go in. Sit anywhere. It starts when the fiddle starts.",needs:"candles",sets:"chapel-open"},{text:"First wedding since the sickness. My mother counted \u2014 a hundred and eleven of us went into the ground that year.",needs:"chapel-open"},{text:"I am not going in. Somebody has to watch the candles and it is always me.",needs:"wedding"}]},{id:"soldier",name:"SOLDADO",tx:31,ty:9,facing:"down",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",load:"musket",stance:"wide",skin:y(u,8),hairCol:y(u,1),cloth:y(q,1,.5),cloth2:y(u,12)},lines:[{text:"Chapel is that way, and it is shut until somebody brings candles. [He does not move, exactly, but the gate is wider than it was.]",aside:"The bride\u2019s mother is Do\xF1a Refugia \u2014 far end of town, west, at the cooking fire. The bride you will not see until tonight, and everything before that goes through her mother."},{text:"A wedding. Good. It has been a quiet year for the good kind of noise.",needs:"candles",sets:"asked-general",then:!0},{text:"You know who stood where you are standing, eight days ago? The general. Cos himself. He slept in those quarters and you could have thrown a stone at him from the gate.",aside:"His billeting order is still on the door of those quarters. Nobody has had the heart to take it down.",needs:"asked-general",sets:"told-here",then:!0},{text:"And on the fifth he took the Morelos battalion and his own guard and went to B\xE9xar, on account of something that happened at a place called Gonzales.",aside:"He left us. That is a fact with a date on it, and the date is pinned inside the barracks door. Fifty of us, and a wall built for three hundred.",needs:"told-here",sets:"told-gone"},{text:"Fifty men. Walk the wall yourself and count the gates, and then tell me how you would do it.",needs:"told-gone"}]},{id:"elder",name:"DON PRUDENCIO",tx:15,ty:20,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"folded",legs:"calzoneras",stance:"bowed",skin:y(u,8),hairCol:y(u,12),cloth:y(u,5),cloth2:y(u,3)},lines:[{text:"You are the one who counts hides. Sit a minute. Do you know what this province is called, and why?",aside:"Not Texas. Before that.",sets:"asked-name",then:!0},{text:"Tejas. And it is not a Spanish word at all \u2014 it is Caddo, from the people out east. Tayshas. It means friends. Allies.",aside:'They said it to the first Spaniards as a greeting, and the Spaniards wrote it down as the name of the country. We have been calling this place "friends" for a hundred and fifty years without knowing it.',needs:"asked-name",sets:"told-name",gives:"the word tejas"},{text:"Friends. Remember that when men start arriving who do not speak it.",needs:"told-name",sets:"asked-circular",then:!0},{text:"There is one nailed up on the post at the crossing, if you want to read it. A man read it aloud here and then left a copy for whoever came after him.",aside:"Austin wrote it at San Felipe in September. There is no newspaper in Texas. THAT is the newspaper: one page, copied out by hand, walked from town to town and nailed where people pass.",needs:"asked-circular",sets:"told-circular"},{text:"Copy it out if you can write. If you cannot, read it to somebody who cannot either. That is the whole system and there is no other one.",needs:"told-circular"}]},{id:"carter",name:"THE CARTER",tx:23,ty:25,facing:"left",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"satchel",skin:y(u,8),hairCol:y(u,1),cloth:y(u,6),cloth2:y(u,4)},lines:[{text:"Do not ask me what is in the carts and I will not have to lie to you.",aside:"Coffee. It is coffee. Mostly.",sets:"asked-road",then:!0},{text:"Everything that reaches Bexar comes through here. Copano is forty miles down, the road runs right past that chapel, and there is no other road.",aside:"Which is why this little town has a fort in it and Victoria does not. If you want the numbers, the freight bill is nailed up on the store wall.",needs:"asked-road",sets:"told-road"},{text:"Forty miles to the water. Remember the road, not the town.",needs:"told-road",sets:"asked-landing",then:!0},{text:"And three weeks back I sat on that cart at the end of it and watched five hundred soldiers come off the boats. It took them days. I counted, because what else is a man going to do.",aside:"About the twentieth of September. I would not swear to the day \u2014 but the army wrote it down, and their board is up beside the fort gate.",needs:"asked-landing",sets:"told-landing"},{text:"Five hundred men and one road. You do the arithmetic. I am tired.",needs:"told-landing"}]}],props:[{id:"plaza-post",tx:19,ty:18,lines:[{text:"A post at the crossing, with two bills nailed to it. The lower one is weathered to nothing. The upper one is new.",aside:"Somebody has copied this out by hand. You can see where the pen ran dry and was dipped.",gives:"the circular",sets:"read-circular"},{text:"The same two bills. The upper one is still legible; the lower one has not been for a year.",needs:"read-circular"}]},{id:"gate-post",tx:27,ty:10,lines:[{text:"Garrison paper, nailed to the wall beside the gate: rations, punishments, and a sheet about a landing at the coast.",aside:"Somebody has gone down the list of companies with a thumbnail, scoring off the ones that have marched.",gives:"the landing at copano",sets:"read-landing"},{text:"The same wall. Rations, punishments, and a sheet about a landing at the coast.",needs:"read-landing"}]},{id:"store-bill",tx:4,ty:21,lines:[{text:"A freight bill, nailed up where the carters can argue with it. Loads, dates, and what each one was charged from the coast.",aside:"Somebody has gone down the right-hand column twice and got a different total both times.",gives:"the copano road",sets:"read-freight"},{text:"The freight bill. Loads, dates, and what each was charged from the coast.",needs:"read-freight"}]},{id:"well",tx:5,ty:18,lines:[{text:"The town well. Somebody has scratched a tally of the dry months into the stone and given up partway."}]},{id:"store-door",tx:5,ty:21,lines:[{text:"Ocampo\u2019s. Salt, powder, cloth, coffee, and a ledger she guards like a dog."}]},{id:"racks",tx:4,ty:29,lines:[{text:"Hides on the racks, four deep, stiff as doors. This is what Goliad sells."},{text:"Four racks, four deep. You do the near one twice because you lose your place, and then you go slower.",aside:"Two hundred and thirty-five on the near rack. Two hundred and thirty-five on the next. Two hundred and thirty-four. Two hundred and thirty-six.",needs:"to-count",sets:"counted"},{text:"Four racks, and you have the four numbers. Nine hundred and forty, if you have added them right.",needs:"gut"}]},{id:"chapel",tx:28,ty:15,lines:[{text:"Nuestra Se\xF1ora de Loreto, the chapel of the presidio. The whole town gets married and buried inside a fort, and nobody here thinks that is strange.",aside:"The door faces the parade ground, and it is shut. There is a soldier on the gate who is not moving."},{text:"Still shut. Whoever is setting it up for tonight has not been given what they need to light it.",aside:"You are carrying them. Tom\xE1s is the one on the parade ground with his arms folded \u2014 hand them to him.",needs:"candles"},{text:"Open, and somebody inside is setting candles along the wall in a line that is not straight.",aside:"The way in is the arch, three tiles of it, straight ahead.",needs:"chapel-open"}]},{id:"herd-notice",tx:2,ty:5,lines:[{text:"A board in the yard wall, under a ledge that has kept the weather off it for fifty years. Tallies, in columns, in three different hands.",aside:"The last column is a count of cattle, and you have to read it twice, because the number does not look like a number of animals.",gives:"the mission herd",sets:"read-herd"},{text:"The tally board. Cattle, in columns, in three different hands.",needs:"read-herd"}]},{id:"mission",tx:6,ty:4,lines:[{text:"Esp\xEDritu Santo. Secularised five years ago; the great herds are eighty years gone and the east wall with them.",aside:"The fort is on the far bank. You cross at the ford, the way everybody does."}]},{id:"quarters",tx:29,ty:18,lines:[{text:"The officers\u2019 quarters. Stone, like everything the crown paid for, and shut \u2014 but there is a billeting order still tacked to the frame, gone soft in the damp.",aside:"It has the general\u2019s own name at the head of it, and a date eight days old.",gives:"the general in the fort",sets:"read-billet"},{text:"The officers\u2019 quarters. The door does not move, and a soldier watches you find that out.",needs:"read-billet"}]},{id:"barracks",tx:29,ty:20,lines:[{text:"The soldiers\u2019 barracks, built against the wall itself. There are fewer men in it than there are beds, and a march order is still pinned inside the door.",aside:"Sandoval has fifty. The wall is longer than fifty men, and the order says where the rest of them went.",gives:"the general marches out",sets:"read-march"},{text:"The barracks. Shut to you, and you are not going to be the one who argues about it.",needs:"read-march"}]},{id:"magazine",tx:33,ty:18,lines:[{text:"The powder magazine. The one door in the fort nobody leaves unlocked, and it is locked.",aside:"Two turns of a key you can hear from here. Whatever else this garrison has let slide, it has not let this slide."}]},{id:"cannon",tx:34,ty:15,lines:[{text:"Cannon, on the parade. Eight-pounders \u2014 the fort was built with six of them and nobody has moved one in years.",aside:"They are counted. Everything the crown issued was counted."}]}]},Ti={s:g.STONE,f:g.FLAGSTONE,",":g.DIRT,d:g.DOORWAY,A:g.ALTAR,"+":g.CROSS,b:g.BENCH,t:g.TABLE,H:g.HEARTH,Y:g.TREE},Ri={id:"the-wedding",needs:"chapel-open",unless:"wedding",steps:[W(void 0,"Tom\xE1s has lit every candle in the building. There are more candles than there are chairs."),Ae("player",5,12),W("EL PADRE","Are we all in? Then somebody shut that door before the wind has it."),Ae("manuela",6,9),W(void 0,"Outside, the fiddle stops. Two hundred people stop with it."),Ae("manuela",6,3),Je("manuela","up"),Je("eusebio","up"),W("EL PADRE","We have waited a long while for a good reason to fill this room. Most of the last ones were not good reasons.","Sixteen months ago he buried a hundred and eleven people out of this same doorway."),W("MANUELA","S\xED."),W("EUSEBIO","S\xED."),W(void 0,"The room makes a noise like a roof coming off."),Ze("wedding"),Je("manuela","down"),Je("eusebio","down"),Ae("eusebio",5,7),Ae("manuela",6,7),Ae("manuela",14,8),Ae("eusebio",13,6),W(void 0,"Outside, Anselmo lays the bow across the new string, and the yard finds out what your afternoon at the hide racks bought.")]},xi={id:"chapel",name:"La Capilla",light:{base:-6,sources:[{tx:5,ty:2,r:7,gain:7},{tx:6,ty:2,r:7,gain:7},{tx:1,ty:6,r:4,gain:4},{tx:10,ty:6,r:4,gain:4},{tx:1,ty:12,r:4,gain:4},{tx:10,ty:12,r:4,gain:4},{tx:11,ty:7,r:3,gain:3},{tx:12,ty:14,r:6,gain:6},{tx:16,ty:9,r:5,gain:4},{tx:16,ty:12,r:5,gain:4},{tx:5,ty:15,r:3,gain:3}]},rows:["sssss++ssssssssssssss","sffffAAffffs,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,Y,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,,,,,,s","sffffffffffd,,,,,,,,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,tttt,s","sffffffffffs,,,,,,,,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffs,,,tttt,s","sfbbbffbbbfs,,,,,,,,s","sffffffffffsH,,,,,,,s","sssssdssssss,,,,,,,,s","sssssssssssssssssssss"],legend:Ti,start:{tx:5,ty:14,facing:"up"},scenes:[Ri],triggers:[{tx:5,ty:14,needs:"letter",sets:"at-the-door",text:"[You are at the door with her letter in your shirt. Behind you the fiddle is still being tuned.]",aside:"Whatever is said in this room tonight gets said once, and you will not be coming back in."}],exits:[{tx:5,ty:15,to:"bahia",entry:{tx:21,ty:1,facing:"down"},needs:"letter"},{tx:5,ty:15,to:"goliad",entry:{tx:29,ty:6,facing:"down"}}],npcs:[{id:"padre",name:"EL PADRE",tx:6,ty:2,facing:"down",look:{build:"adult",hat:"none",hair:"tonsure",torso:"camisa",legs:"cassock",load:"book",skin:y(u,10),hairCol:y(u,9),cloth:y(u,2),cloth2:y(u,2)},lines:[{text:"You are late. So was I. We will say nothing about it to each other."},{text:"You came in on a horse from out past the river, no? Then answer me something. How far is the nearest priest to your people?",aside:"It is not a trick. I am the answer and I am also the problem.",needs:"wedding",sets:"asked-bond",then:!0},{text:"Up on the Brazos there is one of me for a country the size of Spain. So they do not wait. A man and a woman sign a bond in front of two neighbours, and they live married, and they wait for somebody like me to ride through.",aside:"I have baptised children at the same table where I afterwards married their parents. It is legal. It is a document. It is not what I would have chosen.",needs:"asked-bond",sets:"told-bond",gives:"the marriage bond"},{text:"A bond is a paper two neighbours signed. This is a paper a church signed. One day somebody will ask which one counted, and they will go looking for the paper, not for the two neighbours.",needs:"told-bond",sets:"to-the-string",then:!0},{text:"Speaking of which. [He nods at your pockets, and takes a length of string out of the drawer.] You have been picking paper up all over this town today. I have watched you do it. Put it on the table.",aside:"One at a time, and you will tell me which of them came first.",needs:"to-the-string",sets:"strung",opens:"order"},{text:"It is on the string and it is in order. Do not lose it. Somebody will want it one day, and they will not take your word for any of it.",needs:"strung"}]},{id:"eusebio",name:"EUSEBIO",tx:5,ty:3,facing:"up",look:{build:"adult",hat:"none",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:y(u,9),hairCol:y(u,1),cloth:y(u,6),cloth2:y(u,3)},lines:[{text:"Do not talk to me. If I talk I will keep talking and then I will still be talking when he asks me the question."},{text:"Her mother has not sat down since Thursday. Somebody should make her sit down. It will not be me, I have used up all my courage for one day.",needs:"wedding"}]},{id:"manuela",name:"MANUELA",tx:6,ty:13,facing:"up",look:{build:"adult",hat:"veil",hair:"none",torso:"camisa",legs:"skirt",load:"bouquet",skin:y(u,10),hairCol:y(u,1),cloth:y(u,13),cloth2:y(u,12)},lines:[{text:"Not yet. Nobody sees me before the candles are lit \u2014 that is the entire point of candles."},{text:"You. The one who has been running all over town since noon. My brother is on the Brazos and he could not come. Will you carry this to him?",aside:"Tell him it happened. Tell him who was here.",needs:"wedding",sets:"letter"},{text:"North, past the crossing, and ask for the Ruiz place. He will feed you for it, and he will make you say all the names twice.",needs:"letter"}]},{id:"refugia",name:"DO\xD1A REFUGIA",tx:13,ty:14,facing:"left",look:{build:"adult",hat:"rebozo",hair:"none",torso:"rebozo",legs:"skirt",load:"comal",skin:y(u,9),hairCol:y(u,1),cloth:y(u,7),cloth2:y(u,5),accent:"#8b5d55"},lines:[{text:"Eat something. I did not cook for two days so that people could stand about being polite."},{text:"Anselmo has been telling everyone his story from Gonzales. The flag. Say it back to me \u2014 what was it cut from?",needs:"wedding",sets:"asked-dress"},{text:"A wedding dress. [She does not laugh.] I sewed the one my daughter has on. Four months. It is the only thing in this family worth anything, and when she is done with it her daughter gets it.",aside:"Nobody cuts up a wedding dress to make a bedsheet with writing on it. Go back and ask him whose dress. He will give you a name, and he will be guessing.",needs:"guessed",sets:"told-dress",gives:"a seamstress's objection"},{text:"Ask him whose. That is all. It is a good story and I would like it to be true, and those are two different things.",needs:"told-dress"}]},{id:"anselmo",name:"ANSELMO",tx:17,ty:11,facing:"up",look:{build:"adult",hat:"cap",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"violin",sash:!0,skin:y(u,9),hairCol:y(u,8),cloth:y(u,11),cloth2:y(u,5)},lines:[{text:"Gut from a dead cow, and out of it comes that. I have never got over it and I have been doing it for thirty years."},{text:"They will dance until the candles go. Nobody in this town has had a reason to wear out a floor since before the sickness.",needs:"wedding"},{text:"So he put the whole week on a string for you. [He grins and does not stop tuning.] Then you can answer me now, and you will be the only one in this room who can.",needs:"strung"},{text:"The dress? [He does not stop tuning.] Spanish. Brought up from B\xE9xar, I would say, or the coast. You can tell.",aside:"He says it the way a man says a thing he has never once been asked to prove.",needs:"asked-dress",sets:"guessed"},{text:"You are the one who told Do\xF1a Refugia the dress was Spanish. [He is not embarrassed. He is interested.] So. The gun at Gonzales. The lieutenant asked for it back and they would not give it. If you had been standing on that bank, what would you have said to him?",aside:"Take your time. I have watched a great many men lose that argument.",needs:"told-dress",sets:"the-argument",then:!0},{text:"No \u2014 do not answer me. [He lays the bow across his knee.] Ask any four men in this room what happened this week and you will get four different weeks, and not one of us wrote a word of it down.",aside:"Go and see El Padre. He is the only person in this town who puts a date beside a thing on the day it happens, and you have been collecting paper since this morning.",needs:"the-argument"}]},{id:"paquita",name:"PAQUITA",tx:4,ty:12,facing:"right",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:y(u,10),hairCol:y(u,1),cloth:y(u,11),cloth2:y(u,8)},lines:[{text:"I have been sitting on this bench since four o\u2019clock and I am not allowed to say anything about it."},{text:"You are taking me to the food. That is how it is done \u2014 you take me there and you bring me back to my mother, and everybody watches you do it, and then I am allowed to eat.",aside:"Walk. I will keep up. I have been keeping up my whole life.",needs:"wedding",sets:"escorting"},{text:"Out the side door and along. You cannot miss it, it is the only thing in the yard that smells like that.",needs:"escorting"},{text:"Now my mother. Not fast. If you run it does not count.",needs:"fed"},{text:"That was correctly done. I will tell people.",needs:"escorted"}]},{id:"benigno",name:"T\xCDO BENIGNO",tx:15,ty:13,facing:"up",look:{build:"adult",hat:"sombrero",hair:"short",torso:"chaqueta",legs:"calzoneras",load:"reata",stance:"bowed",spurs:!0,sash:!0,skin:y(u,8),hairCol:y(u,8),cloth:y(u,7),cloth2:y(u,4)},lines:[{text:"Forty-one years I have been coming to weddings in that building. I have signed the book at eleven of them."},{text:"You want to see something? Come and look at what I put in the register tonight, next to my name.",aside:"Except it is not next to my name. It is instead of it.",needs:"wedding",sets:"asked-mark",then:!0},{text:"I cannot write. So I sign with my iron \u2014 the same mark that is on every cow of mine and on my gate and in the book at the town hall where they keep the brands.",aside:"On the cattle it means mine. On the register it means I was here and I say so. It is the same mark and it means the same thing, and it will still mean it when I am dead.",needs:"asked-mark",sets:"told-mark",gives:"a mark for a signature"},{text:"Learn your neighbours\u2019 irons before you learn their faces. The face changes.",needs:"told-mark"}]}],props:[{id:"altar",tx:5,ty:1,lines:[{text:"Two candles, a cloth somebody has washed within an inch of its life, and a crucifix older than the fort."}]},{id:"bench",tx:3,ty:13,lines:[{text:"A plank on two frames. Half the town is sitting on the other half of it."}]},{id:"table",tx:16,ty:9,lines:[{text:"Planks laid across frames: tamales in a cloth, cakes, and a coffee pot that has been full since noon."},{text:"Paquita takes a tamal in each hand, which is one more than the ritual strictly allows.",needs:"escorting",sets:"fed"},{text:"Picked over now. Somebody has taken all the cakes with the sugar on.",needs:"escorted"}]},{id:"hearth",tx:12,ty:14,lines:[{text:"The chimney. The coffee and the cakes get their heat here, and so does everybody who stands near it."},{text:"You deliver Paquita to her mother\u2019s elbow and let go of her sleeve. Do\xF1a Refugia looks at you for a second longer than she needs to.",aside:"A fiddle, planks across frames, and a girl walked to the food and back. This is what a fandango is, and you have just been in one.",needs:"fed",sets:"escorted",gives:"the fandango"},{text:"Warm. The only warm thing in the yard that is not a person.",needs:"escorted"}]}]};function Ei(){const o=mo.rows.map(e=>e.split("")),t=(e,s,n)=>{o[s][e]=n};return t(30,10,"B"),t(34,22,","),t(35,16,","),t(26,19,","),o.map(e=>e.join(""))}const Ai={id:"the-road",needs:"letter",unless:"chose",steps:[W(void 0,"You are most of the way home before you understand what you saw on the coast road.","Horses. Not two or three. More than you can count in the dark, and none of them hurrying, which is worse."),W(void 0,"They are not the Mexican army. The Mexican army is in that fort, and it has been all year, and it nodded at you tonight."),Ma(void 0,"You are the only person in this valley who knows. You have about a minute.",[{label:"Warn the garrison.",sets:"told-garrison",reply:"You go for the gate. The sentry knows you \u2014 you are the candle kid \u2014 and he believes you, and that is the whole of it. Men come out of the quarters pulling their coats on.",aside:"They will stand to. The fight will be longer and worse than it would have been, and more of them will live through it."},{label:"Warn the town.",sets:"told-town",reply:"You go for the square instead, shouting, and the square empties. Do\xF1a Refugia has her family and half of somebody else\u2019s out the back before you finish the sentence.",aside:"Not one person you woke can fire a musket. That was not the point and you knew it when you turned."},{label:"Say nothing. Run.",sets:"told-nobody",reply:"You do not stop. You put the mare down the river track and you are inside the walls before you have decided anything at all.",aside:"For the next eleven minutes you are the only person in Goliad who knows what is coming. It is heavier than it sounds."}],"Whatever you pick, they are still coming and there are still a hundred and twenty of them."),Ze("chose")]},vi={id:"the-fight",needs:"inside",unless:"fought",steps:[W(void 0,"Eleven o\u2019clock. It starts the way the men who were there always said it started \u2014 all at once, and from the wrong direction."),W(void 0,"You are on your face in the dirt of a courtyard you walked across four hours ago carrying candles.","You cannot see any of it. You can hear all of it, which turns out not to be better."),W(void 0,"What you can see is men. Sandoval\u2019s, in the yard, firing at a wall from the inside of it. Strangers coming out of the dark on the far side of that wall, closer every time you look.","They go down and most of them get up again. Remember that when somebody hands you a number in the morning."),W(void 0,"Tom\xE1s is in this building somewhere. So is a girl in a blue rebozo who was walked to the food and back four hours ago and has not been walked anywhere since.","You are the only person inside these walls who knows three ways out of them. Find both of them, then find the gate."),Ze("fought")]},Si={id:"the-surrender",needs:"got-out",unless:"surrendered",steps:[W(void 0,"It stops. Not gradually \u2014 the way a room goes quiet when somebody senior says a short word in it."),Ae("player",29,8),Je("player","up"),W("GEORGE COLLINSWORTH","Sandoval. You have done what you were told to do and there is no more of it to do. Your men keep their coats."),W(void 0,"Half an hour, start to finish. Nobody asks you anything, and nobody will, and you are thirteen years old and standing in the middle of it."),so(600),W(void 0,"\u2014 THE ROLL, LA BAH\xCDA, 9 OCTOBER 1835 \u2014","Garrison, under Lt. Col. Francisco Sandoval: three killed. Seven wounded. Twenty-one taken. Volunteers, under Collinsworth: several wounded. None killed."),no("the roll of la bah\xEDa"),W(void 0,"Somebody writes it down before the sun is up, because somebody always does, and that is the only reason you will ever be able to say it back."),so(400),W(void 0,"Morning. The river fog comes up to the walls and stops there."),W(void 0,"Forty-nine of them put their names to one page: that they are here to protect the people of this town from military domination, and that they say so in writing.","Some of them sign with a mark. You know what that means now."),no("the compact of volunteers"),W(void 0,"You cannot give an order and nobody will take one from you. You can carry a copy of somebody else\u2019s, and you have just watched one being made."),so(400),W(void 0,"Two hundred miles east of here, at San Felipe, three men have spent this week setting type by hand. Their first number comes off the press in the morning."),W(void 0,"\u2014 TELEGRAPH AND TEXAS REGISTER, VOL. 1 NO. 1 \u2014","San Felipe de Austin, Saturday 10 October 1835. Printed by Baker & Bordens. The first newspaper Texas manages to keep."),no("the first number"),W(void 0,"Not one word of tonight is in it. It went to press before any of this could reach them \u2014 and that is exactly why everything you are carrying had to be carried by somebody."),Ze("surrendered"),Ze("the-end")]},Oi={id:"bahia",name:"La Bah\xEDa",light:{base:-4,sources:[{tx:30,ty:10,r:5,gain:4},{tx:31,ty:15,r:5,gain:4},{tx:19,ty:19,r:6,gain:3},{tx:21,ty:1,r:5,gain:2},{tx:5,ty:21,r:4,gain:2},{tx:32,ty:16,r:4,gain:3}]},flashes:[{tx:38,ty:12,needs:"fought"},{tx:38,ty:19,needs:"fought"},{tx:33,ty:25,needs:"fought"},{tx:28,ty:25,needs:"fought"},{tx:24,ty:14,needs:"fought"},{tx:24,ty:19,needs:"fought"},{tx:27,ty:9,needs:"fought"},{tx:34,ty:9,needs:"fought"},{tx:30,ty:9,needs:"fought"}],attack:{needs:"fought",fighters:[{tx:38,ty:13,toX:36,toY:13,side:"volunteer"},{tx:38,ty:17,toX:36,toY:17,side:"volunteer"},{tx:38,ty:21,toX:36,toY:20,side:"volunteer"},{tx:31,ty:26,toX:30,toY:23,side:"volunteer"},{tx:35,ty:26,toX:34,toY:23,side:"volunteer"},{tx:27,ty:26,toX:28,toY:23,side:"volunteer"},{tx:26,ty:9,toX:29,toY:9,side:"volunteer"},{tx:36,ty:9,toX:34,toY:9,side:"volunteer"},{tx:28,ty:19,toX:29,toY:19,side:"garrison",killed:!0},{tx:33,ty:19,toX:34,toY:19,side:"garrison"},{tx:29,ty:11,toX:29,toY:11,side:"garrison",killed:!0},{tx:33,ty:11,toX:33,toY:11,side:"garrison"},{tx:27,ty:16,toX:27,toY:16,side:"garrison",killed:!0},{tx:34,ty:16,toX:34,toY:16,side:"garrison"}]},pen:{needs:"fought",keep:[26,10,35,22],text:"THAT IS WHERE THEY ARE FIRING FROM"},rows:Ei(),legend:Lt(xe({},mo.legend),{B:g.BARRED}),start:{tx:21,ty:1,facing:"down"},scenes:[Ai,vi,Si],triggers:[{tx:34,ty:22,needs:"chose",sets:"by-ditch",text:"The ditch under the south wall. Casimiro told you about it while you were counting his hides, and you were not listening, and you remembered anyway."},{tx:35,ty:16,needs:"chose",sets:"by-river",text:"The river side, where the stones are wet all year and nobody posts a man because nobody would come this way."},{tx:26,ty:19,needs:"chose",sets:"by-magazine",text:"The gap by the magazine. You are close enough to the powder to be told off for it, and there is nobody left to tell you off."},{tx:31,ty:16,needs:"chose",sets:"inside"},{tx:31,ty:11,needs:"paquita-out",sets:"got-out",text:"You get them both to the gate. It is barred, and the bar is on your side, and lifting it is the only useful thing you do all night."}],npcs:[{id:"tomas",name:"TOM\xC1S",tx:29,ty:15,facing:"down",look:{build:"youth",hat:"none",hair:"crop",torso:"camisa",legs:"calzoneras",load:"candles",skin:y(u,9),hairCol:y(u,1),cloth:y(u,12),cloth2:y(u,5)},lines:[{text:"Do not stand up. Whatever you do, do not stand up."},{text:"I have been in this building my whole life and I do not know how to get out of it. Isn\u2019t that the stupidest thing you have ever heard.",aside:"You know three ways. You used one of them getting in.",needs:"fought",sets:"tomas-out"},{text:"Behind you. Keep your hand on the wall and do not look at the light.",needs:"tomas-out"}]},{id:"paquita",name:"PAQUITA",tx:33,ty:15,facing:"left",look:{build:"child",hat:"none",hair:"braids",torso:"camisa",legs:"skirt",skin:y(u,10),hairCol:y(u,1),cloth:y(u,11),cloth2:y(u,8)},lines:[{text:"[She has both hands over her ears and she is not going to take them off for you.]"},{text:"You took me to the food and you brought me back. That is twice you are supposed to walk me somewhere.",aside:"[She puts a hand out. It is the same manoeuvre as the tamales and neither of you says so.]",needs:"tomas-out",sets:"paquita-out"},{text:"Not fast. If you run it does not count.",needs:"paquita-out"}]},{id:"sandoval",name:"LT. COL. SANDOVAL",tx:30,ty:19,facing:"left",look:{build:"adult",hat:"shako",hair:"short",torso:"uniform",legs:"calzoneras",stance:"wide",skin:y(u,8),hairCol:y(u,1),cloth:y(u,4),cloth2:y(u,11)},lines:[{text:"Get down. I do not care whose child you are, get DOWN."},{text:"Cos took the good half of this garrison to B\xE9xar in the summer and left me the paperwork. Somebody on that road counted us before they came. Somebody always counts first.",needs:"surrendered"}]},{id:"dimmitt",name:"PHILIP DIMMITT",tx:28,ty:19,facing:"up",look:{build:"adult",hat:"palm",hair:"short",torso:"chaqueta",legs:"calzoneras",sash:!0,skin:y(u,9),hairCol:y(u,8),cloth:y(u,6),cloth2:y(u,3)},lines:[{text:"Out of the way, son."},{text:"I have a wife and a store and a league of land eight miles from where you are standing, and I have known this country twelve years. Ask me why we came here and not somewhere with more in it.",needs:"surrendered",sets:"asked-why"},{text:"Copano is forty miles down that road and every pound of powder Cos eats in B\xE9xar comes up it, through here, past that chapel. We did not take a town tonight. We took a road.",aside:"Which is a thing you already knew, because a carter told you this afternoon while you were trying to get somewhere else.",needs:"asked-why",sets:"told-why",gives:"the road to bexar, cut"},{text:"A road, and a fort nobody will thank us for. Remember which one mattered.",needs:"told-why"}]},{id:"milam",name:"A VOLUNTEER",tx:33,ty:19,facing:"down",look:{build:"adult",hat:"palm",hair:"short",torso:"camisa",legs:"calzoneras",load:"musket",stance:"wide",skin:y(u,8),hairCol:y(u,12),cloth:y(u,7),cloth2:y(u,4)},lines:[{text:"[He is reloading and he does not look up.]"},{text:"You want to know something worth knowing? That man over there was in a cell in Monterrey three months ago.",needs:"surrendered",sets:"asked-milam"},{text:"Ben Milam. Walked out of a Mexican prison, walked north until he found somebody going the same way, and turned up on this road last week asking whose army it was.",aside:"He will be dead in December in a street in B\xE9xar and there will be a county named after him, and neither of those has happened yet.",needs:"asked-milam",sets:"told-milam",gives:"milam, lately out of monterrey"},{text:"Some men walk out of prisons. Most do not. Learn the difference before you copy anybody.",needs:"told-milam",sets:"asked-matagorda",then:!0},{text:"Us? We are nobody. Tuesday we were forty men in Sylvanus Hatch\u2019s front room at Matagorda, arguing, and the first thing we did was take a vote on who was in charge of us.",aside:"Collinsworth won it. Three days later there were a hundred and twenty of us and we were coming up your road.",needs:"asked-matagorda",sets:"told-matagorda"},{text:"Forty men in a front room on Tuesday. Remember that the next time somebody tells you an army arrived.",needs:"told-matagorda"}]}],props:[{id:"gate",tx:30,ty:10,lines:[{text:"The gate you walked through this afternoon, barred from the inside. The bar is a tree.",aside:"There is no version of tonight where you get in this way."}]},{id:"chapel",tx:31,ty:14,lines:[{text:"The chapel. Four hours ago there were candles in every window of it and a fiddle going in the yard."},{text:"The candles are still lit. Nobody had a reason to put them out and nobody has had a moment to.",needs:"fought"}]},{id:"quarters",tx:31,ty:9,lines:[{text:"Twenty-one men will come out of there with their hands where everyone can see them, and every one of them will be written down by name.",needs:"surrendered"},{text:"The garrison quarters. The door is open, which it has never been \u2014 and somebody coming through it in a hurry has dropped a folded paper on the sill.",aside:"Not garrison paper. It is a muster, in a civilian hand, headed with the name of a house in Matagorda.",gives:"the meeting at matagorda",needs:"fought",sets:"read-muster"},{text:"The garrison quarters. The door is open, which it has never been.",needs:"read-muster"}]}]},Ci=["wwwwwwwwwwwwwww","wwwwwwwwwwwwwww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","ww...........ww","wwwwwwwdwwwwwww","wwwwwwwwwwwwwww"],Mt={tx:7,ty:8},po={tx:7,ty:7,facing:"up"};function Mi(){return{base:-4,sources:[{tx:Mt.tx,ty:Mt.ty,r:6,gain:6},{tx:11,ty:1,r:5,gain:5},{tx:3,ty:2,r:3,gain:2}]}}function tt(o){var a,i,d,m;const t=Ci.map(f=>f.spli w old are you?",aside:"The shelves behind him are handsome and mostly empty."},{text:"Everything on this side of the room came up the road from Copano. Nothing has come up it in nine days. You work out what that means, I have stopped enjoying it.",needs:"told-landing"}]}],props:[{id:"shelves",tx:3,ty:1,lines:[{text:"Good shelves, planed and pegged, with four things on them.",aside:"Somebody built these expecting a different decade."}]},{id:"counter",tx:7,ty:5,lines:[{text:"A counter worn pale in one strip, where nine years of elbows have gone."}]}]}),Di=tt({id:"jacal-n",name:"A jacal",build:"adobe",back:{to:"goliad",tx:6,ty:12},place:[[11,1,"H"],[4,6,"e"]],props:[{id:"hides",tx:4,ty:6,lines:[{text:"Hides, folded, stacked to the roof pole and counted twice in chalk on the wall beside them.",aside:"The second count is lower than the first and neither has been rubbed out."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Cold. Whoever lives here has been somewhere else since morning."}]}]}),Hi=tt({id:"jacal-w",name:"A jacal",build:"adobe",back:{to:"goliad",tx:4,ty:17},place:[[11,1,"H"],[5,5,"t"],[9,5,"e"]],props:[{id:"loom",tx:5,ty:5,lines:[{text:"A loom with a piece half done on it, and the light set up so it falls across the work and not across the worker.",aside:"Somebody who does this for a living arranged this room, and arranged it years ago."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"A pot at the edge of the ash, keeping. There is a wedding to get to."}]}]}),Yi=tt({id:"jacal-s",name:"A jacal",build:"adobe",back:{to:"goliad",tx:5,ty:25},place:[[11,1,"H"],[4,5,"e"],[10,5,"e"]],props:[{id:"cots",tx:4,ty:5,lines:[{text:"Three cots, and two of them have been folded away against the wall for a long while.",aside:"Sixteen months ago El Padre buried a hundred and eleven people out of one doorway. This is what that looks like from inside a house."}]},{id:"hearth",tx:11,ty:1,lines:[{text:"Swept, laid, and not lit. One person does not light a fire for one person."}]}]}),Ms=[Ii,Ni,Di ,"mark-signature":"The register gives the year and stops. I can tell you it is this year. I cannot tell you the month, and neither can it.",seamstress:"June, and the bill is the proof of June. Six yards, paid for, and the dress was finished and worn. A story cannot argue with a bill.",circular:"Austin wrote that in September and asked every man who got it to copy it out and read it aloud to his neighbours. That is what we have here instead of a newspaper.","copano-landing":"Five hundred men off the boats at Copano. Everything you are holding after this happens because of that.","copano-road":"The month and not the day. A carter counts loads, not calendars. Put it in September and do not pretend to know more.","cos-here":"The general slept in this building on the first of October. Hold that one where you can see it, and look at what comes next.","rider-gonzales":"A man on a horse, and he was not lying and he was not writing it down either. The second, he says. I have no paper that says so.","cos-gone":"And on the fifth he took the good companies out of that gate and went to B\xE9xar. Four days ago. Now put the ninth after it.","hatch-meeting":"On the sixth they were still forty men in somebody\u2019s front room in Matagorda, voting on who was in charge of them.","marriage-bond":"Tonight. I wrote it in the book myself, an hour before you came in, and both of them made their mark under it.",milam:"Nobody agrees on the day. I will put the man in the week and I will not put him in a day, and you should not either.","roll-bahia":"Somebody counted. That is the entire reason we are able to say three, instead of saying many and meaning nothing.",compact:"The ninth, like everything else tonight. Forty-nine names on it, and a good few of those names are marks.","bexar-cut":"The same day and the same event, looked at from the far end of the road. B\xE9xar will work out what happened when the wagons stop.",telegraph:"That one is dated tomorrow and printed two hundred miles from <script>
  // Did it actually draw? Screen is the only thing that ever writes an inline
  // width onto the canvas, so that is the honest signal. Reading canvas.width
  // instead would call a legitimate 1x scale a failure, since 240 is smaller
  // than the 300 an untouched canvas starts at.
  (function () {
    var boot = document.getElementById('tj-boot');
    var hint = document.getElementById('tj-hint');
    requestAnimationFrame(function () {
      var c = document.getElementById('screen');
      // Drawn is not the same as VISIBLE. A canvas can be correctly sized and
      // still be clipped to nothing by a container that collapsed - which is
      // what a case with a black screen in it actually is - and that reads to
      // a player as "the game is broken" with nothing to report but the
      // colour. So measure what is really on screen, and say so if it is
      // nothing.
      var box = c ? c.getBoundingClientRect() : null;
      if (c && c.style.width && box && box.width >= 1 && box.height >= 1) {
        if (boot) boot.hidden = true;
        // The hint points at controls that are not on screen yet. With a case
        // up they always are, so there is nothing to point at and saying so
        // would just be a line of text over somebody's game.
        var cased = !!document.querySelector('.tj-shell');
        var touchable = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;

              Math.round(box.width) + 'x' + Math.round(box.height) + '.',
        );
      }
    });
    // A second look, a beat later, at the one question the first check cannot
    // answer. Not "is the canvas there and the right size" - it was, on the
    // phone this was written for - but "is there anything ON it". A canvas
    // can be present, correctly sized, visible and uniformly black, and that
    // state is indistinguishable from a broken game by looking at it. So
    // sample the middle of the panel, and if it is empty print the numbers
    // that say why, instead of a black rectangle that says nothing.
    var sweep = function () {
      // Never accuse a hidden page. A browser pauses requestAnimationFrame
      // outright for a backgrounded or occluded tab, so a game that is
      // perfectly healthy has drawn nothing and every symptom this looks for
      // is present. Reporting then would paint "not drawing" over a running
      // game the moment somebody switched tabs. Wait until it is on screen.
      if (document.hidden) {
        document.addEventListener('visibilitychange', function once() {
          document.removeEventListener('visibilitychange', once);
          setTimeout(sweep, 800);
        });

      }
      var c = document.getElementById('screen');

      var why = '';

      }
      if (painted) return;

      var t = null;
      try { t = window.tejas ? window.tejas() : null; } catch (e) { /* ignore */ }
      var host = c.parentElement;
      var hb = host ? host.getBoundingClientRect() : null;
      var cb = c.getBoundingClientRect();
      var shell = document.querySelector('.tj-shell');
      if (window.__tjFail) {
        window.__tjFail([
          'frames drawn: ' + (t ? t.ticks : 'NONE, the loop never ran'),
          'canvas: ' + c.width + 'x' + c.height + ' css ' + Math.round(cb.width) + 'x' + Math.round(cb.height),
          'holder: ' + (host ? (host.className || host.id || host.tagName) : '?') + ' ' +
            (hb ? Math.round(hb.width) + 'x' + Math.round(hb.height) : '?'),
          'window: ' + window.innerWidth + 'x' + window.innerHeight + ' dpr ' + (window.devicePixelRatio || 1),

          why || 'the panel is there and every pixel of it is black',

      }
    };
    setTimeout(sweep, 1400);

    var go = function () { if (hint) hint.hidden = true; };
    addEventListener('touchstart', go, { passive: true, capture: true });
    addEventListener('pointerdown', go, { passive: true, capture: true });
    addEventListener('keydown', go, { capture: true });
  })();
